<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Visual Designer – en websides anatomi</title>
  <desc id="desc">Illustration af global Header, sideindhold med Hero og Sektioner samt global Footer.</desc>
  <rect width="1200" height="850" fill="#ffffff"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#1d2327">En webside i Visual Designer</text>
  <rect x="120" y="95" width="960" height="105" rx="12" fill="#eef4fb" stroke="#2271b1" stroke-width="3"/>
  <text x="150" y="135" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1d2327">GLOBAL HEADER</text>
  <text x="150" y="175" font-family="Arial,sans-serif" font-size="20" fill="#3c434a">Logo · Menu · Knap · Ikon · Tekst</text>

  <rect x="120" y="225" width="960" height="150" rx="12" fill="#f6f0e2" stroke="#9a7b36" stroke-width="3"/>
  <text x="150" y="265" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1d2327">HERO / TOPBANNER</text>
  <text x="150" y="305" font-family="Arial,sans-serif" font-size="20" fill="#3c434a">Baggrundsbillede · Overskrift · Tekst · Knapper</text>
  <text x="150" y="340" font-family="Arial,sans-serif" font-size="17" fill="#646970">En del af den enkelte side – kan være forskellig fra side til side.</text>

  <rect x="120" y="400" width="960" height="250" rx="12" fill="#f6f7f7" stroke="#50575e" stroke-width="3"/>
  <text x="150" y="440" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1d2327">SIDEINDHOLD</text>
  <rect x="155" y="470" width="890" height="70" rx="8" fill="#ffffff" stroke="#8c8f94" stroke-width="2"/>
  <text x="180" y="513" font-family="Arial,sans-serif" font-size="20" fill="#1d2327">Sektion → Kasser → Tekst / Billede / Knap / Ikon</text>
  <rect x="155" y="555" width="430" height="70" rx="8" fill="#ffffff" stroke="#8c8f94" stroke-width="2"/>
  <text x="180" y="598" font-family="Arial,sans-serif" font-size="20" fill="#1d2327">Sektion → Tabel / Galleri</text>
  <rect x="615" y="555" width="430" height="70" rx="8" fill="#ffffff" stroke="#8c8f94" stroke-width="2"/>
  <text x="640" y="598" font-family="Arial,sans-serif" font-size="20" fill="#1d2327">Sektion → Formular / FAQ</text>

  <rect x="120" y="675" width="960" height="105" rx="12" fill="#eef4fb" stroke="#2271b1" stroke-width="3"/>
  <text x="150" y="715" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1d2327">GLOBAL FOOTER</text>
  <text x="150" y="755" font-family="Arial,sans-serif" font-size="20" fill="#3c434a">Logo · Menu · Kontakt · Links · Ikoner · Copyright</text>

  <text x="600" y="825" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#646970">Temaet fungerer som WordPress-shell rundt om Header, Side og Footer.</text>
</svg>