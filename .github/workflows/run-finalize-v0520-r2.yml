name: Run v0.5.20 finalizer r2

on:
  push:
    branches:
      - qa/v0.5.20-diagnose
    paths:
      - '.github/workflows/run-finalize-v0520-r2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.20-diagnose
          fetch-depth: 0
      - name: Correct CSS function boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/patch_v0520.py')
          t=p.read_text()
          old="end=php.index('    private function render_page_editor_imported_group', start)"
          new="end=php.index('    private function page_imported_group_style', start)"
          if old not in t:
              raise SystemExit('Original CSS boundary anchor missing')
          p.write_text(t.replace(old,new,1))
          PY
      - run: python3 .github/scripts/finalize_v0520.py
