name: Release Hangar18 Manager 0.4.6

on:
  push:
    branches:
      - main
    paths:
      - 'release-v046.patch'
      - '.github/workflows/release-v046.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply and validate 0.4.6
        shell: bash
        run: |
          set -euo pipefail
          git apply --check release-v046.patch
          git apply release-v046.patch
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F 'Version: 0.4.6' hangar18-manager.php
          grep -F "const VERSION = '0.4.6';" hangar18-manager.php
          grep -F 'render_frontend_runtime_fixes' hangar18-manager.php
          grep -F 'FRONTEND_REPAIR_046_COMPLETE' hangar18-manager.php
          grep -F 'h18-vehicle-inner {$detail_root_class}' hangar18-manager.php
          grep -F 'h18-gallery-grid {$grid_class}' hangar18-manager.php
          grep -F 'Events=unchanged' hangar18-manager.php

      - name: Build install package and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build/hangar18-manager/assets dist
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp assets/admin.css assets/admin.js .build/hangar18-manager/assets/
          rm -f dist/hangar18-manager.zip
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          PACKAGE_SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"
          export PACKAGE_SHA
          python3 - <<'PY'
          import json, os
          manifest = {
              'schema_version': '1.0',
              'plugin': 'hangar18-manager',
              'version': '0.4.6',
              'min_wp': '6.4',
              'min_php': '8.0',
              'published_utc': '2026-08-14T17:25:00Z',
              'package_path': 'dist/hangar18-manager.zip',
              'package_sha256': os.environ['PACKAGE_SHA'],
              'changelog': [
                  'Events er ikke ændret.',
                  'Fjerner Astra/WordPress native blå/lilla sidetitelbjælke på Hangar18-sider.',
                  'Køretøjsdetaljer genbygges fuldt og respekterer Venstre/Midtstillet.',
                  'Gallerialbums bruger tvungen Venstre/Midtstillet placering af billedgrid.',
                  'Automatisk engangs-genbygning af eksisterende køretøjer og gallerialbums.'
              ]
          }
          with open('update.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          echo "Package SHA-256: $PACKAGE_SHA"

      - name: Publish 0.4.6 atomically
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          rm -f release-v046.patch
          rm -f .github/workflows/release-v046.yml
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Hangar18 Manager 0.4.6'
          git push
