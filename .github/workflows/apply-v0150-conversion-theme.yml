name: Apply Visual Designer Manager 0.1.50 Conversion Theme

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_v0150_conversion_theme.py'
      - '.github/workflows/apply-v0150-conversion-theme.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.1.50 patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_v0150_conversion_theme.py

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find theme/akvpk -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Regression and model QA
        shell: bash
        run: |
          set -euo pipefail
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php

      - name: Verify 0.1.50 contracts
        shell: bash
        run: |
          set -euo pipefail
          echo 'Gate: version'
          grep -q 'Version: 0.1.50' clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.50'" clean/hangar18-manager/hangar18-manager.php

          echo 'Gate: conversion service + controller'
          test -s clean/hangar18-manager/src/Migration/PageConversionService.php
          test -s clean/hangar18-manager/src/Admin/ConversionController.php
          grep -q "CANDIDATE_META = '_h18_vd_conversion_candidate_v0150'" clean/hangar18-manager/src/Migration/PageConversionService.php
          grep -q "Godkend og aktivér" clean/hangar18-manager/src/Admin/ConversionController.php
          grep -q "Konvertér alle ikke-konverterede" clean/hangar18-manager/src/Admin/ConversionController.php
          grep -q "h18-clean-conversion" clean/hangar18-manager/src/Admin/AdminController.php
          grep -q "PageConversionService.php" clean/hangar18-manager/hangar18-manager.php
          grep -q "ConversionController::register" clean/hangar18-manager/hangar18-manager.php

          echo 'Gate: staging safety'
          grep -q "update_post_meta(\$postId, self::CANDIDATE_META" clean/hangar18-manager/src/Migration/PageConversionService.php
          grep -q "LayoutModel::saveVersion" clean/hangar18-manager/src/Migration/PageConversionService.php
          grep -q "original post_content bevaret" clean/hangar18-manager/src/Migration/PageConversionService.php
          grep -q "HANGAR18-HEADER-START" clean/hangar18-manager/src/Migration/PageConversionService.php
          grep -q "HANGAR18-FOOTER-START" clean/hangar18-manager/src/Migration/PageConversionService.php
          if grep -q "wp_update_post.*post_content" clean/hangar18-manager/src/Migration/PageConversionService.php; then
            echo 'Converter must never overwrite original post_content.' >&2
            exit 1
          fi

          echo 'Gate: active shell copy'
          grep -q "ThemeShell::enabled" clean/hangar18-manager/src/Admin/ThemeController.php
          grep -q "Visual Designer Manager leverer live Header" clean/hangar18-manager/src/Admin/ThemeController.php

          echo 'Gate: AKVPK technical theme identity'
          grep -q '^Theme Name: AKVPK$' theme/akvpk/style.css
          grep -q '^Theme URI: https://akvpk.dk/$' theme/akvpk/style.css
          grep -q '^Version: 1.3.0$' theme/akvpk/style.css
          grep -q '^Text Domain: akvpk$' theme/akvpk/style.css
          grep -q "H18_BASE_THEME_VERSION = '1.3.0'" theme/akvpk/functions.php
          grep -q "switch_theme('akvpk')" clean/hangar18-manager/src/Admin/ThemeController.php
          grep -q "theme_mods_akvpk" clean/hangar18-manager/src/Admin/ThemeController.php
          grep -q "wp_update_custom_css_post" clean/hangar18-manager/src/Admin/ThemeController.php
          grep -q '"target_theme": "akvpk"' theme-update.json

          echo 'Gate: docs'
          grep -q '"version": "0.1.50"' clean/hangar18-manager/release-history.json
          test -s docs/v0150-status.md
          grep -q 'VD-CONVERSION-STAGE-001' CLEAN-TECHNICAL-MANUAL.md

      - name: Build AKVPK theme 1.3.0 update package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .theme-build
          mkdir -p .theme-build/akvpk dist
          cp -a theme/akvpk/. .theme-build/akvpk/
          (cd .theme-build && zip -qr ../dist/akvpk-theme-v1.3.0.zip akvpk)
          unzip -tq dist/akvpk-theme-v1.3.0.zip
          THEME_SHA="$(sha256sum dist/akvpk-theme-v1.3.0.zip | awk '{print $1}')"
          base64 -w 0 dist/akvpk-theme-v1.3.0.zip > dist/akvpk-theme-v1.3.0.zip.b64
          printf '\n' >> dist/akvpk-theme-v1.3.0.zip.b64
          cp dist/akvpk-theme-v1.3.0.zip.b64 dist/akvpk-theme.zip.b64
          python - "$THEME_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path('theme-update.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['package_sha256'] = sys.argv[1]
          data['package_url'] = 'https://raw.githubusercontent.com/phenixdk2020/hangar18-manager/main/dist/akvpk-theme.zip.b64'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -rf .theme-build dist/akvpk-theme-v1.3.0.zip
          echo "AKVPK theme package SHA256: $THEME_SHA"

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-implementation-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add \
            clean/hangar18-manager/hangar18-manager.php \
            clean/hangar18-manager/src/Migration/PageConversionService.php \
            clean/hangar18-manager/src/Admin/ConversionController.php \
            clean/hangar18-manager/src/Admin/AdminController.php \
            clean/hangar18-manager/src/Admin/ThemeController.php \
            clean/hangar18-manager/release-history.json \
            clean-release-notes.html \
            docs/v0150-status.md \
            CLEAN-TECHNICAL-MANUAL.md \
            theme/akvpk \
            theme-update.json \
            dist/akvpk-theme-v1.3.0.zip.b64 \
            dist/akvpk-theme.zip.b64
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Add staged page conversion and AKVPK theme migration in v0.1.50'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
