name: QA Hangar18 Manager 0.5.1 JavaScript

on:
  push:
    branches:
      - development/v0.5.1-work
    paths:
      - '.github/workflows/qa-v051-js.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development/v0.5.1-work

      - name: Fix navigator refresh callback semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/admin.js')
          text = path.read_text(encoding='utf-8')
          old = "        if (!skipNavigator) {\n            rebuildPageNavigator();\n        }"
          new = "        if (skipNavigator !== true) {\n            rebuildPageNavigator();\n        }"
          if old not in text:
              raise SystemExit('navigator callback anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Static QA and package consistency
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F 'if (skipNavigator !== true)' assets/admin.js
          grep -F 'wp_ajax_h18_save_page_preset' hangar18-manager.php
          grep -F 'h18-page-navigator-list' hangar18-manager.php
          grep -F 'h18-inspector-tabs' assets/admin.css
          rm -rf .build
          mkdir -p .build/hangar18-manager/assets dist
          cp hangar18-manager.php .build/hangar18-manager/
          cp readme.txt .build/hangar18-manager/
          cp assets/admin.css .build/hangar18-manager/assets/
          cp assets/admin.js .build/hangar18-manager/assets/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"
          export SHA
          python3 -c "import json,os; p='update.json'; m=json.load(open(p,encoding='utf-8')); assert m['version']=='0.5.1'; m['package_sha256']=os.environ['SHA']; open(p,'w',encoding='utf-8').write(json.dumps(m,ensure_ascii=False,indent=2)+'\\n')"
          rm -rf .build

      - name: Commit QA fix and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/qa-v051-js.yml
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'QA fix v0.5.1 navigator refresh and rebuild package'
          git push
