name: QA Hangar18 Manager 0.5.6 hero hover

on:
  push:
    branches: [development/v0.5.6]
    paths: ['.github/workflows/qa-v056-hero.yml']

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix custom hover background precedence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hangar18-manager.php'); s=p.read_text(encoding='utf-8')
          old="""        if (empty($section['ShowDesktop'])) { $classes[] = 'h18-hide-desktop'; }\n        if (empty($section['ShowTablet'])) { $classes[] = 'h18-hide-tablet'; }\n        if (empty($section['ShowMobile'])) { $classes[] = 'h18-hide-mobile'; }\n        return implode(' ', $classes);"""
          new="""        if (empty($section['ShowDesktop'])) { $classes[] = 'h18-hide-desktop'; }\n        if (empty($section['ShowTablet'])) { $classes[] = 'h18-hide-tablet'; }\n        if (empty($section['ShowMobile'])) { $classes[] = 'h18-hide-mobile'; }\n        if (($section['HoverStyleMode'] ?? 'Inherit') === 'Custom') { $classes[] = 'h18-hover-style-custom'; }\n        return implode(' ', $classes);"""
          if s.count(old)!=1: raise SystemExit(f'class helper count={s.count(old)}')
          s=s.replace(old,new,1)
          oldcss="""body.page .h18-editor-page>.h18-editor-section:hover .h18-editor-grid-card h3{color:inherit!important}}' ."""
          newcss="""body.page .h18-editor-page>.h18-editor-section:hover .h18-editor-grid-card h3{color:inherit!important}body.page .h18-editor-page>.h18-hover-style-custom:hover{background-image:none!important}}' ."""
          if s.count(oldcss)!=1: raise SystemExit(f'hover css count={s.count(oldcss)}')
          s=s.replace(oldcss,newcss,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and rebuild
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F 'h18-hover-style-custom' hangar18-manager.php
          rm -rf .build
          mkdir -p .build/hangar18-manager/assets
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp assets/admin.css assets/admin.js .build/hangar18-manager/assets/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('update.json'); d=json.loads(p.read_text(encoding='utf-8'))
          d['package_sha256']=hashlib.sha256(Path('dist/hangar18-manager.zip').read_bytes()).hexdigest()
          d['changelog'].append('Tilpasset solid hover-state tilsidesætter også inline hero-baggrund uden at påvirke Arv Normal.')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -rf .build
      - name: Commit and self-clean
        run: |
          set -euo pipefail
          rm -f .github/workflows/qa-v056-hero.yml
          git config user.name "hangar18-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "QA fix v0.5.6 hero custom hover state"
          git push
