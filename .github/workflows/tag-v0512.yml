name: Tag Hangar18 Manager v0.5.12

on:
  push:
    branches:
      - maintenance/tag-v0.5.12
    paths:
      - .github/workflows/tag-v0512.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/tag-v0.5.12
          fetch-depth: 0
      - name: Tag v0.5.12 and self-clean
        shell: bash
        run: |
          set -euo pipefail
          release_sha="bc3a1632cceca4d4a17f9c405d189f050283deb7"
          git fetch origin main --tags
          git show "$release_sha:hangar18-manager.php" > /tmp/h18-v0512.php
          grep -q 'Version: 0.5.12' /tmp/h18-v0512.php
          git tag -f v0.5.12 "$release_sha"
          git push origin refs/tags/v0.5.12 --force
          git rm .github/workflows/tag-v0512.yml
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git commit -m "Clean v0.5.12 tag workflow"
          git push origin HEAD:maintenance/tag-v0.5.12
