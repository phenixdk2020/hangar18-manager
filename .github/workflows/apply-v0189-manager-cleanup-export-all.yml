name: Apply Visual Designer Manager v0.1.89 Manager Cleanup Export All

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/apply_v0189_manager_cleanup_export_all.py'
      - '.github/scripts/v0189_manager_cleanup_export_all_qa.py'
      - '.github/workflows/apply-v0189-manager-cleanup-export-all.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.1.89 candidate
        run: python3 .github/scripts/apply_v0189_manager_cleanup_export_all.py

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done
          echo 'PHP syntax: OK'

      - name: JavaScript syntax
        run: |
          node --check clean/hangar18-manager/assets/editor-v018-core.js
          node --check clean/hangar18-manager/assets/editor-v0181-color-picker.js
          node --check clean/hangar18-manager/assets/admin-v0123.js

      - name: v0.1.89 manager cleanup and Export All QA
        run: python3 .github/scripts/v0189_manager_cleanup_export_all_qa.py

      - name: v0.1.86 site settings regression
        run: python3 .github/scripts/v0186_site_settings_qa.py

      - name: v0.1.85 editor and event regressions
        run: |
          python3 .github/scripts/v0185_editor_live_box_qa.py
          python3 .github/scripts/v0185_event_facts_typography_qa.py
          python3 .github/scripts/v0185_semantic_qa.py

      - name: Portable transfer regression
        run: python3 .github/scripts/v0184_portable_transfer_qa.py

      - name: Responsive, composable and v0.1.81 regressions
        run: |
          python3 .github/scripts/v0173_editor_frontend_parity_qa.py
          python3 .github/scripts/v0169_canvas_autoheight_qa.py
          python3 .github/scripts/v0179_responsive_qa.py
          python3 .github/scripts/v0180_composable_qa.py
          python3 .github/scripts/v0181_complete_qa.py

      - name: Verify updater is not released yet
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('clean-update.json').read_text(encoding='utf-8'))
          assert data['version']=='0.1.88', f"Updater must remain 0.1.88 before release, got {data['version']}"
          print('Candidate/release separation: OK')
          PY

      - name: Commit verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-qa-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager/hangar18-manager.php \
                  clean/hangar18-manager/src/Admin/AdminController.php \
                  clean/hangar18-manager/src/Admin/ExportController.php \
                  clean/hangar18-manager/src/Admin/PortableTransferController.php \
                  clean/hangar18-manager/release-history.json \
                  clean-release-notes.html \
                  docs/v0189-status.md
          if git diff --cached --quiet; then
            echo 'No candidate changes to commit.'
            exit 0
          fi
          git commit -m 'Clean Manager navigation and add Export All in v0.1.89'
          git push origin HEAD:main
