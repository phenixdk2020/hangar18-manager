name: Build Hangar18 Manager v0.5.17

on:
  push:
    branches:
      - development/v0.5.17
    paths:
      - '.github/workflows/build-v0517.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development/v0.5.17
          fetch-depth: 0

      - name: Apply v0.5.17 patch
        run: python3 .github/scripts/patch_v0517.py

      - name: Syntax and structural QA
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F 'Version: 0.5.17' hangar18-manager.php
          grep -F "const VERSION = '0.5.17';" hangar18-manager.php
          grep -F "'tabs'       => 'Faner / tabs'" hangar18-manager.php
          grep -F "'accordion'  => 'Accordion'" hangar18-manager.php
          grep -F 'page_editor_tabs_script' hangar18-manager.php
          grep -F 'role="tablist"' hangar18-manager.php
          grep -F 'role="tabpanel"' hangar18-manager.php
          grep -F "e.key===\"ArrowRight\"" hangar18-manager.php
          grep -F '<details class="h18-editor-accordion-item' hangar18-manager.php
          grep -F '<summary>' hangar18-manager.php
          grep -F 'refreshCollectionEditorV0517' assets/admin.js
          grep -F 'initializeCollectionPanelsV0517' assets/admin.js
          grep -F "['card_grid', 'tabs', 'accordion'].includes(type)" assets/admin.js
          grep -F 'h18-canvas-tabs-nav' assets/admin.css
          grep -F 'page-editor schema forbliver 1.13' readme.txt
          python3 - <<'PY'
          from pathlib import Path
          php = Path('hangar18-manager.php').read_text()
          js = Path('assets/admin.js').read_text()
          # Tabs must use existing Cards; introducing a parallel item schema is rejected.
          forbidden = ['TabItems', 'AccordionItems', 'TabsItems', 'AccordionPanels']
          hits = [item for item in forbidden if item in php or item in js]
          if hits:
              raise SystemExit('Parallel tabs data model detected: ' + repr(hits))
          required_php = ['role="tab"', 'aria-selected=', 'tabindex=', 'ArrowLeft', 'ArrowRight', 'Home', 'End', '<details', '<summary>']
          missing = [item for item in required_php if item not in php]
          if missing:
              raise SystemExit('Missing accessibility behavior: ' + repr(missing))
          # No schema bump: Cards are already present in schema 1.13.
          if "'Version'        => '1.14'" in php:
              raise SystemExit('Unexpected page schema bump')
          # Frontend tab script contains no user-provided JS interpolation except JSON-encoded fixed section id.
          helper_start = php.index('private function page_editor_tabs_script')
          helper_end = php.index('private function render_page_editor_list_primitive', helper_start)
          helper = php[helper_start:helper_end]
          if 'wp_json_encode' not in helper:
              raise SystemExit('Tab script section id is not JSON encoded')
          print('v0.5.17 structural/accessibility QA passed')
          PY

      - name: Rebuild distribution package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build/hangar18-manager/assets
          cp hangar18-manager.php .build/hangar18-manager/
          cp readme.txt .build/hangar18-manager/
          cp assets/admin.css .build/hangar18-manager/assets/
          cp assets/admin.js .build/hangar18-manager/assets/
          rm -f dist/hangar18-manager.zip
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip

      - name: Update manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          package = Path('dist/hangar18-manager.zip')
          manifest = {
              'schema_version': '1.0',
              'plugin': 'hangar18-manager',
              'version': '0.5.17',
              'min_wp': '6.4',
              'min_php': '8.0',
              'published_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'package_path': 'dist/hangar18-manager.zip',
              'package_sha256': hashlib.sha256(package.read_bytes()).hexdigest(),
              'changelog': [
                  'Tilføjer UD-030 Tabs/Faner og Accordion som native sideeditor-elementer.',
                  'Genbruger Cards som panelmodel, så Undo/Redo, autosave, komponenter og designkontroller følger med.',
                  'Tabs får tablist/tab/tabpanel semantik, roving tabindex og pile/Home/End-navigation.',
                  'Accordion bruger native details/summary og panelernes eksisterende Card-design.',
                  'Page-editor schema forbliver 1.13 uden ekstra datamigrering.'
              ]
          }
          Path('update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(manifest['package_sha256'])
          PY

      - name: Package QA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .verify
          mkdir .verify
          unzip -q dist/hangar18-manager.zip -d .verify
          php -l .verify/hangar18-manager/hangar18-manager.php
          node --check .verify/hangar18-manager/assets/admin.js
          grep -F 'Version: 0.5.17' .verify/hangar18-manager/hangar18-manager.php
          grep -F "'tabs'       => 'Faner / tabs'" .verify/hangar18-manager/hangar18-manager.php
          grep -F 'page_editor_tabs_script' .verify/hangar18-manager/hangar18-manager.php
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('update.json').read_text())
          actual = hashlib.sha256(Path('dist/hangar18-manager.zip').read_bytes()).hexdigest()
          assert manifest['version'] == '0.5.17'
          assert manifest['package_sha256'] == actual
          print('Package manifest QA passed:', actual)
          PY

      - name: Self-clean and diff scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build .verify
          rm -f .github/scripts/patch_v0517.py .github/workflows/build-v0517.yml
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed = {
              'hangar18-manager.php','assets/admin.js','assets/admin.css','readme.txt','update.json','dist/hangar18-manager.zip',
              '.github/scripts/patch_v0517.py','.github/workflows/build-v0517.yml'
          }
          paths = set()
          for line in subprocess.check_output(['git','status','--short'], text=True).splitlines():
              path = line[3:].strip()
              if ' -> ' in path: path = path.split(' -> ',1)[1]
              paths.add(path)
          extra = paths - allowed
          if extra: raise SystemExit('Unexpected release-scope files: ' + repr(sorted(extra)))
          print('Release scope QA passed')
          PY

      - name: Commit v0.5.17 release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Release Hangar18 Manager 0.5.17'
          git push origin HEAD:development/v0.5.17
