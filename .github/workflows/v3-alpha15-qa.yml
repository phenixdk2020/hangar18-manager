name: V3 Alpha.15 V1 Mobile Page Flow QA

on:
  push:
    branches: [v3-alpha15-v1-mobile-page-flow]
    paths:
      - '.github/scripts/build_v3_alpha15.py'
      - '.github/workflows/v3-alpha15-qa.yml'
      - 'V3-ALPHA15.md'
  pull_request:
    branches: [v3-clean-refactor]

jobs:
  alpha15-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock V1 0.1.93 source runtime
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='dc3bad403c764f4ec123a526333a781d05dde491'
          git cat-file -e "${BASELINE}^{commit}"
          git diff --exit-code "$BASELINE" -- clean/hangar18-manager
          echo 'V1 0.1.93 source runtime: byte-identical PASS'

      - name: Verify working V1 mobile page-flow reference
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '.h18-editor-text-image{grid-template-columns:1fr}' hangar18-manager.php
          grep -Fq '.h18-page-form-grid{grid-template-columns:1fr}' hangar18-manager.php
          grep -Fq '.h18-editor-card-grid{grid-template-columns:repeat(var(--h18-mobile-grid-columns,1),minmax(0,1fr))' hangar18-manager.php
          grep -Fq 'body.page .h18-editor-page .wp-block-columns{flex-direction:column}' hangar18-manager.php
          grep -Fq 'MobileHorizontalPaddingPx' hangar18-manager.php
          grep -Fq '.h18-gallery-item img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}' hangar18-manager.php
          grep -Fq '.h18-event-card-image{aspect-ratio:16/10;overflow:hidden' hangar18-manager.php
          echo 'Working V1 one-column/padding/card-ratio mobile reference: PASS'

      - name: Retained V1 regression gates
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 .github/scripts/v0192_export_integrity_qa.py
          python3 .github/scripts/v0191_form_design_controls_qa.py
          python3 .github/scripts/v0190_form_wysiwyg_parity_qa.py
          python3 .github/scripts/v0189_manager_cleanup_export_all_qa.py
          python3 .github/scripts/v0186_site_settings_qa.py
          python3 .github/scripts/v0185_editor_live_box_qa.py
          python3 .github/scripts/v0185_semantic_qa.py
          python3 .github/scripts/v0184_portable_transfer_qa.py

      - name: Build Alpha.14 menu reference
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build_v3_alpha14.py
          ROOT='build/visual-designer-manager'
          grep -Fq '<details class="h18-clean-front-menu-details">' "$ROOT/src/Frontend/Renderer.php"
          grep -Fq 'h18-clean-front-menu-details[open]>.h18-clean-front-menu-panel' "$ROOT/src/Frontend/Renderer.php"
          echo 'Alpha.14 working menu baseline: PASS'

      - name: Build and validate V3 3.0.0-alpha.15
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/build_v3_alpha15.py
          python3 .github/scripts/build_v3_alpha15.py
          ROOT='build/visual-designer-manager'
          MAIN="$ROOT/visual-designer-manager.php"
          RENDERER="$ROOT/src/Frontend/Renderer.php"
          RESPONSIVE="$ROOT/src/Frontend/ResponsiveRenderer.php"
          HISTORY="$ROOT/release-history.json"

          grep -Fq 'Version: 3.0.0-alpha.15' "$MAIN"
          grep -Fq '<details class="h18-clean-front-menu-details">' "$RENDERER"
          grep -Fq -- '--h18-vdm-gap-y:' "$RENDERER"
          grep -Fq -- '--h18-vdm-pad-top:' "$RENDERER"
          grep -Fq "metadata_exists('post', \$postId, '_h18_clean_layout_v1')" "$RESPONSIVE"
          grep -Fq 'private static function v1MobileFlowCss(' "$RESPONSIVE"
          grep -Fq 'display:flex!important;flex-direction:column!important' "$RESPONSIVE"
          grep -Fq 'grid-template-columns:1fr!important' "$RESPONSIVE"
          grep -Fq 'padding-right:min(var(--h18-vdm-pad-right,0px),18px)!important' "$RESPONSIVE"
          grep -Fq 'padding-top:min(var(--h18-vdm-pad-top,0px),38px)!important' "$RESPONSIVE"
          grep -Fq 'grid-column:auto!important;grid-row:auto!important' "$RESPONSIVE"
          grep -Fq 'transform:none!important' "$RESPONSIVE"
          grep -Fq 'aspect-ratio:4/3' "$RESPONSIVE"
          grep -Fq 'aspect-ratio:16/10' "$RESPONSIVE"
          grep -Fq '3.0.0-alpha.15' "$HISTORY"

          test ! -e "$ROOT/assets/v3-alpha10-mobile-reflow.js"
          test ! -e "$ROOT/assets/v3-alpha11-mobile-reflow.js"
          ! grep -Fq 'ResizeObserver' "$RESPONSIVE"
          ! grep -Fq 'getBoundingClientRect' "$RESPONSIVE"

          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find "$ROOT/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          echo 'Alpha.15 deterministic V1 mobile page flow contract: PASS'

      - name: Package Alpha.15 QA artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION='3.0.0-alpha.15'
          mkdir -p dist
          ZIP="dist/visual-designer-manager-v${VERSION}.zip"
          rm -f "$ZIP"
          (cd build && zip -qr "../$ZIP" visual-designer-manager)
          unzip -tq "$ZIP"
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/visual-designer-manager.php$')" = '1'
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/src/Frontend/ResponsiveRenderer.php$')" = '1'
          echo "SHA256=$(sha256sum "$ZIP" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: visual-designer-manager-v3.0.0-alpha.15-qa
          path: dist/visual-designer-manager-v3.0.0-alpha.15.zip
          if-no-files-found: error
