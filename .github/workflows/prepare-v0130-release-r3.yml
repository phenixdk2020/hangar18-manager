name: Prepare Visual Designer Manager 0.1.30 release r3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-v0130-release-r3.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final source changes
        shell: python
        run: |
          from pathlib import Path

          plugin = Path('clean/hangar18-manager/hangar18-manager.php')
          s = plugin.read_text(encoding='utf-8')
          if 'Version: 0.1.29' in s:
              s = s.replace('Version: 0.1.29', 'Version: 0.1.30', 1)
              s = s.replace("H18_CLEAN_VERSION', '0.1.29'", "H18_CLEAN_VERSION', '0.1.30'", 1)
          if 'Version: 0.1.30' not in s or "H18_CLEAN_VERSION', '0.1.30'" not in s:
              raise SystemExit('Plugin version could not be set to 0.1.30')
          plugin.write_text(s, encoding='utf-8')

          responsive_js = Path('clean/hangar18-manager/assets/editor-v0121.js')
          s = responsive_js.read_text(encoding='utf-8')
          old = "function isFloatingButton(node) { return !!(node && node.type === 'button' && node.parentId && node.props && node.props.placementMode === 'overlay'); }"
          new = "function isFloatingButton(node) { return !!(node && node.type === 'button' && node.props && node.props.placementMode === 'overlay'); }"
          if old in s:
              s = s.replace(old, new, 1)
          if new not in s:
              raise SystemExit('Responsive editor floating predicate not correct')
          responsive_js.write_text(s, encoding='utf-8')

          responsive_php = Path('clean/hangar18-manager/src/Frontend/ResponsiveRenderer.php')
          s = responsive_php.read_text(encoding='utf-8')
          old = "$floating = (string) ($node['type'] ?? '') === 'button' && (string) ($node['parentId'] ?? '') !== '' && (string) ($props['placementMode'] ?? 'normal') === 'overlay';"
          new = "$floating = (string) ($node['type'] ?? '') === 'button' && (string) ($props['placementMode'] ?? 'normal') === 'overlay';"
          if old in s:
              s = s.replace(old, new, 1)
          if new not in s:
              raise SystemExit('Responsive frontend floating predicate not correct')
          responsive_php.write_text(s, encoding='utf-8')

          renderer = Path('clean/hangar18-manager/src/Frontend/Renderer.php')
          s = renderer.read_text(encoding='utf-8')
          line = next((x for x in s.splitlines() if '.h18-clean-page,.h18-clean-front-surface{display:grid;' in x), '')
          if not line:
              raise SystemExit('Frontend root surface CSS missing')
          if 'position:relative' not in line:
              s = s.replace('.h18-clean-page,.h18-clean-front-surface{display:grid;', '.h18-clean-page,.h18-clean-front-surface{display:grid;position:relative;', 1)
          renderer.write_text(s, encoding='utf-8')

          rich = Path('clean/hangar18-manager/assets/editor-v0125.js')
          s = rich.read_text(encoding='utf-8')
          marker = "        restoreSelection();\n        try { document.execCommand(name, false, value || null); } catch (ignore) {}"
          replacement = "        restoreSelection();\n        try { document.execCommand('styleWithCSS', false, false); } catch (ignoreStyleMode) {}\n        try { document.execCommand(name, false, value || null); } catch (ignore) {}"
          if "document.execCommand('styleWithCSS', false, false)" not in s:
              if marker not in s:
                  raise SystemExit('Rich text command marker missing')
              s = s.replace(marker, replacement, 1)
          rich.write_text(s, encoding='utf-8')

          admin = Path('clean/hangar18-manager/src/Admin/AdminController.php')
          s = admin.read_text(encoding='utf-8')
          s = s.replace("self::open('Backup', 'Eksport af Clean-layout og versionshistorik');", "self::open('Backup', 'Eksport af Visual Designer-layout og versionshistorik');")
          s = s.replace('sider, der har Clean-state', 'sider, der har Visual Designer-data')
          s = s.replace('<li>Aktuel Clean-version</li>', '<li>Aktuel Designer-version</li>')
          admin.write_text(s, encoding='utf-8')

          updater = Path('clean/hangar18-manager/src/Update/GitHubUpdater.php')
          s = updater.read_text(encoding='utf-8')
          s = s.replace(
              'Før WordPress udskifter pluginfilerne, gemmes en ZIP-backup af den installerede Visual Designer Manager-version. Opdateringen afbrydes, hvis backupen ikke kan oprettes.',
              'Før WordPress udskifter pluginfilerne, gemmes både en ZIP-backup af den installerede version og et Designer-data-checkpoint. Opdateringen afbrydes, hvis checkpointet ikke kan oprettes.'
          )
          updater.write_text(s, encoding='utf-8')

          Path('clean-release-notes.html').write_text('''<h4>0.1.30</h4><ul><li><strong>Inspector-scroll:</strong> Inspector er nu bundet til den synlige viewport med egen scrollbar og korrekt box-sizing, så nederste felter kan nås uden at rulle hele browservinduet.</li><li><strong>Rich text / Fed:</strong> rich-text-editoren arver ikke længere Inspectors label-vægt, og formatteringskommandoer tvinges til semantisk HTML frem for browser-CSS. Normal tekst forbliver normal, og Fed/Kursiv tåler re-render bedre.</li><li><strong>Ægte Flydende Knap:</strong> Floating er et parent-relativt overlay og kan også bruges på Side-root. Desktop, Laptop, Mobil, Forhåndsvisning og frontend bruger samme floating-princip; den er aldrig position:fixed til browseren.</li><li><strong>Update-checkpoint:</strong> før hver plugin-opdatering gemmes både program-ZIP og Designer-data med sidelayouts, sidehistorik, Header/Footer-valg, templates, template-settings og template-historik. Opdateringen stoppes hvis checkpointet fejler.</li><li><strong>Backupoversigt:</strong> Opdateringer viser de seneste lokale update-checkpoints; der beholdes op til 12.</li><li><strong>Versionshistorik:</strong> Opdateringer viser punkterne for 0.1.23–0.1.30 fra den bundled release-historik.</li><li><strong>Naming:</strong> resterende synlige Clean-tekster på Backup-siden er rettet til Visual Designer.</li></ul>''', encoding='utf-8')

          release = Path('.github/workflows/clean-release.yml')
          s = release.read_text(encoding='utf-8')
          marker = "          # 0.1.29 parent-relative floating Button release gates.\n"
          if marker not in s:
              raise SystemExit('Release gate insertion marker missing')
          gates = """          # 0.1.30 update checkpoint / Inspector / root-floating gates.\n          grep -q \"createDesignerCheckpoint\" clean/hangar18-manager/src/Update/GitHubUpdater.php\n          grep -q \"programBackups\" clean/hangar18-manager/src/Update/GitHubUpdater.php\n          grep -q \"releaseHistory\" clean/hangar18-manager/src/Update/GitHubUpdater.php\n          grep -q \"Update-checkpoints\" clean/hangar18-manager/src/Admin/AdminController.php\n          grep -q \"Versionshistorik\" clean/hangar18-manager/src/Admin/AdminController.php\n          grep -q \"font-weight:400\" clean/hangar18-manager/assets/editor-v0125.css\n          grep -q \"styleWithCSS\" clean/hangar18-manager/assets/editor-v0125.js\n          grep -q \"height:calc(100dvh - 102px)\" clean/hangar18-manager/assets/editor-v0123-ux.css\n          grep -q \"function isFloatingButton(node).*node.props.*placementMode.*overlay\" clean/hangar18-manager/assets/editor-v0121.js\n          grep -q \"=== 'button'.*placementMode.*overlay\" clean/hangar18-manager/src/Frontend/ResponsiveRenderer.php\n          grep -q \"position:relative\" clean/hangar18-manager/src/Frontend/Renderer.php\n          test -s clean/hangar18-manager/release-history.json\n          grep -q '\"version\": \"0.1.30\"' clean/hangar18-manager/release-history.json\n"""
          if '# 0.1.30 update checkpoint / Inspector / root-floating gates.' not in s:
              s = s.replace(marker, gates + marker, 1)
          package_marker = "          test \"$(unzip -Z1 \"$VERSIONED\" | grep -c '^hangar18-manager/assets/editor-v0125.css$')\" = '1'\n"
          package_gate = package_marker + "          test \"$(unzip -Z1 \"$VERSIONED\" | grep -c '^hangar18-manager/release-history.json$')\" = '1'\n"
          if '^hangar18-manager/release-history.json$' not in s:
              if package_marker not in s:
                  raise SystemExit('Package gate insertion marker missing')
              s = s.replace(package_marker, package_gate, 1)
          release.write_text(s, encoding='utf-8')

          Path('clean-release-now.txt').write_text('Release Visual Designer Manager v0.1.30\n', encoding='utf-8')

      - name: Final source QA
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php
          grep -q 'Version: 0.1.30' clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.30'" clean/hangar18-manager/hangar18-manager.php
          grep -q 'createDesignerCheckpoint' clean/hangar18-manager/src/Update/GitHubUpdater.php
          grep -q 'font-weight:400' clean/hangar18-manager/assets/editor-v0125.css
          grep -q 'styleWithCSS' clean/hangar18-manager/assets/editor-v0125.js
          grep -q 'height:calc(100dvh - 102px)' clean/hangar18-manager/assets/editor-v0123-ux.css
          grep -q "function isFloatingButton(node).*node.props.*placementMode.*overlay" clean/hangar18-manager/assets/editor-v0121.js
          grep -q "=== 'button'.*placementMode.*overlay" clean/hangar18-manager/src/Frontend/ResponsiveRenderer.php
          grep -q 'position:relative' clean/hangar18-manager/src/Frontend/Renderer.php
          test -s clean/hangar18-manager/release-history.json

      - name: Commit and trigger release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-release-prep'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager/hangar18-manager.php clean/hangar18-manager/assets/editor-v0121.js clean/hangar18-manager/assets/editor-v0125.js clean/hangar18-manager/src/Frontend/ResponsiveRenderer.php clean/hangar18-manager/src/Frontend/Renderer.php clean/hangar18-manager/src/Admin/AdminController.php clean/hangar18-manager/src/Update/GitHubUpdater.php clean-release-notes.html clean-release-now.txt .github/workflows/clean-release.yml
          git commit -m 'Prepare Visual Designer Manager v0.1.30 release'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
