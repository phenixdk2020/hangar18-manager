name: Diagnose Hangar18 v0.5.20
on:
  push:
    branches: [qa/v0.5.20-diagnose]
    paths: ['.github/workflows/diagnose-v0520.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.20-diagnose
      - name: Run patch and record result
        shell: bash
        run: |
          set +e
          LOG=.github/diagnostics-v0520.txt
          : > "$LOG"
          echo '=== PATCH ===' >> "$LOG"
          python3 .github/scripts/patch_v0520.py >> "$LOG" 2>&1
          echo "patch_status=$?" >> "$LOG"
          echo '=== PHP ===' >> "$LOG"
          php -l hangar18-manager.php >> "$LOG" 2>&1
          echo "php_status=$?" >> "$LOG"
          echo '=== JS ===' >> "$LOG"
          node --check assets/admin.js >> "$LOG" 2>&1
          echo "js_status=$?" >> "$LOG"
          echo '=== QA ===' >> "$LOG"
          python3 .github/scripts/qa_v0520.py >> "$LOG" 2>&1
          echo "qa_status=$?" >> "$LOG"
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add "$LOG"
          git commit -m 'QA: record v0.5.20 diagnostic'
          git push origin HEAD:qa/v0.5.20-diagnose
