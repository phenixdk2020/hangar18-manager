name: Apply Visual Designer Manager 0.1.59 Text Background Inheritance

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_v0159_text_background_inheritance.py'
      - '.github/workflows/apply-v0159-text-background-inheritance.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.1.59 patch
        run: python3 .github/scripts/apply_v0159_text_background_inheritance.py

      - name: PHP syntax
        run: find clean/hangar18-manager -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in clean/hangar18-manager/assets/*.js; do node --check "$f"; done

      - name: Existing model regression QA
        run: |
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php

      - name: Verify Text background inheritance release
        run: |
          set -euo pipefail
          grep -Fq 'Version: 0.1.59' clean/hangar18-manager/hangar18-manager.php
          grep -Fq "H18_CLEAN_VERSION', '0.1.59'" clean/hangar18-manager/hangar18-manager.php
          grep -Fq "'backgroundTransparent' => true," clean/hangar18-manager/src/Model/LayoutModel.php
          grep -Fq 'VD-TEXT-BG-INHERIT-001' CLEAN-TECHNICAL-MANUAL.md
          grep -Fq '0.1.59 – Tekstbaggrund arver Kasse/Sektion' clean-release-notes.html
          grep -Fq 'Release Visual Designer Manager v0.1.59' visual-designer-release-now.txt
          test -s docs/v0159-status.md
          python3 - <<'PY'
          import json
          data = json.load(open('clean/hangar18-manager/release-history.json', encoding='utf-8'))
          assert data['versions'][0]['version'] == '0.1.59'
          PY
          echo '0.1.59 Text background inheritance PASS'

      - name: Preserve critical regression gates
        run: |
          set -euo pipefail
          grep -Fq "selectionSessionMode: 'prearmed-v0138'" clean/hangar18-manager/assets/editor-v0125.js
          grep -Fq 'boundary-markers-v0137-single-owner' clean/hangar18-manager/assets/editor-v0125.js
          grep -Fq "var mode = 'fit'" clean/hangar18-manager/assets/editor-v0144-viewport.js
          grep -Fq 'data-h18-leaf-transparent' clean/hangar18-manager/assets/editor-v018-core.js
          grep -Fq "'menu-item-classes' => self::menuItemClasses(\$item->classes)" clean/hangar18-manager/src/Admin/NavigationController.php
          echo 'regression gates PASS'

      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name 'phenixdk2020'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager/hangar18-manager.php clean/hangar18-manager/release-history.json clean-release-notes.html CLEAN-TECHNICAL-MANUAL.md docs/v0159-status.md visual-designer-release-now.txt
          if git diff --cached --quiet; then echo 'No implementation changes'; exit 0; fi
          git commit -m 'Prepare Visual Designer Manager 0.1.59 release'
          git pull --rebase origin main
          git push origin HEAD:main
