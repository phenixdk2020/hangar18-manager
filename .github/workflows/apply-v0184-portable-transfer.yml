name: Apply Visual Designer Manager 0.1.84 Portable Transfer

on:
  push:
    branches: [vdm-v0184-portable-transfer]
    paths:
      - '.github/workflows/apply-v0184-portable-transfer.yml'
      - '.github/scripts/apply_v0184_portable_transfer.py'
      - '.github/scripts/v0184_portable_transfer_qa.py'
      - 'clean/hangar18-manager/src/Admin/PortableTransferController.php'
      - 'clean/hangar18-manager/src/Compatibility/LegacyStorageBridge.php'

permissions:
  contents: write

jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vdm-v0184-portable-transfer
          fetch-depth: 0

      - name: Apply v0.1.84 bootstrap and release metadata
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_v0184_portable_transfer.py

      - name: Syntax and portable-transfer QA
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/apply_v0184_portable_transfer.py .github/scripts/v0184_portable_transfer_qa.py
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 .github/scripts/v0184_portable_transfer_qa.py

      - name: Regression QA
        run: |
          set -euo pipefail
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php
          php .github/scripts/v0161_header_footer_qa.php
          python3 .github/scripts/v0162_page_duplicate_qa.py
          python3 .github/scripts/v0164_clipboard_qa.py
          php .github/scripts/v0165_elements_model_qa.php
          python3 .github/scripts/v0165_general_elements_qa.py
          python3 .github/scripts/v0166_foundation_qa.py
          php .github/scripts/v0167_module_foundation_qa.php
          php .github/scripts/v0168_canvas_section_qa.php
          python3 .github/scripts/v0168_canvas_section_static_qa.py
          python3 .github/scripts/v0169_canvas_autoheight_qa.py
          python3 .github/scripts/v0170_vehicle_module_qa.py
          python3 .github/scripts/v0171_event_module_qa.py
          python3 .github/scripts/v0172_gallery_design_qa.py
          python3 .github/scripts/v0181_complete_qa.py

      - name: Verify scoped patch
        run: |
          set -euo pipefail
          find .github/scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          python3 - <<'PY'
          import subprocess
          allowed = {
              'clean/hangar18-manager/hangar18-manager.php',
              'clean/hangar18-manager/release-history.json',
              'clean-release-notes.html',
              'docs/v0184-status.md',
          }
          lines = subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], text=True).splitlines()
          changed = {line[3:] for line in lines if len(line) >= 4}
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('Unexpected v0.1.84 apply paths: ' + ', '.join(unexpected))
          missing = sorted({
              'clean/hangar18-manager/hangar18-manager.php',
              'clean/hangar18-manager/release-history.json',
              'clean-release-notes.html',
              'docs/v0184-status.md',
          } - changed)
          if missing:
              raise SystemExit('Expected v0.1.84 apply paths missing: ' + ', '.join(missing))
          PY
          grep -q 'Version: 0.1.84' clean/hangar18-manager/hangar18-manager.php
          grep -Fq "define('VDM_VERSION', '0.1.84');" clean/hangar18-manager/hangar18-manager.php
          grep -Fq "define('H18_CLEAN_VERSION', '0.1.84');" clean/hangar18-manager/hangar18-manager.php
          grep -Fq "private const PAGE = 'vdm-transfer';" clean/hangar18-manager/src/Admin/PortableTransferController.php
          grep -Fq "private const FORMAT = 'Visual Designer Manager Portable Site';" clean/hangar18-manager/src/Admin/PortableTransferController.php
          grep -Fq 'namespace VisualDesignerManager\Compatibility;' clean/hangar18-manager/src/Compatibility/LegacyStorageBridge.php
          test "$(python3 -c "import json; print(json.load(open('clean-update.json',encoding='utf-8'))['version'])")" = '0.1.83'

      - name: Commit verified v0.1.84 candidate
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-apply-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add \
            clean/hangar18-manager/hangar18-manager.php \
            clean/hangar18-manager/release-history.json \
            clean-release-notes.html \
            docs/v0184-status.md
          git diff --cached --quiet && exit 0 || true
          git commit -m 'Finalize Visual Designer Manager v0.1.84 portable transfer candidate'
          git push origin HEAD:vdm-v0184-portable-transfer
