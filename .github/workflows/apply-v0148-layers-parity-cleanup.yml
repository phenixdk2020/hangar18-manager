name: Apply Visual Designer Manager 0.1.48 Layers Parity Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0148-layers-parity-cleanup.yml'
      - '.github/scripts/apply_v0148_layers_parity_cleanup.py'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.1.48 patch
        shell: bash
        run: |
          set -euo pipefail
          # The 0.1.47 preview CSS is minified on one physical line. Normalize
          # the patch script's CSS needle before execution; source code itself
          # is still changed only by the deterministic patch script.
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_v0148_layers_parity_cleanup.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "'.vd-global-preview-canvas .h18-clean-node:not([data-h18-parent-painted-box=\"1\"]){background:transparent!important;border-color:transparent!important}\\n',",
              "'.vd-global-preview-canvas .h18-clean-node:not([data-h18-parent-painted-box=\"1\"]){background:transparent!important;border-color:transparent!important}',"
          )
          p.write_text(s, encoding='utf-8')
          PY
          python .github/scripts/apply_v0148_layers_parity_cleanup.py

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Regression and model QA
        shell: bash
        run: |
          set -euo pipefail
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php

      - name: Verify 0.1.48 contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Version: 0.1.48' clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.48'" clean/hangar18-manager/hangar18-manager.php

          grep -q 'editor-v0148-layers.js' clean/hangar18-manager/hangar18-manager.php
          grep -q 'editor-v0148-layers.css' clean/hangar18-manager/hangar18-manager.php
          grep -q 'data-h18-left-tab="layers"' clean/hangar18-manager/assets/editor-v0148-layers.js
          grep -q 'data-node-id' clean/hangar18-manager/assets/editor-v0148-layers.js
          grep -q "new MouseEvent('click'" clean/hangar18-manager/assets/editor-v0148-layers.js

          if grep -q 'border-color:transparent!important' clean/hangar18-manager/assets/global-designer-v0123.css; then
            echo 'Local template preview still suppresses canonical border color.' >&2
            exit 1
          fi
          grep -q '\$linkStyle = \$borderStyle . \$radiusStyle' clean/hangar18-manager/src/Frontend/Renderer.php
          if grep -q '\$buttonStyle = \$layoutStyle . \$borderStyle' clean/hangar18-manager/src/Frontend/Renderer.php; then
            echo 'Button wrapper still owns the painted border.' >&2
            exit 1
          fi

          if grep -q 'LegacyHeaderConverter::register' clean/hangar18-manager/hangar18-manager.php; then exit 1; fi
          if grep -q 'LegacyFooterConverter::register' clean/hangar18-manager/hangar18-manager.php; then exit 1; fi
          if grep -q 'renderLegacyHeaderConversion();' clean/hangar18-manager/src/Admin/GlobalDesignerController.php; then exit 1; fi
          if grep -q 'renderLegacyFooterConversion();' clean/hangar18-manager/src/Admin/GlobalDesignerController.php; then exit 1; fi
          if grep -q "admin_post_' . self::CONVERT_ACTION" clean/hangar18-manager/src/Admin/GlobalDesignerController.php; then exit 1; fi
          if grep -q "admin_post_' . self::FOOTER_CONVERT_ACTION" clean/hangar18-manager/src/Admin/GlobalDesignerController.php; then exit 1; fi

          grep -q "let mode = 'fit'" clean/hangar18-manager/assets/editor-v0144-viewport.js
          grep -q 'setFit();' clean/hangar18-manager/assets/editor-v0144-viewport.js
          grep -q "selectionRegressionGate: 'bug02-v0147-persistent'" clean/hangar18-manager/assets/editor-v0125.js
          grep -q "selectionOwner: 'v0125-authoritative'" clean/hangar18-manager/assets/editor-v0125.js
          grep -q "selectionSessionMode: 'prearmed-v0138'" clean/hangar18-manager/assets/editor-v0125.js

          grep -q '^Theme Name: AKVPK$' theme/legacy-v1.2.0/style.css
          grep -q '^Version: 1.2.1$' theme/legacy-v1.2.0/style.css
          grep -q '^Text Domain: hangar18-base$' theme/legacy-v1.2.0/style.css
          grep -q '"theme": "hangar18-base"' theme-update.json

          grep -q '"version": "0.1.48"' clean/hangar18-manager/release-history.json
          test -s docs/v0148-status.md
          grep -q '0.1.48 – Lag, parity og legacy-oprydning' CLEAN-TECHNICAL-MANUAL.md
          grep -q "get_option(self::CUTOVER_OPTION, '0') === '1'" clean/hangar18-manager/src/Frontend/ThemeShell.php

      - name: Build AKVPK theme 1.2.1 update package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .theme-build
          mkdir -p .theme-build/hangar18-base dist
          cp -a theme/legacy-v1.2.0/. .theme-build/hangar18-base/
          (cd .theme-build && zip -qr ../dist/hangar18-base-theme-v1.2.1.zip hangar18-base)
          unzip -tq dist/hangar18-base-theme-v1.2.1.zip
          THEME_SHA="$(sha256sum dist/hangar18-base-theme-v1.2.1.zip | awk '{print $1}')"
          base64 -w 0 dist/hangar18-base-theme-v1.2.1.zip > dist/hangar18-base-theme-v1.2.1.zip.b64
          printf '\n' >> dist/hangar18-base-theme-v1.2.1.zip.b64
          cp dist/hangar18-base-theme-v1.2.1.zip.b64 dist/hangar18-base-theme.zip.b64
          python - "$THEME_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path('theme-update.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['package_sha256'] = sys.argv[1]
          data['package_url'] = 'https://raw.githubusercontent.com/phenixdk2020/hangar18-manager/main/dist/hangar18-base-theme.zip.b64'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -rf .theme-build dist/hangar18-base-theme-v1.2.1.zip
          echo "AKVPK theme package SHA256: $THEME_SHA"

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-implementation-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add \
            clean/hangar18-manager/hangar18-manager.php \
            clean/hangar18-manager/src/Admin/GlobalDesignerController.php \
            clean/hangar18-manager/src/Frontend/Renderer.php \
            clean/hangar18-manager/assets/global-designer-v0123.css \
            clean/hangar18-manager/assets/editor-v0148-layers.js \
            clean/hangar18-manager/assets/editor-v0148-layers.css \
            clean/hangar18-manager/release-history.json \
            clean-release-notes.html \
            docs/v0148-status.md \
            CLEAN-TECHNICAL-MANUAL.md \
            theme/legacy-v1.2.0/style.css \
            theme-update.json \
            dist/hangar18-base-theme-v1.2.1.zip.b64 \
            dist/hangar18-base-theme.zip.b64
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Add layers parity cleanup and AKVPK theme in v0.1.48'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
