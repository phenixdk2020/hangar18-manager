name: Apply Visual Designer Manager 0.1.26 hotfix

on:
  push:
    branches: [main]
    paths:
      - 'v0126-apply-now.txt'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic 0.1.26 patch
        run: python .github/scripts/apply_v0126.py

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Hierarchy normalizer QA
        run: php .github/scripts/hierarchy_normalizer_qa.php

      - name: 0.1.25 model regression QA
        run: php .github/scripts/v0125_model_qa.php

      - name: Verify 0.1.26 hotfix scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q "headingFontFamily" clean/hangar18-manager/src/Model/LayoutModel.php
          grep -q "headingFontSize" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "rememberSelection" clean/hangar18-manager/assets/editor-v0125.js
          grep -q "querySelectorAll('div')" clean/hangar18-manager/assets/editor-v0125.js
          grep -q "manualW" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "autoSize" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "autoFitButtons" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "nl2br" clean/hangar18-manager/src/Frontend/Renderer.php
          grep -q "editor labels are chrome" clean/hangar18-manager/assets/editor-v0123-ux.css
          grep -q "overscroll-behavior:contain" clean/hangar18-manager/assets/editor-v0123-ux.css
          if grep -n "Gem clean layout" clean/hangar18-manager/assets/editor-v018-core.js clean/hangar18-manager/assets/editor-v0120.js clean/hangar18-manager/assets/editor-v0121.js clean/hangar18-manager/assets/editor-v0122-hierarchy.js clean/hangar18-manager/assets/editor-v0123-ux.js clean/hangar18-manager/assets/editor-v0125.js; then
            echo 'Obsolete generic Clean save note remains in an active runtime asset.' >&2
            exit 1
          fi

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-implementation-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager
          if git diff --cached --quiet; then
            echo '0.1.26 hotfix already applied.'
            exit 0
          fi
          git commit -m 'Fix Visual Designer WYSIWYG and typography editing for 0.1.26'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'Unable to publish 0.1.26 hotfix source.' >&2
          exit 1
