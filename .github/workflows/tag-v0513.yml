name: Tag Hangar18 Manager v0.5.13

on:
  push:
    branches:
      - maintenance/tag-v0.5.13
    paths:
      - '.github/workflows/tag-v0513.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/tag-v0.5.13
          fetch-depth: 0
      - name: Tag v0.5.13 and self-clean
        shell: bash
        run: |
          set -euo pipefail
          release_sha="272925f082c6c33f67164ae49389b65523442189"
          git fetch origin main --tags
          git show "$release_sha:hangar18-manager.php" > /tmp/h18-v0513.php
          grep -F 'Version: 0.5.13' /tmp/h18-v0513.php
          grep -F "const VERSION = '0.5.13';" /tmp/h18-v0513.php
          git tag -f v0.5.13 "$release_sha"
          git push origin refs/tags/v0.5.13 --force
          git rm .github/workflows/tag-v0513.yml
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git commit -m "Clean v0.5.13 tag workflow"
          git push origin HEAD:maintenance/tag-v0.5.13
