name: Apply Visual Designer Manager 0.1.58 Side Designer Save

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_v0158_side_designer_save.py'
      - '.github/workflows/apply-v0158-side-designer-save.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.1.58 patch
        run: python3 .github/scripts/apply_v0158_side_designer_save.py

      - name: PHP syntax
        run: find clean/hangar18-manager -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in clean/hangar18-manager/assets/*.js; do node --check "$f"; done

      - name: Existing model regression QA
        run: |
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php

      - name: Verify Side Designer save lifecycle
        run: |
          set -euo pipefail
          grep -Fq 'Version: 0.1.58' clean/hangar18-manager/hangar18-manager.php
          grep -Fq "H18_CLEAN_VERSION', '0.1.58'" clean/hangar18-manager/hangar18-manager.php
          grep -Fq 'private static function touchFrontendPage' clean/hangar18-manager/src/Admin/EditorController.php
          grep -Fq 'wp_update_post($update, true)' clean/hangar18-manager/src/Admin/EditorController.php
          grep -Fq 'clean_post_cache($postId)' clean/hangar18-manager/src/Admin/EditorController.php
          grep -Fq "do_action('h18_clean_designer_page_saved'" clean/hangar18-manager/src/Admin/EditorController.php
          grep -Fq "add_query_arg('h18_vd_saved', \$version, \$permalink)" clean/hangar18-manager/src/Admin/EditorController.php
          grep -Fq 'frontend_cache_invalidated' clean/hangar18-manager/src/Admin/EditorController.php
          grep -Fq 'VD-PAGE-SAVE-CACHE-001' CLEAN-TECHNICAL-MANUAL.md
          test -s docs/v0158-status.md
          echo '0.1.58 Side Designer save lifecycle PASS'

      - name: Prove menu code is untouched
        run: |
          set -euo pipefail
          if ! git diff --quiet -- clean/hangar18-manager/src/Admin/NavigationController.php; then
            echo '0.1.58 must not change NavigationController.php' >&2
            git diff -- clean/hangar18-manager/src/Admin/NavigationController.php
            exit 1
          fi
          grep -Fq "'menu-item-classes' => self::menuItemClasses(\$item->classes)" clean/hangar18-manager/src/Admin/NavigationController.php
          echo 'Menu runtime unchanged PASS'

      - name: Preserve critical regression gates
        run: |
          set -euo pipefail
          grep -Fq "selectionSessionMode: 'prearmed-v0138'" clean/hangar18-manager/assets/editor-v0125.js
          grep -Fq 'boundary-markers-v0137-single-owner' clean/hangar18-manager/assets/editor-v0125.js
          grep -Fq "var mode = 'fit'" clean/hangar18-manager/assets/editor-v0144-viewport.js
          grep -Fq 'data-h18-leaf-transparent' clean/hangar18-manager/assets/editor-v018-core.js
          grep -Fq 'VD-MENU-UX-003' CLEAN-TECHNICAL-MANUAL.md
          grep -Fq 'VD-PAGES-ACTIONS-001' CLEAN-TECHNICAL-MANUAL.md
          echo 'regression gates PASS'

      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name 'phenixdk2020'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager/hangar18-manager.php clean/hangar18-manager/src/Admin/EditorController.php clean/hangar18-manager/release-history.json clean-release-notes.html CLEAN-TECHNICAL-MANUAL.md docs/v0158-status.md
          if git diff --cached --quiet; then echo 'No implementation changes'; exit 0; fi
          git commit -m 'Fix Side Designer save frontend synchronization in 0.1.58'
          git pull --rebase origin main
          git push origin HEAD:main
