name: Visual Designer Manager V3 Alpha.15 Release

on:
  push:
    branches: [v3-clean-refactor]
    paths:
      - 'v3-alpha15-release-now.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v3-alpha15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock V1 0.1.93 runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='dc3bad403c764f4ec123a526333a781d05dde491'
          git cat-file -e "${BASELINE}^{commit}"
          git diff --exit-code "$BASELINE" -- clean/hangar18-manager

      - name: Verify working V1 mobile page-flow reference
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'h18-editor-text-image' hangar18-manager.php
          grep -Fq 'grid-template-columns:1fr' hangar18-manager.php
          grep -Fq 'h18-mobile-grid-columns' hangar18-manager.php
          grep -Fq 'flex-direction:column' hangar18-manager.php
          grep -Fq 'MobileHorizontalPaddingPx' hangar18-manager.php
          grep -Fq 'aspect-ratio:4/3' hangar18-manager.php
          grep -Fq 'aspect-ratio:16/10' hangar18-manager.php

      - name: Run retained V1 regression gates
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 .github/scripts/v0192_export_integrity_qa.py
          python3 .github/scripts/v0191_form_design_controls_qa.py
          python3 .github/scripts/v0190_form_wysiwyg_parity_qa.py
          python3 .github/scripts/v0189_manager_cleanup_export_all_qa.py
          python3 .github/scripts/v0186_site_settings_qa.py
          python3 .github/scripts/v0185_editor_live_box_qa.py
          python3 .github/scripts/v0185_semantic_qa.py
          python3 .github/scripts/v0184_portable_transfer_qa.py

      - name: Build and validate V3 3.0.0-alpha.15
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build_v3_alpha15.py
          ROOT='build/visual-designer-manager'
          MAIN="$ROOT/visual-designer-manager.php"
          RENDERER="$ROOT/src/Frontend/Renderer.php"
          RESPONSIVE="$ROOT/src/Frontend/ResponsiveRenderer.php"
          grep -Fq 'Version: 3.0.0-alpha.15' "$MAIN"
          grep -Fq '<details class="h18-clean-front-menu-details">' "$RENDERER"
          grep -Fq -- '--h18-vdm-gap-y:' "$RENDERER"
          grep -Fq -- '--h18-vdm-pad-top:' "$RENDERER"
          grep -Fq 'private static function v1MobileFlowCss(' "$RESPONSIVE"
          grep -Fq 'display:flex!important;flex-direction:column!important' "$RESPONSIVE"
          grep -Fq 'grid-template-columns:1fr!important' "$RESPONSIVE"
          grep -Fq 'padding-right:min(var(--h18-vdm-pad-right,0px),18px)!important' "$RESPONSIVE"
          grep -Fq 'padding-top:min(var(--h18-vdm-pad-top,0px),38px)!important' "$RESPONSIVE"
          grep -Fq 'grid-column:auto!important;grid-row:auto!important' "$RESPONSIVE"
          grep -Fq 'aspect-ratio:4/3' "$RESPONSIVE"
          grep -Fq 'aspect-ratio:16/10' "$RESPONSIVE"
          test ! -e "$ROOT/assets/v3-alpha10-mobile-reflow.js"
          test ! -e "$ROOT/assets/v3-alpha11-mobile-reflow.js"
          ! grep -Fq 'ResizeObserver' "$RESPONSIVE"
          ! grep -Fq 'getBoundingClientRect' "$RESPONSIVE"
          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find "$ROOT/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Package V3 alpha.15 and create updater manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION='3.0.0-alpha.15'
          mkdir -p dist
          ZIP="dist/visual-designer-manager-v${VERSION}.zip"
          rm -f "$ZIP"
          (cd build && zip -qr "../$ZIP" visual-designer-manager)
          unzip -tq "$ZIP"
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/visual-designer-manager.php$')" = '1'
          SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          python3 - "$SHA" "$SOURCE_COMMIT" <<'PY'
          import json, sys
          from pathlib import Path
          sha, source_commit = sys.argv[1:3]
          version = '3.0.0-alpha.15'
          data = {
              'name': 'Visual Designer Manager',
              'slug': 'visual-designer-manager',
              'version': version,
              'homepage': 'https://github.com/phenixdk2020/hangar18-manager/tree/v3-clean-refactor',
              'requires': '6.4',
              'requires_php': '8.0',
              'tested': '6.8',
              'package': f'https://raw.githubusercontent.com/phenixdk2020/hangar18-manager/v3-clean-refactor/dist/visual-designer-manager-v{version}.zip',
              'sha256': sha,
              'source_commit': source_commit,
              'source_baseline': 'dc3bad403c764f4ec123a526333a781d05dde491',
              'source_version': '0.1.93',
              'sections': {
                  'description': 'Visual Designer Manager V3 med V1 som funktionel og visuel reference.',
                  'changelog': '3.0.0-alpha.15: V1 Mobile Page Flow Parity. Converted V1 pages now use full-width natural one-column phone flow, deterministic mobile ordering, compact V1-like spacing, one-column event/gallery layouts and the working Alpha.14 menu.'
              }
          }
          Path('v3-update.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          echo "V3_PACKAGE_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "V3 package SHA-256: $SHA"

      - name: Commit verified V3 package to V3 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-v3-release-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add v3-update.json dist/visual-designer-manager-v3.0.0-alpha.15.zip
          if git diff --cached --quiet; then
            echo 'Verified V3 package already current.'
            exit 0
          fi
          git commit -m 'Publish Visual Designer Manager V3 3.0.0-alpha.15 [skip v3 release]'
          git push origin HEAD:v3-clean-refactor

      - name: Upload actual WordPress plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: visual-designer-manager-v3.0.0-alpha.15
          if-no-files-found: error
          retention-days: 30
          path: dist/visual-designer-manager-v3.0.0-alpha.15.zip
