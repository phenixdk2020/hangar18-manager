      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F 'Version: 0.5.1' hangar18-manager.php
          grep -F "const VERSION = '0.5.1';" hangar18-manager.php
          grep -F 'PAGE_PRESETS_OPTION' hangar18-manager.php
          grep -F 'wp_ajax_h18_save_page_preset' hangar18-manager.php
          grep -F 'h18-page-navigator-list' hangar18-manager.php
