name: Build Hangar18 Manager 0.5.1

on:
  push:
    branches:
      - development/v0.5.1-work
    paths:
      - '.github/workflows/build-v051.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development/v0.5.1-work

      - name: Apply v0.5.1 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_v051.py

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F 'Version: 0.5.1' hangar18-manager.php
          grep -F "const VERSION = '0.5.1';" hangar18-manager.php
          grep -F 'PAGE_PRESETS_OPTION' hangar18-manager.php
          grep -F 'wp_ajax_h18_save_page_preset' hangar18-manager.php
          grep -F 'h18-page-navigator-list' hangar18-manager.php
          grep -F 'h18-save-section-preset' hangar18-manager.php
          grep -F 'builtInSectionPresets' assets/admin.js
          grep -F 'rebuildPageNavigator' assets/admin.js
          grep -F 'sectionPresetData' assets/admin.js
          grep -F 'h18-inspector-tabs' assets/admin.css

      - name: Build package and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .build
          mkdir -p dist .build/hangar18-manager/assets
          cp hangar18-manager.php .build/hangar18-manager/
          cp readme.txt .build/hangar18-manager/
          cp assets/admin.css .build/hangar18-manager/assets/
          cp assets/admin.js .build/hangar18-manager/assets/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"
          export SHA
          python3 -c "import json,os; from datetime import datetime,timezone; m={'schema_version':'1.0','plugin':'hangar18-manager','version':'0.5.1','min_wp':'6.4','min_php':'8.0','published_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'package_path':'dist/hangar18-manager.zip','package_sha256':os.environ['SHA'],'changelog':['Tilføjer Navigator/Lag med drag-and-drop rækkefølge og synlighedsstatus.','Opdeler Inspector i Indhold, Design og Avanceret.','Tilføjer fem indbyggede komponentpresets.','Gør det muligt at gemme og genbruge egne sektioner centralt i WordPress.']}; open('update.json','w',encoding='utf-8').write(json.dumps(m,ensure_ascii=False,indent=2)+'\\n')"
          rm -rf .build

      - name: Commit validated build and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-v051.yml tools/build_v051.py
          rmdir tools 2>/dev/null || true
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Build Hangar18 Manager 0.5.1 navigator and components'
          git push
