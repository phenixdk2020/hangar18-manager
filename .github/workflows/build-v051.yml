                                <div id="h18-page-navigator-list" class="h18-page-navigator-list"></div>
                            </div>

                            <div class="h18-builder-sidebar-panel" data-builder-panel="components">
                                <h3>Komponentbibliotek</h3>
                                <p>Færdige kombinationer du kan indsætte og derefter tilpasse.</p>
                                <div class="h18-builder-component-list">
                                    <button type="button" class="h18-builder-component-item" data-section-preset="hero-cta"><span class="dashicons dashicons-cover-image"></span><strong>Hero + handling</strong><small>Stor introduktion med knap</small></button>
                                    <button type="button" class="h18-builder-component-item" data-section-preset="text-image"><span class="dashicons dashicons-align-pull-left"></span><strong>Tekst + billede</strong><small>To-delt præsentation</small></button>
                                    <button type="button" class="h18-builder-component-item" data-section-preset="info-cards"><span class="dashicons dashicons-screenoptions"></span><strong>3 informationskort</strong><small>Responsivt kort-grid</small></button>
                                    <button type="button" class="h18-builder-component-item" data-section-preset="cta-band"><span class="dashicons dashicons-megaphone"></span><strong>CTA-bånd</strong><small>Fremhævet handlingssektion</small></button>
                                    <button type="button" class="h18-builder-component-item" data-section-preset="contact-form"><span class="dashicons dashicons-email-alt"></span><strong>Kontaktblok</strong><small>Tekst og mailformular</small></button>
                                </div>
                                <div class="h18-user-components-heading"><h4>Egne komponenter</h4><span>Gemmes i WordPress</span></div>
                                <div id="h18-user-presets-list" class="h18-user-presets-list"><p class="description">Vælg en sektion og brug “Gem som komponent” i Inspector.</p></div>
                            </div>
                        </aside>

                        <div class="h18-builder-canvas">'''
          php, count = palette_pattern.subn(palette_replacement, php, count=1)
          if count != 1:
              raise SystemExit('builder palette replacement failed')

          inspector_pattern = re.compile(r'''                        <aside id=\"h18-page-inspector\" class=\"h18-builder-inspector\">.*?                        </aside>''', re.S)
          inspector_replacement = r'''                        <aside id="h18-page-inspector" class="h18-builder-inspector" data-inspector-panel="content">
                            <div class="h18-builder-inspector-heading"><h3>Inspector</h3><span>Vælg en sektion i sideopbygningen</span></div>
                            <div class="h18-inspector-tabs" role="tablist" aria-label="Elementindstillinger">
                                <button type="button" class="h18-inspector-tab is-active" data-inspector-tab="content">Indhold</button>
                                <button type="button" class="h18-inspector-tab" data-inspector-tab="design">Design</button>
                                <button type="button" class="h18-inspector-tab" data-inspector-tab="advanced">Avanceret</button>
                            </div>
                            <div id="h18-page-inspector-target"><p class="description">Klik på <strong>Rediger</strong> ved en sektion for at ændre indhold, design og responsive indstillinger.</p></div>
                            <div id="h18-inspector-advanced-panel" class="h18-inspector-advanced-panel">
                                <div class="h18-inspector-meta-grid">
                                    <div><span>Type</span><strong id="h18-inspector-type">–</strong></div>
                                    <div><span>Elementnøgle</span><code id="h18-inspector-key">–</code></div>
                                </div>
                                <div class="h18-inspector-advanced-actions">
                                    <button type="button" class="button" id="h18-inspector-copy-key" disabled>Kopiér nøgle</button>
                                    <button type="button" class="button" id="h18-inspector-duplicate" disabled>Duplikér element</button>
                                    <button type="button" class="button button-primary" id="h18-save-section-preset" disabled>Gem som komponent</button>
                                </div>
                                <p class="description">Genbrugelige komponenter gemmes centralt i WordPress og kan indsættes på alle sider i Hangar18-editoren.</p>
                            </div>
                        </aside>'''
          php, count = inspector_pattern.subn(inspector_replacement, php, count=1)
          if count != 1:
              raise SystemExit('builder inspector replacement failed')

          php = rep(
              php,
              "                <template id=\"h18-page-section-template\"><?php $this->render_page_editor_section_admin($page, $this->default_page_section('text', 10), '__INDEX__', true); ?></template>",
              "                <script id=\"h18-page-presets-data\" type=\"application/json\"><?php echo wp_json_encode(array_values($page_presets), JSON_HEX_TAG | JSON_HEX_AMP | JSON_HEX_APOS | JSON_HEX_QUOT); ?></script>\n                <template id=\"h18-page-section-template\"><?php $this->render_page_editor_section_admin($page, $this->default_page_section('text', 10), '__INDEX__', true); ?></template>",
              'preset json output'
          )

          # -------------------------- admin.js ---------------------------
          js = rep(
              js,
              "    const $pageInspector = $('#h18-page-inspector');\n    const $pageInspectorTarget = $('#h18-page-inspector-target');\n    let pageSectionNextIndex = 0;\n    let pageCardSerial = 0;\n    let $inspectedSection = $();",
              "    const $pageInspector = $('#h18-page-inspector');\n    const $pageInspectorTarget = $('#h18-page-inspector-target');\n    const $pageInspectorAdvanced = $('#h18-inspector-advanced-panel');\n    const $pageNavigatorList = $('#h18-page-navigator-list');\n    const $pageNavigatorCount = $('#h18-page-navigator-count');\n    const $pageUserPresetsList = $('#h18-user-presets-list');\n    let pageSectionNextIndex = 0;\n    let pageCardSerial = 0;\n    let $inspectedSection = $();\n    let currentInspectorPanel = 'content';\n    const pageUserPresets = {};\n\n    try {\n        const presetNode = document.getElementById('h18-page-presets-data');\n        const parsedPresets = presetNode ? JSON.parse(presetNode.textContent || '[]') : [];\n        (Array.isArray(parsedPresets) ? parsedPresets : []).forEach(function (preset) {\n            if (preset && preset.Id) {\n                pageUserPresets[String(preset.Id)] = preset;\n            }\n        });\n    } catch (presetError) {\n        window.console && console.warn('Hangar18: kunne ikke læse komponentbibliotek.', presetError);\n    }\n\n    const builtInSectionPresets = {\n        'hero-cta': {\n            Type: 'hero', Title: 'Velkommen', Content: '<p>Skriv en kort introduktion, der fortæller hvad siden handler om.</p>',\n            Background: 'Olive', DesktopAlignment: 'Center', MobileAlignment: 'Center', PaddingPx: 36, MobilePaddingPx: 22,\n            HeroHeightPx: 320, MobileHeroHeightPx: 220, OverlayOpacityPercent: 35, Button1Label: 'Læs mere', Button1Url: '#', Active: true\n        },\n        'text-image': {\n            Type: 'text_image', Title: 'Overskrift', Content: '<p>Fortæl historien her. Vælg derefter et billede i Inspector.</p>',\n            Background: 'White', ImagePosition: 'Right', DesktopAlignment: 'Left', MobileAlignment: 'Left', Active: true\n        },\n        'info-cards': {\n            Type: 'card_grid', Title: 'Kort fortalt', Content: '', Background: 'White', Columns: 3, MobileColumns: 1, ColumnGapPx: 16, MobileColumnGapPx: 14, Active: true,\n            Cards: [\n                { Title: 'Punkt 1', Content: '<p>Beskrivelse af det første punkt.</p>', Background: 'OffWhite', TextTone: 'Auto', Active: true },\n                { Title: 'Punkt 2', Content: '<p>Beskrivelse af det andet punkt.</p>', Background: 'Sand', TextTone: 'Auto', Active: true },\n                { Title: 'Punkt 3', Content: '<p>Beskrivelse af det tredje punkt.</p>', Background: 'Steel', TextTone: 'Auto', Active: true }\n            ]\n        },\n        'cta-band': {\n            Type: 'buttons', Title: 'Klar til næste skridt?', Content: '<p>Brug sektionen til en tydelig handling.</p>', Background: 'OffWhite',\n            DesktopAlignment: 'Center', MobileAlignment: 'Center', PaddingPx: 24, MobilePaddingPx: 18, Button1Label: 'Læs mere', Button1Url: '#', Active: true\n        },\n        'contact-form': {\n            Type: 'mail_form', Title: 'Kontakt os', Content: '<p>Send os en besked, så vender vi tilbage hurtigst muligt.</p>', Background: 'OffWhite',\n            PaddingPx: 26, MobilePaddingPx: 20, Active: true\n        }\n    };",
              'builder state extension'
          )

          helper_block = r'''
    function inspectorTypeLabel(type) {
        const labels = {
            hero: 'Topbanner / hero', text: 'Tekst', text_image: 'Tekst og billede', image: 'Stort billede',
            buttons: 'Handlingsknapper', card: 'Indholdskort', card_grid: 'Kort-række / kolonner', highlight: 'Fremhævet tekst',
            spacer: 'Afstand', html: 'Importeret blok / HTML', css: 'Side-CSS', mail_form: 'Mailformular', poll: 'Afstemning', legacy: 'Eksisterende indhold'
        };
        return labels[String(type || '')] || 'Sektion';
    }

    function setInspectorPanel(panel) {
        panel = ['content', 'design', 'advanced'].includes(String(panel)) ? String(panel) : 'content';
        currentInspectorPanel = panel;
        $pageInspector.attr('data-inspector-panel', panel);
        $pageInspector.find('.h18-inspector-tab').removeClass('is-active').filter('[data-inspector-tab="' + panel + '"]').addClass('is-active');
    }

    function refreshInspectorMeta($row) {
        const hasRow = $row && $row.length && !$row.hasClass('h18-page-section-removed');
        const type = hasRow ? String($row.attr('data-section-type') || 'text') : '';
        const key = hasRow ? String($row.find('.h18-page-section-key').val() || '') : '';
        $('#h18-inspector-type').text(hasRow ? inspectorTypeLabel(type) : '–');
        $('#h18-inspector-key').text(key || '–');
        $('#h18-inspector-copy-key, #h18-inspector-duplicate, #h18-save-section-preset').prop('disabled', !hasRow || type === 'legacy');
        if (hasRow && type === 'legacy') {
            $('#h18-inspector-copy-key').prop('disabled', false);
        }
    }

    function rebuildPageNavigator() {
        if (!$pageNavigatorList.length || !$pageSections.length) {
            return;
        }
        if ($pageNavigatorList.hasClass('ui-sortable')) {
            $pageNavigatorList.sortable('destroy');
        }
        $pageNavigatorList.empty();
        let count = 0;
        $pageSections.children('.h18-page-section-row:not(.h18-page-section-removed)').each(function () {
            const $row = $(this);
            const index = String($row.attr('data-section-index') || '');
            const type = String($row.attr('data-section-type') || 'text');
            const title = String($row.find('.h18-page-section-title-summary').first().text() || '').trim();
            const active = $row.find('.h18-section-active').is(':checked');
            const selected = $inspectedSection.length && $inspectedSection.get(0) === $row.get(0);
            const $item = $('<div>', { class: 'h18-navigator-item' + (selected ? ' is-selected' : ''), 'data-section-index': index });
            $item.append($('<span>', { class: 'dashicons dashicons-menu h18-navigator-drag', title: 'Flyt lag' }));
            const $button = $('<button>', { type: 'button', class: 'h18-navigator-select' });
            $button.append($('<strong>', { text: inspectorTypeLabel(type) }));
            $button.append($('<small>', { text: title || 'Uden overskrift' }));
            $item.append($button);
            $item.append($('<span>', { class: 'h18-navigator-visibility ' + (active ? 'is-visible' : 'is-hidden'), title: active ? 'Synlig' : 'Skjult' }).append($('<span>', { class: 'dashicons ' + (active ? 'dashicons-visibility' : 'dashicons-hidden') })));
            $pageNavigatorList.append($item);
            count += 1;
        });
        $pageNavigatorCount.text(count);
        if (count > 1) {
            $pageNavigatorList.sortable({
                items: '> .h18-navigator-item', handle: '.h18-navigator-drag', axis: 'y', tolerance: 'pointer',
                update: function () {
                    const orderedRows = [];
                    $pageNavigatorList.children('.h18-navigator-item').each(function () {
                        const index = String($(this).attr('data-section-index') || '');
                        const $row = $pageSections.children('.h18-page-section-row[data-section-index="' + index + '"]');
                        if ($row.length) {
                            orderedRows.push($row);
                        }
                    });
                    orderedRows.forEach(function ($row) { $pageSections.append($row); });
                    $pageSections.children('.h18-page-section-row.h18-page-section-removed').appendTo($pageSections);
                    syncPageSectionOrder(true);
                    window.setTimeout(rebuildPageNavigator, 0);
                }
            });
        }
    }

    function renderUserPresets() {
        if (!$pageUserPresetsList.length) {
            return;
        }
        const presets = Object.values(pageUserPresets).sort(function (a, b) { return String(a.Name || '').localeCompare(String(b.Name || ''), 'da'); });
        $pageUserPresetsList.empty();
        if (!presets.length) {
            $pageUserPresetsList.html('<p class="description">Vælg en sektion og brug “Gem som komponent” i Inspector.</p>');
            return;
        }
        presets.forEach(function (preset) {
            const $row = $('<div>', { class: 'h18-user-preset-row', 'data-preset-id': String(preset.Id) });
            $row.append($('<button>', { type: 'button', class: 'h18-user-preset-insert' }).append($('<strong>', { text: String(preset.Name || 'Komponent') })).append($('<small>', { text: inspectorTypeLabel(preset.Section && preset.Section.Type) })));
            $row.append($('<button>', { type: 'button', class: 'h18-user-preset-delete', title: 'Slet komponent', 'aria-label': 'Slet komponent' }).append($('<span>', { class: 'dashicons dashicons-trash' })));
            $pageUserPresetsList.append($row);
        });
    }

    function sectionPresetData($row) {
        if (!$row || !$row.length) {
            return null;
        }
        const data = { Type: String($row.attr('data-section-type') || 'text') };
        const cards = {};
        pageSectionControls($row, '[name]').each(function () {
            const $field = $(this);
            const name = String($field.attr('name') || '');
            let match = name.match(/^sections\[[^\]]+\]\[Cards\]\[([^\]]+)\]\[([^\]]+)\]$/);
            let value = $field.is(':checkbox') ? $field.is(':checked') : $field.val();
            if (match) {
                const cardIndex = String(match[1]);
                const fieldName = String(match[2]);
                if (['Key', 'Order', 'Remove'].includes(fieldName)) {
                    return;
                }
                cards[cardIndex] = cards[cardIndex] || {};
                cards[cardIndex][fieldName] = value;
                return;
            }
            match = name.match(/^sections\[[^\]]+\]\[([^\]]+)\]$/);
            if (!match) {
                return;
            }
            const fieldName = String(match[1]);
            if (['Key', 'Order', 'Remove', 'ResetVotes'].includes(fieldName)) {
                return;
            }
            data[fieldName] = value;
        });
        data.Cards = Object.keys(cards).sort(function (a, b) { return Number(a) - Number(b); }).map(function (index) { return cards[index]; });
        return data;
    }

    function setSectionPresetField($row, fieldName, value) {
        const sectionIndex = String($row.attr('data-section-index') || '');
        pageSectionControls($row, '[name]').filter(function () {
            return String($(this).attr('name') || '') === 'sections[' + sectionIndex + '][' + fieldName + ']';
        }).each(function () {
            const $field = $(this);
            if ($field.is(':checkbox')) {
                $field.prop('checked', Boolean(value));
            } else {
                $field.val(value == null ? '' : value);
            }
        });
    }

    function applySectionPreset(presetData) {
        if (!presetData || typeof presetData !== 'object') {
            return $();
        }
        const type = String(presetData.Type || 'text');
        const $row = addPageSection(type);
        if (!$row.length) {
            return $row;
        }
        Object.keys(presetData).forEach(function (fieldName) {
            if (['Type', 'Cards', 'Key', 'Order', 'Remove'].includes(fieldName)) {
                return;
            }
            setSectionPresetField($row, fieldName, presetData[fieldName]);
        });
        $row.find('.h18-page-section-type').val(type);
        if (Array.isArray(presetData.Cards) && type === 'card_grid') {
            const $container = pageSectionControls($row, '.h18-page-cards-sortable');
            $container.children('.h18-page-card-row').remove();
            presetData.Cards.slice(0, 12).forEach(function (card) { addPageCard($row, card || {}); });
        }
        refreshPageSectionType($row);
        const title = String(setSectionTitleSummary($row));
        if (title) { /* summary already updated */ }
        syncPageSectionOrder();
        inspectPageSection($row);
        return $row;
    }

    function setSectionTitleSummary($row) {
        const title = String(pageSectionControls($row, '.h18-section-title-input').val() || '');
        $row.find('.h18-page-section-title-summary').text(title);
        return title;
    }

