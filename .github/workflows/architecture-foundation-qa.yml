name: Architecture QA

on:
  pull_request:
    paths: ['**']

permissions:
  contents: write

jobs:
  release-078:
    if: github.head_ref == 'agent/release-0.7.8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.7.8
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - name: Apply release metadata
        run: python3 .github/scripts/release_078.py
      - name: Validate
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          php -l src/Admin/AssetManagerAdminController.php
          php -l src/Admin/MenuPageChooserAdminController.php
          node --check assets/ultimate-designer-asset-admin.js
          node --check assets/ultimate-designer-menu-pages.js
          bash tests/Architecture/protected-domain-contract.sh
          bash tests/Architecture/e14-security-audit.sh
          php tests/Architecture/e9-assets-smoke.php
          php tests/Architecture/i5-asset-usage-meta-smoke.php
          bash tests/Architecture/i5-asset-admin-contract.sh
          bash tests/Architecture/i3-menu-page-chooser-contract.sh
          php tests/Architecture/integration-admin-smoke.php
          bash tests/Architecture/integration-admin-contract.sh
          grep -F 'Version: 0.7.8' hangar18-manager.php
          grep -F "const VERSION = '0.7.8';" hangar18-manager.php
      - name: Build package
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build/hangar18-manager dist
          rm -f dist/hangar18-manager.zip
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp -R assets src .build/hangar18-manager/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip >/dev/null
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Admin/AssetManagerAdminController.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Admin/MenuPageChooserAdminController.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/assets/ultimate-designer-asset-admin.js'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/assets/ultimate-designer-menu-pages.js'
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"
          PUBLISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export SHA PUBLISHED
          python3 - <<'PY'
          import json, os
          data = {
            'schema_version':'1.0',
            'plugin':'hangar18-manager',
            'version':'0.7.8',
            'min_wp':'6.4',
            'min_php':'8.0',
            'published_utc':os.environ['PUBLISHED'],
            'package_path':'dist/hangar18-manager.zip',
            'package_sha256':os.environ['SHA'],
            'changelog':[
              'I5 Asset Manager UI med folders/collections/tags, responsive focal point og usage-inspector oven på native Media IDs.',
              'SHA-256 dubletscan er read-only; ingen automatisk sletning eller fletning.',
              'WebP/AVIF genereres som namespaced .h18.webp/.h18.avif derivater; original og eksisterende derivater overskrives aldrig.',
              'Menu UI har eksplicit Tilgængelige sider med valg/fravalg; sider eksisterer uafhængigt af menuen.',
              'Frontend og Vehicle/Event/Gallery er uændrede; ingen sider er konverteret.'
            ]
          }
          open('update.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool update.json >/dev/null
          rm -rf .build
      - name: Commit product files only
        run: |
          set -euo pipefail
          rm -f .github/scripts/release_078.py
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add hangar18-manager.php readme.txt update.json dist/hangar18-manager.zip
          git add -u .github/scripts
          git diff --cached --check
          git commit -m 'Release Hangar18 Manager 0.7.8'
          git push origin HEAD:agent/release-0.7.8
