name: Architecture QA

on:
  push:
    branches:
      - agent/architecture-foundation
      - agent/runtime-bridge-v2
      - agent/ud-060-starter-schemas
      - agent/release-0.8.6
  pull_request:
    paths:
      - 'src/**'
      - 'tests/Architecture/**'
      - 'assets/ultimate-designer-admin.js'
      - 'assets/ultimate-designer-admin.css'
      - 'assets/ultimate-designer-menu-admin.js'
      - 'assets/ultimate-designer-menu-admin.css'
      - 'assets/ultimate-designer-menu-pages.js'
      - 'assets/ultimate-designer-menu-pages.css'
      - 'assets/ultimate-designer-side-health.js'
      - 'assets/ultimate-designer-side-health.css'
      - 'assets/ultimate-designer-asset-admin.js'
      - 'assets/ultimate-designer-asset-admin.css'
      - 'assets/ultimate-designer-portability.js'
      - 'assets/ultimate-designer-portability.css'
      - 'assets/ultimate-designer-permissions.css'
      - 'assets/ultimate-designer-ai.css'
      - 'assets/ultimate-designer-qa.css'
      - 'assets/ultimate-designer-conversion.css'
      - 'assets/ultimate-designer-layout-tools.js'
      - 'assets/ultimate-designer-layout-tools.css'
      - 'docs/architecture-*.md'
      - 'docs/ud-*.md'
      - 'docs/ultimate-designer-onboarding.md'
      - 'docs/integration-backlog-after-ud120.md'
      - '.github/workflows/architecture-foundation-qa.yml'

permissions:
  contents: write

jobs:
  architecture-smoke:
    if: github.ref != 'refs/heads/agent/release-0.8.6' && github.head_ref != 'agent/release-0.8.6'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0','8.2','8.3']
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: bash tests/Architecture/assert-foundation-isolation.sh origin/main
      - run: bash tests/Architecture/protected-domain-contract.sh
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php-version }}', coverage: none}
      - run: find src tests/Architecture -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/Architecture/architecture-smoke.php
      - run: php tests/Architecture/page-schema-smoke.php
      - run: php tests/Architecture/runtime-bridge-smoke.php
      - run: php tests/Architecture/compatibility-comparator-smoke.php
      - run: php tests/Architecture/ud-060-starter-schemas-smoke.php
      - run: php tests/Architecture/e6-site-builder-smoke.php
      - run: php tests/Architecture/e7-interaction-smoke.php
      - run: php tests/Architecture/e8-workflow-smoke.php
      - run: php tests/Architecture/e9-assets-smoke.php
      - run: php tests/Architecture/e10-permissions-smoke.php
      - run: php tests/Architecture/e11-quality-smoke.php
      - run: php tests/Architecture/e12-ai-smoke.php
      - run: php tests/Architecture/e13-portability-smoke.php
      - run: php tests/Architecture/i6-portability-workspace-smoke.php
      - run: php tests/Architecture/i7-permissions-ui-smoke.php
      - run: php tests/Architecture/i8-ai-ui-smoke.php
      - run: php tests/Architecture/i9-qa-dashboard-smoke.php
      - run: php tests/Architecture/i10-conversion-planner-smoke.php
      - run: php tests/Architecture/i10-conversion-acceptance-smoke.php
      - run: php tests/Architecture/i10-cutover-preflight-smoke.php
      - run: bash tests/Architecture/e14-security-audit.sh
      - run: php tests/Architecture/e14-performance-budget.php
      - run: php tests/Architecture/e14-migration-rollback-smoke.php
      - run: php tests/Architecture/e14-e2e-smoke.php
      - run: bash tests/Architecture/v073-heading-linebreak-contract.sh
      - run: bash tests/Architecture/v085-layout-table-contract.sh
      - run: bash tests/Architecture/v085-layout-table-health-contract.sh
      - run: php tests/Architecture/integration-admin-smoke.php
      - run: php tests/Architecture/i3-menu-admin-smoke.php
      - run: bash tests/Architecture/i3-menu-page-chooser-contract.sh
      - run: php tests/Architecture/i4-side-health-admin-smoke.php
      - run: php tests/Architecture/i5-asset-usage-meta-smoke.php
      - run: bash tests/Architecture/i5-asset-admin-contract.sh
      - run: bash tests/Architecture/i6-portability-admin-contract.sh
      - run: bash tests/Architecture/i7-permissions-admin-contract.sh
      - run: bash tests/Architecture/i8-ai-admin-contract.sh
      - run: bash tests/Architecture/i9-qa-admin-contract.sh
      - run: bash tests/Architecture/i10-conversion-admin-contract.sh
      - run: bash tests/Architecture/i10-cutover-preflight-admin-contract.sh
      - run: bash tests/Architecture/integration-admin-contract.sh
      - run: node --check assets/site-builder-runtime.js && node --check assets/interaction-runtime.js && node --check assets/ultimate-designer-admin.js && node --check assets/ultimate-designer-menu-admin.js && node --check assets/ultimate-designer-menu-pages.js && node --check assets/ultimate-designer-side-health.js && node --check assets/ultimate-designer-asset-admin.js && node --check assets/ultimate-designer-portability.js && node --check assets/ultimate-designer-layout-tools.js

  browser-engine-qa:
    if: github.ref != 'refs/heads/agent/release-0.8.6' && github.head_ref != 'agent/release-0.8.6'
    name: E14 browser engines (Chromium/Firefox/WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm init -y >/dev/null 2>&1 && npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test -c tests/Architecture/browser/playwright.config.cjs

  release-086:
    if: github.ref == 'refs/heads/agent/release-0.8.6' && !contains(github.event.head_commit.message || '', 'Release Hangar18 Manager 0.8.6')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.8.6
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.0', coverage: none}
      - run: python3 .github/scripts/release_086.py
      - name: Validate candidate
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          node --check assets/ultimate-designer-layout-tools.js
          bash tests/Architecture/protected-domain-contract.sh
          bash tests/Architecture/e14-security-audit.sh
          bash tests/Architecture/v085-layout-table-contract.sh
          bash tests/Architecture/v085-layout-table-health-contract.sh
          php tests/Architecture/i10-conversion-planner-smoke.php
          php tests/Architecture/i10-conversion-acceptance-smoke.php
          php tests/Architecture/i10-cutover-preflight-smoke.php
          bash tests/Architecture/i10-cutover-preflight-admin-contract.sh
          grep -F 'Version: 0.8.6' hangar18-manager.php
          grep -F "const VERSION = '0.8.6';" hangar18-manager.php
      - name: Build package
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build/hangar18-manager dist
          rm -f dist/hangar18-manager.zip
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp -R assets src .build/hangar18-manager/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Migration/ConversionCutoverPreflightService.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Admin/CutoverPreflightAdminController.php'
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"; export SHA
          PUBLISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; export PUBLISHED
          python3 - <<'PY'
          import json,os
          d={'schema_version':'1.0','plugin':'hangar18-manager','version':'0.8.6','min_wp':'6.4','min_php':'8.0','published_utc':os.environ['PUBLISHED'],'package_path':'dist/hangar18-manager.zip','package_sha256':os.environ['SHA'],'changelog':['I10 source-drift detection compares current legacy state with accepted shadow SourceHash.','Signed cutover preflight requires manual QA, correct sequence, valid acceptance and WordPress identity/permalink.','HMAC token is bound to the exact immutable preflight snapshot and expires automatically.','Executable=false and PublicMutationAvailable=false; preflight grants no activation capability.','No activate/cutover/publish handler is added; Vehicle/Event/Gallery remain protected on legacy runtime.']}
          open('update.json','w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool update.json >/dev/null
          rm -rf .build
      - name: Commit product files
        run: |
          set -euo pipefail
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/scripts/release_086.py
          git add hangar18-manager.php readme.txt update.json dist/hangar18-manager.zip
          git diff --cached --check
          git commit -m 'Release Hangar18 Manager 0.8.6'
          git push origin HEAD:agent/release-0.8.6
