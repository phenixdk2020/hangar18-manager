name: Optional Save Summary Patch

on:
  push:
    branches:
      - agent/optional-save-summary

permissions:
  contents: write

jobs:
  patch-save-summary:
    if: ${{ !contains(github.event.head_commit.message || '', 'Implement optional automatic save summary') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/optional-save-summary
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 .github/scripts/patch_optional_save_summary.py
      - name: Validate patched runtime
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          bash tests/Architecture/e8-save-summary-contract.sh
          bash tests/Architecture/protected-domain-contract.sh
          grep -F 'Egen kommentar (valgfri)' hangar18-manager.php
          grep -F 'h18BuildAutomaticSummaryV071' assets/admin.js
      - name: Commit product patch and remove temporary patch machinery
        run: |
          set -euo pipefail
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/architecture-foundation-qa.yml
          git rm .github/scripts/patch_optional_save_summary.py
          git add hangar18-manager.php assets/admin.js .github/workflows/architecture-foundation-qa.yml
          git diff --cached --check
          git commit -m 'Implement optional automatic save summary'
          git push origin HEAD:agent/optional-save-summary
