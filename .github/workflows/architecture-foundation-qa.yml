name: Architecture QA

on:
  pull_request:
    paths: ['**']

permissions:
  contents: write

jobs:
  release-082:
    if: github.head_ref == 'agent/release-0.8.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.8.2
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - run: python3 .github/scripts/release_082.py
      - name: Validate
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          php -l src/Admin/QaDashboardAdminController.php
          php -l src/QA/ManualEvidenceValidator.php
          php -l src/QA/RollbackPreflightService.php
          php -l src/Infrastructure/WordPress/WordPressOptionManualQaEvidenceRepository.php
          php tests/Architecture/i9-qa-dashboard-smoke.php
          bash tests/Architecture/i9-qa-admin-contract.sh
          bash tests/Architecture/protected-domain-contract.sh
          bash tests/Architecture/e14-security-audit.sh
          bash tests/Architecture/integration-admin-contract.sh
          grep -F 'Version: 0.8.2' hangar18-manager.php
          grep -F "const VERSION = '0.8.2';" hangar18-manager.php
      - name: Build package
        run: |
          set -euo pipefail
          rm -rf .build; mkdir -p .build/hangar18-manager dist; rm -f dist/hangar18-manager.zip
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp -R assets src .build/hangar18-manager/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip >/dev/null
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Admin/QaDashboardAdminController.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/QA/ManualEvidenceValidator.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/QA/RollbackPreflightService.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/assets/ultimate-designer-qa.css'
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"; export SHA
          PUBLISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; export PUBLISHED
          python3 - <<'PY'
          import json,os
          data={'schema_version':'1.0','plugin':'hangar18-manager','version':'0.8.2','min_wp':'6.4','min_php':'8.0','published_utc':os.environ['PUBLISHED'],'package_path':'dist/hangar18-manager.zip','package_sha256':os.environ['SHA'],'changelog':['I9 Manual QA Dashboard registrerer evidens for alle otte obligatoriske I10-gates.','Manuel PASS kræver confirmation, miljø og evidensreference og gemmer bruger-ID/UTC-tid.','Automatiske tests/preflight kan ikke markere manuelle gates som godkendt.','Rollback preflight kører kun på en in-memory kopi og skriver ikke til legacy page-store.','I10 forbliver blokeret indtil de krævede manuelle/live gates faktisk er gennemført; frontend og Vehicle/Event/Gallery er uændrede.']}
          open('update.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool update.json >/dev/null
          rm -rf .build
      - name: Commit product files only
        run: |
          set -euo pipefail
          rm -f .github/scripts/release_082.py
          git config user.name 'hangar18-build'; git config user.email 'actions@users.noreply.github.com'
          git add hangar18-manager.php readme.txt update.json dist/hangar18-manager.zip
          git add -u .github/scripts
          git diff --cached --check
          git commit -m 'Release Hangar18 Manager 0.8.2'
          git push origin HEAD:agent/release-0.8.2
