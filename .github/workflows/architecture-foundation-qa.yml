name: Architecture QA

on:
  push:
    branches:
      - agent/architecture-foundation
      - agent/runtime-bridge-v2
      - agent/ud-060-starter-schemas
      - agent/release-0.6.4
  pull_request:
    paths:
      - 'src/**'
      - 'tests/Architecture/**'
      - 'docs/architecture-*.md'
      - 'docs/ud-*.md'
      - '.github/workflows/architecture-foundation-qa.yml'

permissions:
  contents: write

jobs:
  architecture-smoke:
    if: github.ref != 'refs/heads/agent/release-0.6.4' && github.head_ref != 'agent/release-0.6.4'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Architecture isolation guard
        run: bash tests/Architecture/assert-foundation-isolation.sh origin/main
      - name: Protected domain contract
        run: bash tests/Architecture/protected-domain-contract.sh
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: PHP syntax check
        run: find src tests/Architecture -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Architecture smoke test
        run: php tests/Architecture/architecture-smoke.php
      - name: Page schema compatibility test
        run: php tests/Architecture/page-schema-smoke.php
      - name: Runtime bridge shadow-mode test
        run: php tests/Architecture/runtime-bridge-smoke.php
      - name: Compatibility comparator test
        run: php tests/Architecture/compatibility-comparator-smoke.php
      - name: UD-060 starter schema preset test
        run: php tests/Architecture/ud-060-starter-schemas-smoke.php
      - name: E6 Site Builder core test
        run: php tests/Architecture/e6-site-builder-smoke.php
      - name: E7 Interaction core test
        run: php tests/Architecture/e7-interaction-smoke.php
      - name: E8 Workflow core test
        run: php tests/Architecture/e8-workflow-smoke.php
      - name: Passive runtime JavaScript syntax
        run: |
          node --check assets/site-builder-runtime.js
          node --check assets/interaction-runtime.js

  release-064:
    if: github.ref == 'refs/heads/agent/release-0.6.4' && !contains(github.event.head_commit.message || '', 'Release Hangar18 Manager 0.6.4')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-0.6.4
          fetch-depth: 0

      - name: Setup PHP 8.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Apply release metadata
        run: python3 .github/scripts/release_064.py

      - name: Validate source and compatibility
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          node --check assets/site-builder-runtime.js
          node --check assets/interaction-runtime.js
          grep -F 'Version: 0.6.4' hangar18-manager.php
          grep -F "const VERSION = '0.6.4';" hangar18-manager.php
          grep -F 'Version: 0.6.4' readme.txt
          grep -F 'id="h18-editor-save-top"' hangar18-manager.php
          bash tests/Architecture/protected-domain-contract.sh
          php tests/Architecture/architecture-smoke.php
          php tests/Architecture/page-schema-smoke.php
          php tests/Architecture/runtime-bridge-smoke.php
          php tests/Architecture/compatibility-comparator-smoke.php
          php tests/Architecture/ud-060-starter-schemas-smoke.php
          php tests/Architecture/e6-site-builder-smoke.php
          php tests/Architecture/e7-interaction-smoke.php
          php tests/Architecture/e8-workflow-smoke.php

      - name: Build package and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build/hangar18-manager dist
          rm -f dist/hangar18-manager.zip
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp -R assets src .build/hangar18-manager/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Workflow/RevisionService.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Workflow/StagingService.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/assets/admin.js'
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"
          PUBLISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export SHA PUBLISHED
          python3 - <<'PY'
          import json, os
          manifest = {
              'schema_version': '1.0',
              'plugin': 'hangar18-manager',
              'version': '0.6.4',
              'min_wp': '6.4',
              'min_php': '8.0',
              'published_utc': os.environ['PUBLISHED'],
              'package_path': 'dist/hangar18-manager.zip',
              'package_sha256': os.environ['SHA'],
              'changelog': [
                  'Tydelig Gem-knap i sideeditorens top-toolbar samt Ctrl/Cmd+S, save-status og advarsel ved ugemte ændringer.',
                  'E8 Workflow core tilføjer autosave snapshots og permanente revisioner med user/time/note/state hash.',
                  'Revision restore bevarer historik, og structured diff viser added/removed/moved/property changes.',
                  'Expiring/revocable preview tokens og working/public staging med atomic publish og pre-publish backup.',
                  'Vehicle/Event/Gallery og eksisterende sider konverteres ikke i denne release.'
              ]
          }
          with open('update.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          python3 -m json.tool update.json >/dev/null
          rm -rf .build

      - name: Commit release product files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/architecture-foundation-qa.yml
          git rm .github/scripts/release_064.py
          git add hangar18-manager.php readme.txt update.json dist/hangar18-manager.zip
          git diff --cached --check
          git commit -m 'Release Hangar18 Manager 0.6.4'
          git push origin HEAD:agent/release-0.6.4
