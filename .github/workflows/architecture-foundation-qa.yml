name: Architecture QA

on:
  pull_request:
    paths:
      - '**'

permissions:
  contents: write

jobs:
  architecture-smoke:
    if: github.head_ref != 'agent/release-0.7.5'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0','8.2','8.3']
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: bash tests/Architecture/assert-foundation-isolation.sh origin/main
      - run: bash tests/Architecture/protected-domain-contract.sh
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php-version }}', coverage: none}
      - run: find src tests/Architecture -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/Architecture/integration-admin-smoke.php
      - run: bash tests/Architecture/e14-security-audit.sh
      - run: node --check assets/ultimate-designer-admin.js

  browser-engine-qa:
    if: github.head_ref != 'agent/release-0.7.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo 'Browser regression remains on normal feature PRs.'

  release-075:
    if: github.head_ref == 'agent/release-0.7.5' && !contains(github.event.pull_request.head.sha || '', 'Release Hangar18 Manager 0.7.5')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.7.5
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - name: Apply version metadata
        run: python3 .github/scripts/release_075.py
      - name: Validate release baseline
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          php -l src/Admin/IntegrationAdminBootstrap.php
          php -l src/Admin/SiteTemplateAdminController.php
          node --check assets/admin.js
          node --check assets/ultimate-designer-admin.js
          bash tests/Architecture/protected-domain-contract.sh
          bash tests/Architecture/e14-security-audit.sh
          php tests/Architecture/architecture-smoke.php
          php tests/Architecture/e6-site-builder-smoke.php
          php tests/Architecture/e8-workflow-smoke.php
          php tests/Architecture/e14-e2e-smoke.php
          php tests/Architecture/integration-admin-smoke.php
          bash tests/Architecture/integration-admin-contract.sh
          grep -F 'Version: 0.7.5' hangar18-manager.php
          grep -F "const VERSION = '0.7.5';" hangar18-manager.php
      - name: Build plugin package and manifest
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build/hangar18-manager dist
          rm -f dist/hangar18-manager.zip
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp -R assets src .build/hangar18-manager/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip >/dev/null
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Admin/SiteTemplateAdminController.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/assets/ultimate-designer-admin.js'
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"; export SHA
          PUBLISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; export PUBLISHED
          python3 - <<'PY'
          import json,os
          data={
            'schema_version':'1.0','plugin':'hangar18-manager','version':'0.7.5','min_wp':'6.4','min_php':'8.0',
            'published_utc':os.environ['PUBLISHED'],'package_path':'dist/hangar18-manager.zip','package_sha256':os.environ['SHA'],
            'changelog':[
              'I2 Visual Header/Footer Builder i shadow mode med samme Sections-tree som sideeditoren.',
              'Opret/rediger/slet, add/remove, drag/drop og tastaturvenlig op/ned-rækkefølge.',
              'Nested Parent Key preview samt persistent typography/design/farver/alignment/padding.',
              'Dedikerede Ultimate Designer admin-assets indlæses kun på builder-siden.',
              'Capability/nonce/sanitization security gate er grøn; ingen frontend/global cutover eller sidekonvertering.'
            ]
          }
          open('update.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool update.json >/dev/null
          rm -rf .build
      - name: Commit release product files only
        run: |
          set -euo pipefail
          rm -f .github/scripts/release_075.py
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add hangar18-manager.php readme.txt update.json dist/hangar18-manager.zip
          git add -u .github/scripts
          git diff --cached --check
          git commit -m 'Release Hangar18 Manager 0.7.5'
          git push origin HEAD:agent/release-0.7.5
