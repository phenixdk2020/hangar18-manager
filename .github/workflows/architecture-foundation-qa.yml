name: Architecture QA

on:
  pull_request:
    paths: ['**']
permissions:
  contents: write
jobs:
  release-077:
    if: github.head_ref == 'agent/release-0.7.7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/release-0.7.7, fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.0', coverage: none}
      - run: python3 .github/scripts/release_077.py
      - name: Validate
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          php -l src/Admin/SideHealthAdminController.php
          node --check assets/ultimate-designer-side-health.js
          bash tests/Architecture/protected-domain-contract.sh
          bash tests/Architecture/e14-security-audit.sh
          php tests/Architecture/i4-side-health-admin-smoke.php
          bash tests/Architecture/integration-admin-contract.sh
          grep -F 'Version: 0.7.7' hangar18-manager.php
          grep -F "const VERSION = '0.7.7';" hangar18-manager.php
      - name: Build package
        run: |
          set -euo pipefail
          rm -rf .build; mkdir -p .build/hangar18-manager dist; rm -f dist/hangar18-manager.zip
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp -R assets src .build/hangar18-manager/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip >/dev/null
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Admin/SideHealthAdminController.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/assets/ultimate-designer-side-health.js'
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"; export SHA
          PUBLISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; export PUBLISHED
          python3 - <<'PY'
          import json,os
          data={'schema_version':'1.0','plugin':'hangar18-manager','version':'0.7.7','min_wp':'6.4','min_php':'8.0','published_utc':os.environ['PUBLISHED'],'package_path':'dist/hangar18-manager.zip','package_sha256':os.environ['SHA'],'changelog':['I4 Live Side Health direkte i den eksisterende Sider-editor.','Analysen medregner ugemte DOM/form-ændringer og viser samlet + fem delscorer.','Issues kan filtreres og linker til konkrete Navigator element keys.','Read-only AJAX er capability/nonce/size-bounded og indeholder ingen page-write primitives.','Frontend og Vehicle/Event/Gallery forbliver uændrede.']}
          open('update.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf .build
      - name: Commit product files
        run: |
          set -euo pipefail
          rm -f .github/scripts/release_077.py
          git config user.name 'hangar18-build'; git config user.email 'actions@users.noreply.github.com'
          git add hangar18-manager.php readme.txt update.json dist/hangar18-manager.zip
          git add -u .github/scripts
          git diff --cached --check
          git commit -m 'Release Hangar18 Manager 0.7.7'
          git push origin HEAD:agent/release-0.7.7
