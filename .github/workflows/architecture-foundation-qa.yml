name: Architecture QA

on:
  pull_request:
    paths: ['**']

permissions:
  contents: write

jobs:
  release-084:
    if: github.head_ref == 'agent/release-0.8.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.8.4
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - run: python3 .github/scripts/release_084.py
      - name: Validate
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          php -l src/Admin/ConversionAdminController.php
          php -l src/Admin/IntegrationAdminBootstrap.php
          php -l src/Migration/ConversionAcceptanceChecklist.php
          php -l src/Migration/ConversionAcceptanceValidator.php
          php -l src/Infrastructure/WordPress/WordPressOptionConversionAcceptanceRepository.php
          php tests/Architecture/i10-conversion-planner-smoke.php
          php tests/Architecture/i10-conversion-acceptance-smoke.php
          bash tests/Architecture/i10-conversion-admin-contract.sh
          bash tests/Architecture/protected-domain-contract.sh
          bash tests/Architecture/e14-security-audit.sh
          bash tests/Architecture/integration-admin-contract.sh
          grep -F 'Version: 0.8.4' hangar18-manager.php
          grep -F "const VERSION = '0.8.4';" hangar18-manager.php
      - name: Build package
        run: |
          set -euo pipefail
          rm -rf .build; mkdir -p .build/hangar18-manager dist; rm -f dist/hangar18-manager.zip
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp -R assets src .build/hangar18-manager/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip >/dev/null
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Migration/ConversionAcceptanceValidator.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Infrastructure/WordPress/WordPressOptionConversionAcceptanceRepository.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Admin/ConversionAdminController.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/assets/ultimate-designer-conversion.css'
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"; export SHA
          PUBLISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; export PUBLISHED
          python3 - <<'PY'
          import json,os
          data={'schema_version':'1.0','plugin':'hangar18-manager','version':'0.8.4','min_wp':'6.4','min_php':'8.0','published_utc':os.environ['PUBLISHED'],'package_path':'dist/hangar18-manager.zip','package_sha256':os.environ['SHA'],'changelog':['I10 shadow acceptance kræver syv manuelle checks: desktop/tablet/mobile/save/preview/revision/rollback.','Acceptance kræver miljø, evidensreference og eksplicit human confirmation og beregnes server-side.','Acceptance bindes til den aktuelle shadow SourceHash; genskabt shadow gør gammel acceptance stale.','Acceptance lukker ikke globale I9-gates og v0.8.4 har stadig ingen activate/cutover/publish-handler eller page-write.','Vehicle/Event/Gallery forbliver blokeret af CompatibilityPolicy på legacy v0.5.30-runtime.']}
          open('update.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool update.json >/dev/null
          rm -rf .build
      - name: Commit product files only
        run: |
          set -euo pipefail
          rm -f .github/scripts/release_084.py
          git config user.name 'hangar18-build'; git config user.email 'actions@users.noreply.github.com'
          git add hangar18-manager.php readme.txt update.json dist/hangar18-manager.zip
          git add -u .github/scripts
          git diff --cached --check
          git commit -m 'Release Hangar18 Manager 0.8.4'
          git push origin HEAD:agent/release-0.8.4
