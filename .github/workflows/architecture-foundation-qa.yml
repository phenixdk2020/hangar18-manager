name: Architecture QA

on:
  push:
    branches:
      - agent/architecture-foundation
      - agent/runtime-bridge-v2
      - agent/ud-060-starter-schemas
      - agent/fix-inspector-settings-overlap
  pull_request:
    paths:
      - 'src/**'
      - 'tests/Architecture/**'
      - 'docs/architecture-*.md'
      - 'docs/ud-*.md'
      - '.github/workflows/architecture-foundation-qa.yml'
      - '.github/scripts/fix_inspector_overlap.py'

permissions:
  contents: write

jobs:
  architecture-smoke:
    if: github.ref != 'refs/heads/agent/fix-inspector-settings-overlap' && github.head_ref != 'agent/fix-inspector-settings-overlap'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Architecture isolation guard
        run: bash tests/Architecture/assert-foundation-isolation.sh origin/main

      - name: Protected domain contract
        run: bash tests/Architecture/protected-domain-contract.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: PHP syntax check
        run: |
          find src tests/Architecture -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Architecture smoke test
        run: php tests/Architecture/architecture-smoke.php

      - name: Page schema compatibility test
        run: php tests/Architecture/page-schema-smoke.php

      - name: Runtime bridge shadow-mode test
        run: php tests/Architecture/runtime-bridge-smoke.php

      - name: Compatibility comparator test
        run: php tests/Architecture/compatibility-comparator-smoke.php

      - name: UD-060 starter schema preset test
        run: php tests/Architecture/ud-060-starter-schemas-smoke.php

  inspector-overlap-hotfix:
    if: (github.ref == 'refs/heads/agent/fix-inspector-settings-overlap' || github.head_ref == 'agent/fix-inspector-settings-overlap') && !contains(github.event.head_commit.message || '', 'Fix inspector settings overlap')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-inspector-settings-overlap
          fetch-depth: 0

      - name: Apply CSS hotfix
        run: python3 .github/scripts/fix_inspector_overlap.py

      - name: Validate hotfix
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'v0.6.1 – Inspector tabs må ikke overlappe settings' assets/admin.css
          grep -F 'grid-template-columns:repeat(2,minmax(0,1fr))' assets/admin.css
          bash tests/Architecture/protected-domain-contract.sh
          php -l hangar18-manager.php
          node --check assets/admin.js
          git diff --check

      - name: Commit only CSS hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/architecture-foundation-qa.yml
          git rm .github/scripts/fix_inspector_overlap.py
          git add assets/admin.css
          git diff --cached --check
          git commit -m 'Fix inspector settings overlap'
          git push origin HEAD:agent/fix-inspector-settings-overlap
