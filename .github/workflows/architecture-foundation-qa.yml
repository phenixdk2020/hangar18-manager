name: Architecture QA

on:
  pull_request:
    paths: ['**']
permissions:
  contents: write
jobs:
  release-076:
    if: github.head_ref == 'agent/release-0.7.6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/release-0.7.6, fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.0', coverage: none}
      - run: python3 .github/scripts/release_076.py
      - name: Validate
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          php -l src/Admin/MenuAdminController.php
          php -l src/SiteBuilder/MenuPresentationNormalizer.php
          node --check assets/ultimate-designer-menu-admin.js
          bash tests/Architecture/protected-domain-contract.sh
          bash tests/Architecture/e14-security-audit.sh
          php tests/Architecture/i3-menu-admin-smoke.php
          php tests/Architecture/integration-admin-smoke.php
          bash tests/Architecture/integration-admin-contract.sh
          grep -F 'Version: 0.7.6' hangar18-manager.php
          grep -F "const VERSION = '0.7.6';" hangar18-manager.php
      - name: Build package
        run: |
          set -euo pipefail
          rm -rf .build; mkdir -p .build/hangar18-manager dist; rm -f dist/hangar18-manager.zip
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp -R assets src .build/hangar18-manager/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip >/dev/null
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Admin/MenuAdminController.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/assets/ultimate-designer-menu-admin.js'
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"; export SHA
          PUBLISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; export PUBLISHED
          python3 - <<'PY'
          import json,os
          data={'schema_version':'1.0','plugin':'hangar18-manager','version':'0.7.6','min_wp':'6.4','min_php':'8.0','published_utc':os.environ['PUBLISHED'],'package_path':'dist/hangar18-manager.zip','package_sha256':os.environ['SHA'],'changelog':['I3 Menu UI v2 i shadow mode med adskilt menu-data og presentation.','Desktop/mobile/motion presets, nested drag/reorder/indent og mega-panel ComponentId.','Keyboard-preview med piletaster/submenu/Escape samt ikon/badge preview.','Dangerous javascript/data/vbscript URL-schemes afvises; capability/nonce/sanitization gates er grønne.','Offentlig legacy-menu og eksisterende sider/Vehicle/Event/Gallery forbliver uændrede.']}
          open('update.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf .build
      - name: Commit product files
        run: |
          set -euo pipefail
          rm -f .github/scripts/release_076.py
          git config user.name 'hangar18-build'; git config user.email 'actions@users.noreply.github.com'
          git add hangar18-manager.php readme.txt update.json dist/hangar18-manager.zip
          git add -u .github/scripts
          git diff --cached --check
          git commit -m 'Release Hangar18 Manager 0.7.6'
          git push origin HEAD:agent/release-0.7.6
