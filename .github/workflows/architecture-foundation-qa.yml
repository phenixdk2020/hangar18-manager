name: Architecture QA

on:
  push:
    branches:
      - agent/architecture-foundation
      - agent/runtime-bridge-v2
      - agent/ud-060-starter-schemas
      - agent/release-0.7.0
  pull_request:
    paths:
      - 'src/**'
      - 'tests/Architecture/**'
      - 'docs/architecture-*.md'
      - 'docs/ud-*.md'
      - 'docs/ultimate-designer-onboarding.md'
      - '.github/workflows/architecture-foundation-qa.yml'

permissions:
  contents: write

jobs:
  architecture-smoke:
    if: github.ref != 'refs/heads/agent/release-0.7.0' && github.head_ref != 'agent/release-0.7.0'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0','8.2','8.3']
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: bash tests/Architecture/assert-foundation-isolation.sh origin/main
      - run: bash tests/Architecture/protected-domain-contract.sh
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php-version }}', coverage: none}
      - run: find src tests/Architecture -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/Architecture/architecture-smoke.php
      - run: php tests/Architecture/page-schema-smoke.php
      - run: php tests/Architecture/runtime-bridge-smoke.php
      - run: php tests/Architecture/compatibility-comparator-smoke.php
      - run: php tests/Architecture/ud-060-starter-schemas-smoke.php
      - run: php tests/Architecture/e6-site-builder-smoke.php
      - run: php tests/Architecture/e7-interaction-smoke.php
      - run: php tests/Architecture/e8-workflow-smoke.php
      - run: php tests/Architecture/e9-assets-smoke.php
      - run: php tests/Architecture/e10-permissions-smoke.php
      - run: php tests/Architecture/e11-quality-smoke.php
      - run: php tests/Architecture/e12-ai-smoke.php
      - run: php tests/Architecture/e13-portability-smoke.php
      - run: bash tests/Architecture/e14-security-audit.sh
      - run: php tests/Architecture/e14-performance-budget.php
      - run: php tests/Architecture/e14-migration-rollback-smoke.php
      - run: php tests/Architecture/e14-e2e-smoke.php
      - run: node --check assets/site-builder-runtime.js && node --check assets/interaction-runtime.js

  browser-engine-qa:
    if: github.ref != 'refs/heads/agent/release-0.7.0' && github.head_ref != 'agent/release-0.7.0'
    name: E14 browser engines (Chromium/Firefox/WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm init -y >/dev/null 2>&1 && npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test -c tests/Architecture/browser/playwright.config.cjs

  release-070:
    if: github.ref == 'refs/heads/agent/release-0.7.0' && !contains(github.event.head_commit.message || '', 'Release Hangar18 Manager 0.7.0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/release-0.7.0, fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.0', coverage: none}
      - name: Apply release metadata
        run: python3 .github/scripts/release_070.py
      - name: Validate complete automated QA baseline
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          node --check assets/site-builder-runtime.js
          node --check assets/interaction-runtime.js
          bash tests/Architecture/protected-domain-contract.sh
          php tests/Architecture/architecture-smoke.php
          php tests/Architecture/page-schema-smoke.php
          php tests/Architecture/runtime-bridge-smoke.php
          php tests/Architecture/compatibility-comparator-smoke.php
          php tests/Architecture/ud-060-starter-schemas-smoke.php
          php tests/Architecture/e6-site-builder-smoke.php
          php tests/Architecture/e7-interaction-smoke.php
          php tests/Architecture/e8-workflow-smoke.php
          php tests/Architecture/e9-assets-smoke.php
          php tests/Architecture/e10-permissions-smoke.php
          php tests/Architecture/e11-quality-smoke.php
          php tests/Architecture/e12-ai-smoke.php
          php tests/Architecture/e13-portability-smoke.php
          bash tests/Architecture/e14-security-audit.sh
          php tests/Architecture/e14-performance-budget.php
          php tests/Architecture/e14-migration-rollback-smoke.php
          php tests/Architecture/e14-e2e-smoke.php
          grep -F 'Version: 0.7.0' hangar18-manager.php
          grep -F "const VERSION = '0.7.0';" hangar18-manager.php
      - name: Build plugin package and manifest
        run: |
          set -euo pipefail
          rm -rf .build; mkdir -p .build/hangar18-manager dist; rm -f dist/hangar18-manager.zip
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp -R assets src .build/hangar18-manager/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/QA/ReleaseReadiness.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Portability/ImportExecutor.php'
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"; export SHA
          PUBLISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; export PUBLISHED
          python3 - <<'PY'
          import json,os
          d={
            'schema_version':'1.0','plugin':'hangar18-manager','version':'0.7.0','min_wp':'6.4','min_php':'8.0',
            'published_utc':os.environ['PUBLISHED'],'package_path':'dist/hangar18-manager.zip','package_sha256':os.environ['SHA'],
            'changelog':[
              'E14 automated QA baseline med Chromium/Firefox/WebKit engine tests, keyboard/focus/reduced-motion flows.',
              'Security audit, performance budgets, migration/rollback og MVP/v1 end-to-end gates er grønne.',
              'ReleaseReadiness holder manual/live acceptance adskilt fra automated CI.',
              'Administrator/designer onboarding og final migration-rækkefølge er dokumenteret.',
              'Manual Chrome/Edge/Firefox/Safari brand-test, screen-reader, test2 live E2E, Vehicle/Event/Gallery regression og live-copy migration er fortsat pending.',
              'Ingen eksisterende sider er konverteret i v0.7.0.'
            ]
          }
          open('update.json','w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool update.json >/dev/null
          rm -rf .build
      - name: Commit release product files only
        run: |
          set -euo pipefail
          git config user.name 'hangar18-build'; git config user.email 'actions@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/architecture-foundation-qa.yml
          git rm .github/scripts/release_070.py
          git add hangar18-manager.php readme.txt update.json dist/hangar18-manager.zip
          git diff --cached --check
          git commit -m 'Release Hangar18 Manager 0.7.0'
          git push origin HEAD:agent/release-0.7.0
