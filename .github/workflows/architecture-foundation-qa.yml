name: Architecture QA

on:
  pull_request:
    paths:
      - '**'

permissions:
  contents: write

jobs:
  release-074:
    if: github.head_ref == 'agent/release-0.7.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.7.4
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - name: Apply version metadata
        run: python3 .github/scripts/release_074.py
      - name: Validate release baseline
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          php -l src/Admin/IntegrationAdminBootstrap.php
          php tests/Architecture/integration-admin-smoke.php
          bash tests/Architecture/integration-admin-contract.sh
          bash tests/Architecture/protected-domain-contract.sh
          php tests/Architecture/e8-workflow-smoke.php
          php tests/Architecture/e14-e2e-smoke.php
          grep -F 'Version: 0.7.4' hangar18-manager.php
      - name: Build package
        run: |
          set -euo pipefail
          rm -rf .build; mkdir -p .build/hangar18-manager dist; rm -f dist/hangar18-manager.zip
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp -R assets src .build/hangar18-manager/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip >/dev/null
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"; export SHA
          PUBLISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; export PUBLISHED
          python3 - <<'PY'
          import json,os
          data={'schema_version':'1.0','plugin':'hangar18-manager','version':'0.7.4','min_wp':'6.4','min_php':'8.0','published_utc':os.environ['PUBLISHED'],'package_path':'dist/hangar18-manager.zip','package_sha256':os.environ['SHA'],'changelog':['Ultimate Designer admin-only integration dashboard.','Repository-backed Site Builder/menu/asset/permission status og I1-I10 backlog.','Manual/live release gates vises separat fra automated QA.','Ingen frontend renderer eller eksisterende side/domain konverteres.','PHP integration QA og Vehicle/Event/Gallery contract er grøn.']}
          open('update.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf .build
      - name: Commit release product files
        run: |
          set -euo pipefail
          rm -f .github/scripts/release_074.py
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add hangar18-manager.php readme.txt update.json dist/hangar18-manager.zip
          git add -u .github/scripts
          git diff --cached --check
          git commit -m 'Release Hangar18 Manager 0.7.4'
          git push origin HEAD:agent/release-0.7.4
