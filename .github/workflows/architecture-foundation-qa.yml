name: Architecture QA

on:
  pull_request:
    paths: ['**']

permissions:
  contents: write

jobs:
  release-079:
    if: github.head_ref == 'agent/release-0.7.9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.7.9
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - run: python3 .github/scripts/release_079.py
      - name: Validate
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          php -l src/Admin/PortabilityAdminController.php
          php -l src/Infrastructure/WordPress/WordPressOptionArtifactRepository.php
          php -l src/Infrastructure/WordPress/WordPressOptionRevisionRepository.php
          node --check assets/ultimate-designer-portability.js
          bash tests/Architecture/protected-domain-contract.sh
          bash tests/Architecture/e14-security-audit.sh
          php tests/Architecture/e13-portability-smoke.php
          php tests/Architecture/i6-portability-workspace-smoke.php
          bash tests/Architecture/i6-portability-admin-contract.sh
          bash tests/Architecture/integration-admin-contract.sh
          grep -F 'Version: 0.7.9' hangar18-manager.php
          grep -F "const VERSION = '0.7.9';" hangar18-manager.php
      - name: Build package
        run: |
          set -euo pipefail
          rm -rf .build; mkdir -p .build/hangar18-manager dist; rm -f dist/hangar18-manager.zip
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp -R assets src .build/hangar18-manager/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip >/dev/null
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Admin/PortabilityAdminController.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/src/Infrastructure/WordPress/WordPressOptionArtifactRepository.php'
          unzip -l dist/hangar18-manager.zip | grep -F 'hangar18-manager/assets/ultimate-designer-portability.js'
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"; export SHA
          PUBLISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; export PUBLISHED
          python3 - <<'PY'
          import json,os
          data={'schema_version':'1.0','plugin':'hangar18-manager','version':'0.7.9','min_wp':'6.4','min_php':'8.0','published_utc':os.environ['PUBLISHED'],'package_path':'dist/hangar18-manager.zip','package_sha256':os.environ['SHA'],'changelog':['I6 sidepakker kan eksporteres og valideres preview-only uden side-write.','Artifact import er dry-run-first med conflicts/remaps og HMAC-signeret plan-token.','Bekræftet import går kun til isoleret Portability Workspace.','Pre-import backup og workspace restore er integreret; uløste portable refs blokerer mutation.','Frontend og Vehicle/Event/Gallery er uændrede; ingen sider er konverteret.']}
          open('update.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf .build
      - name: Commit product files only
        run: |
          set -euo pipefail
          rm -f .github/scripts/release_079.py
          git config user.name 'hangar18-build'; git config user.email 'actions@users.noreply.github.com'
          git add hangar18-manager.php readme.txt update.json dist/hangar18-manager.zip
          git add -u .github/scripts
          git diff --cached --check
          git commit -m 'Release Hangar18 Manager 0.7.9'
          git push origin HEAD:agent/release-0.7.9
