name: Architecture QA

on:
  push:
    branches:
      - agent/architecture-foundation
      - agent/runtime-bridge-v2
      - agent/ud-060-starter-schemas
      - agent/release-0.6.0
  pull_request:
    paths:
      - 'src/**'
      - 'tests/Architecture/**'
      - 'docs/architecture-*.md'
      - 'docs/ud-*.md'
      - '.github/scripts/release_v060.py'
      - '.github/workflows/architecture-foundation-qa.yml'

permissions:
  contents: write

jobs:
  architecture-smoke:
    if: github.ref != 'refs/heads/agent/release-0.6.0' && github.head_ref != 'agent/release-0.6.0'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Architecture isolation guard
        run: bash tests/Architecture/assert-foundation-isolation.sh origin/main

      - name: Protected domain contract
        run: bash tests/Architecture/protected-domain-contract.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: PHP syntax check
        run: |
          find src tests/Architecture -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Architecture smoke test
        run: php tests/Architecture/architecture-smoke.php

      - name: Page schema compatibility test
        run: php tests/Architecture/page-schema-smoke.php

      - name: Runtime bridge shadow-mode test
        run: php tests/Architecture/runtime-bridge-smoke.php

      - name: Compatibility comparator test
        run: php tests/Architecture/compatibility-comparator-smoke.php

      - name: UD-060 starter schema preset test
        run: php tests/Architecture/ud-060-starter-schemas-smoke.php

  release-v060:
    if: (github.ref == 'refs/heads/agent/release-0.6.0' || github.head_ref == 'agent/release-0.6.0') && !contains(github.event.head_commit.message || github.event.pull_request.title, 'Release Hangar18 Manager 0.6.0')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-0.6.0
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Prepare v0.6.0 source
        run: python3 .github/scripts/release_v060.py

      - name: Validate source and compatibility
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          find src tests/Architecture -name '*.php' -print0 | xargs -0 -n1 php -l
          bash tests/Architecture/protected-domain-contract.sh
          php tests/Architecture/architecture-smoke.php
          php tests/Architecture/page-schema-smoke.php
          php tests/Architecture/runtime-bridge-smoke.php
          php tests/Architecture/compatibility-comparator-smoke.php
          php tests/Architecture/ud-060-starter-schemas-smoke.php
          grep -F 'Version: 0.6.0' hangar18-manager.php
          grep -F "const VERSION = '0.6.0';" hangar18-manager.php
          grep -F "LEGACY_RUNTIME_VERSION = '0.5.30';" src/Compatibility/CompatibilityPolicy.php
          grep -F 'h18-pages-admin{max-width:none' assets/admin.css
          grep -F 'h18_create_blank_page' hangar18-manager.php
          git diff --check

      - name: Build v0.6.0 package and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .build
          mkdir -p dist .build/hangar18-manager/assets
          cp hangar18-manager.php .build/hangar18-manager/
          cp readme.txt .build/hangar18-manager/
          cp assets/admin.css .build/hangar18-manager/assets/
          cp assets/admin.js .build/hangar18-manager/assets/
          cp -R src .build/hangar18-manager/src
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          rm -rf .verify
          mkdir -p .verify
          unzip -q dist/hangar18-manager.zip -d .verify
          grep -F 'Version: 0.6.0' .verify/hangar18-manager/hangar18-manager.php
          grep -F "const VERSION = '0.6.0';" .verify/hangar18-manager/hangar18-manager.php
          test -f .verify/hangar18-manager/src/Autoload.php
          test -f .verify/hangar18-manager/src/Core/RuntimeBridge.php
          test -f .verify/hangar18-manager/src/DynamicData/StarterSchemaPresetCatalog.php
          find .verify/hangar18-manager/src -name '*.php' -print0 | xargs -0 -n1 php -l
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"
          export SHA
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          manifest = {
              'schema_version': '1.0',
              'plugin': 'hangar18-manager',
              'version': '0.6.0',
              'min_wp': '6.4',
              'min_php': '8.0',
              'published_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'package_path': 'dist/hangar18-manager.zip',
              'package_sha256': os.environ['SHA'],
              'changelog': [
                  'Architecture Foundation og passive shadow-mode services er nu med i releasepakken under src/.',
                  'UD-060 tilføjer generiske Vehicle/Event/Gallery starter schemas uden specialmotor eller automatisk migration.',
                  'Sider-modulet bruger hele den tilgængelige WordPress-adminbredde og giver et større builder-canvas.',
                  'Ny tom side kan oprettes direkte fra Sider; oprettelse fra Page Template er gjort tydeligere.',
                  'Retter template-oprettelse, så nye managed side-slugs ikke falder tilbage til Hjem.',
                  'Vehicle/Event/Gallery beholder v0.5.30 legacy runtime, markup, CSS hooks, data og URLs uændret.'
              ]
          }
          with open('update.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          python3 - <<'PY'
          import hashlib, json
          data = json.load(open('update.json', encoding='utf-8'))
          digest = hashlib.sha256(open('dist/hangar18-manager.zip','rb').read()).hexdigest()
          assert data['version'] == '0.6.0'
          assert data['package_sha256'] == digest
          print('v0.6.0 package manifest: PASS')
          PY
          rm -rf .verify

      - name: Commit release candidate and clean helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/architecture-foundation-qa.yml
          git rm .github/scripts/release_v060.py
          git add hangar18-manager.php readme.txt assets/admin.css assets/admin.js update.json .github/workflows/sync-release-source.yml src
          git add -f dist/hangar18-manager.zip
          git diff --cached --check
          git commit -m 'Release Hangar18 Manager 0.6.0'
          git push origin HEAD:agent/release-0.6.0
