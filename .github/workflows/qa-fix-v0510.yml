name: QA Hangar18 Manager 0.5.10 inspector

on:
  push:
    branches:
      - qa/v0.5.10-fix
    paths:
      - '.github/workflows/qa-fix-v0510.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply inspector placement fix
        run: python3 .github/v0510_layout_fix.py

      - name: Structural and syntax QA
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('hangar18-manager.php').read_text()
          assert s.count('h18-image-design-fields') == 1
          p=s.index('Billedplacering på desktop')
          i=s.index('Billedudsnit og fokus')
          c=s.index('<h4>Kort-række / kolonner</h4>')
          m=s.index('<strong>Kolonner mobil</strong>')
          assert p < i < c < m, (p,i,c,m)
          card=s.rfind('h18-card-grid-editor',0,m)
          assert not (card >= 0 and card < i < m)
          assert "'Version'        => '1.11'" in s
          assert "'ImageAspectRatio'      => 'Auto'" in s
          assert "'ImageFocalXPercent'    => 50" in s
          assert "'ImageFocalYPercent'    => 50" in s
          PY

      - name: Rebuild package and manifest SHA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build .verify
          mkdir .build
          unzip -q dist/hangar18-manager.zip -d .build
          cp hangar18-manager.php .build/hangar18-manager/hangar18-manager.php
          rm -f dist/hangar18-manager.zip
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          mkdir .verify
          unzip -q dist/hangar18-manager.zip -d .verify
          php -l .verify/hangar18-manager/hangar18-manager.php
          node --check .verify/hangar18-manager/assets/admin.js
          grep -F 'Billedudsnit og fokus' .verify/hangar18-manager/hangar18-manager.php
          SHA=$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - "$SHA" "$NOW" <<'PY'
          import json,sys
          p='update.json'; d=json.load(open(p)); d['package_sha256']=sys.argv[1]; d['published_utc']=sys.argv[2]
          open(p,'w').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf .build .verify

      - name: Final diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD -- | sort
          test "$(git diff --name-only HEAD -- | wc -l)" -eq 3
          git diff --name-only HEAD -- | grep -Fx 'hangar18-manager.php'
          git diff --name-only HEAD -- | grep -Fx 'dist/hangar18-manager.zip'
          git diff --name-only HEAD -- | grep -Fx 'update.json'

      - name: Commit QA fix and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v0510_layout_fix.py .github/workflows/qa-fix-v0510.yml
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'QA fix v0.5.10 image inspector placement'
          git push origin HEAD:qa/v0.5.10-fix
