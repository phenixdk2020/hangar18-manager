name: Finalize Hangar18 Manager 0.5.0

on:
  push:
    branches:
      - development/v0.5.0
    paths:
      - '.github/workflows/publish-v050.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.5.0 development
        uses: actions/checkout@v4
        with:
          ref: development/v0.5.0

      - name: Apply compatibility QA fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          php_path = Path('hangar18-manager.php')
          readme_path = Path('readme.txt')
          manifest_path = Path('update.json')
          php = php_path.read_text(encoding='utf-8')
          readme = readme_path.read_text(encoding='utf-8')

          if " * Version: 0.5.0" not in php or "const VERSION = '0.5.0';" not in php:
              raise SystemExit('Expected v0.5.0 source not found')

          # Keep the legacy HeaderDesign schema version for PowerShell/config-store
          # compatibility and version the new designer extension separately.
          php = php.replace(
              "            'Version' => '3.0',\n            'PrimaryColor' => '#30382a',",
              "            'Version' => '2.3',\n            'DesignerSchemaVersion' => '1.0',\n            'PrimaryColor' => '#30382a',",
              1
          )
          php = php.replace(
              "            'Version'                           => '3.0',\n            'PrimaryColor'",
              "            'Version'                           => '2.3',\n            'DesignerSchemaVersion'             => '1.0',\n            'PrimaryColor'",
              1
          )
          php = php.replace(
              "            'Version'                           => '3.0',\n            'PrimaryColor'",
              "            'Version'                           => '2.3',\n            'DesignerSchemaVersion'             => '1.0',\n            'PrimaryColor'",
              1
          )
          php = php.replace('HeaderDesign schema 3.0', 'HeaderDesign schema 2.3 + Designer schema 1.0')

          # CSS font stacks come from a fixed whitelist. Remove quote characters
          # before HTML escaping so the resulting style text remains valid CSS.
          php = php.replace(
              "        $body_font = $this->header_font_family_css($d['BodyFontFamily']);\n        $heading_font = $this->header_font_family_css($d['HeadingFontFamily']);",
              "        $body_font = str_replace('\\\"', '', $this->header_font_family_css($d['BodyFontFamily']));\n        $heading_font = str_replace('\\\"', '', $this->header_font_family_css($d['HeadingFontFamily']));",
              1
          )

          # Improve floating menu readability on the light pill surface.
          needle = ".h18-site-header .h18-desktop-nav {background:var(--h18-color-surface) !important;border:1px solid rgba(48,56,42,.14) !important;border-radius:999px !important;padding:6px 12px !important;box-shadow:0 8px 24px rgba(0,0,0,.09) !important;}"
          replacement = needle + "\n              .h18-site-header .h18-desktop-nav .h18-web-menu-root > .h18-menu-item > a {color:var(--h18-color-text) !important;}"
          if needle in php and replacement not in php:
              php = php.replace(needle, replacement, 1)

          readme = readme.replace(
              '- HeaderDesign schema 3.0 med globale design tokens.',
              '- Nyt Designer schema 1.0 med globale design tokens, indlejret bagudkompatibelt i HeaderDesign schema 2.3.'
          )
          readme = readme.replace(
              '- Ældre HeaderDesign-konfigurationer normaliseres bagudkompatibelt.',
              '- HeaderDesign forbliver schema 2.3, så den eksisterende centrale konfiguration og ældre PowerShell-klienter fortsat kan læse de kendte felter.'
          )

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['changelog'] = [
              'Bygger direkte videre på v0.4.27 og bevarer den eksisterende visuelle builder.',
              'Tilføjer Designer schema 1.0 med globale design tokens uden at bryde HeaderDesign schema 2.3.',
              'Kobler sidebyggerens farvepresets til centrale designfarver.',
              'Tilføjer valgfrie menupræsentationer, hover/active-effekter og undermenu-animationer.'
          ]

          php_path.write_text(php, encoding='utf-8')
          readme_path.write_text(readme, encoding='utf-8')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F 'Version: 0.5.0' hangar18-manager.php
          grep -F "const VERSION = '0.5.0';" hangar18-manager.php
          grep -F "'Version' => '2.3'" hangar18-manager.php
          grep -F "'DesignerSchemaVersion' => '1.0'" hangar18-manager.php
          grep -F "'DesignerSchemaVersion'             => '1.0'" hangar18-manager.php
          grep -F 'render_design_tokens_v050' hangar18-manager.php
          grep -F 'MenuPresentation' hangar18-manager.php
          grep -F 'Globalt designsystem' hangar18-manager.php

      - name: Rebuild package and SHA manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .build
          mkdir -p dist .build/hangar18-manager/assets
          cp hangar18-manager.php .build/hangar18-manager/
          cp readme.txt .build/hangar18-manager/
          cp assets/admin.css .build/hangar18-manager/assets/
          cp assets/admin.js .build/hangar18-manager/assets/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"
          export SHA
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          p = Path('update.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['package_sha256'] = os.environ['SHA']
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit QA-finalized v0.5.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add hangar18-manager.php readme.txt update.json
          git add -f dist/hangar18-manager.zip
          git commit -m 'QA Hangar18 Manager 0.5.0 design-system foundation'
          git push origin HEAD:development/v0.5.0
