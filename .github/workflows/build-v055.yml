name: Build Hangar18 Manager 0.5.5

on:
  push:
    branches:
      - development/v0.5.5
    paths:
      - '.github/workflows/build-v055.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.5.5 patch
        run: |
          set -euo pipefail
          python3 tools/build_v055.py

      - name: Static QA
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F "Version: 0.5.5" hangar18-manager.php
          grep -F "const VERSION = '0.5.5';" hangar18-manager.php
          grep -F "'Version'        => '1.9'" hangar18-manager.php
          grep -F "'ShowDesktop'            => true" hangar18-manager.php
          grep -F "'TabletAlignment'        => 'Inherit'" hangar18-manager.php
          grep -F -- '--h18-tablet-transform-x' hangar18-manager.php
          grep -F 'h18-hide-tablet' hangar18-manager.php
          grep -F 'h18-responsive-device-grid' assets/admin.css
          test "$(grep -o "'1.9'" hangar18-manager.php | wc -l)" -eq 7

      - name: Build package and manifest
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build/hangar18-manager dist
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          mkdir -p .build/hangar18-manager/assets
          cp assets/admin.css assets/admin.js .build/hangar18-manager/assets/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          unzip -q dist/hangar18-manager.zip -d .build/verify
          php -l .build/verify/hangar18-manager/hangar18-manager.php
          node --check .build/verify/hangar18-manager/assets/admin.js
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          package = Path('dist/hangar18-manager.zip')
          payload = {
              'schema_version': '1.0',
              'plugin': 'hangar18-manager',
              'version': '0.5.5',
              'min_wp': '6.4',
              'min_php': '8.0',
              'published_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'package_path': 'dist/hangar18-manager.zip',
              'package_sha256': hashlib.sha256(package.read_bytes()).hexdigest(),
              'changelog': [
                  'Tilføjer vis/skjul pr. desktop, tablet og mobil.',
                  'Tilføjer særskilt tablet-layout med arv fra desktop.',
                  'Tilføjer translate, scale og rotate pr. enhed.',
                  'Komponerer responsive transforms med hover-effekter og reduced-motion.',
                  'Løfter page-editor schema kompatibelt til 1.9.'
              ]
          }
          Path('update.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -rf .build

      - name: Commit validated build and self-clean
        run: |
          set -euo pipefail
          rm -f tools/build_v055.py .github/workflows/build-v055.yml
          rmdir tools 2>/dev/null || true
          git config user.name "hangar18-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build Hangar18 Manager 0.5.5 responsive element controls"
          git push
