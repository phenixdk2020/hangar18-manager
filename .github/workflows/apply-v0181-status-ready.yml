name: Apply Visual Designer Manager 0.1.81 Status Ready

on:
  push:
    paths:
      - '.github/workflows/apply-v0181-status-ready.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.1.81 status changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          js_path = Path('clean/hangar18-manager/assets/admin-v0123.js')
          js = js_path.read_text(encoding='utf-8')
          old_pages = "        'h18-clean-pages': ['Under udvikling', 'partial'],"
          new_pages = "        'h18-clean-pages': ['Klar', 'ready'],"
          if old_pages not in js:
              raise SystemExit('Expected Sider status anchor not found')
          js = js.replace(old_pages, new_pages, 1)

          event_anchor = "        'h18-clean-events': ['Klar', 'ready'],\n"
          event_fields = "        'h18-clean-event-fields': ['Klar', 'ready'],\n"
          if event_fields not in js:
              if event_anchor not in js:
                  raise SystemExit('Expected Events status anchor not found')
              js = js.replace(event_anchor, event_anchor + event_fields, 1)
          js_path.write_text(js, encoding='utf-8')

          plugin_path = Path('clean/hangar18-manager/hangar18-manager.php')
          plugin = plugin_path.read_text(encoding='utf-8')
          if ' * Version: 0.1.80' not in plugin or "define('H18_CLEAN_VERSION', '0.1.80');" not in plugin:
              raise SystemExit('Expected v0.1.80 plugin version anchors not found')
          plugin = plugin.replace(' * Version: 0.1.80', ' * Version: 0.1.81', 1)
          plugin = plugin.replace("define('H18_CLEAN_VERSION', '0.1.80');", "define('H18_CLEAN_VERSION', '0.1.81');", 1)
          plugin_path.write_text(plugin, encoding='utf-8')

          history_path = Path('clean/hangar18-manager/release-history.json')
          history = json.loads(history_path.read_text(encoding='utf-8'))
          versions = history.get('versions', [])
          if versions and versions[0].get('version') == '0.1.81':
              pass
          else:
              versions.insert(0, {
                  'version': '0.1.81',
                  'date': '2026-09-02',
                  'items': [
                      'Manager-status: Sider er markeret Klar, fordi sideadministration, duplikering, publiceringsstatus, Hjem-valg og Designer-integration er implementeret.',
                      'Manager-status: Eventfelter er markeret Klar, fordi feltdefinitioner, værdier, synlighed/påkrævet, Manager-redigering og Designer-elementet Eventfelt er implementeret.',
                      'Ingen funktionel datamodel er ændret; dette er en status-/releaseopdatering af eksisterende færdig funktionalitet.'
                  ]
              })
              history['versions'] = versions
          history_path.write_text(json.dumps(history, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          notes = '''<h2>0.1.81 – Modulstatus for Sider og Eventfelter</h2>
          <ul>
          <li><strong>Sider</strong> vises nu som <strong>Klar</strong> i Manager-menuen.</li>
          <li><strong>Eventfelter</strong> vises nu som <strong>Klar</strong> i Manager-menuen.</li>
          <li>Statusændringen afspejler den allerede implementerede funktionalitet; datamodel og frontend-adfærd er uændret.</li>
          </ul>'''
          Path('clean-release-notes.html').write_text(notes + '\n', encoding='utf-8')

          status = '''# Visual Designer Manager v0.1.81 – status

## Scope

- Sider: Manager-badge ændret fra **Under udvikling** til **Klar**.
- Eventfelter: Manager-badge tilføjet som **Klar**.
- Ingen ændring af event-/sidedata eller frontend-rendering.

## Begrundelse

Sider har allerede sideadministration, Designer-status, duplikering, publicering/kladde, Hjem-valg og Designer-integration. Eventfelter har feltdefinitioner, værdier, aktiv/påkrævet, kort/detail-visning, Manager-redigering og selvstændigt Designer-element.
'''
          Path('docs/v0181-status.md').write_text(status, encoding='utf-8')
          PY

      - name: Syntax and status QA
        shell: bash
        run: |
          set -euo pipefail
          php -l clean/hangar18-manager/hangar18-manager.php
          node --check clean/hangar18-manager/assets/admin-v0123.js
          grep -Fq "'h18-clean-pages': ['Klar', 'ready']" clean/hangar18-manager/assets/admin-v0123.js
          grep -Fq "'h18-clean-event-fields': ['Klar', 'ready']" clean/hangar18-manager/assets/admin-v0123.js
          grep -q 'Version: 0.1.81' clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.81'" clean/hangar18-manager/hangar18-manager.php
          test "$(python3 -c "import json; print(json.load(open('clean/hangar18-manager/release-history.json',encoding='utf-8'))['versions'][0]['version'])")" = '0.1.81'

      - name: Verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -n "$(git status --short)"
          if git status --short | grep -Ev '^( M|M |A |\?\?) (clean/hangar18-manager/assets/admin-v0123.js|clean/hangar18-manager/hangar18-manager.php|clean/hangar18-manager/release-history.json|clean-release-notes.html|docs/v0181-status.md)$'; then
            echo 'Unexpected v0.1.81 modified path.' >&2
            exit 1
          fi

      - name: Commit v0.1.81 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-apply-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager/assets/admin-v0123.js clean/hangar18-manager/hangar18-manager.php clean/hangar18-manager/release-history.json clean-release-notes.html docs/v0181-status.md
          git commit -m 'Mark Sider and Eventfelter ready in v0.1.81'
          git push origin HEAD:main
