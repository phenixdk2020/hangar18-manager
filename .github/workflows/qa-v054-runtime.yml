name: QA Hangar18 Manager 0.5.4 runtime

on:
  push:
    branches:
      - development/v0.5.4
    paths:
      - '.github/workflows/qa-v054-runtime.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Harden background media runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hangar18-manager.php')
          s = p.read_text(encoding='utf-8')
          old = """        $effect = (string) ($section['BackgroundEffect'] ?? 'None');\n        $effect_image = 'none';\n        if ($effect === 'Gradient') {\n            $effect_image = 'linear-gradient(' . (int) ($section['GradientAngleDeg'] ?? 135) . 'deg,' . (string) ($section['GradientStartColor'] ?? '#30382a') . ',' . (string) ($section['GradientEndColor'] ?? '#c3ae83') . ')';\n        } elseif ($effect === 'Image' && !empty($section['BackgroundImageUrl'])) {\n            $effect_image = 'url(' . wp_json_encode(esc_url_raw((string) $section['BackgroundImageUrl'])) . ')';\n        }"""
          new = """        $effect = (string) ($section['BackgroundEffect'] ?? 'None');\n        $background_image_url = esc_url_raw((string) ($section['BackgroundImageUrl'] ?? ''));\n        $background_media_id = absint($section['BackgroundMediaId'] ?? 0);\n        if ($background_media_id > 0) {\n            $resolved_background_url = wp_get_attachment_url($background_media_id);\n            if ($resolved_background_url) {\n                $background_image_url = esc_url_raw((string) $resolved_background_url);\n            }\n        }\n        $effect_image = 'none';\n        if ($effect === 'Gradient') {\n            $effect_image = 'linear-gradient(' . (int) ($section['GradientAngleDeg'] ?? 135) . 'deg,' . (string) ($section['GradientStartColor'] ?? '#30382a') . ',' . (string) ($section['GradientEndColor'] ?? '#c3ae83') . ')';\n        } elseif ($effect === 'Image' && $background_image_url !== '') {\n            $effect_image = 'url(' . wp_json_encode($background_image_url) . ')';\n        }"""
          if s.count(old) != 1:
              raise SystemExit('runtime background block did not match exactly once')
          s = s.replace(old, new, 1)
          old_css = """            '@media(hover:hover){body.page .h18-editor-page>.h18-editor-section:hover{transform:var(--h18-hover-transform,none);box-shadow:var(--h18-hover-shadow,var(--h18-section-shadow,none))}}' .\n            'body.page .h18-editor-page>.h18-editor-section h1"""
          new_css = """            '@media(hover:hover){body.page .h18-editor-page>.h18-editor-section:hover{transform:var(--h18-hover-transform,none);box-shadow:var(--h18-hover-shadow,var(--h18-section-shadow,none))}}' .\n            '@media(prefers-reduced-motion:reduce){body.page .h18-editor-page>.h18-editor-section{transition:none!important}body.page .h18-editor-page>.h18-editor-section:hover{transform:none!important}}' .\n            'body.page .h18-editor-page>.h18-editor-section h1"""
          if s.count(old_css) != 1:
              raise SystemExit('hover css block did not match exactly once')
          s = s.replace(old_css, new_css, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate and rebuild package
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F 'wp_get_attachment_url($background_media_id)' hangar18-manager.php
          grep -F 'prefers-reduced-motion:reduce' hangar18-manager.php
          rm -rf .build
          mkdir -p .build/hangar18-manager
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          mkdir -p .build/hangar18-manager/assets
          cp assets/admin.css assets/admin.js .build/hangar18-manager/assets/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('update.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['package_sha256'] = hashlib.sha256(Path('dist/hangar18-manager.zip').read_bytes()).hexdigest()
          data['changelog'].append('Baggrundsbilleder fra Media Library følger attachment-ID, og hover respekterer reduceret bevægelse.')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -rf .build

      - name: Commit QA fix and self-clean
        run: |
          set -euo pipefail
          rm -f .github/workflows/qa-v054-runtime.yml
          git config user.name "hangar18-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "QA harden v0.5.4 advanced visual runtime"
          git push
