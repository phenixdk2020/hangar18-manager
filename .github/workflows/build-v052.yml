name: Build Hangar18 Manager 0.5.2

on:
  push:
    branches:
      - development/v0.5.2
    paths:
      - '.github/workflows/build-v052.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development/v0.5.2

      - name: Apply v0.5.2 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_v052.py

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F 'Version: 0.5.2' hangar18-manager.php
          grep -F "const VERSION = '0.5.2';" hangar18-manager.php
          grep -F "'DesignMode'" hangar18-manager.php
          grep -F 'h18-section-design-mode' hangar18-manager.php
          grep -F 'refreshSectionDesignMode' assets/admin.js
          grep -F 'h18-element-design-box' assets/admin.css
          grep -F "'Version'        => '1.6'" hangar18-manager.php

      - name: Build package and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build/hangar18-manager/assets dist
          cp hangar18-manager.php .build/hangar18-manager/
          cp readme.txt .build/hangar18-manager/
          cp assets/admin.css .build/hangar18-manager/assets/
          cp assets/admin.js .build/hangar18-manager/assets/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"
          export SHA
          python3 -c "import json,os; from datetime import datetime,timezone; m={'schema_version':'1.0','plugin':'hangar18-manager','version':'0.5.2','min_wp':'6.4','min_php':'8.0','published_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'package_path':'dist/hangar18-manager.zip','package_sha256':os.environ['SHA'],'changelog':['Tilføjer individuel farvestyring pr. editorsektion.','Tilføjer kantbredde, kantfarve og skygge pr. element.','Globalt design er fortsat standard for bagudkompatibilitet.','Løfter page-editor dataformatet kompatibelt til schema 1.6.']}; open('update.json','w',encoding='utf-8').write(json.dumps(m,ensure_ascii=False,indent=2)+'\\n')"
          rm -rf .build

      - name: Commit validated build and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-v052.yml tools/build_v052.py
          rmdir tools 2>/dev/null || true
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Build Hangar18 Manager 0.5.2 per-element design controls'
          git push
