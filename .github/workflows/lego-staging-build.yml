name: LEGO Staging Test Build

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional test-session note'
        required: false
        default: 'manual LEGO acceptance'

permissions:
  contents: read

jobs:
  build:
    name: Validate and package current commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify LEGO contracts
        shell: bash
        run: |
          bash tests/Architecture/protected-domain-contract.sh
          bash tests/Architecture/v0840-lego-side-by-side-contract.sh
          bash tests/Architecture/v0841-lego-resize-contract.sh
          bash tests/Architecture/v0842-lego-responsive-layout-contract.sh
          bash tests/Architecture/lego-manual-acceptance-contract.sh
          bash tests/Architecture/lego-staging-build-contract.sh
          bash tests/Architecture/lego-staging-verify-contract.sh

      - name: Lint plugin PHP
        shell: bash
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(php -r '$s=file_get_contents("hangar18-manager.php"); if(!preg_match("/const VERSION = '\''([^'\'']+)'\'';/",$s,$m)){exit(2);} echo $m[1];')"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          printf 'Build commit: %s\nPlugin version: %s\nPurpose: LEGO staging/manual acceptance only\nOfficial release: NO\nPublic cutover authorized: NO\n' "$GITHUB_SHA" "$VERSION" > TEST-BUILD.txt

      - name: Build installable staging ZIP
        shell: bash
        run: |
          rm -rf build staging-dist
          mkdir -p build/hangar18-manager staging-dist
          cp hangar18-manager.php readme.txt TEST-BUILD.txt build/hangar18-manager/
          cp -R assets src build/hangar18-manager/
          (cd build && zip -qr ../staging-dist/hangar18-manager-lego-staging.zip hangar18-manager)
          sha256sum staging-dist/hangar18-manager-lego-staging.zip > staging-dist/SHA256SUMS.txt
          cp TEST-BUILD.txt staging-dist/TEST-BUILD.txt
          unzip -tq staging-dist/hangar18-manager-lego-staging.zip
          unzip -p staging-dist/hangar18-manager-lego-staging.zip hangar18-manager/TEST-BUILD.txt | grep -F "Build commit: $GITHUB_SHA"

      - name: Write staging manifest
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TEST_NOTE: ${{ inputs.note }}
        run: |
          python3 <<'PY'
          import hashlib, json, os, pathlib
          package=pathlib.Path('staging-dist/hangar18-manager-lego-staging.zip')
          manifest={
              'schemaVersion':'1.0',
              'purpose':'lego-staging-manual-acceptance',
              'commitSha':os.environ['GITHUB_SHA'],
              'pluginVersion':os.environ['VERSION'],
              'note':os.environ.get('TEST_NOTE',''),
              'package':package.name,
              'packageSha256':hashlib.sha256(package.read_bytes()).hexdigest(),
              'officialRelease':False,
              'publicCutoverAuthorized':False,
          }
          pathlib.Path('staging-dist/lego-staging-manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY

      - name: Verify staging artifact identity and integrity
        run: node tools/lego-staging-verify.cjs staging-dist

      - name: Upload staging test artifact
        uses: actions/upload-artifact@v4
        with:
          name: hangar18-lego-staging-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
          path: staging-dist/
          if-no-files-found: error
          retention-days: 14
