name: Apply Visual Designer Manager 0.1.65 General Elements Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0165-general-elements-test.yml'
      - '.github/scripts/apply_v0165_general_elements.py'
      - '.github/scripts/fix_v0165_apply_script.py'
      - '.github/scripts/v0165_general_elements_qa.py'
      - '.github/scripts/v0165_elements_model_qa.php'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden apply script
        run: python3 .github/scripts/fix_v0165_apply_script.py

      - name: Apply v0.1.65 general Designer elements
        run: python3 .github/scripts/apply_v0165_general_elements.py

      - name: PHP syntax
        run: find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Existing regression QA
        run: |
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php
          php .github/scripts/v0161_header_footer_qa.php
          python3 .github/scripts/v0162_page_duplicate_qa.py
          python3 .github/scripts/v0164_clipboard_qa.py

      - name: v0.1.65 model QA
        run: php .github/scripts/v0165_elements_model_qa.php

      - name: v0.1.65 source contract QA
        run: python3 .github/scripts/v0165_general_elements_qa.py

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'phenixdk2020'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add \
            clean/hangar18-manager \
            clean-release-notes.html \
            CLEAN-TECHNICAL-MANUAL.md \
            docs/v0165-status.md \
            .github/scripts/apply_v0165_general_elements.py
          if git diff --cached --quiet; then
            echo 'v0.1.65 source already applied.'
            exit 0
          fi
          git commit -m 'Add v0.1.65 general Designer elements test'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo 'Unable to publish v0.1.65 implementation after three attempts.' >&2
          exit 1
