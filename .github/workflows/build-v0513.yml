name: Build Hangar18 Manager v0.5.13

on:
  push:
    branches:
      - development/v0.5.13
    paths:
      - '.github/workflows/build-v0513.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development/v0.5.13
          fetch-depth: 0

      - name: Apply v0.5.13 patch
        run: python3 .github/scripts/patch_v0513.py

      - name: Syntax and structural QA
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F 'Version: 0.5.13' hangar18-manager.php
          grep -F "const VERSION = '0.5.13';" hangar18-manager.php
          grep -F 'Version: 0.5.13' readme.txt
          grep -F 'hangar18PageDraftV0513:' assets/admin.js
          grep -F 'editorDraftInitializeRecovery' assets/admin.js
          grep -F 'editorDraftRestoreCandidate' assets/admin.js
          grep -F 'editorDraftDiscardCandidate' assets/admin.js
          grep -F 'SubmittedAtUtc' assets/admin.js
          grep -F 'BaseSignature' assets/admin.js
          grep -F 'visibilitychange' assets/admin.js
          grep -F 'pagehide.h18EditorDraft' assets/admin.js
          grep -F 'h18-editor-restore-draft' hangar18-manager.php
          grep -F 'h18-editor-discard-draft' hangar18-manager.php
          grep -F 'page-editor schema forbliver 1.12' readme.txt
          if grep -Fq '"Version": "1.13"' hangar18-manager.php; then
            echo 'Unexpected page schema bump to 1.13' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          js = Path('assets/admin.js').read_text()
          required = [
              "editorDraftSaveNow(!$pageWhatIf.is(':checked'))",
              "if (editorDraftRecoveryPending && !markSubmitted)",
              "draft.BaseSignature !== initial.signature",
              "editorDraftServerSignature = initial.signature",
              "editorHistoryEntries.splice(0, editorHistoryEntries.length)",
              "window.localStorage.setItem(editorDraftStorageKey(), raw)",
          ]
          missing = [item for item in required if item not in js]
          if missing:
              raise SystemExit('Missing recovery safety assertions: ' + repr(missing))
          init_start = js.index('function editorDraftInitializeRecovery')
          init_end = js.index('function editorDraftRestoreCandidate', init_start)
          if 'editorHistoryRestore(' in js[init_start:init_end]:
              raise SystemExit('Recovery initialization must not auto-restore a draft')
          print('Recovery structural QA passed')
          PY

      - name: Rebuild distribution package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build/hangar18-manager/assets
          cp hangar18-manager.php .build/hangar18-manager/
          cp readme.txt .build/hangar18-manager/
          cp assets/admin.css .build/hangar18-manager/assets/
          cp assets/admin.js .build/hangar18-manager/assets/
          rm -f dist/hangar18-manager.zip
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip

      - name: Update manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          package = Path('dist/hangar18-manager.zip')
          manifest = {
              'schema_version': '1.0',
              'plugin': 'hangar18-manager',
              'version': '0.5.13',
              'min_wp': '6.4',
              'min_php': '8.0',
              'published_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'package_path': 'dist/hangar18-manager.zip',
              'package_sha256': hashlib.sha256(package.read_bytes()).hexdigest(),
              'changelog': [
                  'Tilføjer lokal browser-autosave af sideeditorens recovery-state.',
                  'Tilføjer Gendan kladde / Kassér kladde med versionskontrol mod WordPress-siden.',
                  'Kladder gendannes aldrig automatisk og permanente revisioner/backups er uændrede.',
                  'Autosave flusher ved pagehide/skjult fane og håndterer succesfulde Gem-submits sikkert.',
                  'Retter readme-versioneringen og dokumenterer v0.5.12; page-editor schema forbliver 1.12.'
              ]
          }
          Path('update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(manifest['package_sha256'])
          PY

      - name: Package QA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .verify
          mkdir .verify
          unzip -q dist/hangar18-manager.zip -d .verify
          php -l .verify/hangar18-manager/hangar18-manager.php
          node --check .verify/hangar18-manager/assets/admin.js
          grep -F 'Version: 0.5.13' .verify/hangar18-manager/hangar18-manager.php
          grep -F 'Version: 0.5.13' .verify/hangar18-manager/readme.txt
          grep -F 'hangar18PageDraftV0513:' .verify/hangar18-manager/assets/admin.js
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('update.json').read_text())
          actual = hashlib.sha256(Path('dist/hangar18-manager.zip').read_bytes()).hexdigest()
          assert manifest['version'] == '0.5.13'
          assert manifest['package_sha256'] == actual
          print('Package manifest QA passed:', actual)
          PY

      - name: Self-clean and diff scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build .verify
          rm -f .github/scripts/patch_v0513.py .github/workflows/build-v0513.yml
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed = {'hangar18-manager.php','assets/admin.js','assets/admin.css','readme.txt','update.json','dist/hangar18-manager.zip','.github/scripts/patch_v0513.py','.github/workflows/build-v0513.yml'}
          changed = set(subprocess.check_output(['git','status','--short'], text=True).splitlines())
          paths = set()
          for line in changed:
              path = line[3:].strip()
              if ' -> ' in path:
                  path = path.split(' -> ',1)[1]
              paths.add(path)
          extra = paths - allowed
          if extra:
              raise SystemExit('Unexpected release-scope files: ' + repr(sorted(extra)))
          print('Release scope QA passed')
          PY

      - name: Commit v0.5.13 release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Release Hangar18 Manager 0.5.13'
          git push origin HEAD:development/v0.5.13
