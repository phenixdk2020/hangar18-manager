name: Visual Designer Manager V3 Alpha.12 Release

on:
  push:
    branches: [v3-clean-refactor]
    paths:
      - 'v3-alpha12-release-now.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v3-alpha12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock V1 0.1.93 runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='dc3bad403c764f4ec123a526333a781d05dde491'
          git cat-file -e "${BASELINE}^{commit}"
          git diff --exit-code "$BASELINE" -- clean/hangar18-manager
          echo 'V1 0.1.93 source runtime: byte-identical PASS'

      - name: Run retained V1 regression gates
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 .github/scripts/v0192_export_integrity_qa.py
          python3 .github/scripts/v0191_form_design_controls_qa.py
          python3 .github/scripts/v0190_form_wysiwyg_parity_qa.py
          python3 .github/scripts/v0189_manager_cleanup_export_all_qa.py
          python3 .github/scripts/v0186_site_settings_qa.py
          python3 .github/scripts/v0185_editor_live_box_qa.py
          python3 .github/scripts/v0185_semantic_qa.py
          python3 .github/scripts/v0184_portable_transfer_qa.py
          echo 'Retained V1 regression gates: PASS'

      - name: Capture Alpha.9 responsive reference
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build_v3_alpha9.py
          cp build/visual-designer-manager/src/Frontend/ResponsiveRenderer.php /tmp/alpha9-responsive.php

      - name: Build and validate V3 3.0.0-alpha.12
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build_v3_alpha12.py
          ROOT='build/visual-designer-manager'
          MAIN="$ROOT/visual-designer-manager.php"
          RR="$ROOT/src/Frontend/ResponsiveRenderer.php"
          RENDERER="$ROOT/src/Frontend/Renderer.php"
          MODEL="$ROOT/src/Model/LayoutModel.php"
          JS="$ROOT/assets/editor-v018-core.js"
          grep -Fq 'Version: 3.0.0-alpha.12' "$MAIN"
          grep -Fq "define('VDM_VERSION', '3.0.0-alpha.12');" "$MAIN"
          cmp -s /tmp/alpha9-responsive.php "$RR"
          ! grep -Fq 'h18-vdm-mobile-flow-repair' "$RR"
          ! grep -Fq 'mobileOrder' "$RR"
          test ! -e "$ROOT/assets/v3-alpha10-mobile-reflow.js"
          test ! -e "$ROOT/assets/v3-alpha11-mobile-reflow.js"
          grep -Fq "\$fit = 'original';" "$MODEL"
          grep -Fq "'imageMaxWidth' => self::clamp" "$MODEL"
          grep -Fq 'max-width:900px' "$RENDERER"
          grep -Fq 'renderStoredRichText' "$RENDERER"
          grep -Fq 'eventDynamicImageMaxWidth' "$JS"
          php .github/scripts/v3_alpha9_padding_qa.php "$ROOT"
          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find "$ROOT/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          echo 'V3 alpha.12 release contract: PASS'

      - name: Unit-test multiline event rendering
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/alpha12-lines.php <<'PHP'
          <?php
          function esc_html($value) { return htmlspecialchars((string)$value, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8'); }
          function wp_kses_post($value) { return (string)$value; }
          require 'build/visual-designer-manager/src/Frontend/Renderer.php';
          $method = new ReflectionMethod('VisualDesignerManager\\Frontend\\Renderer', 'renderStoredRichText');
          $method->setAccessible(true);
          $plain = $method->invoke(null, "10.00 - Kaffe\n10.10 - Udstilling\n10.15 - Afslutning");
          if (substr_count($plain, '<br>') !== 2) { fwrite(STDERR, "Line breaks collapsed: $plain\n"); exit(1); }
          echo "Alpha.12 multiline event rendering: PASS\n";
          PHP
          php /tmp/alpha12-lines.php

      - name: Package V3 alpha.12 and create updater manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION='3.0.0-alpha.12'
          mkdir -p dist
          ZIP="dist/visual-designer-manager-v${VERSION}.zip"
          rm -f "$ZIP"
          (cd build && zip -qr "../$ZIP" visual-designer-manager)
          unzip -tq "$ZIP"
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/visual-designer-manager.php$')" = '1'
          test "$(unzip -Z1 "$ZIP" | grep -c 'v3-alpha1[01]-mobile-reflow.js$' || true)" = '0'
          SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          python3 - "$SHA" "$SOURCE_COMMIT" <<'PY'
          import json, sys
          from pathlib import Path
          sha, source_commit = sys.argv[1:3]
          version = '3.0.0-alpha.12'
          data = {
              'name': 'Visual Designer Manager',
              'slug': 'visual-designer-manager',
              'version': version,
              'homepage': 'https://github.com/phenixdk2020/hangar18-manager/tree/v3-clean-refactor',
              'requires': '6.4',
              'requires_php': '8.0',
              'tested': '6.8',
              'package': f'https://raw.githubusercontent.com/phenixdk2020/hangar18-manager/v3-clean-refactor/dist/visual-designer-manager-v{version}.zip',
              'sha256': sha,
              'source_commit': source_commit,
              'source_baseline': 'dc3bad403c764f4ec123a526333a781d05dde491',
              'source_version': '0.1.93',
              'sections': {
                  'description': 'V3 clean-refactor af den gennemtestede Visual Designer Manager V1 0.1.93 runtime.',
                  'changelog': '3.0.0-alpha.12: V1 Mobile Parity Reset. Alpha.10/11 grid-to-flex mobile workarounds are removed; event images use normal content sizing and line breaks are preserved in Program and other event fields.'
              }
          }
          Path('v3-update.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          echo "V3_PACKAGE_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "V3 package SHA-256: $SHA"

      - name: Commit verified V3 package to V3 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-v3-release-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add v3-update.json dist/visual-designer-manager-v3.0.0-alpha.12.zip
          if git diff --cached --quiet; then
            echo 'Verified V3 package already current.'
            exit 0
          fi
          git commit -m 'Publish Visual Designer Manager V3 3.0.0-alpha.12 [skip v3 release]'
          git push origin HEAD:v3-clean-refactor

      - name: Upload actual WordPress plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: visual-designer-manager-v3.0.0-alpha.12
          if-no-files-found: error
          retention-days: 30
          path: dist/visual-designer-manager-v3.0.0-alpha.12.zip
