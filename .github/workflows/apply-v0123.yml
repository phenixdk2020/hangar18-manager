name: Apply Visual Designer Manager 0.1.23

on:
  push:
    branches: [main]
    paths:
      - 'v0123-apply-now.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.1.23 patch
        run: python .github/scripts/apply_v0123.py

      - name: Verify PHP and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php .github/scripts/hierarchy_normalizer_qa.php
          grep -q "Version: 0.1.23" clean/hangar18-manager/hangar18-manager.php
          grep -q "editor-v0123-ux.js" clean/hangar18-manager/hangar18-manager.php
          grep -q "admin-v0123.js" clean/hangar18-manager/src/Admin/AdminController.php
          grep -q "GlobalDesignerController.php" clean/hangar18-manager/hangar18-manager.php

      - name: Commit applied source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-dev-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager CLEAN-DESIGN-MANUAL.md CLEAN-USER-MANUAL.md docs/CLEAN-HANDOVER.md docs/HEADER-FOOTER-SPEC.md
          if git diff --cached --quiet; then
            echo '0.1.23 source already applied.'
            exit 0
          fi
          git commit -m 'Prepare Visual Designer Manager v0.1.23 Header Footer UX release'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
