name: V3 Alpha.4 Route Audit

on:
  push:
    branches: [v3-alpha4-admin-routes]
    paths:
      - '.github/workflows/v3-alpha4-route-audit.yml'
      - '.github/scripts/build_v3_alpha4.py'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build current Alpha.3 baseline
        run: python3 .github/scripts/build_v3_alpha3.py
      - name: Inventory h18-clean route-like literals
        shell: bash
        run: |
          set -euo pipefail
          echo '=== UNIQUE ROUTE-LIKE TOKENS ==='
          grep -RhoE "h18-clean-[a-z0-9-]+" build/visual-designer-manager --include='*.php' --include='*.js' --include='*.html' | sort -u || true
          echo '=== PHP/JS CONTEXT ==='
          grep -RniE "page=['\"]?h18-clean-|admin\.php\?page=h18-clean-|const (PAGE|MENU).*h18-clean-|h18-clean-(editor|vehicles|vehicle-fields|events|event-fields|gallery|menu|header-footer)" build/visual-designer-manager --include='*.php' --include='*.js' || true
