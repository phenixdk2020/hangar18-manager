name: Apply Visual Designer Manager 0.1.57 Menu Save and Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_v0157_menu_save_identity.py'
      - '.github/workflows/apply-v0157-menu-save-identity.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.1.57 patch
        run: python3 .github/scripts/apply_v0157_menu_save_identity.py

      - name: PHP syntax
        run: find clean/hangar18-manager -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in clean/hangar18-manager/assets/*.js; do node --check "$f"; done

      - name: Existing model regression QA
        run: |
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php

      - name: Verify BUG-19 menu class serialization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          nav = Path('clean/hangar18-manager/src/Admin/NavigationController.php').read_text(encoding='utf-8')
          assert "'menu-item-classes' => 'vd-menu-heading'" in nav
          assert "'menu-item-classes' => self::menuItemClasses($item->classes)" in nav
          assert "'menu-item-classes' => self::menuItemClasses($item['classes'] ?? [])" in nav
          assert 'private static function menuItemClasses($classes): string' in nav
          lines = [line.strip() for line in nav.splitlines() if "'menu-item-classes' =>" in line]
          assert len(lines) == 3, lines
          for line in lines:
              assert '=> [' not in line, line
              assert 'array_map(' not in line, line
          print('BUG-19 menu-item-classes serialization PASS:', lines)
          PY

      - name: Verify 0.1.57 runtime identity
        run: |
          set -euo pipefail
          grep -q 'Version: 0.1.57' clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.57'" clean/hangar18-manager/hangar18-manager.php
          grep -q 'Text Domain: visual-designer-manager' clean/hangar18-manager/hangar18-manager.php
          grep -R -q 'namespace VisualDesignerManager' clean/hangar18-manager --include='*.php'
          if grep -R -n -F 'Hangar18\Clean' clean/hangar18-manager --include='*.php'; then
            echo 'Old Hangar18\\Clean namespace remains in active PHP runtime' >&2
            exit 1
          fi
          if grep -R -n -F 'hangar18-manager-clean' clean/hangar18-manager --include='*.php'; then
            echo 'Old text domain remains in active PHP runtime' >&2
            exit 1
          fi
          grep -q "h18_clean_navigation_history_v1" clean/hangar18-manager/src/Admin/NavigationController.php
          grep -q "h18-clean-menu" clean/hangar18-manager/src/Admin/NavigationController.php
          grep -q "h18_clean_nav_save" clean/hangar18-manager/src/Admin/NavigationController.php
          grep -q 'VD-RUNTIME-IDENTITY-001' CLEAN-TECHNICAL-MANUAL.md
          grep -q 'VD-MENU-CLASS-SERIALIZATION-001' CLEAN-TECHNICAL-MANUAL.md
          test -s docs/v0157-status.md
          echo '0.1.57 runtime identity and compatibility IDs PASS'

      - name: Preserve critical regression gates
        run: |
          set -euo pipefail
          grep -q "selectionSessionMode: 'prearmed-v0138'" clean/hangar18-manager/assets/editor-v0125.js
          grep -q 'boundary-markers-v0137-single-owner' clean/hangar18-manager/assets/editor-v0125.js
          grep -q "var mode = 'fit'" clean/hangar18-manager/assets/editor-v0144-viewport.js
          grep -q 'data-h18-leaf-transparent' clean/hangar18-manager/assets/editor-v018-core.js
          grep -q 'VD-MENU-UX-003' CLEAN-TECHNICAL-MANUAL.md
          grep -q 'VD-PAGES-ACTIONS-001' CLEAN-TECHNICAL-MANUAL.md
          echo 'regression gates PASS'

      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name 'phenixdk2020'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager clean-release-notes.html CLEAN-TECHNICAL-MANUAL.md docs/v0157-status.md
          if git diff --cached --quiet; then echo 'No implementation changes'; exit 0; fi
          git commit -m 'Fix menu save and runtime identity in Visual Designer Manager 0.1.57'
          git pull --rebase origin main
          git push origin HEAD:main
