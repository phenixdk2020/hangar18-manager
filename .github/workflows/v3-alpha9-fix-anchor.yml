name: V3 Alpha.9 Fix Bootstrap Anchor

on:
  push:
    branches: [v3-alpha9-parity]
    paths:
      - '.github/workflows/v3-alpha9-fix-anchor.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct Alpha.9 bootstrap anchor
        shell: bash
        run: |
          set -euo pipefail
          FILE='.github/scripts/build_v3_alpha9.py'
          grep -Fq "require_anchor = \"require_once H18_CLEAN_DIR . 'src/Migration/SharedPrimaryMenu.php';\"" "$FILE"
          sed -i "s|require_anchor = \"require_once H18_CLEAN_DIR . 'src/Migration/SharedPrimaryMenu.php';\"|require_anchor = \"require_once VDM_DIR . 'src/Migration/SharedPrimaryMenu.php';\"|" "$FILE"
          grep -Fq "require_anchor = \"require_once VDM_DIR . 'src/Migration/SharedPrimaryMenu.php';\"" "$FILE"
          git config user.name 'visual-designer-v3-fix-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'Fix Alpha.9 migration bootstrap anchor'
          git push origin HEAD:v3-alpha9-parity
