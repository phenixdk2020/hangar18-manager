name: V3 Alpha.10 Mobile Rendered Reflow QA

on:
  push:
    branches: [v3-alpha10-mobile-reflow]
    paths:
      - '.github/scripts/build_v3_alpha10.py'
      - '.github/workflows/v3-alpha10-qa.yml'
      - 'V3-ALPHA10.md'
  pull_request:
    branches: [v3-clean-refactor]

jobs:
  alpha10-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock V1 0.1.93 source runtime
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='dc3bad403c764f4ec123a526333a781d05dde491'
          git cat-file -e "${BASELINE}^{commit}"
          git diff --exit-code "$BASELINE" -- clean/hangar18-manager
          echo 'V1 0.1.93 source runtime: byte-identical PASS'

      - name: Retained V1 regression gates
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 .github/scripts/v0192_export_integrity_qa.py
          python3 .github/scripts/v0191_form_design_controls_qa.py
          python3 .github/scripts/v0190_form_wysiwyg_parity_qa.py
          python3 .github/scripts/v0189_manager_cleanup_export_all_qa.py
          python3 .github/scripts/v0186_site_settings_qa.py
          python3 .github/scripts/v0185_editor_live_box_qa.py
          python3 .github/scripts/v0185_semantic_qa.py
          python3 .github/scripts/v0184_portable_transfer_qa.py
          echo 'Retained V1 regression gates: PASS'

      - name: Build and validate V3 3.0.0-alpha.10
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/build_v3_alpha10.py
          python3 .github/scripts/build_v3_alpha10.py
          ROOT='build/visual-designer-manager'
          MAIN="$ROOT/visual-designer-manager.php"
          RR="$ROOT/src/Frontend/ResponsiveRenderer.php"
          JS="$ROOT/assets/v3-alpha10-mobile-reflow.js"
          grep -Fq 'Version: 3.0.0-alpha.10' "$MAIN"
          grep -Fq "define('VDM_VERSION', '3.0.0-alpha.10');" "$MAIN"
          grep -Fq "wp_enqueue_script('vdm-v3-mobile-reflow'" "$RR"
          grep -Fq 'h18-vdm-mobile-flow-repair' "$RR"
          grep -Fq "'.h18-vd-live-shell-page '" "$RR"
          grep -Fq "'.h18-vd-live-shell-header '" "$RR"
          grep -Fq "'.h18-vd-live-shell-footer '" "$RR"
          grep -Fq 'public const MOBILE_MAX = 782;' "$RR"
          grep -Fq 'horizontalOverflow(parentRect, childRect)' "$JS"
          grep -Fq 'intrinsicOverflow(child)' "$JS"
          grep -Fq 'gap > 160' "$JS"
          grep -Fq 'document.fonts.ready.then(schedule)' "$JS"
          php -l "$RR"
          node --check "$JS"
          echo 'Alpha.10 rendered mobile reflow contract: PASS'

      - name: Re-prove Alpha.9 functionality and package contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT='build/visual-designer-manager'
          MAIN="$ROOT/visual-designer-manager.php"
          grep -Fq 'V3DetailLayoutRepair::register();' "$MAIN"
          grep -Fq 'private static function galleryDetailRows' "$ROOT/src/Frontend/Renderer.php"
          grep -Fq 'data-field="paddingBottom"' "$ROOT/assets/editor-v018-core.js"
          grep -Fq '.h18-clean-node-preview--form{padding:0!important' "$ROOT/assets/admin-v0175.css"
          php .github/scripts/v3_alpha9_padding_qa.php "$ROOT"
          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find "$ROOT/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          VERSION='3.0.0-alpha.10'
          mkdir -p dist
          ZIP="dist/visual-designer-manager-v${VERSION}.zip"
          rm -f "$ZIP"
          (cd build && zip -qr "../$ZIP" visual-designer-manager)
          unzip -tq "$ZIP"
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/visual-designer-manager.php$')" = '1'
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/assets/v3-alpha10-mobile-reflow.js$')" = '1'
          echo "SHA256=$(sha256sum "$ZIP" | awk '{print $1}')"
          echo 'Alpha.10 installable ZIP: PASS'
