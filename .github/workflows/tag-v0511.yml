name: Tag Hangar18 Manager v0.5.11

on:
  push:
    branches:
      - maintenance/tag-v0.5.11
    paths:
      - .github/workflows/tag-v0511.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/tag-v0.5.11
          fetch-depth: 0
      - name: Tag v0.5.11 and self-clean
        shell: bash
        run: |
          set -euo pipefail
          release_sha="f4b285a7ca9c2ff1ea61bdc153ba4a4cede5b64e"
          git fetch origin main --tags
          test "$(git show "$release_sha:hangar18-manager.php" | grep -m1 'Version: 0.5.11')" != ""
          git tag -f v0.5.11 "$release_sha"
          git push origin refs/tags/v0.5.11 --force
          git rm .github/workflows/tag-v0511.yml
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git commit -m "Clean v0.5.11 tag workflow"
          git push origin HEAD:maintenance/tag-v0.5.11
