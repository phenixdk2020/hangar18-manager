name: Build Hangar18 Manager 0.5.3

on:
  push:
    branches:
      - development/v0.5.3
    paths:
      - '.github/workflows/build-v053.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development/v0.5.3

      - name: Apply typography patches
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v053_part1.py
          python3 tools/v053_runtime.py
          python3 tools/v053_frontend.py
          python3 tools/v053_ui.py

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F 'Version: 0.5.3' hangar18-manager.php
          grep -F "const VERSION = '0.5.3';" hangar18-manager.php
          grep -F "'SectionBodyFontFamily'" hangar18-manager.php
          grep -F "'SectionHeadingFontFamily'" hangar18-manager.php
          grep -F 'h18-element-typography-box' hangar18-manager.php
          grep -F -- '--h18-section-body-font:' hangar18-manager.php
          grep -F "'Version'        => '1.7'" hangar18-manager.php

      - name: Build package and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build/hangar18-manager/assets dist
          cp hangar18-manager.php .build/hangar18-manager/
          cp readme.txt .build/hangar18-manager/
          cp assets/admin.css .build/hangar18-manager/assets/
          cp assets/admin.js .build/hangar18-manager/assets/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"
          export SHA
          python3 -c "import json,os; from datetime import datetime,timezone; m={'schema_version':'1.0','plugin':'hangar18-manager','version':'0.5.3','min_wp':'6.4','min_php':'8.0','published_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'package_path':'dist/hangar18-manager.zip','package_sha256':os.environ['SHA'],'changelog':['Tilføjer brødtekstfont og overskriftsfont pr. element.','Tilføjer individuelle størrelser for brødtekst samt H1, H2 og H3.','Global/0 arver designsystemet og bevarer eksisterende sider.','Løfter page-editor schema kompatibelt til 1.7.']}; open('update.json','w',encoding='utf-8').write(json.dumps(m,ensure_ascii=False,indent=2)+'\\n')"
          rm -rf .build

      - name: Commit validated build and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-v053.yml tools/v053_part1.py tools/v053_runtime.py tools/v053_frontend.py tools/v053_ui.py
          rmdir tools 2>/dev/null || true
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Build Hangar18 Manager 0.5.3 per-element typography'
          git push
