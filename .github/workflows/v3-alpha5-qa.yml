name: V3 Alpha.5 Site Shell QA

on:
  push:
    branches: [v3-alpha5-site-shell]
    paths:
      - '.github/scripts/build_v3_alpha5.py'
      - '.github/workflows/v3-alpha5-qa.yml'
      - 'V3-ALPHA5.md'

jobs:
  alpha5-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock V1 0.1.93 source runtime
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='dc3bad403c764f4ec123a526333a781d05dde491'
          git cat-file -e "${BASELINE}^{commit}"
          git diff --quiet "$BASELINE" -- clean/hangar18-manager
          echo 'V1 source runtime baseline: PASS'

      - name: Retained V1 regression gates
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 .github/scripts/v0192_export_integrity_qa.py
          python3 .github/scripts/v0191_form_design_controls_qa.py
          python3 .github/scripts/v0190_form_wysiwyg_parity_qa.py
          python3 .github/scripts/v0189_manager_cleanup_export_all_qa.py
          python3 .github/scripts/v0186_site_settings_qa.py
          python3 .github/scripts/v0185_editor_live_box_qa.py
          python3 .github/scripts/v0185_event_facts_typography_qa.py
          python3 .github/scripts/v0185_semantic_qa.py
          python3 .github/scripts/v0184_portable_transfer_qa.py
          python3 .github/scripts/v0181_complete_qa.py
          echo 'Retained V1 gates: PASS'

      - name: Build Alpha.5 deterministically
        run: python3 .github/scripts/build_v3_alpha5.py

      - name: Validate true VDM site-shell ownership
        shell: bash
        run: |
          set -euo pipefail
          ROOT='build/visual-designer-manager'
          MAIN="$ROOT/visual-designer-manager.php"
          SHELL="$ROOT/src/Frontend/ThemeShell.php"
          TEMPLATE="$ROOT/templates/vdm-site-shell.php"
          grep -Fq 'Version: 3.0.0-alpha.5' "$MAIN"
          grep -Fq "define('VDM_VERSION', '3.0.0-alpha.5');" "$MAIN"
          grep -Fq "add_filter('template_include', [self::class, 'templateInclude'], 999);" "$SHELL"
          grep -Fq "metadata_exists('post', \$postId, LayoutModel::META)" "$SHELL"
          grep -Fq "VDM_DIR . 'templates/vdm-site-shell.php'" "$SHELL"
          grep -Fq 'wp_head();' "$TEMPLATE"
          grep -Fq 'wp_body_open();' "$TEMPLATE"
          grep -Fq 'the_content();' "$TEMPLATE"
          grep -Fq 'wp_footer();' "$TEMPLATE"
          grep -Fq 'data-vdm-site-shell="active"' "$TEMPLATE"
          if grep -Eq 'get_header\(|get_footer\(|the_title\(' "$TEMPLATE"; then
            echo 'Theme header/footer/title leaked into VDM standalone template.' >&2
            exit 1
          fi
          echo 'True VDM site-shell ownership: PASS'

      - name: Validate Designer/live geometry contract
        shell: bash
        run: |
          set -euo pipefail
          VIEWPORT='build/visual-designer-manager/assets/editor-v0144-viewport.js'
          CORE='build/visual-designer-manager/assets/editor-v018-core.js'
          HEIGHT='build/visual-designer-manager/assets/editor-v0169-canvas-height.js'
          grep -Fq 'desktop: 1920' "$VIEWPORT"
          grep -Fq 'laptop: 1180' "$VIEWPORT"
          grep -Fq 'tablet: 980' "$VIEWPORT"
          grep -Fq 'mobile: 390' "$VIEWPORT"
          grep -Fq "root.style.width = currentWidth + 'px'" "$VIEWPORT"
          grep -Fq "root.style.transform = 'scale(' + currentScale + ')'" "$VIEWPORT"
          grep -Fq "mode = 'fit'" "$VIEWPORT"
          grep -Fq 'function editorScale()' "$CORE"
          grep -Fq 'function editorRowPx()' "$CORE"
          grep -Fq 'function desiredHeight()' "$HEIGHT"
          test "$(sha256sum clean/hangar18-manager/assets/editor-v0144-viewport.js | awk '{print $1}')" = "$(sha256sum "$VIEWPORT" | awk '{print $1}')"
          test "$(sha256sum clean/hangar18-manager/assets/editor-v018-core.js | awk '{print $1}')" = "$(sha256sum "$CORE" | awk '{print $1}')"
          echo 'Designer virtual viewport/Fit contract preserved: PASS'

      - name: Re-prove storage and Designer behavior unchanged
        shell: bash
        run: |
          set -euo pipefail
          JS='build/visual-designer-manager/assets/editor-v018-core.js'
          MIG='build/visual-designer-manager/src/Migration/V3StorageMigration.php'
          grep -Fq 'button.draggable = true;' "$JS"
          grep -Fq "button.addEventListener('dragstart'" "$JS"
          grep -Fq 'surface.ondrop = function' "$JS"
          grep -Fq 'function undo()' "$JS"
          grep -Fq 'function redo()' "$JS"
          grep -Fq 'legacyDataRetained' "$MIG"
          grep -Fq 'migratePrimaryStorage' "$MIG"
          grep -Fq 'migrateModulePosts' "$MIG"
          echo 'Designer/storage preservation: PASS'

      - name: PHP and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find build/visual-designer-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find build/visual-designer-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          echo 'Syntax: PASS'

      - name: Build and inspect installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION='3.0.0-alpha.5'
          mkdir -p dist
          ZIP="dist/visual-designer-manager-v${VERSION}.zip"
          rm -f "$ZIP"
          (cd build && zip -qr "../$ZIP" visual-designer-manager)
          unzip -tq "$ZIP"
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/visual-designer-manager.php$')" = '1'
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/templates/vdm-site-shell.php$')" = '1'
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/src/Frontend/ThemeShell.php$')" = '1'
          echo "SHA256=$(sha256sum "$ZIP" | awk '{print $1}')"
          echo 'Installable ZIP: PASS'
