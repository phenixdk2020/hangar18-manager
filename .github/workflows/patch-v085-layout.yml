name: Patch v0.8.5 layout tools

on:
  push:
    branches:
      - agent/editor-auto-box-table-v085

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', 'Apply v0.8.5 layout patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/editor-auto-box-table-v085
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply controlled patch
        run: python3 .github/scripts/patch_v085_layout.py
      - name: Validate patch
        run: |
          set -euo pipefail
          node --check assets/ultimate-designer-layout-tools.js
          php -l src/Admin/LayoutToolsAdminController.php
          php -l src/Admin/IntegrationAdminBootstrap.php
          bash tests/Architecture/protected-domain-contract.sh
          bash tests/Architecture/v085-layout-table-contract.sh
      - name: Commit patched product files
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/ultimate-designer-layout-tools.js src/Admin/IntegrationAdminBootstrap.php; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/ultimate-designer-layout-tools.js src/Admin/IntegrationAdminBootstrap.php
          git diff --cached --check
          git commit -m 'Apply v0.8.5 layout patch'
          git push origin HEAD:agent/editor-auto-box-table-v085
