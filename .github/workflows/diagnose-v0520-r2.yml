name: Diagnose Hangar18 v0.5.20 r2
on:
  push:
    branches: [qa/v0.5.20-r2]
    paths: ['.github/workflows/diagnose-v0520-r2.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.20-r2
      - name: Run corrected patch and record result
        shell: bash
        run: |
          set +e
          LOG=.github/diagnostics-v0520-r2.txt
          : > "$LOG"
          python3 - <<'PY' >> "$LOG" 2>&1
          from pathlib import Path
          p=Path('.github/scripts/patch_v0520.py');t=p.read_text()
          old="""spacing_panel_tail=\"\"\"                        $this->field('SpacingLargePx', 'Afstand L (px)', $s['SpacingLargePx'], 'number');
                        $this->field('SpacingXlPx', 'Afstand XL (px)', $s['SpacingXlPx'], 'number');
                        ?>
                    </section>
\"\"\""""
          new="""spacing_panel_tail=\"\"\"                        $this->field('SpacingLargePx', 'Afstand L (px)', $s['SpacingLargePx'], 'number');
                        $this->field('SpacingXlPx', 'Afstand XL (px)', $s['SpacingXlPx'], 'number');
                        $this->field('RadiusSmallPx', 'Afrunding S (px)', $s['RadiusSmallPx'], 'number');
                        $this->field('RadiusMediumPx', 'Afrunding M (px)', $s['RadiusMediumPx'], 'number');
                        $this->field('RadiusLargePx', 'Afrunding L (px)', $s['RadiusLargePx'], 'number');
                        ?>
                    </section>
\"\"\""""
          print('admin_anchor_found', old in t)
          if old in t:t=t.replace(old,new,1)
          p.write_text(t)
          PY
          echo '=== PATCH ===' >> "$LOG"
          python3 .github/scripts/patch_v0520.py >> "$LOG" 2>&1
          echo "patch_status=$?" >> "$LOG"
          echo '=== PHP ===' >> "$LOG"
          php -l hangar18-manager.php >> "$LOG" 2>&1
          echo "php_status=$?" >> "$LOG"
          echo '=== JS ===' >> "$LOG"
          node --check assets/admin.js >> "$LOG" 2>&1
          echo "js_status=$?" >> "$LOG"
          echo '=== QA ===' >> "$LOG"
          python3 .github/scripts/qa_v0520.py >> "$LOG" 2>&1
          echo "qa_status=$?" >> "$LOG"
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add "$LOG"
          git commit -m 'QA: record v0.5.20 r2 diagnostic'
          git push origin HEAD:qa/v0.5.20-r2
