name: Visual Designer Manager Dev Artifact

on:
  push:
    branches: [main]
    paths:
      - 'clean-artifact-now.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Visual Designer Manager source
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php .github/scripts/hierarchy_normalizer_qa.php
          if grep -R -n -E 'Hangar18\\UltimateDesigner|ultimate-designer-|EditorLego|save-integrity|saved-layout-rebuild|lego-fixes-v0|lego-resize-v0' clean/hangar18-manager; then
            echo 'Legacy editor dependency found in Visual Designer Manager.' >&2
            exit 1
          fi
      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(php -r '$s=file_get_contents("clean/hangar18-manager/hangar18-manager.php"); if (!preg_match("/Version:\\s*([0-9.]+)/", $s, $m)) { exit(1); } echo $m[1];')"
          ZIP="visual-designer-manager-dev-v${VERSION}.zip"
          rm -f "$ZIP"
          (cd clean && zip -qr "../$ZIP" hangar18-manager)
          unzip -tq "$ZIP"
          sha256sum "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: visual-designer-manager-dev
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.ZIP }}
