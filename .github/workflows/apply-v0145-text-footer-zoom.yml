name: Apply Visual Designer Manager 0.1.45 Text Footer Zoom

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0145-text-footer-zoom.yml'
      - '.github/scripts/apply_v0145_text_footer_zoom.py'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.1.45 patch
        run: python .github/scripts/apply_v0145_text_footer_zoom.py

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Regression and model QA
        shell: bash
        run: |
          set -euo pipefail
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php

      - name: Verify 0.1.45 contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Version: 0.1.45' clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.45'" clean/hangar18-manager/hangar18-manager.php
          grep -q "'verticalAlign' => \$verticalAlign" clean/hangar18-manager/src/Model/LayoutModel.php
          grep -q 'Lodret justering' clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "field === 'verticalAlign'" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q 'justify-content:' clean/hangar18-manager/src/Frontend/Renderer.php
          grep -q "library: { type: 'image' }" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q 'PNG-transparens bevares' clean/hangar18-manager/assets/editor-v018-core.js
          grep -q 'hangar18_manager_site_templates_v1' clean/hangar18-manager/src/Migration/LegacyFooterConverter.php
          grep -q 'hangar18_manager_site_template_assignments_v1' clean/hangar18-manager/src/Migration/LegacyFooterConverter.php
          grep -q 'legacy-visual-builder-assigned' clean/hangar18-manager/src/Migration/LegacyFooterConverter.php
          grep -q 'legacy-manager-standard-fallback' clean/hangar18-manager/src/Migration/LegacyFooterConverter.php
          grep -q 'ikke 1:1-kilde' clean/hangar18-manager/src/Migration/LegacyFooterConverter.php
          grep -q 'MAX_MANUAL_SCALE = 2.0' clean/hangar18-manager/assets/editor-v0144-viewport.js
          grep -q "addEventListener('wheel'" clean/hangar18-manager/assets/editor-v0144-viewport.js
          grep -q 'event.preventDefault()' clean/hangar18-manager/assets/editor-v0144-viewport.js
          grep -q 'scrollLeft' clean/hangar18-manager/assets/editor-v0144-viewport.js
          grep -q 'virtualX' clean/hangar18-manager/assets/editor-v0144-viewport.js
          grep -q 'data-vd-zoom="fit"' clean/hangar18-manager/assets/editor-v0144-viewport.js
          grep -q 'overflow:auto!important' clean/hangar18-manager/assets/editor-v0144.css
          grep -q 'Visual Designer Manager 0.1.45 model QA PASS' .github/scripts/v0125_model_qa.php
          grep -q '"version": "0.1.45"' clean/hangar18-manager/release-history.json
          test -s docs/v0145-status.md
          grep -q 'VD-TEXT-VALIGN-001' CLEAN-TECHNICAL-MANUAL.md
          grep -q 'VD-IMAGE-MIME-001' CLEAN-TECHNICAL-MANUAL.md
          grep -q 'VD-FOOTER-LEGACY-SOURCE-001' CLEAN-TECHNICAL-MANUAL.md
          grep -q 'VD-CANVAS-ZOOM-001' CLEAN-TECHNICAL-MANUAL.md
          grep -q "get_option(self::CUTOVER_OPTION, '0') === '1'" clean/hangar18-manager/src/Frontend/ThemeShell.php

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-implementation-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add \
            clean/hangar18-manager/hangar18-manager.php \
            clean/hangar18-manager/src/Model/LayoutModel.php \
            clean/hangar18-manager/src/Frontend/Renderer.php \
            clean/hangar18-manager/src/Migration/LegacyHeaderConverter.php \
            clean/hangar18-manager/src/Migration/LegacyFooterConverter.php \
            clean/hangar18-manager/src/Admin/GlobalDesignerController.php \
            clean/hangar18-manager/assets/editor-v018-core.js \
            clean/hangar18-manager/assets/editor-v0144-viewport.js \
            clean/hangar18-manager/assets/editor-v0144.css \
            .github/scripts/v0125_model_qa.php \
            clean/hangar18-manager/release-history.json \
            clean-release-notes.html \
            docs/v0145-status.md \
            CLEAN-TECHNICAL-MANUAL.md
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Implement text alignment Footer migration and canvas zoom in v0.1.45'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
