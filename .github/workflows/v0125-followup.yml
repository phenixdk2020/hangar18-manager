name: Visual Designer Manager 0.1.25 Integration QA

on:
  push:
    branches: [main]
    paths:
      - 'v0125-followup-now.txt'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.1.25 integration follow-up fixes
        run: python .github/scripts/v0125_followup.py

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Canonical hierarchy QA
        run: php .github/scripts/hierarchy_normalizer_qa.php

      - name: 0.1.25 model migration and Button QA
        run: php .github/scripts/v0125_model_qa.php

      - name: Verify integration follow-up
        shell: bash
        run: |
          set -euo pipefail
          grep -q "userEntered.value = '0'" clean/hangar18-manager/assets/editor-v0123-ux.js
          grep -q 'augmentAutomaticNote();' clean/hangar18-manager/assets/editor-v0125.js
          ! grep -q 'setTimeout(augmentAutomaticNote' clean/hangar18-manager/assets/editor-v0125.js
          grep -q 'h18-clean-version-actions' clean/hangar18-manager/src/Admin/EditorController.php
          ! grep -q 'h18-Visual Designer-version-actions' clean/hangar18-manager/src/Admin/EditorController.php
          grep -q "function_exists('mb_substr')" clean/hangar18-manager/src/Model/TemplateLayoutModel.php

      - name: Commit QA-passed follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-qa-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager
          if git diff --cached --quiet; then
            echo 'Follow-up source already applied.'
            exit 0
          fi
          git commit -m 'Harden Visual Designer Manager 0.1.25 integration'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
