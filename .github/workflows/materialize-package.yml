name: Materialize Hangar18 package

on:
  push:
    branches:
      - main
    paths:
      - 'package-parts/**'
      - 'update.json'
      - '.github/workflows/materialize-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat package-parts/part-*.b64 | base64 --decode > dist/hangar18-manager.zip
          echo "ae6a873759b1a3a07ae068a59d97af7b701d470b5ccc84dab36b72e45477130c  dist/hangar18-manager.zip" | sha256sum -c -

      - name: Commit materialized package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hangar18-build"
          git config user.email "actions@users.noreply.github.com"
          git add dist/hangar18-manager.zip
          if git diff --cached --quiet; then
            echo "Package is already current."
            exit 0
          fi
          git commit -m "Materialize Hangar18 Manager 0.4.1 package"
          git push
