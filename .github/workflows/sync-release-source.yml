name: Build Hangar18 Manager 0.5.24 candidate

on:
  push:
    branches:
      - qa/v0.5.24-release
    paths:
      - '.github/workflows/sync-release-source.yml'

permissions:
  contents: write

jobs:
  build-v0524:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.24-release
          fetch-depth: 0
      - name: Patch and source QA
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_v0524.py
          php -l hangar18-manager.php
          node --check assets/admin.js
          python3 .github/scripts/qa_v0524.py
      - name: Build and verify package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build .verify
          mkdir -p .build/hangar18-manager/assets dist
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp assets/admin.css assets/admin.js .build/hangar18-manager/assets/
          rm -f dist/hangar18-manager.zip
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          SHA=$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')
          python3 - "$SHA" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          sha=sys.argv[1]
          data={
            'schema_version':'1.0','plugin':'hangar18-manager','version':'0.5.24','min_wp':'6.4','min_php':'8.0',
            'published_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'package_path':'dist/hangar18-manager.zip','package_sha256':sha,
            'changelog':[
              'Tilføjer E5 UD-053 current data context pr. Hangar18-side.',
              'Title, Content, MediaId og knaptekst/links kan bindes typevalideret til custom data fields.',
              'Static elementværdier bevares som fallback og overskrives kun ved gyldig runtime binding.',
              'Runtime genvaliderer datatype, entry, field og property-type; URL og media saniteres separat.',
              'Canvas-preview bruger samme current context og viser dynamiske medier.',
              'Bindings bevares i Patterns, linked component definitions og Page Templates uden entry-identitet.',
              'Page-editor schema løftes bagudkompatibelt til 1.19.'
            ]
          }
          open('update.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          mkdir .verify
          unzip -q dist/hangar18-manager.zip -d .verify
          php -l .verify/hangar18-manager/hangar18-manager.php
          node --check .verify/hangar18-manager/assets/admin.js
          cmp hangar18-manager.php .verify/hangar18-manager/hangar18-manager.php
          cmp readme.txt .verify/hangar18-manager/readme.txt
          cmp assets/admin.css .verify/hangar18-manager/assets/admin.css
          cmp assets/admin.js .verify/hangar18-manager/assets/admin.js
          test "$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')" = "$(python3 -c "import json;print(json.load(open('update.json'))['package_sha256'])")"
          rm -rf .build .verify
      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add hangar18-manager.php assets/admin.js assets/admin.css readme.txt update.json dist/hangar18-manager.zip
          git commit -m 'Release Hangar18 Manager 0.5.24 candidate'
          git push origin HEAD:qa/v0.5.24-release
