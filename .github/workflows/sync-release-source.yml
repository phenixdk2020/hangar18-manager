name: Verify Hangar18 Manager 0.5.30

on:
  push:
    branches:
      - qa/v0.5.30-final
    paths:
      - '.github/workflows/sync-release-source.yml'

permissions:
  contents: write

jobs:
  verify-v0530:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.30-final
          fetch-depth: 0
      - name: Verify package, source and UD-059 semantics
        run: |
          set -euo pipefail
          TARGET=8156af91924b86370d1b7b7d9420bbe90120b33e
          VERSION=$(python3 -c "import json;print(json.load(open('update.json'))['version'])")
          EXPECTED=$(python3 -c "import json;print(json.load(open('update.json'))['package_sha256'])")
          ACTUAL=$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')
          test "$VERSION" = "0.5.30"; test "$EXPECTED" = "$ACTUAL"
          rm -rf .verify && mkdir .verify; unzip -t dist/hangar18-manager.zip; unzip -q dist/hangar18-manager.zip -d .verify
          php -l .verify/hangar18-manager/hangar18-manager.php; node --check .verify/hangar18-manager/assets/admin.js
          cmp hangar18-manager.php .verify/hangar18-manager/hangar18-manager.php; cmp readme.txt .verify/hangar18-manager/readme.txt; cmp assets/admin.css .verify/hangar18-manager/assets/admin.css; cmp assets/admin.js .verify/hangar18-manager/assets/admin.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hangar18-manager.php').read_text();j=Path('assets/admin.js').read_text()
          checks={'schema':"'Version'        => '1.22'" in p,'options':'normalize_dynamic_binding_options' in p,'format':'dynamic_binding_format_value' in p,'fallback':'FallbackWhenEmpty' in p and 'apply_dynamic_binding_fallback' in p,'sanitize':'apply_dynamic_binding_output' in p,'preview':'bindingPreviewFormatV0530' in j and 'bindingPreviewFallbackV0530' in j,'preset':'data.BindingOptions = bindingOptions' in j}
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(repr(bad))
          PY
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v0.5.30 >/dev/null; then test "$(git rev-list -n1 v0.5.30)" = "$TARGET"; else git tag v0.5.30 "$TARGET"; git push origin refs/tags/v0.5.30; fi
          TAG_SHA=$(git rev-list -n1 v0.5.30)
          printf 'PASS\nversion=%s\npackage_sha256=%s\nrelease_commit=%s\ntag_commit=%s\n' "$VERSION" "$ACTUAL" "$TARGET" "$TAG_SHA" > .github/v0530-final-qa.txt
          rm -rf .verify
      - name: Persist QA result
        run: |
          git config user.name hangar18-build; git config user.email actions@users.noreply.github.com; git add .github/v0530-final-qa.txt; git commit -m 'QA: v0.5.30 final package and tag verified'; git push origin HEAD:qa/v0.5.30-final
