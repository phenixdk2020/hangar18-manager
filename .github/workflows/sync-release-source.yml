name: Inspect Hangar18 Manager 0.5.27 date format

on:
  push:
    branches:
      - qa/v0.5.27-date-check
    paths:
      - '.github/workflows/sync-release-source.yml'

permissions:
  contents: write

jobs:
  date-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.27-date-check
          fetch-depth: 0
      - name: Generate and inspect date engine
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_v0527.py
          python3 .github/scripts/patch_v0527.py
          python3 .github/scripts/harden_v0527.py
          python3 - <<'PY' > .github/v0527-date-check.txt
          from pathlib import Path
          p=Path('hangar18-manager.php').read_text()
          s=p.index('private function page_condition_datetime_timestamp')
          e=p.index('private function page_condition_value_is_empty',s)
          print(p[s:e])
          PY
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add .github/v0527-date-check.txt
          git commit -m 'QA: record v0.5.27 generated date engine'
          git push origin HEAD:qa/v0.5.27-date-check
