name: Verify Hangar18 Manager 0.5.29

on:
  push:
    branches:
      - qa/v0.5.29-final
    paths:
      - '.github/workflows/sync-release-source.yml'

permissions:
  contents: write

jobs:
  verify-v0529:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.29-final
          fetch-depth: 0
      - name: Verify package, source and UD-056 semantics
        shell: bash
        run: |
          set -euo pipefail
          TARGET=99c0f6ff91a505aea4f6229cfef6157a8a36747d
          VERSION=$(python3 -c "import json;print(json.load(open('update.json'))['version'])")
          EXPECTED=$(python3 -c "import json;print(json.load(open('update.json'))['package_sha256'])")
          ACTUAL=$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')
          test "$VERSION" = "0.5.29"; test "$EXPECTED" = "$ACTUAL"
          rm -rf .verify && mkdir .verify; unzip -t dist/hangar18-manager.zip; unzip -q dist/hangar18-manager.zip -d .verify
          php -l .verify/hangar18-manager/hangar18-manager.php; node --check .verify/hangar18-manager/assets/admin.js
          cmp hangar18-manager.php .verify/hangar18-manager/hangar18-manager.php; cmp readme.txt .verify/hangar18-manager/readme.txt; cmp assets/admin.css .verify/hangar18-manager/assets/admin.css; cmp assets/admin.js .verify/hangar18-manager/assets/admin.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hangar18-manager.php').read_text(); j=Path('assets/admin.js').read_text()
          checks={'taxonomy':'DATA_TAG_TAXONOMY' in p and 'register_taxonomy(self::DATA_TAG_TAXONOMY' in p,'shortcode':"hangar18_data_query_advanced" in p,'groups':'normalize_advanced_data_query' in p and 'GroupRelation' in p,'relation':"$field_type==='relation'?['eq','neq']" in p,'runner':'run_advanced_data_query' in p and "'post_status'=>'publish'" in p,'pagination':"$page_param='h18q_'.$hash" in p,'no raw sql':'$wpdb' not in p[p.index('private function normalize_advanced_data_query'):p.index('public function render_data()',p.index('private function normalize_advanced_data_query'))],'builder':'/* v0.5.29 – UD-056 Advanced Query */' in j}
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(repr(bad))
          PY
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v0.5.29 >/dev/null; then test "$(git rev-list -n1 v0.5.29)" = "$TARGET"; else git tag v0.5.29 "$TARGET"; git push origin refs/tags/v0.5.29; fi
          TAG_SHA=$(git rev-list -n1 v0.5.29)
          printf 'PASS\nversion=%s\npackage_sha256=%s\nrelease_commit=%s\ntag_commit=%s\n' "$VERSION" "$ACTUAL" "$TARGET" "$TAG_SHA" > .github/v0529-final-qa.txt
          rm -rf .verify
      - name: Persist QA result
        run: |
          git config user.name hangar18-build; git config user.email actions@users.noreply.github.com; git add .github/v0529-final-qa.txt; git commit -m 'QA: v0.5.29 final package and tag verified'; git push origin HEAD:qa/v0.5.29-final
