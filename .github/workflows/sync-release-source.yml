name: Sync Hangar18 release source

on:
  push:
    branches:
      - qa/v0.5.21-release
    paths:
      - '.github/workflows/sync-release-source.yml'

permissions:
  contents: write

jobs:
  release-v0521:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.21-release
          fetch-depth: 0
      - name: Release candidate r3
        run: python3 .github/scripts/release_v0521.py
