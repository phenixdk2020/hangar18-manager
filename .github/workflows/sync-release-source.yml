name: Sync Hangar18 release source

on:
  push:
    branches:
      - qa/v0.5.20-release-check
    paths:
      - '.github/workflows/sync-release-source.yml'

permissions:
  contents: write

jobs:
  release-v0520:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.20-release-check
          fetch-depth: 0
      - run: python3 .github/scripts/release_v0520_stable.py
