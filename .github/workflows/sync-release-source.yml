name: Build Hangar18 Manager 0.5.27 candidate

on:
  push:
    branches:
      - qa/v0.5.27-release
    paths:
      - '.github/workflows/sync-release-source.yml'

permissions:
  contents: write

jobs:
  build-v0527:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.27-release
          fetch-depth: 0
      - name: Patch and source QA
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_v0527.py
          python3 .github/scripts/patch_v0527.py
          python3 .github/scripts/harden_v0527.py
          python3 .github/scripts/prepare_qa_v0527.py
          php -l hangar18-manager.php
          node --check assets/admin.js
          python3 .github/scripts/qa_v0527.py
      - name: Build and verify package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build .verify
          mkdir -p .build/hangar18-manager/assets dist
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp assets/admin.css assets/admin.js .build/hangar18-manager/assets/
          rm -f dist/hangar18-manager.zip
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          SHA=$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')
          python3 - "$SHA" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          sha=sys.argv[1]
          data={
            'schema_version':'1.0','plugin':'hangar18-manager','version':'0.5.27','min_wp':'6.4','min_php':'8.0',
            'published_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'package_path':'dist/hangar18-manager.zip','package_sha256':sha,
            'changelog':[
              'Tilføjer E5 UD-058 Conditional Visibility på alle page-builder elementer.',
              'Data conditions understøtter empty/not-empty, equality og numeriske/dato-sammenligninger mod current data context.',
              'User conditions understøtter logged in/out, rolle og capability.',
              'Date/time conditions evalueres før/efter/mellem i WordPress-site timezone.',
              'Conditions evalueres server-side før dynamic binding og virker pr. resultat inde i Query Lists.',
              'Editor-preview markerer condition-skjulte elementer uden at fjerne dem fra canvas.',
              'Conditions er præsentationslogik og ikke en authorization/security boundary.',
              'Page-editor schema løftes bagudkompatibelt til 1.21.'
            ]
          }
          open('update.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          mkdir .verify
          unzip -q dist/hangar18-manager.zip -d .verify
          php -l .verify/hangar18-manager/hangar18-manager.php
          node --check .verify/hangar18-manager/assets/admin.js
          cmp hangar18-manager.php .verify/hangar18-manager/hangar18-manager.php
          cmp readme.txt .verify/hangar18-manager/readme.txt
          cmp assets/admin.css .verify/hangar18-manager/assets/admin.css
          cmp assets/admin.js .verify/hangar18-manager/assets/admin.js
          test "$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')" = "$(python3 -c "import json;print(json.load(open('update.json'))['package_sha256'])")"
          rm -rf .build .verify
      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add hangar18-manager.php assets/admin.js assets/admin.css readme.txt update.json dist/hangar18-manager.zip
          git commit -m 'Release Hangar18 Manager 0.5.27 candidate'
          git push origin HEAD:qa/v0.5.27-release
