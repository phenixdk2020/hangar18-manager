name: Verify Hangar18 Manager 0.5.25

on:
  push:
    branches:
      - qa/v0.5.25-final
    paths:
      - '.github/workflows/sync-release-source.yml'

permissions:
  contents: write

jobs:
  verify-v0525:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.25-final
          fetch-depth: 0
      - name: Verify package, source and UD-055 semantics
        shell: bash
        run: |
          set -euo pipefail
          TARGET=47ed95227ec8f904aeb645fda39e036e875ac4cd
          VERSION=$(python3 -c "import json;print(json.load(open('update.json'))['version'])")
          EXPECTED=$(python3 -c "import json;print(json.load(open('update.json'))['package_sha256'])")
          ACTUAL=$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')
          test "$VERSION" = "0.5.25"
          test "$EXPECTED" = "$ACTUAL"
          rm -rf .verify && mkdir .verify
          unzip -t dist/hangar18-manager.zip
          unzip -q dist/hangar18-manager.zip -d .verify
          php -l .verify/hangar18-manager/hangar18-manager.php
          node --check .verify/hangar18-manager/assets/admin.js
          cmp hangar18-manager.php .verify/hangar18-manager/hangar18-manager.php
          cmp readme.txt .verify/hangar18-manager/readme.txt
          cmp assets/admin.css .verify/hangar18-manager/assets/admin.css
          cmp assets/admin.js .verify/hangar18-manager/assets/admin.js
          python3 - <<'PY'
          from pathlib import Path
          php=Path('hangar18-manager.php').read_text()
          checks={
            'schema': "'Version'        => '1.19'" in php,
            'core': 'private function run_custom_data_query' in php,
            'same core': '$this->run_custom_data_query($qb_raw, $qb_normalized)' in php and '$this->run_custom_data_query($atts, $normalized)' in php,
            'publish only': "'post_status' => 'publish'" in php,
            'no SQL': '$wpdb' not in php[php.index('private function custom_data_query_operator_map'):php.index('public function render_data()',php.index('private function custom_data_query_operator_map'))],
            'limit': "$this->clamp_int($raw['Limit']" in php,
            'field validation': '!isset($field_map[$field_key])' in php and 'isset($field_map[$sort_field])' in php,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('v0.5.25 semantic QA failed: '+repr(failed))
          print('v0.5.25 semantic QA passed')
          PY
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v0.5.25 >/dev/null; then
            TAG_SHA=$(git rev-list -n1 v0.5.25)
            test "$TAG_SHA" = "$TARGET"
          else
            git tag v0.5.25 "$TARGET"
            git push origin refs/tags/v0.5.25
          fi
          TAG_SHA=$(git rev-list -n1 v0.5.25)
          printf 'PASS\nversion=%s\npackage_sha256=%s\nrelease_commit=%s\ntag_commit=%s\n' "$VERSION" "$ACTUAL" "$TARGET" "$TAG_SHA" > .github/v0525-final-qa.txt
          rm -rf .verify
      - name: Persist QA result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add .github/v0525-final-qa.txt
          git commit -m 'QA: v0.5.25 final package and tag verified'
          git push origin HEAD:qa/v0.5.25-final
