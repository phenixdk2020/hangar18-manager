name: Verify Hangar18 Manager 0.5.27

on:
  push:
    branches:
      - qa/v0.5.27-final
    paths:
      - '.github/workflows/sync-release-source.yml'

permissions:
  contents: write

jobs:
  verify-v0527:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.27-final
          fetch-depth: 0
      - name: Verify package, source and UD-058 semantics
        shell: bash
        run: |
          set -euo pipefail
          TARGET=fd5f303d00caafd6d545a1f6c712d968161cafd7
          VERSION=$(python3 -c "import json;print(json.load(open('update.json'))['version'])")
          EXPECTED=$(python3 -c "import json;print(json.load(open('update.json'))['package_sha256'])")
          ACTUAL=$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')
          test "$VERSION" = "0.5.27"
          test "$EXPECTED" = "$ACTUAL"
          rm -rf .verify && mkdir .verify
          unzip -t dist/hangar18-manager.zip
          unzip -q dist/hangar18-manager.zip -d .verify
          php -l .verify/hangar18-manager/hangar18-manager.php
          node --check .verify/hangar18-manager/assets/admin.js
          cmp hangar18-manager.php .verify/hangar18-manager/hangar18-manager.php
          cmp readme.txt .verify/hangar18-manager/readme.txt
          cmp assets/admin.css .verify/hangar18-manager/assets/admin.css
          cmp assets/admin.js .verify/hangar18-manager/assets/admin.js
          python3 - <<'PY'
          from pathlib import Path
          php=Path('hangar18-manager.php').read_text(); js=Path('assets/admin.js').read_text()
          checks={
            'schema': "'Version'        => '1.21'" in php,
            'normalizer': 'private function normalize_page_conditions' in php,
            'data': "$type === 'data'" in php and 'page_condition_value_is_empty' in php,
            'user': "$type === 'user'" in php and 'current_user_can($value)' in php,
            'date': "$type === 'date'" in php and 'wp_timezone()' in php,
            'runtime order': php.index('evaluate_page_conditions',php.index('private function render_page_editor_section_front')) < php.index('apply_dynamic_bindings_to_section',php.index('private function render_page_editor_section_front')),
            'query context': '$this->active_dynamic_data_context = $context;' in php,
            'editor': 'evaluateConditionPreviewV0527' in js and 'Skjult af conditions' in js,
            'no expressions': 'new Function' not in js[js.index('/* v0.5.27 – UD-058 Conditional Visibility */'):],
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('v0.5.27 semantic QA failed: '+repr(failed))
          print('v0.5.27 semantic QA passed')
          PY
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v0.5.27 >/dev/null; then
            TAG_SHA=$(git rev-list -n1 v0.5.27)
            test "$TAG_SHA" = "$TARGET"
          else
            git tag v0.5.27 "$TARGET"
            git push origin refs/tags/v0.5.27
          fi
          TAG_SHA=$(git rev-list -n1 v0.5.27)
          printf 'PASS\nversion=%s\npackage_sha256=%s\nrelease_commit=%s\ntag_commit=%s\n' "$VERSION" "$ACTUAL" "$TARGET" "$TAG_SHA" > .github/v0527-final-qa.txt
          rm -rf .verify
      - name: Persist QA result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add .github/v0527-final-qa.txt
          git commit -m 'QA: v0.5.27 final package and tag verified'
          git push origin HEAD:qa/v0.5.27-final
