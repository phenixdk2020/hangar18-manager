name: Verify Hangar18 Manager 0.5.28

on:
  push:
    branches:
      - qa/v0.5.28-final
    paths:
      - '.github/workflows/sync-release-source.yml'

permissions:
  contents: write

jobs:
  verify-v0528:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.28-final
          fetch-depth: 0
      - name: Verify package, source and UD-054 semantics
        shell: bash
        run: |
          set -euo pipefail
          TARGET=3633e39d4ad32eda4b4d51373e331ff4337f9d24
          VERSION=$(python3 -c "import json;print(json.load(open('update.json'))['version'])")
          EXPECTED=$(python3 -c "import json;print(json.load(open('update.json'))['package_sha256'])")
          ACTUAL=$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')
          test "$VERSION" = "0.5.28"; test "$EXPECTED" = "$ACTUAL"
          rm -rf .verify && mkdir .verify; unzip -t dist/hangar18-manager.zip; unzip -q dist/hangar18-manager.zip -d .verify
          php -l .verify/hangar18-manager/hangar18-manager.php; node --check .verify/hangar18-manager/assets/admin.js
          cmp hangar18-manager.php .verify/hangar18-manager/hangar18-manager.php; cmp readme.txt .verify/hangar18-manager/readme.txt; cmp assets/admin.css .verify/hangar18-manager/assets/admin.css; cmp assets/admin.js .verify/hangar18-manager/assets/admin.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hangar18-manager.php').read_text(); j=Path('assets/admin.js').read_text()
          checks={'schema2':"'SchemaVersion' => 2" in p,'relation':'RelationTargetType' in p and 'custom_data_relation_schema_usage' in p,'group':"$type === 'group'" in p,'repeater':"$type === 'repeater'" in p and 'RepeaterMaxItems' in p,'nested':'custom_data_nested_field_types' in p and 'sanitize_custom_data_nested_values' in p,'ui':'h18-data-repeater-add' in j}
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(repr(bad))
          PY
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v0.5.28 >/dev/null; then test "$(git rev-list -n1 v0.5.28)" = "$TARGET"; else git tag v0.5.28 "$TARGET"; git push origin refs/tags/v0.5.28; fi
          TAG_SHA=$(git rev-list -n1 v0.5.28)
          printf 'PASS\nversion=%s\npackage_sha256=%s\nrelease_commit=%s\ntag_commit=%s\n' "$VERSION" "$ACTUAL" "$TARGET" "$TAG_SHA" > .github/v0528-final-qa.txt
          rm -rf .verify
      - name: Persist QA result
        run: |
          git config user.name hangar18-build; git config user.email actions@users.noreply.github.com; git add .github/v0528-final-qa.txt; git commit -m 'QA: v0.5.28 final package and tag verified'; git push origin HEAD:qa/v0.5.28-final
