name: Verify Hangar18 Manager 0.5.24

on:
  push:
    branches:
      - qa/v0.5.24-final
    paths:
      - '.github/workflows/sync-release-source.yml'

permissions:
  contents: write

jobs:
  verify-v0524:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.24-final
          fetch-depth: 0
      - name: Verify package, source and UD-053 semantics
        shell: bash
        run: |
          set -euo pipefail
          TARGET=ca78ee1a84246eb4c7f693e6512938dd7b11cb7f
          VERSION=$(python3 -c "import json;print(json.load(open('update.json'))['version'])")
          EXPECTED=$(python3 -c "import json;print(json.load(open('update.json'))['package_sha256'])")
          ACTUAL=$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')
          test "$VERSION" = "0.5.24"
          test "$EXPECTED" = "$ACTUAL"
          rm -rf .verify && mkdir .verify
          unzip -t dist/hangar18-manager.zip
          unzip -q dist/hangar18-manager.zip -d .verify
          php -l .verify/hangar18-manager/hangar18-manager.php
          node --check .verify/hangar18-manager/assets/admin.js
          cmp hangar18-manager.php .verify/hangar18-manager/hangar18-manager.php
          cmp readme.txt .verify/hangar18-manager/readme.txt
          cmp assets/admin.css .verify/hangar18-manager/assets/admin.css
          cmp assets/admin.js .verify/hangar18-manager/assets/admin.js
          python3 - <<'PY'
          from pathlib import Path
          php=Path('hangar18-manager.php').read_text()
          js=Path('assets/admin.js').read_text()
          checks={
            'schema': "'Version'        => '1.19'" in php,
            'context': 'resolve_dynamic_data_context' in php and "'DataContextType'" in php and "'DataContextEntryId'" in php,
            'bindings': 'normalize_dynamic_bindings' in php and 'apply_dynamic_bindings_to_section' in php,
            'type safety': "'MediaId' => ['media']" in php and "'Button1Url' => ['text']" in php,
            'sanitizers': '$section[$property] = absint($value);' in php and '$section[$property] = esc_url_raw($text);' in php,
            'preview': 'dynamicPreviewBindingV0524' in js and "fieldName === 'MediaUrl'" in js,
            'serialization': 'data.Bindings = bindings;' in js and 'presetData.Bindings' in js,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('v0.5.24 semantic QA failed: '+repr(failed))
          print('v0.5.24 semantic QA passed')
          PY
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v0.5.24 >/dev/null; then
            TAG_SHA=$(git rev-list -n1 v0.5.24)
            test "$TAG_SHA" = "$TARGET"
          else
            git tag v0.5.24 "$TARGET"
            git push origin refs/tags/v0.5.24
          fi
          TAG_SHA=$(git rev-list -n1 v0.5.24)
          printf 'PASS\nversion=%s\npackage_sha256=%s\nrelease_commit=%s\ntag_commit=%s\n' "$VERSION" "$ACTUAL" "$TARGET" "$TAG_SHA" > .github/v0524-final-qa.txt
          rm -rf .verify
      - name: Persist QA result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add .github/v0524-final-qa.txt
          git commit -m 'QA: v0.5.24 final package and tag verified'
          git push origin HEAD:qa/v0.5.24-final
