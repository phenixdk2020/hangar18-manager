name: Verify Hangar18 Manager 0.5.23

on:
  push:
    branches:
      - qa/v0.5.23-final
    paths:
      - '.github/workflows/sync-release-source.yml'

permissions:
  contents: write

jobs:
  verify-v0523:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.23-final
          fetch-depth: 0
      - name: Verify package, source and data-engine semantics
        shell: bash
        run: |
          set -euo pipefail
          TARGET=bdb3d1c9f6ed6f2bfbfc7693d198407ff97c7f21
          VERSION=$(python3 -c "import json;print(json.load(open('update.json'))['version'])")
          EXPECTED=$(python3 -c "import json;print(json.load(open('update.json'))['package_sha256'])")
          ACTUAL=$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')
          test "$VERSION" = "0.5.23"
          test "$EXPECTED" = "$ACTUAL"
          rm -rf .verify && mkdir .verify
          unzip -t dist/hangar18-manager.zip
          unzip -q dist/hangar18-manager.zip -d .verify
          php -l .verify/hangar18-manager/hangar18-manager.php
          node --check .verify/hangar18-manager/assets/admin.js
          cmp hangar18-manager.php .verify/hangar18-manager/hangar18-manager.php
          cmp readme.txt .verify/hangar18-manager/readme.txt
          cmp assets/admin.css .verify/hangar18-manager/assets/admin.css
          cmp assets/admin.js .verify/hangar18-manager/assets/admin.js
          python3 - <<'PY'
          from pathlib import Path
          php=Path('hangar18-manager.php').read_text()
          checks={
            'schema builder': 'normalize_custom_data_type' in php,
            'field types': all(x in php for x in ["'text' => 'Tekst'","'number' => 'Tal'","'bool' => 'Ja/nej'","'date' => 'Dato'","'media' => 'Medie / billede'"]),
            'schema cap': "current_user_can('manage_options')" in php,
            'entry CRUD': all(x in php for x in ['handle_save_data_entry','handle_delete_data_entry','custom_data_entry_for_type']),
            'query meta': "'_h18_field_' . sanitize_key" in php,
            'media validation': "$attachment->post_type !== 'attachment'" in php,
            'delete guard': 'custom_data_entry_count($key)' in php,
            'page schema unchanged': "'Version'        => '1.18'" in php and "'Version'        => '1.19'" not in php,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('v0.5.23 semantic QA failed: '+repr(failed))
          print('v0.5.23 semantic QA passed')
          PY
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v0.5.23 >/dev/null; then
            TAG_SHA=$(git rev-list -n1 v0.5.23)
            test "$TAG_SHA" = "$TARGET"
          else
            git tag v0.5.23 "$TARGET"
            git push origin refs/tags/v0.5.23
          fi
          TAG_SHA=$(git rev-list -n1 v0.5.23)
          printf 'PASS\nversion=%s\npackage_sha256=%s\nrelease_commit=%s\ntag_commit=%s\n' "$VERSION" "$ACTUAL" "$TARGET" "$TAG_SHA" > .github/v0523-final-qa.txt
          rm -rf .verify
      - name: Persist QA result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add .github/v0523-final-qa.txt
          git commit -m 'QA: v0.5.23 final package and tag verified'
          git push origin HEAD:qa/v0.5.23-final
