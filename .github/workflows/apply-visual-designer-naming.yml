name: Apply Visual Designer Naming

on:
  push:
    branches: [main]
    paths:
      - 'visual-designer-naming-now.txt'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply public naming migration
        run: python .github/scripts/apply_visual_designer_naming.py

      - name: Verify PHP and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php .github/scripts/hierarchy_normalizer_qa.php

      - name: Commit naming migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-migration-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          # GitHub App tokens used by Actions may not update workflow files.
          # Those are updated separately through the GitHub connector.
          git restore --source=HEAD -- .github/workflows
          git add -A
          if git diff --cached --quiet; then
            echo 'Naming already current.'
            exit 0
          fi
          git commit -m 'Apply Visual Designer product naming'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'Unable to publish naming migration.' >&2
          exit 1
