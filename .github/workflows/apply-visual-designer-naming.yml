name: Apply Visual Designer Naming

on:
  push:
    branches: [main]
    paths:
      - 'visual-designer-naming-now.txt'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair technical documentation references
        run: python .github/scripts/fix_visual_designer_technical_refs.py

      - name: Verify Visual Designer Manager source and documentation
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php .github/scripts/hierarchy_normalizer_qa.php
          python .github/scripts/fix_visual_designer_technical_refs.py
          if grep -R -n -E 'Hangar18 Manager Clean|Hangar18 Designer|Clean Manager v|Clean editor |Clean layout gemt|Clean-sider|Ikke Clean' clean/hangar18-manager; then
            echo 'Obsolete public product naming found in Visual Designer Manager source.' >&2
            exit 1
          fi

      - name: Commit documentation repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-migration-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Naming and technical references already current.'
            exit 0
          fi
          git commit -m 'Finalize Visual Designer naming references'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'Unable to publish naming reference repair.' >&2
          exit 1
