name: Visual Designer Manager Release

on:
  push:
    branches: [main]
    paths:
      - 'clean-release-now.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(php -r '$s=file_get_contents("clean/hangar18-manager/hangar18-manager.php"); if (!preg_match("/Version:\\s*([0-9]+\\.[0-9]+\\.[0-9]+)/", $s, $m)) exit(2); echo $m[1];')"
          grep -q "H18_CLEAN_VERSION', '$VERSION'" clean/hangar18-manager/hangar18-manager.php
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Visual Designer Manager version: $VERSION"

      - name: Verify Visual Designer Manager source
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php
          # 0.1.26 WYSIWYG / typography / persistence release gates.
          grep -q "headingFontFamily" clean/hangar18-manager/src/Model/LayoutModel.php
          grep -q "headingFontSize" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "rememberSelection" clean/hangar18-manager/assets/editor-v0125.js
          grep -q "manualW" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "manualH" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "autoSize" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "autoFitButtons" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "nl2br" clean/hangar18-manager/src/Frontend/Renderer.php
          grep -q "editor labels are chrome" clean/hangar18-manager/assets/editor-v0123-ux.css
          grep -q "overscroll-behavior:contain" clean/hangar18-manager/assets/editor-v0123-ux.css
          # 0.1.29/0.1.30 parent-relative floating Button release gates.
          grep -q "placementMode" clean/hangar18-manager/src/Model/LayoutModel.php
          grep -q "zIndex" clean/hangar18-manager/src/Model/LayoutModel.php
          grep -q "function isFloatingButton(node).*node.props.*placementMode.*overlay" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "zone = 'overlay'" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "position = 'absolute'" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "function isFloatingButton(node).*node.props.*placementMode.*overlay" clean/hangar18-manager/assets/editor-v0121.js
          grep -q "h18-clean-front-button--floating" clean/hangar18-manager/src/Frontend/Renderer.php
          grep -q "layoutStyle = 'position:absolute" clean/hangar18-manager/src/Frontend/Renderer.php
          grep -q "bool \$floating" clean/hangar18-manager/src/Frontend/ResponsiveRenderer.php
          grep -q "=== 'button'.*placementMode.*overlay" clean/hangar18-manager/src/Frontend/ResponsiveRenderer.php
          grep -q "position:absolute!important" clean/hangar18-manager/src/Frontend/ResponsiveRenderer.php
          grep -q "position:relative" clean/hangar18-manager/src/Frontend/Renderer.php
          grep -q "aldrig position:fixed" clean/hangar18-manager/readme.txt
          # 0.1.30 Inspector / rich text / update-checkpoint gates.
          grep -q "height:calc(100dvh - 102px)" clean/hangar18-manager/assets/editor-v0123-ux.css
          grep -q "font-weight:400" clean/hangar18-manager/assets/editor-v0125.css
          grep -q "styleWithCSS" clean/hangar18-manager/assets/editor-v0125.js
          grep -q "createDesignerCheckpoint" clean/hangar18-manager/src/Update/GitHubUpdater.php
          grep -q "programBackups" clean/hangar18-manager/src/Update/GitHubUpdater.php
          grep -q "releaseHistory" clean/hangar18-manager/src/Update/GitHubUpdater.php
          grep -q "Update-checkpoints" clean/hangar18-manager/src/Admin/AdminController.php
          grep -q "Versionshistorik" clean/hangar18-manager/src/Admin/AdminController.php
          test -s clean/hangar18-manager/release-history.json
          grep -q '"version": "0.1.30"' clean/hangar18-manager/release-history.json
          if grep -n "Gem clean layout" clean/hangar18-manager/assets/editor-v018-core.js clean/hangar18-manager/assets/editor-v0123-ux.js clean/hangar18-manager/assets/editor-v0125.js; then
            echo 'Obsolete generic Clean save note remains in active editor runtime.' >&2
            exit 1
          fi
          test -s clean/hangar18-manager/assets/admin-v019.css
          test -s clean/hangar18-manager/assets/editor-v0125.js
          test -s clean/hangar18-manager/assets/editor-v0125.css
          test -s clean/hangar18-manager/src/Model/TemplateLayoutModel.php
          if grep -R -n -E 'Hangar18\\UltimateDesigner|ultimate-designer-|EditorLego|save-integrity|saved-layout-rebuild|lego-fixes-v0|lego-resize-v0' clean/hangar18-manager; then
            echo 'Legacy editor runtime dependency found in Visual Designer Manager.' >&2
            exit 1
          fi
          if grep -R -n -E 'Hangar18 Manager Clean|Hangar18 Designer|Clean Manager v|Clean editor |Clean layout gemt|Clean-sider|Ikke Clean|h18-Visual Designer-' clean/hangar18-manager; then
            echo 'Obsolete public product naming or invalid technical identifier found in Visual Designer Manager source.' >&2
            exit 1
          fi

      - name: Build package and manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSIONED="dist/hangar18-manager-clean-v${VERSION}.zip"
          rm -f "$VERSIONED" dist/hangar18-manager-clean.zip
          (cd clean && zip -qr "../$VERSIONED" hangar18-manager)
          cp "$VERSIONED" dist/hangar18-manager-clean.zip
          unzip -tq "$VERSIONED"
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/src/Admin/AdminController.php$')" = '1'
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/src/Admin/AdminMenuBridge.php$')" = '1'
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/src/Admin/ExportController.php$')" = '1'
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/src/Admin/NavigationController.php$')" = '1'
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/src/Admin/ThemeController.php$')" = '1'
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/src/Admin/GlobalDesignerController.php$')" = '1'
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/src/Model/HierarchyNormalizer.php$')" = '1'
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/src/Model/TemplateLayoutModel.php$')" = '1'
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/src/Model/LayoutModel.php$')" = '1'
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/src/Frontend/Renderer.php$')" = '1'
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/src/Frontend/ResponsiveRenderer.php$')" = '1'
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/assets/editor-v0121.js$')" = '1'
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/assets/editor-v0121-panels.js$')" = '1'
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/assets/editor-v0125.js$')" = '1'
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/assets/editor-v0125.css$')" = '1'
          test "$(unzip -Z1 "$VERSIONED" | grep -c '^hangar18-manager/release-history.json$')" = '1'
          SHA="$(sha256sum "$VERSIONED" | awk '{print $1}')"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          python - "$VERSION" "$SHA" "$SOURCE_COMMIT" <<'PY'
          import json, sys
          from pathlib import Path
          version, sha, source_commit = sys.argv[1:4]
          notes_path = Path('clean-release-notes.html')
          notes = notes_path.read_text(encoding='utf-8').strip() if notes_path.exists() else f'<h4>{version}</h4><p>Visual Designer Manager release.</p>'
          data = {
              'name': 'Visual Designer Manager',
              'slug': 'hangar18-manager',
              'version': version,
              'homepage': 'https://github.com/phenixdk2020/hangar18-manager',
              'requires': '6.4',
              'requires_php': '8.0',
              'tested': '6.8',
              'package': f'https://raw.githubusercontent.com/phenixdk2020/hangar18-manager/main/dist/hangar18-manager-clean-v{version}.zip',
              'sha256': sha,
              'source_commit': source_commit,
              'sections': {
                  'description': 'Modeldrevet visuel WordPress-designer med responsive layouts, versionshistorik og Manager-funktioner.',
                  'changelog': notes,
              },
          }
          Path('clean-update.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          echo "Package SHA256: $SHA"

      - name: Commit verified release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-release-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean-update.json "dist/hangar18-manager-clean-v${VERSION}.zip" dist/hangar18-manager-clean.zip
          if git diff --cached --quiet; then
            echo 'Release artifacts already current.'
            exit 0
          fi
          git commit -m "Release Visual Designer Manager v${VERSION}"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying..."
            sleep 2
          done
          echo 'Unable to publish Visual Designer Manager release after three attempts.' >&2
          exit 1

      - name: Upload installable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-designer-manager-v${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: dist/hangar18-manager-clean-v${{ steps.version.outputs.version }}.zip
