name: Diagnose Hangar18 Manager v0.5.18

on:
  push:
    branches:
      - development/v0.5.18
    paths:
      - '.github/workflows/diagnose-v0518.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/v0.5.18
          fetch-depth: 0
      - name: Run diagnostic
        shell: bash
        run: |
          set +e
          LOG=/tmp/h18-v0518-diagnostic.txt
          : > "$LOG"
          echo '=== PATCH ===' >> "$LOG"
          python3 - <<'PY' >> "$LOG" 2>&1
          from pathlib import Path
          p=Path('.github/scripts/patch_v0518.py')
          t=p.read_text()
          old='''js = replace_once(js,
              "['card_grid', 'tabs', 'accordion'].includes(type)",
              "['card_grid', 'tabs', 'accordion', 'carousel'].includes(type)",
              'preset carousel cards')'''
          new='''js = replace_once(js,
              "if (Array.isArray(presetData.Cards) && ['card_grid', 'tabs', 'accordion'].includes(type)) {",
              "if (Array.isArray(presetData.Cards) && ['card_grid', 'tabs', 'accordion', 'carousel'].includes(type)) {",
              'preset carousel cards')'''
          if old in t: p.write_text(t.replace(old,new,1))
          PY
          python3 .github/scripts/patch_v0518.py >> "$LOG" 2>&1
          PATCH_STATUS=$?
          echo "patch_status=$PATCH_STATUS" >> "$LOG"
          if [ "$PATCH_STATUS" -eq 0 ]; then
            echo '=== PHP ===' >> "$LOG"
            php -l hangar18-manager.php >> "$LOG" 2>&1; echo "php_status=$?" >> "$LOG"
            echo '=== JS ===' >> "$LOG"
            node --check assets/admin.js >> "$LOG" 2>&1; echo "js_status=$?" >> "$LOG"
            echo '=== ASSERTIONS ===' >> "$LOG"
            grep -n -F 'CarouselAutoplay' hangar18-manager.php | head -10 >> "$LOG" 2>&1
            grep -n -F 'page_editor_carousel_script' hangar18-manager.php | head -10 >> "$LOG" 2>&1
            grep -n -F "['card_grid', 'tabs', 'accordion', 'carousel'].includes(type)" assets/admin.js >> "$LOG" 2>&1
          fi
          cp "$LOG" .github/diagnostics-v0518.txt
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add .github/diagnostics-v0518.txt
          git commit -m 'QA: record v0.5.18 diagnostic'
          git push origin HEAD:development/v0.5.18
