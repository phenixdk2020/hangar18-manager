name: Build Hangar18 Manager 0.5.6

on:
  push:
    branches: [development/v0.5.6]
    paths: ['.github/workflows/build-v056.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -euo pipefail
          python3 tools/build_v056.py
      - name: Static QA
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F "Version: 0.5.6" hangar18-manager.php
          grep -F "const VERSION = '0.5.6';" hangar18-manager.php
          grep -F "'Version'        => '1.10'" hangar18-manager.php
          grep -F "'HoverStyleMode'         => 'Inherit'" hangar18-manager.php
          grep -F -- '--h18-hover-heading' hangar18-manager.php
          grep -F 'h18-hover-style-mode' assets/admin.js
          test "$(grep -o "'1.10'" hangar18-manager.php | wc -l)" -eq 7
      - name: Package
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build/hangar18-manager/assets dist
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp assets/admin.css assets/admin.js .build/hangar18-manager/assets/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          unzip -q dist/hangar18-manager.zip -d .build/verify
          php -l .build/verify/hangar18-manager/hangar18-manager.php
          node --check .build/verify/hangar18-manager/assets/admin.js
          python3 - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          z=Path('dist/hangar18-manager.zip')
          d={'schema_version':'1.0','plugin':'hangar18-manager','version':'0.5.6','min_wp':'6.4','min_php':'8.0','published_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'package_path':'dist/hangar18-manager.zip','package_sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'changelog':['Tilføjer Normal/Hover state-styling pr. element.','Tilføjer hover-baggrund, tekst, overskrift, kant og opacity.','Hover-state komponeres med responsive transforms, bevægelse og skygge.','Arv Normal er standard og bevarer eksisterende sider.','Løfter page-editor schema kompatibelt til 1.10.']}
          Path('update.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -rf .build
      - name: Commit and self-clean
        run: |
          set -euo pipefail
          rm -f tools/build_v056.py .github/workflows/build-v056.yml
          rmdir tools 2>/dev/null || true
          git config user.name "hangar18-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build Hangar18 Manager 0.5.6 hover state styling"
          git push
