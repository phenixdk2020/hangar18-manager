name: V3 Alpha.17 Event Card Sizing QA

on:
  push:
    branches: [v3-alpha17-event-card-sizing]
    paths:
      - '.github/scripts/build_v3_alpha17.py'
      - '.github/workflows/v3-alpha17-qa.yml'
      - 'V3-ALPHA17.md'
  pull_request:
    branches: [v3-clean-refactor]

jobs:
  alpha17-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock V1 0.1.93 source runtime
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='dc3bad403c764f4ec123a526333a781d05dde491'
          git cat-file -e "${BASELINE}^{commit}"
          git diff --exit-code "$BASELINE" -- clean/hangar18-manager
          echo 'V1 0.1.93 source runtime: byte-identical PASS'

      - name: Verify V1 event-card reference
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'repeat(auto-fit,minmax(280px,360px))' hangar18-manager.php
          grep -Fq '.h18-event-register{display:grid' hangar18-manager.php
          grep -Fq 'gap:18px' hangar18-manager.php
          grep -Fq '.h18-event-card-body{padding:20px}' hangar18-manager.php
          grep -Fq '.h18-event-card-image{aspect-ratio:16/10' hangar18-manager.php
          echo 'V1 compact event-card width/gap/padding/image-ratio reference: PASS'

      - name: Retained V1 regression gates
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 .github/scripts/v0192_export_integrity_qa.py
          python3 .github/scripts/v0191_form_design_controls_qa.py
          python3 .github/scripts/v0190_form_wysiwyg_parity_qa.py
          python3 .github/scripts/v0189_manager_cleanup_export_all_qa.py
          python3 .github/scripts/v0186_site_settings_qa.py
          python3 .github/scripts/v0185_editor_live_box_qa.py
          python3 .github/scripts/v0185_semantic_qa.py
          python3 .github/scripts/v0184_portable_transfer_qa.py

      - name: Re-prove Alpha.16 mobile visual baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build_v3_alpha16.py
          ROOT='build/visual-designer-manager'
          MAIN="$ROOT/visual-designer-manager.php"
          RENDERER="$ROOT/src/Frontend/Renderer.php"
          RESPONSIVE="$ROOT/src/Frontend/ResponsiveRenderer.php"
          grep -Fq 'Version: 3.0.0-alpha.16' "$MAIN"
          grep -Fq '<details class="h18-clean-front-menu-details">' "$RENDERER"
          grep -Fq 'private static function v1MobileVisualParityCss(' "$RESPONSIVE"
          grep -Fq 'font-size:32px!important' "$RESPONSIVE"
          grep -Fq 'height:220px!important' "$RESPONSIVE"
          echo 'Alpha.16 menu/mobile visual baseline: PASS'

      - name: Build and validate V3 3.0.0-alpha.17
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/build_v3_alpha17.py
          python3 .github/scripts/build_v3_alpha17.py
          ROOT='build/visual-designer-manager'
          MAIN="$ROOT/visual-designer-manager.php"
          MODEL="$ROOT/src/Model/LayoutModel.php"
          RENDERER="$ROOT/src/Frontend/Renderer.php"
          RESPONSIVE="$ROOT/src/Frontend/ResponsiveRenderer.php"
          JS="$ROOT/assets/editor-v018-core.js"
          HISTORY="$ROOT/release-history.json"

          grep -Fq 'Version: 3.0.0-alpha.17' "$MAIN"
          grep -Fq "'minCardWidth' => \$minCardWidth" "$MODEL"
          grep -Fq "'maxCardWidth' => \$maxCardWidth" "$MODEL"
          grep -Fq "'cardAlign' => \$cardAlign" "$MODEL"
          grep -Fq "'imageRatio' => \$imageRatio" "$MODEL"
          grep -Fq "cardPadding'] ?? 20" "$MODEL"
          grep -Fq "cardRadius'] ?? 8" "$MODEL"

          grep -Fq 'repeat(auto-fit,minmax(min(100%,' "$RENDERER"
          grep -Fq '$maxListWidth = ($columns * $maxCardWidth)' "$RENDERER"
          grep -Fq "['16:10' => '16 / 10'" "$RENDERER"
          grep -Fq "max-width:' . \$maxListWidth . 'px" "$RENDERER"

          grep -Fq 'eventMinCardWidth' "$JS"
          grep -Fq 'eventMaxCardWidth' "$JS"
          grep -Fq 'eventCardAlign' "$JS"
          grep -Fq 'eventImageRatio' "$JS"
          grep -Fq 'V1-standard for kort er 280–360 px' "$JS"
          grep -Fq 'Maks. kolonner' "$JS"
          grep -Fq "imageRatio||'16:10'" "$JS"
          grep -Fq '3.0.0-alpha.17' "$HISTORY"

          # Alpha.15/16 mobile behavior must remain present.
          grep -Fq 'private static function v1MobileFlowCss(' "$RESPONSIVE"
          grep -Fq 'private static function v1MobileVisualParityCss(' "$RESPONSIVE"
          grep -Fq 'grid-template-columns:1fr!important' "$RESPONSIVE"
          test ! -e "$ROOT/assets/v3-alpha10-mobile-reflow.js"
          test ! -e "$ROOT/assets/v3-alpha11-mobile-reflow.js"

          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find "$ROOT/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check

          python3 - <<'PY'
          min_w=280; max_w=360; gap=18; cols=3
          assert max_w >= min_w
          assert (cols*max_w)+((cols-1)*gap) == 1116
          assert 360/225 == 1.6
          print('Event width math: 3 x 360 + 2 x 18 = 1116px PASS')
          print('V1 16:10 ratio: 360 x 225 PASS')
          PY
          echo 'Alpha.17 compact event-card contract: PASS'

      - name: Package Alpha.17 QA artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION='3.0.0-alpha.17'
          mkdir -p dist
          ZIP="dist/visual-designer-manager-v${VERSION}.zip"
          rm -f "$ZIP"
          (cd build && zip -qr "../$ZIP" visual-designer-manager)
          unzip -tq "$ZIP"
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/visual-designer-manager.php$')" = '1'
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/src/Frontend/Renderer.php$')" = '1'
          echo "SHA256=$(sha256sum "$ZIP" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: visual-designer-manager-v3.0.0-alpha.17-qa
          path: dist/visual-designer-manager-v3.0.0-alpha.17.zip
          if-no-files-found: error
