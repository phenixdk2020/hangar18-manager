name: Apply Clean v0.1.16 Patch

on:
  push:
    branches: [main]
    paths:
      - 'clean-v0116-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate v0.1.16 patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply-clean-v0116.py
          php -l clean/hangar18-manager/hangar18-manager.php
          php -l clean/hangar18-manager/src/Update/GitHubUpdater.php
          grep -q "Version: 0.1.16" clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.16'" clean/hangar18-manager/hangar18-manager.php
          grep -q "active_sitewide_plugins" clean/hangar18-manager/src/Update/GitHubUpdater.php
          grep -q "active_plugins" clean/hangar18-manager/src/Update/GitHubUpdater.php
          if grep -q "activate_plugin(self::PLUGIN_FILE" clean/hangar18-manager/src/Update/GitHubUpdater.php; then
            echo 'Updater still re-executes plugin during self-update.' >&2
            exit 1
          fi

      - name: Commit source and release trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hangar18-release-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager clean-release-notes.html
          printf 'v0.1.16\ntriggered_utc=2026-08-25T17:18:00Z\nreason=Robust self-update activation-state preservation.\nnonce=17\n' > clean-release-now.txt
          git add clean-release-now.txt
          git commit -m 'Prepare clean v0.1.16 self-update activation fix'
          git push origin HEAD:main
