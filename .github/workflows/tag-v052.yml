name: Tag Hangar18 Manager v0.5.2

on:
  push:
    branches:
      - development/v0.5.2
    paths:
      - '.github/workflows/tag-v052.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development/v0.5.2
          fetch-depth: 0

      - name: Create release tag and self-clean
        shell: bash
        run: |
          set -euo pipefail
          TARGET='c5a8e5d7900f3b02be97d749dbb28536922077dd'
          git fetch --tags --force
          if git rev-parse refs/tags/v0.5.2 >/dev/null 2>&1; then
            test "$(git rev-parse v0.5.2^{commit})" = "$TARGET"
          else
            git tag v0.5.2 "$TARGET"
            git push origin refs/tags/v0.5.2
          fi
          rm -f .github/workflows/tag-v052.yml
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Cleanup temporary v0.5.2 tagging workflow'
          git push
