name: Build Hangar18 Manager 0.5.7

on:
  push:
    branches:
      - development/v0.5.7
    paths:
      - .github/workflows/build-v057.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development/v0.5.7
          fetch-depth: 0

      - name: Apply patch and rebuild package
        run: python3 .github/scripts/build-v057.py

      - name: Static QA
        run: |
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -q "Version: 0.5.7" hangar18-manager.php
          grep -q "const VERSION = '0.5.7'" hangar18-manager.php
          grep -q "function renderCanvasPreview" assets/admin.js
          grep -q "h18-preview-state" assets/admin.js
          grep -q "v0.5.7 – live visual canvas" assets/admin.css
          grep -q "Version: 0.5.7" readme.txt
          python3 -m json.tool update.json >/dev/null

      - name: Commit validated build and self-clean
        run: |
          rm -f .github/workflows/build-v057.yml .github/scripts/build-v057.py
          git config user.name "hangar18-build"
          git config user.email "actions@users.noreply.github.com"
          git add hangar18-manager.php assets/admin.js assets/admin.css readme.txt update.json dist/hangar18-manager.zip .github/workflows/build-v057.yml .github/scripts/build-v057.py
          git commit -m "Release v0.5.7 live visual canvas"
          git push origin HEAD:development/v0.5.7
