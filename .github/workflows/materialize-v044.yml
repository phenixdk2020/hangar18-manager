name: Publish Hangar18 Manager 0.4.4

on:
  push:
    branches:
      - main
    paths:
      - 'package-v044/**'
      - '.github/workflows/materialize-v044.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and validate package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p dist .build
          cat package-v044/part-*.b64 | base64 --decode > dist/hangar18-manager.zip
          echo '7a618fcfd4385e26e0da29a99ab0093da4381d62965de0daf01951bc0c641546  dist/hangar18-manager.zip' | sha256sum -c -
          unzip -t dist/hangar18-manager.zip
          unzip -q dist/hangar18-manager.zip -d .build
          test -f .build/hangar18-manager/hangar18-manager.php
          grep -F 'Version: 0.4.4' .build/hangar18-manager/hangar18-manager.php
          grep -F "const VERSION = '0.4.4';" .build/hangar18-manager/hangar18-manager.php
          grep -F "'Version'        => '1.3'" .build/hangar18-manager/hangar18-manager.php || grep -F "'Version' => '1.3'" .build/hangar18-manager/hangar18-manager.php
          grep -F 'EventIndexAlignment' .build/hangar18-manager/hangar18-manager.php
          grep -F 'EventDetailAlignment' .build/hangar18-manager/hangar18-manager.php
          grep -F 'GalleryIndexAlignment' .build/hangar18-manager/hangar18-manager.php
          grep -F 'GalleryDetailAlignment' .build/hangar18-manager/hangar18-manager.php
          php -l .build/hangar18-manager/hangar18-manager.php
          node --check .build/hangar18-manager/assets/admin.js

      - name: Prepare source and manifest
        shell: bash
        run: |
          set -euo pipefail
          cp .build/hangar18-manager/hangar18-manager.php hangar18-manager.php
          cp .build/hangar18-manager/readme.txt readme.txt
          mkdir -p assets
          cp .build/hangar18-manager/assets/admin.css assets/admin.css
          cp .build/hangar18-manager/assets/admin.js assets/admin.js
          cat > update.json <<'JSON'
          {
            "schema_version": "1.0",
            "plugin": "hangar18-manager",
            "version": "0.4.4",
            "min_wp": "6.4",
            "min_php": "8.0",
            "published_utc": "2026-08-14T16:23:00Z",
            "package_path": "dist/hangar18-manager.zip",
            "package_sha256": "7a618fcfd4385e26e0da29a99ab0093da4381d62965de0daf01951bc0c641546",
            "changelog": [
              "Køretøjer: separat Venstre/Midtstillet for oversigtssiden og de enkelte køretøjssider.",
              "Events: separat Venstre/Midtstillet for eventoversigten og de enkelte eventsider.",
              "Billedgalleri: separat Venstre/Midtstillet for gallerioversigten og de enkelte albumsider.",
              "VehicleRegister opgraderet til schema 1.3 med migration af eksisterende indstillinger.",
              "ContentLayout opgraderet til schema 1.1 med migration fra v0.4.3.",
              "WhatIf er fortsat slået fra som standard."
            ]
          }
          JSON
          rm -rf .build

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add -f dist/hangar18-manager.zip
          git add hangar18-manager.php readme.txt assets/admin.css assets/admin.js update.json
          if git diff --cached --quiet; then
            echo 'Release is already published.'
            exit 0
          fi
          git commit -m 'Publish Hangar18 Manager 0.4.4'
          git push
