name: Apply Visual Designer Manager 0.1.51 External Conversion

on:
  push:
    paths:
      - '.github/scripts/apply_v0151_external_conversion.py'
      - '.github/workflows/apply-v0151-external-conversion.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-designer-v0151-external-conversion
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.1.51 patch
        run: python3 .github/scripts/apply_v0151_external_conversion.py

      - name: PHP syntax
        run: |
          set -euo pipefail
          find clean/hangar18-manager -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in clean/hangar18-manager/assets/*.js; do node --check "$f"; done

      - name: Regression and model QA
        run: php .github/scripts/hierarchy_normalizer_qa.php

      - name: Verify 0.1.51 contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('clean/hangar18-manager')
          plugin = (p/'hangar18-manager.php').read_text(encoding='utf-8')
          source = (p/'src/Migration/ExternalPageSourceService.php').read_text(encoding='utf-8')
          service = (p/'src/Migration/PageConversionService.php').read_text(encoding='utf-8')
          controller = (p/'src/Admin/ConversionController.php').read_text(encoding='utf-8')
          theme = (p/'src/Admin/ThemeController.php').read_text(encoding='utf-8')
          history = (p/'release-history.json').read_text(encoding='utf-8')

          checks = {
              'plugin version 0.1.51': "Version: 0.1.51" in plugin and "H18_CLEAN_VERSION', '0.1.51'" in plugin,
              'external service loaded': "ExternalPageSourceService.php" in plugin,
              'safe HTTPS fetch': 'wp_safe_remote_get' in source and "['https']" in source and 'reject_unsafe_urls' in source,
              'source is sanitized': 'wp_kses_post' in source,
              'scripts/styles excluded': "external-scripts-not-imported" in source and "external-stylesheets-not-imported" in source,
              'external candidate source metadata': "'sourceType' => 'external'" in service and "'sourceUrl' => $sourceUrl" in service,
              'approval refetch/hash gate': 'ExternalPageSourceService::fetch($sourceUrl)' in service and 'external kildeside er ændret' in service.lower(),
              'external import UI': 'Hent ekstern side til QA' in controller and 'https://test2.hangar18.dk/' in controller,
              'new draft supported': 'Opret ny WordPress-kladde' in controller and "'post_status' => 'draft'" in controller,
              'no automatic activation on fetch': 'prepareExternalData' in controller and 'approve(' not in controller.split('public static function externalPrepare',1)[1].split('public static function prepare',1)[0],
              'theme migration timing fixed': "add_action('admin_init', [self::class, 'maybeMigrateAkVpkTheme'], 1);" in theme and "add_action('setup_theme', [self::class, 'maybeMigrateAkVpkTheme']" not in theme,
              'release history': '"version": "0.1.51"' in history,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(('PASS ' if ok else 'FAIL ') + name)
          if failed: raise SystemExit('0.1.51 contract verification failed: ' + ', '.join(failed))
          PY

      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name "phenixdk2020"
          git config user.email "74060601+phenixdk2020@users.noreply.github.com"
          git add clean/hangar18-manager docs/v0151-status.md
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "Add external page conversion in Visual Designer Manager 0.1.51"
          git pull --rebase origin main
          git push origin HEAD:main
