name: v0.7.2 Save and Typography QA

on:
  push:
    branches:
      - agent/fix-save-typography-072
  pull_request:
    branches:
      - main
    paths:
      - 'hangar18-manager.php'
      - 'assets/admin.js'
      - 'assets/admin.css'
      - 'tests/Architecture/v072-save-typography-contract.sh'
      - '.github/workflows/v072-save-typography-qa.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.ref == 'refs/heads/agent/fix-save-typography-072' && !contains(github.event.head_commit.message || '', 'Apply v0.7.2 save and typography fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-save-typography-072
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - name: Apply controlled patch
        run: python3 .github/scripts/fix_save_typography_072.py
      - name: Validate before commit
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          bash tests/Architecture/v072-save-typography-contract.sh
          bash tests/Architecture/protected-domain-contract.sh
      - name: Commit patched product files
        run: |
          set -euo pipefail
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/scripts/fix_save_typography_072.py
          git add hangar18-manager.php assets/admin.js assets/admin.css tests/Architecture/v072-save-typography-contract.sh .github/workflows/v072-save-typography-qa.yml
          git diff --cached --check
          git commit -m 'Apply v0.7.2 save and typography fix'
          git push origin HEAD:agent/fix-save-typography-072

  qa:
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message || '', 'Apply v0.7.2 save and typography fix')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0','8.2','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Syntax and contracts
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          bash tests/Architecture/v072-save-typography-contract.sh
          bash tests/Architecture/protected-domain-contract.sh
      - name: Workflow regression
        run: |
          php tests/Architecture/e8-workflow-smoke.php
          php tests/Architecture/e11-quality-smoke.php
          php tests/Architecture/e14-e2e-smoke.php
