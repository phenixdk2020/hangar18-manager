name: Prepare Visual Designer Manager 0.1.27 release

on:
  push:
    branches: [main]
    paths:
      - 'v0126-release-now.txt'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare 0.1.27 release source
        run: python .github/scripts/prepare_v0126_release.py

      - name: Verify version and source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Version: 0.1.27' clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.27'" clean/hangar18-manager/hangar18-manager.php
          grep -q 'Version: 0.1.27' clean/hangar18-manager/readme.txt
          grep -q '<h4>0.1.27</h4>' clean-release-notes.html
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php
          grep -q 'h18-clean-root-render-error' clean/hangar18-manager/assets/editor-v018-core.js
          grep -q 'node_render_error' clean/hangar18-manager/assets/editor-v018-core.js
          grep -q 'surface_render_error' clean/hangar18-manager/assets/editor-v018-core.js
          grep -q 'overscroll-behavior:contain' clean/hangar18-manager/assets/editor-v0123-ux.css
          grep -q 'manualW' clean/hangar18-manager/assets/editor-v018-core.js
          grep -q 'autoSize' clean/hangar18-manager/assets/editor-v018-core.js

      - name: Commit release preparation and trigger normal release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-release-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager/hangar18-manager.php clean/hangar18-manager/readme.txt clean-release-notes.html clean-release-now.txt
          if git diff --cached --quiet; then
            echo '0.1.27 release preparation already current.'
            exit 0
          fi
          git commit -m 'Prepare Visual Designer Manager v0.1.27 release'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
