name: Prepare Visual Designer Manager 0.1.26 release

on:
  push:
    branches: [main]
    paths:
      - 'v0126-release-now.txt'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare 0.1.26 release source
        run: python .github/scripts/prepare_v0126_release.py

      - name: Verify version and source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Version: 0.1.26' clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.26'" clean/hangar18-manager/hangar18-manager.php
          grep -q 'Version: 0.1.26' clean/hangar18-manager/readme.txt
          grep -q '<h4>0.1.26</h4>' clean-release-notes.html
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php
          grep -q 'headingFontFamily' clean/hangar18-manager/src/Model/LayoutModel.php
          grep -q 'rememberSelection' clean/hangar18-manager/assets/editor-v0125.js
          grep -q 'manualW' clean/hangar18-manager/assets/editor-v018-core.js
          grep -q 'autoSize' clean/hangar18-manager/assets/editor-v018-core.js
          grep -q 'nl2br' clean/hangar18-manager/src/Frontend/Renderer.php
          grep -q 'overscroll-behavior:contain' clean/hangar18-manager/assets/editor-v0123-ux.css

      - name: Commit release preparation and trigger normal release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-release-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager/hangar18-manager.php clean/hangar18-manager/readme.txt clean-release-notes.html clean-release-now.txt .github/workflows/clean-release.yml
          if git diff --cached --quiet; then
            echo '0.1.26 release preparation already current.'
            exit 0
          fi
          git commit -m 'Prepare Visual Designer Manager v0.1.26 release'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'Unable to publish 0.1.26 release preparation.' >&2
          exit 1
