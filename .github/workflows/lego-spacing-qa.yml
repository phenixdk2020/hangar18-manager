name: LEGO Editor QA

on:
  push:
    branches:
      - agent/lego-spacing-foundation-v0830
      - agent/lego-responsive-spacing-v0831
      - agent/lego-common-design-v0832
      - agent/lego-responsive-design-v0833
      - agent/lego-interaction-states-v0834
      - agent/lego-consolidation-v0835
      - agent/lego-primary-editor-view-v0836
      - agent/lego-layout-primary-v0837
  pull_request:
    paths:
      - 'src/Editor/LegoSpacingModel.php'
      - 'src/Editor/LegoDesignModel.php'
      - 'src/Editor/LegoResponsiveDesignModel.php'
      - 'src/Editor/LegoInteractionStateModel.php'
      - 'src/Admin/EditorLegoSpacingAdminController.php'
      - 'src/Admin/EditorLegoDesignAdminController.php'
      - 'src/Admin/EditorLegoResponsiveDesignAdminController.php'
      - 'src/Admin/EditorLegoInteractionStatesAdminController.php'
      - 'src/Admin/EditorLegoPrimaryViewAdminController.php'
      - 'src/Admin/EditorLegoLayoutPrimaryAdminController.php'
      - 'src/Admin/IntegrationAdminBootstrap.php'
      - 'src/Backup/SiteBackupRestoreCoordinator.php'
      - 'assets/ultimate-designer-nesting-tools.js'
      - 'assets/ultimate-designer-nesting-tools.css'
      - 'assets/ultimate-designer-lego-spacing-v0830.js'
      - 'assets/ultimate-designer-lego-spacing-v0830.css'
      - 'assets/ultimate-designer-lego-spacing-v0831.js'
      - 'assets/ultimate-designer-lego-spacing-v0831.css'
      - 'assets/ultimate-designer-lego-design-v0832.js'
      - 'assets/ultimate-designer-lego-design-event-guard-v0832.js'
      - 'assets/ultimate-designer-lego-design-v0832.css'
      - 'assets/ultimate-designer-lego-design-responsive-v0833.js'
      - 'assets/ultimate-designer-lego-design-responsive-event-guard-v0833.js'
      - 'assets/ultimate-designer-lego-design-responsive-v0833.css'
      - 'assets/ultimate-designer-lego-interaction-states-v0834.js'
      - 'assets/ultimate-designer-lego-interaction-states-event-guard-v0834.js'
      - 'assets/ultimate-designer-lego-interaction-snapshot-v0834.js'
      - 'assets/ultimate-designer-lego-interaction-states-v0834.css'
      - 'assets/ultimate-designer-lego-primary-view-v0836.js'
      - 'assets/ultimate-designer-lego-primary-view-v0836.css'
      - 'assets/ultimate-designer-lego-layout-primary-v0837.js'
      - 'assets/ultimate-designer-lego-layout-primary-v0837.css'
      - 'tests/Architecture/v0830-lego-spacing-*'
      - 'tests/Architecture/v0831-lego-responsive-spacing-*'
      - 'tests/Architecture/v0832-lego-common-design-*'
      - 'tests/Architecture/v0833-lego-responsive-design-*'
      - 'tests/Architecture/v0834-lego-interaction-states-*'
      - 'tests/Architecture/v0835-lego-consolidation-*'
      - 'tests/Architecture/v0836-lego-primary-view-*'
      - 'tests/Architecture/v0837-lego-layout-primary-*'
      - 'tests/Architecture/browser/lego-spacing-v0830.spec.cjs'
      - 'tests/Architecture/browser/lego-spacing-v0831.spec.cjs'
      - 'tests/Architecture/browser/lego-design-v0832.spec.cjs'
      - 'tests/Architecture/browser/lego-design-responsive-v0833.spec.cjs'
      - 'tests/Architecture/browser/lego-interaction-states-v0834.spec.cjs'
      - 'tests/Architecture/browser/lego-consolidation-v0835.spec.cjs'
      - 'tests/Architecture/browser/lego-consolidation-history-v0835.spec.cjs'
      - 'tests/Architecture/browser/lego-primary-view-v0836.spec.cjs'
      - 'tests/Architecture/browser/lego-layout-primary-v0837.spec.cjs'
      - 'tests/Architecture/browser/playwright*.config.cjs'
      - '.github/workflows/lego-spacing-qa.yml'

permissions:
  contents: read

jobs:
  contract:
    name: LEGO responsive + states + primary design + primary layout contract
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0','8.2','8.3']
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: bash tests/Architecture/assert-foundation-isolation.sh origin/main
      - run: bash tests/Architecture/protected-domain-contract.sh
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php-version }}', coverage: none}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: bash tests/Architecture/v0831-lego-responsive-spacing-contract.sh
      - run: bash tests/Architecture/v0832-lego-common-design-contract.sh
      - run: bash tests/Architecture/v0833-lego-responsive-design-contract.sh
      - run: bash tests/Architecture/v0834-lego-interaction-states-contract.sh
      - run: bash tests/Architecture/v0835-lego-consolidation-contract.sh
      - run: bash tests/Architecture/v0836-lego-primary-view-contract.sh
      - run: bash tests/Architecture/v0837-lego-layout-primary-contract.sh

  browser:
    name: LEGO primary editor design + layout system Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: google-chrome --version
      - run: npm init -y >/dev/null 2>&1 && npm install --no-save @playwright/test jquery
      - run: >-
          npx playwright test
          -c tests/Architecture/browser/playwright.system-chrome.config.cjs
          tests/Architecture/browser/lego-spacing-v0830.spec.cjs
          tests/Architecture/browser/lego-spacing-v0831.spec.cjs
          tests/Architecture/browser/lego-design-v0832.spec.cjs
          tests/Architecture/browser/lego-design-responsive-v0833.spec.cjs
          tests/Architecture/browser/lego-interaction-states-v0834.spec.cjs
          tests/Architecture/browser/lego-consolidation-v0835.spec.cjs
          tests/Architecture/browser/lego-consolidation-history-v0835.spec.cjs
          tests/Architecture/browser/lego-primary-view-v0836.spec.cjs
          tests/Architecture/browser/lego-layout-primary-v0837.spec.cjs
