permissions:
  contents: read

jobs:
  contract:
    name: LEGO primary editor + side-by-side + resize + responsive layout contract
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0','8.2','8.3']
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: bash tests/Architecture/assert-foundation-isolation.sh origin/main
      - run: bash tests/Architecture/protected-domain-contract.sh
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php-version }}', coverage: none}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check assets/ultimate-designer-lego-fixes-v0851.js
      - run: bash tests/Architecture/v0831-lego-responsive-spacing-contract.sh
      - run: bash tests/Architecture/v0832-lego-common-design-contract.sh
      - run: bash tests/Architecture/v0833-lego-responsive-design-contract.sh
      - run: bash tests/Architecture/v0834-lego-interaction-states-contract.sh
      - run: bash tests/Architecture/v0835-lego-consolidation-contract.sh
      - run: bash tests/Architecture/v0836-lego-primary-view-contract.sh
      - run: bash tests/Architecture/v0837-lego-layout-primary-contract.sh
      - run: bash tests/Architecture/v0838-lego-drop-zones-contract.sh
      - run: bash tests/Architecture/v0840-lego-side-by-side-contract.sh
      - run: bash tests/Architecture/v0841-lego-resize-contract.sh
      - run: bash tests/Architecture/v0842-lego-responsive-layout-contract.sh
      - run: bash tests/Architecture/v0843-lego-palette-side-drop-contract.sh
      - run: bash tests/Architecture/lego-manual-acceptance-contract.sh
      - run: bash tests/Architecture/lego-staging-build-contract.sh
      - run: bash tests/Architecture/lego-staging-verify-contract.sh
      - run: bash tests/Architecture/lego-acceptance-record-contract.sh
      - run: bash tests/Architecture/lego-acceptance-init-contract.sh
      - run: bash tests/Architecture/lego-acceptance-recorder-contract.sh

  browser:
    name: LEGO primary editor regression system Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: google-chrome --version
      - run: npm init -y >/dev/null 2>&1 && npm install --no-save @playwright/test jquery
      - run: >-
          npx playwright test
          -c tests/Architecture/browser/playwright.system-chrome.config.cjs
          tests/Architecture/browser/lego-spacing-v0830.spec.cjs
          tests/Architecture/browser/lego-spacing-v0831.spec.cjs
          tests/Architecture/browser/lego-design-v0832.spec.cjs
          tests/Architecture/browser/lego-design-responsive-v0833.spec.cjs
          tests/Architecture/browser/lego-interaction-states-v0834.spec.cjs
          tests/Architecture/browser/lego-consolidation-v0835.spec.cjs
          tests/Architecture/browser/lego-consolidation-history-v0835.spec.cjs
          tests/Architecture/browser/lego-primary-view-v0836.spec.cjs
          tests/Architecture/browser/lego-layout-primary-v0837.spec.cjs
          tests/Architecture/browser/lego-drop-zones-v0838.spec.cjs
          tests/Architecture/browser/lego-palette-side-drop-v0843.spec.cjs
          tests/Architecture/browser/lego-resize-v0841.spec.cjs
          tests/Architecture/browser/lego-responsive-layout-v0842.spec.cjs
          tests/Architecture/browser/lego-selection-inspector-v0852.spec.cjs

  lego-browsers:
    name: LEGO-031/032/033/041/042/052 system Chrome + Chromium Firefox WebKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: google-chrome --version
      - run: npm init -y >/dev/null 2>&1 && npm install --no-save @playwright/test jquery
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: >-
          npx playwright test
          -c tests/Architecture/browser/playwright.lego-v0842.config.cjs
