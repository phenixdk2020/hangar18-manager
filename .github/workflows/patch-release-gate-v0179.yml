name: Patch central Visual Designer release gate through v0.1.79

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_release_gate_v0179.py'
      - '.github/workflows/patch-release-gate-v0179.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch release QA gate
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_release_gate_v0179.py
          grep -q 'v0173_editor_frontend_parity_qa.py' .github/workflows/visual-designer-release.yml
          grep -q 'v0179_responsive_qa.py' .github/workflows/visual-designer-release.yml
      - name: Commit central release gate
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-apply-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add .github/workflows/visual-designer-release.yml
          if git diff --cached --quiet; then
            echo 'Central release gate already current.'
            exit 0
          fi
          git commit -m 'Run central Visual Designer QA through v0.1.79'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
