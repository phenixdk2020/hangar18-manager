name: Apply Visual Designer Manager v0.1.93 Release UX Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_v0193_release_ux_hardening.py'
      - '.github/scripts/v0193_release_ux_hardening_qa.py'
      - '.github/workflows/apply-v0193-release-ux-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.1.93 candidate
        run: python3 .github/scripts/apply_v0193_release_ux_hardening.py
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done
          echo 'PHP syntax: OK'
      - name: JavaScript syntax
        run: node --check clean/hangar18-manager/assets/editor-v018-core.js
      - name: v0.1.93 release/UX hardening QA
        run: python3 .github/scripts/v0193_release_ux_hardening_qa.py
      - name: Current maintenance gates
        run: |
          python3 .github/scripts/v0192_export_integrity_qa.py
          python3 .github/scripts/v0191_form_design_controls_qa.py
          python3 .github/scripts/v0190_form_wysiwyg_parity_qa.py
          python3 .github/scripts/v0189_manager_cleanup_export_all_qa.py
          python3 .github/scripts/v0186_site_settings_qa.py
          python3 .github/scripts/v0185_editor_live_box_qa.py
          python3 .github/scripts/v0185_event_facts_typography_qa.py
          python3 .github/scripts/v0185_semantic_qa.py
          python3 .github/scripts/v0184_portable_transfer_qa.py
          python3 .github/scripts/v0181_complete_qa.py
      - name: Verify updater remains v0.1.92
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('clean-update.json').read_text(encoding='utf-8'))
          assert data['version']=='0.1.92', data['version']
          print('Candidate/release separation: OK')
          PY
      - name: Commit verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-qa-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager/hangar18-manager.php \
                  clean/hangar18-manager/src/Admin/ExportController.php \
                  clean/hangar18-manager/release-history.json \
                  clean-release-notes.html docs/BACKLOG-CANONICAL.md docs/v0193-status.md
          if git diff --cached --quiet; then echo 'No candidate changes.'; exit 0; fi
          git commit -m 'Harden release gates and Export UX in v0.1.93'
          git push origin HEAD:main
