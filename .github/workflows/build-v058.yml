name: Build Hangar18 Manager 0.5.8

on:
  push:
    branches:
      - qa/v0.5.8
    paths:
      - .github/workflows/build-v058.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: qa/v0.5.8
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/build_v058.py

      - name: Static QA
        shell: bash
        run: |
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -q 'Version: 0.5.8' hangar18-manager.php
          grep -q "const VERSION = '0.5.8';" hangar18-manager.php
          grep -q 'h18-canvas-direct-controls' assets/admin.js
          grep -q 'h18-canvas-rich-edit' assets/admin.js
          grep -q 'h18-canvas-padding-handle' assets/admin.css
          python3 - <<'PY'
          import json, hashlib, zipfile
          from pathlib import Path
          manifest=json.loads(Path('update.json').read_text(encoding='utf-8'))
          assert manifest['version']=='0.5.8'
          package=Path(manifest['package_path'])
          assert hashlib.sha256(package.read_bytes()).hexdigest()==manifest['package_sha256']
          with zipfile.ZipFile(package) as zf:
              names=set(zf.namelist())
              required={'hangar18-manager/hangar18-manager.php','hangar18-manager/assets/admin.js','hangar18-manager/assets/admin.css','hangar18-manager/readme.txt'}
              assert required.issubset(names), required-names
          PY

      - name: Commit validated build and self-clean
        shell: bash
        run: |
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/build-v058.yml .github/scripts/build_v058.py
          git add hangar18-manager.php assets/admin.js assets/admin.css readme.txt update.json dist/hangar18-manager.zip
          git commit -m 'Release v0.5.8 direct canvas controls'
          git push origin HEAD:qa/v0.5.8
