name: Apply Visual Designer Manager 0.1.32 contracts

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_v0132_contracts.py'
      - '.github/workflows/apply-v0132-inspector-spacer.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic 0.1.32 patch
        run: python .github/scripts/apply_v0132_contracts.py

      - name: PHP syntax
        run: find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Regression QA
        run: |
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php

      - name: Verify 0.1.32 contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Version: 0.1.32' clean/hangar18-manager/hangar18-manager.php
          grep -Fq "H18_CLEAN_VERSION', '0.1.32'" clean/hangar18-manager/hangar18-manager.php
          grep -Fq "'h18-clean-editor-v0132'" clean/hangar18-manager/hangar18-manager.php
          grep -Fq "assets/editor-v0132.js" clean/hangar18-manager/hangar18-manager.php
          test -s clean/hangar18-manager/assets/editor-v0132.js
          test -s clean/hangar18-manager/assets/editor-v0132.css
          grep -Fq 'function captureRichSelection' clean/hangar18-manager/assets/editor-v0132.js
          grep -Fq 'function restoreBurst' clean/hangar18-manager/assets/editor-v0132.js
          grep -Fq 'Knap blev ikke oprettet' clean/hangar18-manager/assets/editor-v0132.js
          grep -Fq "after[id] === 'button'" clean/hangar18-manager/assets/editor-v0132.js
          grep -Fq '.h18-clean-inspector:not(.is-collapsed)::after' clean/hangar18-manager/assets/editor-v0132.css
          grep -Fq 'height:360px' clean/hangar18-manager/assets/editor-v0132.css
          grep -Fq 'min-height:360px' clean/hangar18-manager/assets/editor-v0132.css
          grep -Fq 'function isFloatingButton(node)' clean/hangar18-manager/assets/editor-v018-core.js
          grep -Fq 'position = '\''absolute'\''' clean/hangar18-manager/assets/editor-v018-core.js
          grep -Fq '== 0.1.32 ==' clean/hangar18-manager/readme.txt
          grep -Fq '"version": "0.1.32"' clean/hangar18-manager/release-history.json
          grep -Fq '<h4>0.1.32</h4>' clean-release-notes.html
          grep -Fq 'Visual Designer Manager 0.1.32 og nyere' CLEAN-USER-MANUAL.md
          grep -Fq 'VD-TEXT-SEL-001' CLEAN-TECHNICAL-MANUAL.md
          grep -Fq 'IMPLEMENTERET i 0.1.32' CLEAN-TECHNICAL-MANUAL.md
          test -s docs/v0132-status.md

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-ci-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager/hangar18-manager.php \
                  clean/hangar18-manager/assets/editor-v0132.js \
                  clean/hangar18-manager/assets/editor-v0132.css \
                  clean/hangar18-manager/readme.txt \
                  clean/hangar18-manager/release-history.json \
                  clean-release-notes.html \
                  CLEAN-USER-MANUAL.md \
                  CLEAN-TECHNICAL-MANUAL.md \
                  docs/v0132-status.md
          if git diff --cached --quiet; then
            echo 'Implementation already present.'
            exit 0
          fi
          git commit -m 'Apply Visual Designer Manager 0.1.32 contract fixes'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race on attempt ${attempt}; retrying..."
            sleep 2
          done
          exit 1
