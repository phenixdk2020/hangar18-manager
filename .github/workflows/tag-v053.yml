name: Tag Hangar18 Manager v0.5.3

on:
  push:
    branches:
      - development/v0.5.3
    paths:
      - '.github/workflows/tag-v053.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development/v0.5.3
          fetch-depth: 0

      - name: Create release tag and self-clean
        shell: bash
        run: |
          set -euo pipefail
          TARGET='314f4c6a662475a1a602096213ea504576fb27c1'
          git fetch --tags --force
          if git rev-parse refs/tags/v0.5.3 >/dev/null 2>&1; then
            test "$(git rev-parse v0.5.3^{commit})" = "$TARGET"
          else
            git tag v0.5.3 "$TARGET"
            git push origin refs/tags/v0.5.3
          fi
          rm -f .github/workflows/tag-v053.yml
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Cleanup temporary v0.5.3 tagging workflow'
          git push
