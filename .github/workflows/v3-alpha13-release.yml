name: Visual Designer Manager V3 Alpha.13 Release

on:
  push:
    branches: [v3-clean-refactor]
    paths:
      - 'v3-alpha13-release-now.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v3-alpha13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock V1 0.1.93 runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='dc3bad403c764f4ec123a526333a781d05dde491'
          git cat-file -e "${BASELINE}^{commit}"
          git diff --exit-code "$BASELINE" -- clean/hangar18-manager

      - name: Run retained V1 regression gates
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 .github/scripts/v0192_export_integrity_qa.py
          python3 .github/scripts/v0191_form_design_controls_qa.py
          python3 .github/scripts/v0190_form_wysiwyg_parity_qa.py
          python3 .github/scripts/v0189_manager_cleanup_export_all_qa.py
          python3 .github/scripts/v0186_site_settings_qa.py
          python3 .github/scripts/v0185_editor_live_box_qa.py
          python3 .github/scripts/v0185_semantic_qa.py
          python3 .github/scripts/v0184_portable_transfer_qa.py

      - name: Capture Alpha.12 renderer reference
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build_v3_alpha12.py
          sha256sum build/visual-designer-manager/src/Frontend/ResponsiveRenderer.php | awk '{print $1}' > /tmp/alpha12-responsive.sha

      - name: Build and validate V3 3.0.0-alpha.13
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build_v3_alpha13.py
          ROOT='build/visual-designer-manager'
          MAIN="$ROOT/visual-designer-manager.php"
          REC="$ROOT/src/Migration/V1MobileGeometryRecovery.php"
          RR="$ROOT/src/Frontend/ResponsiveRenderer.php"
          grep -Fq 'Version: 3.0.0-alpha.13' "$MAIN"
          grep -Fq 'V1MobileGeometryRecovery::register();' "$MAIN"
          grep -Fq "'_h18_clean_layout_v1'" "$REC"
          grep -Fq "'_vdm_layout_v1'" "$REC"
          grep -Fq 'PAGE_BACKUP_META' "$REC"
          grep -Fq 'LayoutModel::saveVersion' "$REC"
          grep -Fq 'TemplateLayoutModel::saveVersion' "$REC"
          test ! -e "$ROOT/assets/v3-alpha10-mobile-reflow.js"
          test ! -e "$ROOT/assets/v3-alpha11-mobile-reflow.js"
          ! grep -Fq 'h18-vdm-mobile-flow-repair' "$RR"
          test "$(sha256sum "$RR" | awk '{print $1}')" = "$(cat /tmp/alpha12-responsive.sha)"
          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find "$ROOT/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Unit-test exact mobile-only recovery
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/alpha13-test.php <<'PHP'
          <?php
          require 'build/visual-designer-manager/src/Migration/V1MobileGeometryRecovery.php';
          $legacy=['nodes'=>[['id'=>'a','type'=>'text','geometry'=>['mobile'=>['x'=>4,'y'=>55,'w'=>112,'h'=>14,'inheritDesktop'=>false]],'props'=>['text'=>'legacy']]]];
          $canonical=['nodes'=>[
            ['id'=>'a','type'=>'text','geometry'=>['desktop'=>['x'=>9,'y'=>9,'w'=>30,'h'=>8],'mobile'=>['x'=>0,'y'=>999,'w'=>120,'h'=>90,'inheritDesktop'=>true]],'props'=>['text'=>'v3']],
            ['id'=>'new','type'=>'eventfacts','geometry'=>['mobile'=>['x'=>1,'y'=>2,'w'=>3,'h'=>4,'inheritDesktop'=>false]],'props'=>['x'=>1]],
          ]];
          $beforeDesktop=$canonical['nodes'][0]['geometry']['desktop'];
          $beforeProps=$canonical['nodes'][0]['props'];
          $beforeNew=$canonical['nodes'][1];
          $r=\VisualDesignerManager\Migration\V1MobileGeometryRecovery::recoverModel($legacy,$canonical);
          if($r['model']['nodes'][0]['geometry']['mobile']!==$legacy['nodes'][0]['geometry']['mobile']) exit(1);
          if($r['model']['nodes'][0]['geometry']['desktop']!==$beforeDesktop) exit(2);
          if($r['model']['nodes'][0]['props']!==$beforeProps) exit(3);
          if($r['model']['nodes'][1]!==$beforeNew) exit(4);
          if($r['matched']!==1||$r['changed']!==1||$r['unmatched']!==1) exit(5);
          echo "Alpha.13 exact mobile-only recovery: PASS\n";
          PHP
          php /tmp/alpha13-test.php

      - name: Package V3 alpha.13 and create updater manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION='3.0.0-alpha.13'
          mkdir -p dist
          ZIP="dist/visual-designer-manager-v${VERSION}.zip"
          rm -f "$ZIP"
          (cd build && zip -qr "../$ZIP" visual-designer-manager)
          unzip -tq "$ZIP"
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/visual-designer-manager.php$')" = '1'
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/src/Migration/V1MobileGeometryRecovery.php$')" = '1'
          SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          python3 - "$SHA" "$SOURCE_COMMIT" <<'PY'
          import json, sys
          from pathlib import Path
          sha, source_commit = sys.argv[1:3]
          version = '3.0.0-alpha.13'
          data = {
              'name': 'Visual Designer Manager',
              'slug': 'visual-designer-manager',
              'version': version,
              'homepage': 'https://github.com/phenixdk2020/hangar18-manager/tree/v3-clean-refactor',
              'requires': '6.4',
              'requires_php': '8.0',
              'tested': '6.8',
              'package': f'https://raw.githubusercontent.com/phenixdk2020/hangar18-manager/v3-clean-refactor/dist/visual-designer-manager-v{version}.zip',
              'sha256': sha,
              'source_commit': source_commit,
              'source_baseline': 'dc3bad403c764f4ec123a526333a781d05dde491',
              'source_version': '0.1.93',
              'sections': {
                  'description': 'V3 clean-refactor af den gennemtestede Visual Designer Manager V1 0.1.93 runtime.',
                  'changelog': '3.0.0-alpha.13: V1 Mobile Geometry Recovery. Existing V3 pages/templates recover V1 geometry.mobile exactly for matching node ID+type, with backup/versioning and no new responsive workaround.'
              }
          }
          Path('v3-update.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          echo "V3_PACKAGE_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "V3 package SHA-256: $SHA"

      - name: Commit verified V3 package to V3 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-v3-release-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add v3-update.json dist/visual-designer-manager-v3.0.0-alpha.13.zip
          if git diff --cached --quiet; then
            echo 'Verified V3 package already current.'
            exit 0
          fi
          git commit -m 'Publish Visual Designer Manager V3 3.0.0-alpha.13 [skip v3 release]'
          git push origin HEAD:v3-clean-refactor

      - name: Upload actual WordPress plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: visual-designer-manager-v3.0.0-alpha.13
          if-no-files-found: error
          retention-days: 30
          path: dist/visual-designer-manager-v3.0.0-alpha.13.zip
