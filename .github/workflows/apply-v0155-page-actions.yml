name: Apply Visual Designer Manager 0.1.55 Page Actions

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_v0155_page_actions.py'
      - '.github/workflows/apply-v0155-page-actions.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.1.55 patch
        run: python3 .github/scripts/apply_v0155_page_actions.py

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Existing model regression QA
        shell: bash
        run: |
          set -euo pipefail
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php

      - name: Verify 0.1.55 page-action contracts
        shell: bash
        run: |
          set -euo pipefail
          ADMIN='clean/hangar18-manager/src/Admin/AdminController.php'
          PLUGIN='clean/hangar18-manager/hangar18-manager.php'
          grep -q 'Version: 0.1.55' "$PLUGIN"
          grep -q "H18_CLEAN_VERSION', '0.1.55'" "$PLUGIN"
          grep -q 'PAGE_STATUS_ACTION' "$ADMIN"
          grep -q 'TRASH_PAGE_ACTION' "$ADMIN"
          grep -q 'PAGE_STATUS_NONCE' "$ADMIN"
          grep -q 'TRASH_PAGE_NONCE' "$ADMIN"
          grep -q 'function updatePageStatus' "$ADMIN"
          grep -q 'function trashPage' "$ADMIN"
          grep -q 'wp_trash_post' "$ADMIN"
          grep -q "current_user_can('delete_post'" "$ADMIN"
          grep -q '>Publicér</button>' "$ADMIN"
          grep -q '>Gør til kladde</button>' "$ADMIN"
          grep -q '>Sæt som Hjem</button>' "$ADMIN"
          grep -q '>Slet</button>' "$ADMIN"
          grep -q 'Hjemmesiden er beskyttet' "$ADMIN"
          grep -q 'Sæt som Hjem.*publicerer aldrig automatisk' "$ADMIN"
          if grep -q 'Publicér og sæt som Hjem' "$ADMIN"; then
            echo 'Combined publish/home action still exists.' >&2
            exit 1
          fi
          grep -q 'VD-PAGES-ACTIONS-001' CLEAN-TECHNICAL-MANUAL.md
          test -s docs/v0155-status.md
          echo '0.1.55 page-action contracts PASS'

      - name: Preserve critical regression gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q "selectionSessionMode: 'prearmed-v0138'" clean/hangar18-manager/assets/editor-v0125.js
          grep -q 'boundary-markers-v0137-single-owner' clean/hangar18-manager/assets/editor-v0125.js
          grep -q 'data-h18-leaf-transparent' clean/hangar18-manager/assets/editor-v018-core.js
          grep -q 'VD-MENU-UX-002' CLEAN-TECHNICAL-MANUAL.md
          grep -q 'VD-PAGE-STATUS-001' CLEAN-TECHNICAL-MANUAL.md
          echo 'Regression gates PASS'

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'phenixdk2020'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager/hangar18-manager.php \
                  clean/hangar18-manager/src/Admin/AdminController.php \
                  clean/hangar18-manager/release-history.json \
                  clean-release-notes.html CLEAN-TECHNICAL-MANUAL.md docs/v0155-status.md
          if git diff --cached --quiet; then
            echo 'No implementation changes'
            exit 0
          fi
          git commit -m 'Add page publish trash and home actions in Visual Designer Manager 0.1.55'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo 'Unable to publish 0.1.55 implementation after three attempts.' >&2
          exit 1
