name: V3 Alpha.22 Desktop Menu Render QA

on:
  push:
    branches: [v3-alpha22-desktop-menu]
    paths:
      - '.github/scripts/build_v3_alpha22.py'
      - '.github/workflows/v3-alpha22-qa.yml'
      - 'V3-ALPHA22.md'
  pull_request:
    branches: [v3-clean-refactor]

jobs:
  alpha22-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock V1 0.1.93 source runtime
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='dc3bad403c764f4ec123a526333a781d05dde491'
          git cat-file -e "${BASELINE}^{commit}"
          git diff --exit-code "$BASELINE" -- clean/hangar18-manager
          echo 'V1 0.1.93 source runtime: byte-identical PASS'

      - name: Retained V1 regression gates
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 .github/scripts/v0192_export_integrity_qa.py
          python3 .github/scripts/v0191_form_design_controls_qa.py
          python3 .github/scripts/v0190_form_wysiwyg_parity_qa.py
          python3 .github/scripts/v0189_manager_cleanup_export_all_qa.py
          python3 .github/scripts/v0186_site_settings_qa.py
          python3 .github/scripts/v0185_editor_live_box_qa.py
          python3 .github/scripts/v0185_semantic_qa.py
          python3 .github/scripts/v0184_portable_transfer_qa.py

      - name: Re-prove Alpha.21 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build_v3_alpha21.py
          ROOT='build/visual-designer-manager'
          grep -Fq 'Version: 3.0.0-alpha.21' "$ROOT/visual-designer-manager.php"
          grep -Fq "get_option('vdm_website_menu_id', null)" "$ROOT/src/Frontend/Renderer.php"
          grep -Fq 'data-menu-source=' "$ROOT/src/Frontend/Renderer.php"
          grep -Fq '<details class="h18-clean-front-menu-details">' "$ROOT/src/Frontend/Renderer.php"
          echo 'Alpha.21 baseline build: PASS'

      - name: Build and validate V3 3.0.0-alpha.22
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/build_v3_alpha22.py
          python3 .github/scripts/build_v3_alpha22.py
          ROOT='build/visual-designer-manager'
          MAIN="$ROOT/visual-designer-manager.php"
          RENDERER="$ROOT/src/Frontend/Renderer.php"
          HISTORY="$ROOT/release-history.json"

          grep -Fq 'Version: 3.0.0-alpha.22' "$MAIN"
          grep -Fq "define('VDM_VERSION', '3.0.0-alpha.22');" "$MAIN"

          # Desktop must no longer depend on a disclosure element.
          grep -Fq '<div class="h18-clean-front-menu-details"><button type="button" class="h18-clean-front-menu-summary"' "$RENDERER"
          ! grep -Fq '<details class="h18-clean-front-menu-details">' "$RENDERER"
          ! grep -Fq '.h18-clean-front-menu-details[open]>.h18-clean-front-menu-panel' "$RENDERER"
          grep -Fq '.h18-clean-front-menu-details.is-open>.h18-clean-front-menu-panel{display:block!important}' "$RENDERER"

          # Explicit mobile controller.
          grep -Fq 'details.classList.toggle("is-open",opening)' "$RENDERER"
          grep -Fq 'trigger.setAttribute("aria-expanded",opening?"true":"false")' "$RENDERER"
          grep -Fq 'document.querySelectorAll(".h18-clean-front-menu-details.is-open")' "$RENDERER"
          grep -Fq 'window.matchMedia("(max-width:782px)")' "$RENDERER"
          grep -Fq 'appearance:none;-webkit-appearance:none;font:inherit' "$RENDERER"

          # Alpha.21 canonical menu binding remains intact.
          grep -Fq "get_option('vdm_website_menu_id', null)" "$RENDERER"
          grep -Fq '$menuId = self::resolveLiveMenuId($props);' "$RENDERER"
          grep -Fq 'data-menu-source=' "$RENDERER"
          grep -Fq '3.0.0-alpha.22' "$HISTORY"

          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find "$ROOT/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          echo 'Alpha.22 desktop menu normal-layout contract: PASS'

      - name: Package Alpha.22 QA artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION='3.0.0-alpha.22'
          mkdir -p dist
          ZIP="dist/visual-designer-manager-v${VERSION}.zip"
          rm -f "$ZIP"
          (cd build && zip -qr "../$ZIP" visual-designer-manager)
          unzip -tq "$ZIP"
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/visual-designer-manager.php$')" = '1'
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/src/Frontend/Renderer.php$')" = '1'
          echo "SHA256=$(sha256sum "$ZIP" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: visual-designer-manager-v3.0.0-alpha.22-qa
          path: dist/visual-designer-manager-v3.0.0-alpha.22.zip
          if-no-files-found: error
