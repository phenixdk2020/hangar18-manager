name: QA Hangar18 Manager 0.5.5 tablet

on:
  push:
    branches:
      - development/v0.5.5
    paths:
      - '.github/workflows/qa-v055-tablet.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix tablet alignment precedence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hangar18-manager.php')
          s = p.read_text(encoding='utf-8')
          old = """            '@media(min-width:783px) and (max-width:1199px){body.page .h18-editor-page>.h18-hide-tablet{display:none!important}body.page .h18-editor-page>.h18-editor-section{margin-top:var(--h18-tablet-top,var(--h18-top,0));margin-bottom:var(--h18-tablet-bottom,var(--h18-bottom,24px));padding:var(--h18-tablet-pad,var(--h18-pad,0)) var(--h18-tablet-pad-x,var(--h18-pad-x,var(--h18-pad,0)));text-align:var(--h18-tablet-align,var(--h18-align,left));--h18-transform-x:var(--h18-tablet-transform-x);--h18-transform-y:var(--h18-tablet-transform-y);--h18-transform-scale:var(--h18-tablet-transform-scale);--h18-transform-rotate:var(--h18-tablet-transform-rotate)}body.page .h18-editor-page>.h18-editor-section .h18-editor-actions{justify-content:var(--h18-tablet-justify,var(--h18-justify,flex-start))}}' ."""
          new = """            '@media(min-width:783px) and (max-width:1199px){body.page .h18-editor-page>.h18-hide-tablet{display:none!important}body.page .h18-editor-page>.h18-editor-section{margin-top:var(--h18-tablet-top,var(--h18-top,0));margin-bottom:var(--h18-tablet-bottom,var(--h18-bottom,24px));padding:var(--h18-tablet-pad,var(--h18-pad,0)) var(--h18-tablet-pad-x,var(--h18-pad-x,var(--h18-pad,0)));text-align:var(--h18-tablet-align,var(--h18-align,left));--h18-transform-x:var(--h18-tablet-transform-x);--h18-transform-y:var(--h18-tablet-transform-y);--h18-transform-scale:var(--h18-tablet-transform-scale);--h18-transform-rotate:var(--h18-tablet-transform-rotate)}body.page .h18-editor-page>.h18-editor-section .has-text-align-left,body.page .h18-editor-page>.h18-editor-section .has-text-align-center,body.page .h18-editor-page>.h18-editor-section .has-text-align-right{ text-align:var(--h18-tablet-align,var(--h18-align,left))!important}body.page .h18-editor-page>.h18-imported-group>.h18-editor-section{text-align:var(--h18-tablet-align,var(--h18-align,left))!important}body.page .h18-editor-page>.h18-imported-composite .h18-editor-actions,body.page .h18-editor-page>.h18-editor-section .h18-editor-actions{justify-content:var(--h18-tablet-justify,var(--h18-justify,flex-start))!important}}' ."""
          if s.count(old) != 1:
              raise SystemExit(f'tablet css match count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate and rebuild package
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F 'h18-imported-group>.h18-editor-section' hangar18-manager.php
          grep -F 'h18-tablet-justify' hangar18-manager.php
          rm -rf .build
          mkdir -p .build/hangar18-manager
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          mkdir -p .build/hangar18-manager/assets
          cp assets/admin.css assets/admin.js .build/hangar18-manager/assets/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('update.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['package_sha256'] = hashlib.sha256(Path('dist/hangar18-manager.zip').read_bytes()).hexdigest()
          d['changelog'].append('Tablet-justering gælder også importerede Gutenberg-grupper, tekstjustering og handlinger.')
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -rf .build

      - name: Commit QA fix and self-clean
        run: |
          set -euo pipefail
          rm -f .github/workflows/qa-v055-tablet.yml
          git config user.name "hangar18-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "QA fix v0.5.5 tablet alignment precedence"
          git push
