name: Visual Designer Manager v0.1.3 Spatial Drop Release

on:
  push:
    branches: [main]
    paths:
      - 'clean-v013-release-now.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.1.3 source patch
        run: python .github/scripts/clean_v013_patch.py

      - name: Verify v0.1.3 source
        shell: bash
        run: |
          set -euo pipefail
          php -l clean/hangar18-manager/hangar18-manager.php
          php -l clean/hangar18-manager/src/Model/LayoutModel.php
          php -l clean/hangar18-manager/src/Diagnostics/DiagnosticStore.php
          php -l clean/hangar18-manager/src/Admin/EditorController.php
          php -l clean/hangar18-manager/src/Frontend/Renderer.php
          php -l clean/hangar18-manager/src/Update/GitHubUpdater.php
          node --check clean/hangar18-manager/assets/editor.js
          grep -q 'Version: 0.1.3' clean/hangar18-manager/hangar18-manager.php
          grep -q 'function dropPlacement' clean/hangar18-manager/assets/editor.js
          grep -q 'surface.ondrop' clean/hangar18-manager/assets/editor.js
          grep -q 'reorderAroundTarget' clean/hangar18-manager/assets/editor.js
          if grep -R -n -E 'Hangar18\\UltimateDesigner|ultimate-designer-|EditorLego|save-integrity|saved-layout-rebuild|lego-fixes-v0|lego-resize-v0' clean/hangar18-manager; then
            echo 'Legacy editor dependency found in Visual Designer Manager.' >&2
            exit 1
          fi

      - name: Build v0.1.3 package and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f dist/hangar18-manager-clean-v0.1.3.zip dist/hangar18-manager-clean.zip
          (cd clean && zip -qr ../dist/hangar18-manager-clean-v0.1.3.zip hangar18-manager)
          cp dist/hangar18-manager-clean-v0.1.3.zip dist/hangar18-manager-clean.zip
          unzip -tq dist/hangar18-manager-clean-v0.1.3.zip
          SHA="$(sha256sum dist/hangar18-manager-clean-v0.1.3.zip | awk '{print $1}')"
          python - "$SHA" <<'PY'
          import json, sys
          sha = sys.argv[1]
          data = {
              'name': 'Visual Designer Manager',
              'slug': 'hangar18-manager',
              'version': '0.1.3',
              'homepage': 'https://github.com/phenixdk2020/hangar18-manager',
              'requires': '6.4',
              'requires_php': '8.0',
              'tested': '6.8',
              'package': 'https://raw.githubusercontent.com/phenixdk2020/hangar18-manager/main/dist/hangar18-manager-clean-v0.1.3.zip',
              'sha256': sha,
              'sections': {
                  'description': 'Modeldrevet visuel WordPress-designer uden legacy editor-runtime.',
                  'changelog': '<h4>0.1.3</h4><ul><li>Fysisk drop venstre/højre ud fra pointer og nabo.</li><li>Venstre drop kan flytte eksisterende nabo mod højre, så to elementer kan ligge side om side.</li><li>Eksisterende element kan omplaceres inden for samme Kasse.</li><li>Drop-listeners duplikeres ikke længere efter Undo/Redo/render.</li></ul>'
              }
          }
          with open('clean-update.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print('Package SHA256:', sha)
          PY

      - name: Commit verified v0.1.3 release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-release-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager dist/hangar18-manager-clean-v0.1.3.zip dist/hangar18-manager-clean.zip clean-update.json
          git commit -m 'Release Visual Designer Manager v0.1.3 spatial drop fixes'
          git push origin HEAD:main
