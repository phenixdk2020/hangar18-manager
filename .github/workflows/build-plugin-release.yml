name: Build Plugin Release

on:
  push:
    branches:
      - main
    paths:
      - 'release-config.json'

permissions:
  contents: write

concurrency:
  group: hangar18-plugin-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and index canonical backlog
        id: backlog
        shell: bash
        run: |
          FILE="$(ls docs/active-backlog-v*.md | sort -V | tail -n1)"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          python3 tools/backlog-governance.py --backlog "$FILE" --output docs/backlog-index.json

      - name: Apply guarded source cleanup
        shell: bash
        run: |
          set +e
          python3 tools/whatif-source-cleanup.py --apply --report /tmp/whatif-cleanup.json >/tmp/whatif-cleanup.stdout 2>/tmp/whatif-cleanup.stderr
          CLEANUP_RC=$?
          set -e
          if [ "$CLEANUP_RC" -ne 0 ]; then
            VERSION="$(python3 -c "import json; print(json.load(open('release-config.json'))['version'])")"
            {
              echo '# Hangar18 release build failure'
              echo
              echo "- Version: $VERSION"
              echo "- Source commit: $GITHUB_SHA"
              echo "- UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo '- Step: guarded WhatIf source cleanup'
              echo
              echo '## stderr'
              echo '```text'
              cat /tmp/whatif-cleanup.stderr
              echo '```'
              echo
              echo '## stdout'
              echo '```text'
              cat /tmp/whatif-cleanup.stdout
              echo '```'
            } > docs/release-build-failure.md
            git restore --worktree -- hangar18-manager.php assets/admin.js assets/admin.css src/Admin/IntegrationAdminBootstrap.php 2>/dev/null || true
            git restore --worktree -- assets/hangar18-no-whatif-v0858.js assets/hangar18-no-whatif-v0858.css src/Admin/NoWhatIfAdminController.php 2>/dev/null || true
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- docs/release-build-failure.md
            git commit -m "Release v${VERSION} cleanup diagnostic [release-diagnostic]"
            git push
            exit "$CLEANUP_RC"
          fi
          rm -f docs/release-build-failure.md
          php -l hangar18-manager.php
          php -l src/Admin/IntegrationAdminBootstrap.php
          node --check assets/admin.js
          python3 tools/whatif-source-cleanup.py --assert-clean
          cat /tmp/whatif-cleanup.json

      - name: Apply release metadata
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('.')
          config = json.loads((root / 'release-config.json').read_text(encoding='utf-8'))
          version = str(config.get('version', '')).strip()
          title = str(config.get('title', '')).strip() or 'Release'
          channel = str(config.get('channel', '')).strip()
          backlog_ids = [str(item).strip() for item in config.get('backlog_ids', []) if str(item).strip()]
          changelog = [str(item).strip() for item in config.get('changelog', []) if str(item).strip()]

          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('release-config.json contains an invalid semantic version')
          if channel not in {'test', 'staging', 'production'}:
              raise SystemExit('release-config.json must contain channel=test|staging|production')
          if not backlog_ids:
              raise SystemExit('release-config.json must contain at least one backlog_ids entry')
          if not changelog:
              raise SystemExit('release-config.json must contain at least one changelog item')

          index = json.loads((root / 'docs/backlog-index.json').read_text(encoding='utf-8'))
          known = {str(item.get('id', '')) for item in index.get('items', [])}
          unknown = [item for item in backlog_ids if item not in known]
          if unknown:
              raise SystemExit('release-config references unknown backlog IDs: ' + ', '.join(unknown))

          php_path = root / 'hangar18-manager.php'
          php = php_path.read_text(encoding='utf-8')
          php, header_count = re.subn(
              r'(?m)^ \* Version: \d+\.\d+\.\d+\s*$',
              f' * Version: {version}',
              php,
              count=1,
          )
          php, const_count = re.subn(
              r"const VERSION = '\d+\.\d+\.\d+';",
              f"const VERSION = '{version}';",
              php,
              count=1,
          )
          if header_count != 1 or const_count != 1:
              raise SystemExit('Could not update both plugin version declarations')
          php_path.write_text(php, encoding='utf-8')

          readme_path = root / 'readme.txt'
          readme = readme_path.read_text(encoding='utf-8')
          readme, version_count = re.subn(
              r'(?m)^Version: \d+\.\d+\.\d+\s*$',
              f'Version: {version}',
              readme,
              count=1,
          )
          if version_count != 1:
              raise SystemExit('Could not update readme version')

          marker = f'== Version {version} – {title} =='
          if marker not in readme:
              insertion = readme.find('== Version ')
              if insertion < 0:
                  raise SystemExit('Could not find readme changelog insertion point')
              backlog_line = 'Backlog: ' + ', '.join(backlog_ids) + '\n'
              channel_line = 'Channel: ' + channel + '\n'
              section = marker + '\n\n' + channel_line + backlog_line + '\nNyt:\n' + ''.join(f'- {item}\n' for item in changelog) + '\n\n'
              readme = readme[:insertion] + section + readme[insertion:]
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Source QA for release support files
        shell: bash
        run: |
          python3 -m py_compile tools/backlog-governance.py tools/release-integrity.py tools/trace-redaction-qa.py tools/legacy-cleanup-audit.py tools/whatif-source-cleanup.py
          python3 tools/trace-redaction-qa.py
          python3 tools/legacy-cleanup-audit.py --output /tmp/legacy-cleanup.json --require-no-powershell --require-no-bootstrap-json --require-no-active-whatif
          python3 tools/whatif-source-cleanup.py --assert-clean
          node --check assets/admin.js
          node --check assets/ultimate-designer-trace-tools-v0879.js
          node --check assets/updater-support-v0879.js
          node --check assets/ultimate-designer-navigator-v0880.js
          node --check assets/ultimate-designer-navigator-productivity-v0881.js
          php -l hangar18-manager.php
          php -l src/Admin/IntegrationAdminBootstrap.php
          php -l src/Admin/UltimateDesignerTraceAdminController.php
          php -l src/Admin/UpdaterStateConsistencyAdminController.php
          php -l src/Admin/EditorNavigatorAdminController.php
          php -l src/Admin/LegacyCleanupAuditAdminController.php

      - name: Build installable ZIP
        shell: bash
        run: |
          rm -rf build
          mkdir -p build/hangar18-manager dist
          cp hangar18-manager.php readme.txt build/hangar18-manager/
          cp -R assets src build/hangar18-manager/
          (cd build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)

      - name: Write update manifest
        shell: bash
        run: |
          PACKAGE_SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"
          export PACKAGE_SHA
          python3 <<'PY'
          import datetime
          import json
          import os
          import pathlib

          config = json.loads(pathlib.Path('release-config.json').read_text(encoding='utf-8'))
          manifest = {
              # Keep 1.0 until every installable legacy updater accepts a newer schema.
              'schema_version': '1.0',
              'plugin': 'hangar18-manager',
              'version': str(config['version']).strip(),
              'channel': str(config['channel']).strip(),
              'backlog_ids': [str(item).strip() for item in config.get('backlog_ids', []) if str(item).strip()],
              'min_wp': '6.4',
              'min_php': '8.0',
              'published_utc': datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'package_path': 'dist/hangar18-manager.zip',
              'package_sha256': os.environ['PACKAGE_SHA'],
              'changelog': [str(item).strip() for item in config.get('changelog', []) if str(item).strip()],
          }
          pathlib.Path('update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify release package
        shell: bash
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('release-config.json'))['version'])")"
          test "$(php -r '$j=json_decode(file_get_contents("update.json"),true); echo $j["schema_version"] ?? "";')" = "1.0"
          test "$(unzip -p dist/hangar18-manager.zip hangar18-manager/hangar18-manager.php | sed -n 's/^ \* Version: //p' | head -n1 | tr -d '\r')" = "$VERSION"
          test "$(php -r '$j=json_decode(file_get_contents("update.json"),true); echo $j["version"] ?? "";')" = "$VERSION"
          echo "$(php -r '$j=json_decode(file_get_contents("update.json"),true); echo $j["package_sha256"] ?? "";')  dist/hangar18-manager.zip" | sha256sum -c -
          unzip -tq dist/hangar18-manager.zip
          if unzip -l dist/hangar18-manager.zip | grep -Eqi 'NoWhatIfAdminController|hangar18-no-whatif'; then
            echo 'Legacy WhatIf shim leaked into release ZIP.' >&2
            exit 1
          fi
          python3 tools/release-integrity.py --write-manifest

      - name: Commit release package and source cleanup
        shell: bash
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('release-config.json'))['version'])")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- hangar18-manager.php assets src/Admin readme.txt update.json release-manifest.json docs/backlog-index.json docs/release-build-failure.md dist/hangar18-manager.zip
          if git diff --cached --quiet; then
            echo 'Release files are already current.'
            exit 0
          fi
          git commit -m "Release v${VERSION} package [release-package]"
          git push
