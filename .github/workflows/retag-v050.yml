name: Retag Hangar18 Manager v0.5.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/retag-v050.yml'

permissions:
  contents: write

jobs:
  retag-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v0.5.0 tag and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          TARGET='3768f989edc2f9570c086e24f2d113aa140ee744'
          git fetch --tags --force
          test "$(git rev-parse v0.5.0^{commit})" = "$TARGET"
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/retag-v050.yml
          git commit -m 'Cleanup: remove temporary v0.5.0 retag workflow'
          git push origin HEAD:main
