name: Tag Hangar18 Manager v0.5.14

on:
  push:
    branches:
      - maintenance/tag-v0.5.14
    paths:
      - '.github/workflows/tag-v0514.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/tag-v0.5.14
          fetch-depth: 0
      - name: Tag v0.5.14 and self-clean
        shell: bash
        run: |
          set -euo pipefail
          release_sha="c74cce92ae5c5640d1a0c69c686c8b366bc079f1"
          git fetch origin main --tags
          git show "$release_sha:hangar18-manager.php" > /tmp/h18-v0514.php
          grep -F 'Version: 0.5.14' /tmp/h18-v0514.php
          grep -F "const VERSION = '0.5.14';" /tmp/h18-v0514.php
          git tag -f v0.5.14 "$release_sha"
          git push origin refs/tags/v0.5.14 --force
          git rm .github/workflows/tag-v0514.yml
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git commit -m "Clean v0.5.14 tag workflow"
          git push origin HEAD:maintenance/tag-v0.5.14
