name: Tag Hangar18 Manager v0.5.19
on:
  push:
    branches: [maintenance/tag-v0.5.19]
    paths: ['.github/workflows/tag-v0519.yml']
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/tag-v0.5.19
          fetch-depth: 0
      - name: Tag v0.5.19 and self-clean
        shell: bash
        run: |
          set -euo pipefail
          TARGET=78527d7b8a9cd17d3a4bb732ee302ff6224923f1
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$TARGET"
          if git rev-parse refs/tags/v0.5.19 >/dev/null 2>&1; then
            test "$(git rev-list -n1 v0.5.19)" = "$TARGET"
          else
            git tag v0.5.19 "$TARGET"
            git push origin v0.5.19
          fi
          rm -f .github/workflows/tag-v0519.yml
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Maintenance: remove v0.5.19 tag workflow'
          git push origin HEAD:maintenance/tag-v0.5.19
