name: Build Hangar18 Manager 0.5.10

on:
  push:
    branches:
      - qa/v0.5.10-patch
    paths:
      - '.github/workflows/build-v0510.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.5.10 patch
        run: python3 .github/v0510_patch.py

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F 'Version: 0.5.10' hangar18-manager.php
          grep -F "const VERSION = '0.5.10';" hangar18-manager.php
          grep -F "'ImageAspectRatio'      => 'Auto'" hangar18-manager.php
          grep -F "'ImageFocalXPercent'    => 50" hangar18-manager.php
          grep -F "'ImageFocalYPercent'    => 50" hangar18-manager.php
          grep -F "'ImageHeightPx'         => 0" hangar18-manager.php
          grep -F "'MobileImageHeightPx'   => 0" hangar18-manager.php
          grep -F "'Version'        => '1.11'" hangar18-manager.php
          grep -F 'h18-canvas-focal-dot' assets/admin.js
          grep -F 'h18-canvas-margin-handle' assets/admin.js
          grep -F 'h18-canvas-image-tools' assets/admin.css

      - name: Rebuild package and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build
          unzip -q dist/hangar18-manager.zip -d .build
          test -d .build/hangar18-manager
          cp hangar18-manager.php .build/hangar18-manager/hangar18-manager.php
          cp readme.txt .build/hangar18-manager/readme.txt
          cp assets/admin.js .build/hangar18-manager/assets/admin.js
          cp assets/admin.css .build/hangar18-manager/assets/admin.css
          rm -f dist/hangar18-manager.zip
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          rm -rf .verify
          mkdir .verify
          unzip -q dist/hangar18-manager.zip -d .verify
          php -l .verify/hangar18-manager/hangar18-manager.php
          node --check .verify/hangar18-manager/assets/admin.js
          grep -F 'Version: 0.5.10' .verify/hangar18-manager/hangar18-manager.php
          grep -F "const VERSION = '0.5.10';" .verify/hangar18-manager/hangar18-manager.php
          SHA=$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - "$SHA" "$NOW" <<'PY'
          import json, sys
          p='update.json'
          d=json.load(open(p))
          d['package_sha256']=sys.argv[1]
          d['published_utc']=sys.argv[2]
          open(p,'w').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf .build .verify

      - name: Diff scope QA
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD -- | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          for f in assets/admin.css assets/admin.js dist/hangar18-manager.zip hangar18-manager.php readme.txt update.json; do grep -Fx "$f" /tmp/changed.txt >/dev/null; done
          test "$(wc -l < /tmp/changed.txt)" -eq 6

      - name: Commit validated release and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v0510_patch.py .github/workflows/build-v0510.yml
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Release v0.5.10 image canvas and box model'
          git push origin HEAD:qa/v0.5.10-patch
