name: Update Visual Designer user manual graphics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-user-manual-visual-documentation.yml'
      - '.github/scripts/update_user_manual_visual_documentation.py'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update design manual and user manual
        run: python .github/scripts/update_user_manual_visual_documentation.py

      - name: Verify documentation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Krav til brugermanualens grafiske dokumentation' CLEAN-DESIGN-MANUAL.md
          grep -q 'Sådan er en webside bygget op' CLEAN-USER-MANUAL.md
          grep -q 'page-anatomy.svg' CLEAN-USER-MANUAL.md
          grep -q 'lego-hierarchy.svg' CLEAN-USER-MANUAL.md
          grep -q 'table-borders.svg' CLEAN-USER-MANUAL.md
          grep -q 'Hero / Topbanner' CLEAN-USER-MANUAL.md
          test -s docs/user-manual-assets/page-anatomy.svg
          test -s docs/user-manual-assets/lego-hierarchy.svg
          test -s docs/user-manual-assets/table-borders.svg

      - name: Commit documentation update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-docs-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add CLEAN-DESIGN-MANUAL.md CLEAN-USER-MANUAL.md
          if git diff --cached --quiet; then
            echo 'Documentation already current.'
            exit 0
          fi
          git commit -m 'Expand Visual Designer user manual with illustrated page anatomy'
          git push origin HEAD:main
