name: Update Visual Designer user manual graphics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-user-manual-visual-documentation.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update design manual and user manual
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          design_path = Path('CLEAN-DESIGN-MANUAL.md')
          user_path = Path('CLEAN-USER-MANUAL.md')

          design = design_path.read_text(encoding='utf-8')
          design = design.replace('Senest opdateret: 25. august 2026', 'Senest opdateret: 27. august 2026', 1)

          start = design.index('## 24. Dokumentationsregel')
          end = design.index('## 0.1.23 – Global Header/Footer Designer')
          documentation_rule = '''## 24. Dokumentationsregel

Når et nyt Visual Designer-designvalg godkendes:

1. Opdatér den canonical Visual Designer-model eller relevante globale indstilling.
2. Opdatér denne design- og arkitekturmanual.
3. Opdatér `CLEAN-USER-MANUAL.md`, når ændringen er synlig eller relevant for en redaktør/administrator.
4. Tilføj ændringen til release-notes/changelog.
5. Kør QA på editor, Save/Reload, Preview og frontend.
6. Byg først en verificeret GitHub-releasepakke, når den aftalte release skal publiceres.

### 24.1 Krav til brugermanualens grafiske dokumentation

Brugermanualen må ikke kun beskrive Visual Designer med tekst. Når et begreb, en arbejdsgang eller et layout forstås bedre visuelt, skal manualen suppleres med **grafiske eksempler og illustrationer**.

Som minimum skal følgende områder dokumenteres visuelt:

- en komplet websides anatomi med **Tema/Shell → Header → Side → Footer**;
- forskellen mellem **Header/Footer** og en sides **Hero/Topbanner**;
- LEGO-hierarkiet **Side → Sektion → Kasse → indholdselement**;
- typiske kolonne-, celle-split- og nested-Kasse-layouts;
- drag-and-drop med Over/Under/Venstre/Højre/Ind i;
- Desktop/Laptop/Mobil og responsive overrides;
- billedboks kontra selve billedet;
- normal kontra flydende Knap;
- Tabel, herunder cellemarkering og Excel-lignende rammevalg;
- Menu, Galleri, Formular og andre større elementtyper, når de frigives.

Grafiske eksempler skal følge disse regler:

- Illustrationer lagres som vedligeholdelige dokumentationsassets, fortrinsvis SVG til diagrammer og PNG/JPG til relevante screenshots.
- Hver illustration skal have en kort forklaring/caption og meningsfuld alt-tekst.
- Diagrammer skal vise det samme hierarki og de samme begreber som den canonical model; de må ikke introducere en alternativ layoutlogik.
- Screenshots og UI-illustrationer skal opdateres, hvis Designerens brugerflade ændres væsentligt.
- En illustration af en planlagt funktion skal tydeligt mærkes **Planlagt** og må ikke præsenteres som allerede frigivet funktionalitet.
- Før/efter-illustrationer anvendes, når de gør drag/drop, responsive ændringer, formattering eller migration lettere at forstå.
- Grafikken skal være læsbar både på almindelig desktop og ved nedskalering i dokumentation.
- Visuelle eksempler skal, hvor relevant, vise realistiske kombinationer af flere elementer frem for kun isolerede kontrolfelter.

Dokumentationen skal derfor forklare både **hvad et element er**, **hvor det kan ligge**, **hvordan det kombineres med andre elementer**, og **hvordan resultatet ser ud i en rigtig sideopbygning**.

`CLEAN-DESIGN-MANUAL.md` er fremover den autoritative arkitekturbeskrivelse for den nye Visual Designer. Den ældre `DESIGN-MANUAL.md` bevares som reference for eksisterende designstandarder og legacy 0.4.x-adfærd, indtil de relevante regler er migreret til Clean.

'''
          design = design[:start] + documentation_rule + design[end:]
          design_path.write_text(design, encoding='utf-8')

          user = user_path.read_text(encoding='utf-8')
          user = user.replace('Senest opdateret: 25. august 2026', 'Senest opdateret: 27. august 2026', 1)
          user = user.replace('Gælder fra: Visual Designer Manager 0.1.18', 'Gælder for: Visual Designer Manager 0.1.31 og nyere; planlagte funktioner er mærket **Planlagt**', 1)

          marker = '## 2. Sådan er en webside bygget op'
          if marker not in user:
              # Existing numbered top-level chapters from 2 onward move one number up.
              def renumber(m):
                  n = int(m.group(1))
                  return f'## {n + 1}. ' if n >= 2 else m.group(0)
              user = re.sub(r'^## (\d+)\. ', renumber, user, flags=re.M)

              chapter = r'''## 2. Sådan er en webside bygget op

Visual Designer bygger en webside som LEGO. Nogle elementer skaber **struktur**, mens andre er **indhold**. Header og Footer er globale, mens den enkelte sides indhold bygges af Sektioner, Kasser og indholdselementer.

![Grafisk oversigt over Header, Hero, sideindhold og Footer](docs/user-manual-assets/page-anatomy.svg)

*Figur 1 – En typisk Visual Designer-side. Header og Footer er globale. Hero/Topbanner og resten af indholdet tilhører selve siden.*

### 2.1 Det overordnede princip

```text
WORDPRESS
└── TEMA / SHELL
    ├── GLOBAL HEADER
    │   ├── Logo
    │   ├── Menu
    │   ├── Knap
    │   └── Icon/Tekst
    │
    ├── SIDE
    │   ├── Hero / Topbanner
    │   ├── Sektion
    │   │   ├── Kasse
    │   │   │   ├── Billede
    │   │   │   └── Tekst
    │   │   └── Kasse
    │   │       ├── Tekst
    │   │       └── Knap
    │   ├── Divider
    │   ├── Sektion → Tabel
    │   ├── Sektion → Galleri
    │   └── Sektion → Formular / FAQ
    │
    └── GLOBAL FOOTER
        ├── Logo
        ├── Menu / Links
        ├── Kontakt
        ├── Icons
        └── Copyright
```

### 2.2 Hvad er Tema/Shell?

Temaet er den tekniske WordPress-ramme omkring Visual Designer. Temaet skal på sigt primært stå for WordPress-lifecycle, hooks, `wp_head()`, `wp_footer()`, nødvendige wrappers, menu-/WordPress-integration og fallback.

Det visuelle design skal i stigende grad ligge i Visual Designer, så temaet ikke bliver en konkurrerende designmotor.

**Status:** Theme Shell-konverteringen er under udvikling. Den eksisterende Hangar18 Base Theme-baseline bruges fortsat som fallback, indtil visuel parity er godkendt.

### 2.3 Header

Header er et **globalt design**. Den ligger over den enkelte side og kan genbruges på mange eller alle sider.

Typisk indhold:

- Logo;
- Menu;
- Knap, fx *Bliv medlem*;
- Icon;
- kort tekst eller kontaktinformation.

```text
┌──────────────────────────────────────────────────────┐
│ [LOGO]   Hjem  Køretøjer  Events  Galleri  [Kontakt]│
└──────────────────────────────────────────────────────┘
```

Header har sin egen globale model og versionshistorik. Desktop, Laptop og Mobil kan have forskellige geometrier af de samme elementer.

### 2.4 Menu

**Menu** er et selvstændigt visuelt element og bør ikke hardcodes i Headeren. Det skal kunne bruge en WordPress-menu som datakilde, mens Visual Designer styrer udseendet.

Planlagte visuelle indstillinger omfatter bl.a. skrifttype, størrelse, farve, afstand, hover, aktiv side, justering og mobil/hamburger-visning.

**Status: Planlagt som native Visual Designer-element.** WordPress-menuadministration findes allerede separat i Manageren.

### 2.5 Hero / Topbanner

Hero/Topbanner er normalt den første store **Sektion inde i den enkelte side**. Den er derfor ikke det samme som Headeren.

```text
GLOBAL HEADER
────────────────────────────────────
HERO / TOPBANNER
  Baggrundsbillede
  Overskrift
  Undertekst
  [ Knap ]
────────────────────────────────────
RESTEN AF SIDEN
────────────────────────────────────
GLOBAL FOOTER
```

Hero er typisk høj og markant. Topbanner er samme grundidé i en lavere variant. Arkitektonisk bør Hero/Topbanner være en **Sektion-preset/specialisering**, ikke en separat layoutmotor.

Typiske indstillinger: baggrundsbillede, Cover/Contain/manuel billedplacering, focal point, overlay, højde og responsive overrides.

**Status: Planlagt.**

### 2.6 Sektion, Kasse og LEGO-hierarkiet

![Grafisk illustration af Side, Sektion, Kasse og indholdselementer](docs/user-manual-assets/lego-hierarchy.svg)

*Figur 2 – Sektion er sidens hovedblok. Kasse er den fleksible lokale container. Kasser kan indeholde Kasser, men Sektioner nestes ikke som almindelige Kasser.*

En **Sektion** ligger direkte på siden og opdeler den i større områder. En **Kasse** bruges inde i en Sektion eller anden Kasse til kolonner, cards, grupper og nested layout.

```text
SIDE
└── SEKTION
    ├── KASSE
    │   ├── Billede
    │   └── Tekst
    └── KASSE
        ├── Tekst
        └── Knap
```

**Huskeregel:** Sektion = stort område. Kasse = lokal LEGO-klods.

### 2.7 Tekst

Tekst-elementet bruges til overskrift, brødtekst, lister og links. En Tekst-boks kan have overskrift H2-H6 og brødtekst i samme fysiske element.

Typiske indstillinger: skrifttype, størrelse, farver, alignment, baggrund, padding, ramme, radius og Afstand X/Y.

### 2.8 Billede

Billede-elementet består af to lag: **billedboksen** og **selve billedet**. Billedet kan derfor fx være Contain, Cover, Original, Stretch eller Manuel inde i en større fysisk boks.

Billede skal desuden kunne fungere som link med samme fælles linkmodel som Knap og Icon:

- Ingen;
- Intern side;
- Ekstern URL;
- Anker;
- E-mail;
- Telefon;
- valgfrit *Åbn i ny fane* hvor relevant.

**Status for billede som link: Planlagt udvidelse.**

### 2.9 Knap

Knap er et selvstændigt indholdselement og skal ikke behandles som Tekst.

En normal Knap deltager i det almindelige LEGO-layout. En **Flydende Knap** er et parent-relativt overlay, som kan placeres over andet indhold uden at reservere en normal grid-celle eller skubbe søskende.

Linktyper kan bl.a. være intern side, ekstern URL, anker, e-mail og telefon.

### 2.10 Icon

Icon er et lille grafisk element til fx telefon, mail, lokation, sociale medier, pil, download eller information. Det skal kunne styles med størrelse, farve, baggrund, padding, ramme/radius og eventuelt link.

**Status: Planlagt.**

### 2.11 Divider

Divider er en visuel skillelinje mellem indholdsområder. Typiske indstillinger: bredde, tykkelse, farve, alignment, afstand og stregtype som solid/dashed/dotted.

**Status: Planlagt.**

### 2.12 Spacer

Spacer er en bevidst tom layoutblok. Den kan bruges, når der skal reserveres fysisk plads, som ikke naturligt hører til et naboelements padding eller Afstand X/Y.

Spacer bør bruges sparsomt; almindelig afstand mellem elementer styres normalt med Afstand X/Y.

**Status: Planlagt.**

### 2.13 Tabel

Tabel bruges til strukturerede data med rækker, kolonner, overskriftsrække, kolonnebredder, tekst, links, farver, padding og alignment.

![Grafisk eksempel på cellemarkering og Excel-lignende tabelrammer](docs/user-manual-assets/table-borders.svg)

*Figur 3 – Planlagt Tabel-element. En eller flere celler kan markeres, hvorefter rammer vælges på samme måde som i et regneark.*

Rammer skal kunne styres som i Excel, bl.a.:

- Ydre;
- Indre;
- Vandret;
- Lodret;
- Top;
- Bund;
- Venstre;
- Højre;
- Alle;
- Ingen.

For den valgte ramme skal tykkelse, farve og senere stregtype kunne styres. Flere celler skal kunne markeres samtidig.

På mobil skal Tabel understøtte relevante strategier som vandret scroll, skjul valgte kolonner eller stablet label/værdi-visning.

**Status: Planlagt.**

### 2.14 Galleri

Galleri viser flere billeder og kan senere tilbyde layouts som Grid, Masonry, Slider/Carousel og Lightbox. Et dynamisk Galleri kan senere kobles til Managerens galleri-data.

**Status: Native Visual Designer-element er planlagt.**

### 2.15 Video

Video-element kan bruges til fx YouTube, Vimeo eller lokal video med relevante indstillinger for URL, controls, autoplay/mute, poster og aspect ratio.

**Status: Planlagt.**

### 2.16 Accordion / FAQ

Accordion/FAQ bruges til indhold, hvor sektioner åbnes og lukkes efter behov. Det er velegnet til ofte stillede spørgsmål eller længere forklaringer.

**Status: Planlagt.**

### 2.17 Tabs

Tabs opdeler beslægtet indhold i faner, fx *Tekniske data*, *Historie* og *Billeder*.

**Status: Planlagt.**

### 2.18 Formular

Formular bruges til fx Kontakt, Bliv medlem og eventtilmelding. Formularfelter kan omfatte tekst, e-mail, telefon, textarea, valgfelter og submit-knap.

**Status: Planlagt.**

### 2.19 Dynamiske elementer

Dynamiske elementer kombinerer Manager-data med et Visual Designer-layout. Planlagte typer omfatter bl.a.:

- Køretøjsliste/-detalje;
- Eventliste/-detalje;
- dynamisk Billedgalleri.

Designet styres af Visual Designer, mens indhold/data kommer fra Managerens fælles datalag.

**Status: Planlagt efter fælles dataarkitektur.**

### 2.20 Footer

Footer er ligesom Header et **globalt design**, der ligger uden for den enkelte sides model.

Typisk indhold:

```text
┌────────────────────────────────────────────────────────┐
│ [LOGO]     LINKS             KONTAKT                   │
│             Hjem              Telefon                  │
│ Foreningen  Køretøjer         E-mail                   │
│             Events            Sociale ikoner           │
│                                                        │
│ © Foreningen                                           │
└────────────────────────────────────────────────────────┘
```

Footer kan bruge Logo, Tekst, Menu/Links, Kasser, Icons og kontaktoplysninger og har sin egen globale versionshistorik.

### 2.21 Et komplet sideeksempel

En færdig side kan fx være opbygget sådan:

```text
GLOBAL HEADER
├── Logo
├── Menu
└── Knap "Bliv medlem"

SIDE: Køretøjer og materiel
├── HERO / TOPBANNER
│   ├── Baggrundsbillede
│   ├── Tekst "Køretøjer og materiel"
│   └── Knap "Se samlingen"
├── SEKTION
│   ├── Kasse → Billede som link
│   └── Kasse → Tekst + Knap
├── Divider
├── SEKTION
│   ├── Tekst "Tekniske data"
│   └── Tabel
├── Spacer
├── SEKTION
│   ├── Tekst "Billeder"
│   └── Galleri
├── SEKTION → Accordion / FAQ
└── SEKTION → Formular

GLOBAL FOOTER
├── Logo
├── Menu / Links
├── Kontakt
├── Icons
└── Copyright
```

### 2.22 Hvad er globalt, og hvad tilhører siden?

| Del | Global | Del af den enkelte side |
|---|---:|---:|
| Tema/Shell | Ja, teknisk ramme | Nej |
| Header | Ja | Nej |
| Menu i Header/Footer | Global placering | Nej |
| Hero/Topbanner | Nej | Ja |
| Sektion | Nej | Ja |
| Kasse | Nej | Ja |
| Tekst/Billede/Knap | Nej, normalt | Ja |
| Footer | Ja | Nej |

**Den vigtigste regel:** Header og Footer er globale. Selve siden består af Sektioner. Sektioner indeholder Kasser og indholdselementer. Kasser kan igen indeholde andre Kasser og elementer. Hero/Topbanner er en særlig Sektion øverst på selve siden.

---

'''
              anchor = '## 3. Hvor findes funktionerne?'
              if anchor not in user:
                  raise SystemExit('Expected renumbered chapter anchor not found')
              user = user.replace(anchor, chapter + anchor, 1)

          # Add manual history entry once.
          history_anchor = '| 1.0 | Første Visual Designer-brugermanual baseret på funktionerne gennem 0.1.18 og den godkendte målarkitektur. |'
          if '| 1.1 |' not in user and history_anchor in user:
              user = user.replace(history_anchor, history_anchor + '\n| 1.1 | Nyt kapitel om websides anatomi, Header/Footer kontra Hero, elementoversigt samt grafiske illustrationer og tydelig markering af planlagt funktionalitet. |', 1)

          user_path.write_text(user, encoding='utf-8')
          PY

      - name: Verify documentation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Krav til brugermanualens grafiske dokumentation' CLEAN-DESIGN-MANUAL.md
          grep -q 'Sådan er en webside bygget op' CLEAN-USER-MANUAL.md
          grep -q 'page-anatomy.svg' CLEAN-USER-MANUAL.md
          grep -q 'lego-hierarchy.svg' CLEAN-USER-MANUAL.md
          grep -q 'table-borders.svg' CLEAN-USER-MANUAL.md
          grep -q 'Hero / Topbanner' CLEAN-USER-MANUAL.md
          grep -q 'Tabel – rammer som i Excel' docs/user-manual-assets/table-borders.svg
          test -s docs/user-manual-assets/page-anatomy.svg
          test -s docs/user-manual-assets/lego-hierarchy.svg
          test -s docs/user-manual-assets/table-borders.svg

      - name: Commit documentation update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-docs-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add CLEAN-DESIGN-MANUAL.md CLEAN-USER-MANUAL.md
          if git diff --cached --quiet; then
            echo 'Documentation already current.'
            exit 0
          fi
          git commit -m 'Expand Visual Designer user manual with illustrated page anatomy'
          git push origin HEAD:main
