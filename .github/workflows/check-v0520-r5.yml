name: Check v0.5.20 r5

on:
  push:
    branches:
      - qa/v0.5.20-r3-check
    paths:
      - '.github/workflows/check-v0520-r5.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v0.5.20-r3-check
          fetch-depth: 0
      - name: Run exact source checks
        shell: bash
        run: |
          set +e
          LOG=.github/check-v0520-r5.txt
          : > "$LOG"
          python3 .github/scripts/prepare_finalize_v0520_r3.py >> "$LOG" 2>&1
          echo "prepare_status=$?" >> "$LOG"
          python3 .github/scripts/patch_v0520.py >> "$LOG" 2>&1
          echo "patch_status=$?" >> "$LOG"
          php -l hangar18-manager.php >> "$LOG" 2>&1
          echo "php_status=$?" >> "$LOG"
          node --check assets/admin.js >> "$LOG" 2>&1
          echo "js_status=$?" >> "$LOG"
          python3 .github/scripts/qa_v0520.py >> "$LOG" 2>&1
          echo "qa_status=$?" >> "$LOG"
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add "$LOG"
          git commit -m 'QA: record v0.5.20 r5 check'
          git push origin HEAD:qa/v0.5.20-r3-check
