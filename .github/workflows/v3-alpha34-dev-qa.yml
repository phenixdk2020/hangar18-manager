name: V3 Alpha.34 Dev QA

on:
  push:
    branches:
      - 'agent/v3-alpha34-canonical-responsive-preview'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock V1 baseline
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='dc3bad403c764f4ec123a526333a781d05dde491'
          git cat-file -e "${BASELINE}^{commit}"
          git diff --exit-code "$BASELINE" -- clean/hangar18-manager

      - name: Build Alpha.34
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/build_v3_alpha34.py
          python3 .github/scripts/build_v3_alpha34.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          ROOT='build/visual-designer-manager'
          grep -Fq 'Version: 3.0.0-alpha.34' "$ROOT/visual-designer-manager.php"
          grep -Fq "define('VDM_VERSION', '3.0.0-alpha.34');" "$ROOT/visual-designer-manager.php"
          test -f "$ROOT/assets/editor-v0183-canonical-responsive-preview.js"
          test -f "$ROOT/assets/editor-v0183-canonical-responsive-preview.css"
          test ! -e "$ROOT/assets/editor-v0182-v1-mobile-parity.js"
          test ! -e "$ROOT/assets/editor-v0182-v1-mobile-parity.css"
          grep -Fq 'var WIDTHS = { laptop: 1180, tablet: 980, mobile: 390 };' "$ROOT/assets/editor-v0183-canonical-responsive-preview.js"
          grep -Fq "hidden(form, 'action', 'h18_clean_preview');" "$ROOT/assets/editor-v0183-canonical-responsive-preview.js"
          grep -Fq 'window.H18VDDesigner = Object.assign' "$ROOT/assets/editor-v018-core.js"
          grep -Fq "document.dispatchEvent(new CustomEvent('h18-clean-model-changed'" "$ROOT/assets/editor-v018-core.js"
          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find "$ROOT/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Package smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vdm-alpha34
          (cd build && zip -qr /tmp/vdm-alpha34/visual-designer-manager-v3.0.0-alpha.34.zip visual-designer-manager)
          unzip -tq /tmp/vdm-alpha34/visual-designer-manager-v3.0.0-alpha.34.zip
          unzip -Z1 /tmp/vdm-alpha34/visual-designer-manager-v3.0.0-alpha.34.zip | grep -Fq 'visual-designer-manager/assets/editor-v0183-canonical-responsive-preview.js'
          if unzip -Z1 /tmp/vdm-alpha34/visual-designer-manager-v3.0.0-alpha.34.zip | grep -Fq 'editor-v0182-v1-mobile-parity'; then
            echo 'Retired Alpha.33 parity asset found in package' >&2
            exit 1
          fi
