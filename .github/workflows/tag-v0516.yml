name: Tag Hangar18 Manager v0.5.16

on:
  push:
    branches:
      - maintenance/tag-v0.5.16
    paths:
      - '.github/workflows/tag-v0516.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/tag-v0.5.16
          fetch-depth: 0
      - name: Tag v0.5.16 and self-clean
        shell: bash
        run: |
          set -euo pipefail
          TARGET=cdc8c86ad610f7e93f4cf73726a88777fe4c496a
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$TARGET"
          if git rev-parse "refs/tags/v0.5.16" >/dev/null 2>&1; then
            test "$(git rev-list -n1 v0.5.16)" = "$TARGET"
          else
            git tag v0.5.16 "$TARGET"
            git push origin v0.5.16
          fi
          rm -f .github/workflows/tag-v0516.yml
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Maintenance: remove v0.5.16 tag workflow'
          git push origin HEAD:maintenance/tag-v0.5.16
