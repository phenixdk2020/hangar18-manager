name: Apply Visual Designer Manager 0.1.31

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0131.yml'
      - '.github/scripts/v0131_finalize.py'
      - 'clean/hangar18-manager/assets/editor-v0131.js'
      - 'clean/hangar18-manager/assets/editor-v0131.css'
      - 'clean/hangar18-manager/src/Frontend/ThemeShell.php'

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize readme metadata
        run: python .github/scripts/v0131_finalize.py

      - name: PHP syntax
        run: find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Regression QA
        run: |
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php

      - name: Verify 0.1.31 behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Version: 0.1.31' clean/hangar18-manager/hangar18-manager.php
          grep -Fq "H18_CLEAN_VERSION', '0.1.31'" clean/hangar18-manager/hangar18-manager.php
          grep -Fq "editor-v0131.js" clean/hangar18-manager/hangar18-manager.php
          grep -Fq "editor-v0131.css" clean/hangar18-manager/hangar18-manager.php
          grep -Fq 'captureTextOffsets' clean/hangar18-manager/assets/editor-v0131.js
          grep -Fq 'restoreTextOffsets' clean/hangar18-manager/assets/editor-v0131.js
          grep -Fq 'h18-clean-node--button.is-floating' clean/hangar18-manager/assets/editor-v0131.js
          grep -Fq "handle.draggable = false" clean/hangar18-manager/assets/editor-v0131.js
          grep -Fq "drag.card.style.left = leftPx + 'px'" clean/hangar18-manager/assets/editor-v0131.js
          grep -Fq "commitInspectorField('gx'" clean/hangar18-manager/assets/editor-v0131.js
          grep -Fq "commitInspectorField('gy'" clean/hangar18-manager/assets/editor-v0131.js
          grep -Fq 'ThemeShell::register' clean/hangar18-manager/hangar18-manager.php
          grep -Fq "CUTOVER_OPTION" clean/hangar18-manager/src/Frontend/ThemeShell.php
          grep -Fq "get_option(self::CUTOVER_OPTION, '0') === '1'" clean/hangar18-manager/src/Frontend/ThemeShell.php
          grep -Fq 'Version: 0.1.31' clean/hangar18-manager/readme.txt
          grep -Fq '== 0.1.31 ==' clean/hangar18-manager/readme.txt
          grep -Fq '"version": "0.1.31"' clean/hangar18-manager/release-history.json
          grep -Fq '<h4>0.1.31</h4>' clean-release-notes.html

      - name: Commit finalized readme
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-ci-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager/readme.txt
          if git diff --cached --quiet; then
            echo 'Readme already finalized.'
            exit 0
          fi
          git commit -m 'Finalize Visual Designer Manager 0.1.31 metadata'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
