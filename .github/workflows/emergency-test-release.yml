name: Emergency Test Release Build

on:
  push:
    branches: [main]
    paths:
      - 'release-now.txt'
  pull_request:
    branches: [main]
    paths:
      - 'release-now.txt'

permissions:
  contents: write

concurrency:
  group: hangar18-emergency-test-release-${{ github.event.pull_request.number || 'push' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release config
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          c=json.load(open('release-config.json',encoding='utf-8'))
          v=str(c.get('version','')).strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+',v), v
          assert c.get('channel') == 'test'
          print('Building test release', v)
          PY

      - name: Apply guarded source migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/whatif-source-cleanup.py --apply --report /tmp/whatif-cleanup.json
          python3 tools/whatif-source-cleanup.py --assert-clean
          python3 tools/updater-install-hardening.py --apply --report /tmp/updater-hardening.json
          python3 tools/updater-install-hardening.py --assert-hardened
          php -l hangar18-manager.php
          php -l src/Admin/IntegrationAdminBootstrap.php
          php -l src/Admin/UpdaterPostInstallVerificationAdminController.php
          php -l src/Autoload.php
          node --check assets/admin.js
          node --check assets/ultimate-designer-lego-inspector-only-v0847.js
          node --check assets/ultimate-designer-unsaved-preview.js
          node --check assets/ultimate-designer-navigator-productivity-v0881.js
          node --check assets/updater-support-v0879.js

      - name: Apply version metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('.')
          cfg=json.loads((root/'release-config.json').read_text(encoding='utf-8'))
          v=str(cfg['version']).strip()
          p=root/'hangar18-manager.php'
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'(?m)^ \* Version: \d+\.\d+\.\d+\s*$',f' * Version: {v}',s,count=1)
          s,n2=re.subn(r"const VERSION = '\d+\.\d+\.\d+';",f"const VERSION = '{v}';",s,count=1)
          if n1!=1 or n2!=1: raise SystemExit('plugin version metadata update failed')
          p.write_text(s,encoding='utf-8')
          r=root/'readme.txt'
          x=r.read_text(encoding='utf-8')
          x,n=re.subn(r'(?m)^Version: \d+\.\d+\.\d+\s*$',f'Version: {v}',x,count=1)
          if n!=1: raise SystemExit('readme version update failed')
          r.write_text(x,encoding='utf-8')
          PY
          php -l hangar18-manager.php

      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          rm -f dist/hangar18-manager.zip
          mkdir -p build/hangar18-manager dist
          cp hangar18-manager.php readme.txt build/hangar18-manager/
          cp -R assets src build/hangar18-manager/
          rm -f build/hangar18-manager/assets/hangar18-no-whatif-v0858.js build/hangar18-manager/assets/hangar18-no-whatif-v0858.css
          rm -f build/hangar18-manager/src/Admin/NoWhatIfAdminController.php
          (cd build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -tq dist/hangar18-manager.zip

      - name: Write update manifest
        shell: bash
        run: |
          export PACKAGE_SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"
          python3 - <<'PY'
          import datetime,json,os,pathlib
          cfg=json.loads(pathlib.Path('release-config.json').read_text(encoding='utf-8'))
          m={
            'schema_version':'1.0',
            'plugin':'hangar18-manager',
            'version':str(cfg['version']).strip(),
            'channel':'test',
            'backlog_ids':[str(x).strip() for x in cfg.get('backlog_ids',[]) if str(x).strip()],
            'min_wp':'6.4','min_php':'8.0',
            'published_utc':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'package_path':'dist/hangar18-manager.zip',
            'package_sha256':os.environ['PACKAGE_SHA'],
            'changelog':[str(x).strip() for x in cfg.get('changelog',[]) if str(x).strip()],
          }
          pathlib.Path('update.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Verify package contract
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json;print(json.load(open('release-config.json'))['version'])")"
          MANIFEST_VERSION="$(python3 -c "import json;print(json.load(open('update.json'))['version'])")"
          SCHEMA="$(python3 -c "import json;print(json.load(open('update.json'))['schema_version'])")"
          SHA="$(python3 -c "import json;print(json.load(open('update.json'))['package_sha256'])")"
          ZIP_VERSION="$(unzip -p dist/hangar18-manager.zip hangar18-manager/hangar18-manager.php | sed -n 's/^ \* Version: //p' | head -n1 | tr -d '\r')"
          test "$VERSION" = "$MANIFEST_VERSION"
          test "$VERSION" = "$ZIP_VERSION"
          test "$SCHEMA" = "1.0"
          echo "$SHA  dist/hangar18-manager.zip" | sha256sum -c -
          if unzip -Z1 dist/hangar18-manager.zip | grep -Eqi 'NoWhatIfAdminController|hangar18-no-whatif'; then
            echo 'Legacy WhatIf shim leaked into ZIP' >&2; exit 1
          fi
          tar -czf release-source-v0882.tar.gz hangar18-manager.php readme.txt assets src

      - name: Upload verified package artifact
        uses: actions/upload-artifact@v4
        with:
          name: hangar18-manager-v0882
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/hangar18-manager.zip
            update.json
            release-source-v0882.tar.gz

      - name: Publish verified PR build to main
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release-v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json;print(json.load(open('release-config.json'))['version'])")"
          rm -rf /tmp/h18-release
          mkdir -p /tmp/h18-release/dist /tmp/h18-release/assets /tmp/h18-release/src/Admin
          cp dist/hangar18-manager.zip /tmp/h18-release/dist/
          cp update.json hangar18-manager.php readme.txt /tmp/h18-release/
          cp assets/admin.js assets/admin.css assets/updater-support-v0879.js /tmp/h18-release/assets/
          cp src/Admin/IntegrationAdminBootstrap.php /tmp/h18-release/src/Admin/

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B h18-release-publish origin/main

          cp /tmp/h18-release/hangar18-manager.php ./hangar18-manager.php
          cp /tmp/h18-release/readme.txt ./readme.txt
          cp /tmp/h18-release/update.json ./update.json
          cp /tmp/h18-release/dist/hangar18-manager.zip ./dist/hangar18-manager.zip
          cp /tmp/h18-release/assets/admin.js ./assets/admin.js
          cp /tmp/h18-release/assets/admin.css ./assets/admin.css
          cp /tmp/h18-release/assets/updater-support-v0879.js ./assets/updater-support-v0879.js
          cp /tmp/h18-release/src/Admin/IntegrationAdminBootstrap.php ./src/Admin/IntegrationAdminBootstrap.php
          rm -f assets/hangar18-no-whatif-v0858.js assets/hangar18-no-whatif-v0858.css src/Admin/NoWhatIfAdminController.php

          git add -A -- hangar18-manager.php readme.txt update.json dist/hangar18-manager.zip assets/admin.js assets/admin.css assets/updater-support-v0879.js assets/hangar18-no-whatif-v0858.js assets/hangar18-no-whatif-v0858.css src/Admin/IntegrationAdminBootstrap.php src/Admin/NoWhatIfAdminController.php
          git commit -m "Release v${VERSION} package [emergency-release]"
          git push origin HEAD:main

      - name: Commit package on direct push only
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json;print(json.load(open('release-config.json'))['version'])")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- hangar18-manager.php readme.txt update.json dist/hangar18-manager.zip assets src/Admin
          git commit -m "Release v${VERSION} package [emergency-release]"
          git push
