name: Publish Hangar18 Manager 0.4.3

on:
  push:
    branches:
      - main
    paths:
      - 'patch-v043/**'
      - '.github/workflows/materialize-v043.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build 0.4.3 from verified 0.4.2 package
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/hangar18-manager.zip
          cat patch-v043/part-01.txt patch-v043/part-02.txt patch-v043/part-03.txt patch-v043/part-04.txt > /tmp/h18-v043.patch
          rm -rf .build
          mkdir -p .build
          unzip -q dist/hangar18-manager.zip -d .build
          test -f .build/hangar18-manager/hangar18-manager.php
          grep -F 'Version: 0.4.2' .build/hangar18-manager/hangar18-manager.php
          (
            cd .build/hangar18-manager
            patch --batch -p1 < /tmp/h18-v043.patch
            php -l hangar18-manager.php
            node --check assets/admin.js
            grep -F 'Version: 0.4.3' hangar18-manager.php
            grep -F "const VERSION = '0.4.3';" hangar18-manager.php
            grep -F 'CONTENT_LAYOUT_OPTION' hangar18-manager.php
            grep -F 'handle_save_event_layout' hangar18-manager.php
            grep -F 'handle_save_gallery_layout' hangar18-manager.php
            grep -F 'handle_save_menu_pin' hangar18-manager.php
            grep -F 'h18-scroll-sticky' hangar18-manager.php
            grep -F "justify-content:' . \$justify . '}.h18-album-card{" hangar18-manager.php
          )
          rm -f dist/hangar18-manager.zip
          (
            cd .build
            zip -qr ../dist/hangar18-manager.zip hangar18-manager
          )
          unzip -t dist/hangar18-manager.zip
          sha256sum dist/hangar18-manager.zip

      - name: Update source and manifest
        shell: bash
        run: |
          set -euo pipefail
          cp .build/hangar18-manager/hangar18-manager.php hangar18-manager.php
          cp .build/hangar18-manager/readme.txt readme.txt
          mkdir -p assets
          cp .build/hangar18-manager/assets/admin.css assets/admin.css
          cp .build/hangar18-manager/assets/admin.js assets/admin.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          from datetime import datetime, timezone

          package = Path('dist/hangar18-manager.zip')
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          manifest = {
              'schema_version': '1.0',
              'plugin': 'hangar18-manager',
              'version': '0.4.3',
              'min_wp': '6.4',
              'min_php': '8.0',
              'published_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'package_path': 'dist/hangar18-manager.zip',
              'package_sha256': digest,
              'changelog': [
                  'Events: global venstre/midtstillet placering for oversigt og detaljesider.',
                  'Billedgalleri: global venstre/midtstillet placering for oversigt og albumsider.',
                  'Menu: ny Pin menu/header ved scroll-indstilling.',
                  'Sticky CSS-fallback gør pinning uafhængig af den gamle PowerShell-shell.',
                  'Ny Hangar18-ContentLayout.json schema 1.0.',
                  'Eksisterende event- og galleri-sider genbygges efter layoutændring med backup først.'
              ]
          }
          Path('update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Published SHA-256:', digest)
          PY

      - name: Commit release and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          rm -rf package-parts package-v043 patch-v043
          rm -f _upload_probe.txt
          rm -f .github/workflows/materialize-v043.yml
          git config user.name "hangar18-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git add -f dist/hangar18-manager.zip
          git commit -m "Publish Hangar18 Manager 0.4.3"
          git push
