name: Materialize Hangar18 Manager 0.4.3

on:
  push:
    branches:
      - main
    paths:
      - 'package-v043/**'
      - '.github/workflows/materialize-v043.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist .build
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, hashlib

          out = bytearray()
          for path in sorted(Path('package-v043').glob('part-*.b64')):
              text = path.read_text(encoding='utf-8', errors='ignore')
              clean = ''.join(ch for ch in text if ch.isalnum() or ch in '+/=')
              pos = 0
              segments = []
              for m in re.finditer(r'=+', clean):
                  end = m.end()
                  segment = clean[pos:end]
                  if segment:
                      segments.append(segment)
                  pos = end
              if pos < len(clean):
                  segments.append(clean[pos:])

              print(f'{path}: clean={len(clean)} segments={len(segments)}')
              for index, segment in enumerate(segments, 1):
                  segment += '=' * ((4 - len(segment) % 4) % 4)
                  try:
                      decoded = base64.b64decode(segment, validate=True)
                  except Exception as exc:
                      raise SystemExit(f'{path} segment {index} invalid: len={len(segment)} error={exc}')
                  out.extend(decoded)

          target = Path('dist/hangar18-manager.zip')
          target.write_bytes(out)
          digest = hashlib.sha256(out).hexdigest()
          print('Actual package SHA-256:', digest)
          expected = '296b41c6f7dc56b41ec3dcda7f336072025b60d20dab9fbcf61ae2f1375b65f2'
          if digest != expected:
              raise SystemExit(f'SHA mismatch: expected {expected}, actual {digest}')
          PY

      - name: Extract repository source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build
          unzip -q dist/hangar18-manager.zip -d .build
          cp .build/hangar18-manager/hangar18-manager.php hangar18-manager.php
          cp .build/hangar18-manager/readme.txt readme.txt
          mkdir -p assets
          cp .build/hangar18-manager/assets/admin.css assets/admin.css
          cp .build/hangar18-manager/assets/admin.js assets/admin.js
          rm -rf .build

      - name: Commit package and source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hangar18-build"
          git config user.email "actions@users.noreply.github.com"
          git add -f dist/hangar18-manager.zip
          git add hangar18-manager.php readme.txt assets/admin.css assets/admin.js
          if git diff --cached --quiet; then
            echo "Package and source are already current."
            exit 0
          fi
          git commit -m "Materialize Hangar18 Manager 0.4.3 package and source"
          git push
