name: Materialize Hangar18 Manager 0.4.3

on:
  push:
    branches:
      - main
    paths:
      - 'package-v043/**'
      - '.github/workflows/materialize-v043.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist .build
          cat package-v043/part-001.b64 package-v043/part-002.b64 package-v043/part-003.b64 package-v043/part-004.b64 package-v043/part-005.b64 package-v043/part-006.b64 | base64 --decode > dist/hangar18-manager.zip
          echo "296b41c6f7dc56b41ec3dcda7f336072025b60d20dab9fbcf61ae2f1375b65f2  dist/hangar18-manager.zip" | sha256sum -c -

      - name: Extract repository source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build
          unzip -q dist/hangar18-manager.zip -d .build
          cp .build/hangar18-manager/hangar18-manager.php hangar18-manager.php
          cp .build/hangar18-manager/readme.txt readme.txt
          mkdir -p assets
          cp .build/hangar18-manager/assets/admin.css assets/admin.css
          cp .build/hangar18-manager/assets/admin.js assets/admin.js
          rm -rf .build

      - name: Commit package and source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hangar18-build"
          git config user.email "actions@users.noreply.github.com"
          git add -f dist/hangar18-manager.zip
          git add hangar18-manager.php readme.txt assets/admin.css assets/admin.js
          if git diff --cached --quiet; then
            echo "Package and source are already current."
            exit 0
          fi
          git commit -m "Materialize Hangar18 Manager 0.4.3 package and source"
          git push
