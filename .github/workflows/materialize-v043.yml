name: Materialize Hangar18 Manager 0.4.3

on:
  push:
    branches:
      - main
    paths:
      - 'package-v043/**'
      - '.github/workflows/materialize-v043.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and validate ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist .build
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, hashlib

          out = bytearray()
          for path in sorted(Path('package-v043').glob('part-*.b64')):
              text = path.read_text(encoding='utf-8', errors='ignore')
              clean = ''.join(ch for ch in text if ch.isalnum() or ch in '+/=')
              clean += '=' * ((4 - len(clean) % 4) % 4)
              try:
                  decoded = base64.b64decode(clean, validate=True)
              except Exception as exc:
                  raise SystemExit(f'{path} invalid base64: len={len(clean)} error={exc}')
              print(f'{path}: clean={len(clean)} decoded={len(decoded)}')
              out.extend(decoded)

          target = Path('dist/hangar18-manager.zip')
          target.write_bytes(out)
          print('Package bytes:', len(out))
          print('Actual package SHA-256:', hashlib.sha256(out).hexdigest())
          PY
          unzip -t dist/hangar18-manager.zip
          rm -rf .build
          mkdir -p .build
          unzip -q dist/hangar18-manager.zip -d .build
          test -f .build/hangar18-manager/hangar18-manager.php
          grep -F 'Version: 0.4.3' .build/hangar18-manager/hangar18-manager.php
          grep -F "const VERSION = '0.4.3';" .build/hangar18-manager/hangar18-manager.php
          grep -F 'CONTENT_LAYOUT_OPTION' .build/hangar18-manager/hangar18-manager.php
          grep -F 'handle_save_event_layout' .build/hangar18-manager/hangar18-manager.php
          grep -F 'handle_save_gallery_layout' .build/hangar18-manager/hangar18-manager.php
          grep -F 'handle_save_menu_pin' .build/hangar18-manager/hangar18-manager.php
          grep -F 'h18-scroll-sticky' .build/hangar18-manager/hangar18-manager.php

      - name: Extract repository source
        shell: bash
        run: |
          set -euo pipefail
          cp .build/hangar18-manager/hangar18-manager.php hangar18-manager.php
          cp .build/hangar18-manager/readme.txt readme.txt
          mkdir -p assets
          cp .build/hangar18-manager/assets/admin.css assets/admin.css
          cp .build/hangar18-manager/assets/admin.js assets/admin.js
          rm -rf .build

      - name: Commit package and source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hangar18-build"
          git config user.email "actions@users.noreply.github.com"
          git add -f dist/hangar18-manager.zip
          git add hangar18-manager.php readme.txt assets/admin.css assets/admin.js
          if git diff --cached --quiet; then
            echo "Package and source are already current."
            exit 0
          fi
          git commit -m "Materialize Hangar18 Manager 0.4.3 package and source"
          git push
