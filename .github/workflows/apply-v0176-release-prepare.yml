name: Prepare Visual Designer Manager 0.1.76 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/prepare_v0176_release.py'
      - '.github/scripts/v0176_release_qa.py'
      - '.github/workflows/apply-v0176-release-prepare.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare v0.1.76 release candidate
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_v0176_release.py

      - name: Syntax
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/scripts/prepare_v0176_release.py \
            .github/scripts/v0173_editor_frontend_parity_qa.py \
            .github/scripts/v0174_module_cutover_qa.py \
            .github/scripts/v0175_forms_search_archive_qa.py \
            .github/scripts/vd_module_visual_parity_002_qa.py \
            .github/scripts/v0176_release_qa.py
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Regression QA
        run: |
          set -euo pipefail
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php
          php .github/scripts/v0161_header_footer_qa.php
          python3 .github/scripts/v0162_page_duplicate_qa.py
          python3 .github/scripts/v0164_clipboard_qa.py
          php .github/scripts/v0165_elements_model_qa.php
          python3 .github/scripts/v0165_general_elements_qa.py
          python3 .github/scripts/v0166_foundation_qa.py
          php .github/scripts/v0167_module_foundation_qa.php
          php .github/scripts/v0168_canvas_section_qa.php
          python3 .github/scripts/v0168_canvas_section_static_qa.py
          python3 .github/scripts/v0169_canvas_autoheight_qa.py
          python3 .github/scripts/v0170_vehicle_module_qa.py
          python3 .github/scripts/v0171_event_module_qa.py
          python3 .github/scripts/v0172_gallery_design_qa.py
          python3 .github/scripts/v0173_editor_frontend_parity_qa.py
          python3 .github/scripts/v0174_module_cutover_qa.py
          python3 .github/scripts/v0175_forms_search_archive_qa.py
          python3 .github/scripts/vd_module_visual_parity_002_qa.py
          python3 .github/scripts/v0176_release_qa.py

      - name: Verify release boundary and scoped diff
        run: |
          set -euo pipefail
          find .github/scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git status --short
          test -n "$(git status --short)"
          if git status --short | grep -Ev '^( M|M |A |\?\?) (clean/hangar18-manager/hangar18-manager.php|clean/hangar18-manager/release-history.json|clean-release-notes.html|docs/clean-backlog-v0100.md|docs/vd-module-visual-parity-002-status.md|docs/v0176-status.md|.github/scripts/v0175_forms_search_archive_qa.py|.github/scripts/vd_module_visual_parity_002_qa.py)'; then
            echo 'Unexpected v0.1.76 release-preparation modified path.' >&2
            exit 1
          fi
          grep -q 'Version: 0.1.76' clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.76'" clean/hangar18-manager/hangar18-manager.php
          grep -q '"version": "0.1.75"' clean-update.json
          test ! -e dist/visual-designer-manager-v0.1.76.zip
          git diff --exit-code -- clean-update.json visual-designer-release-now.txt dist/

      - name: Commit v0.1.76 release candidate
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-apply-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager/hangar18-manager.php \
                  clean/hangar18-manager/release-history.json \
                  clean-release-notes.html \
                  docs/clean-backlog-v0100.md \
                  docs/vd-module-visual-parity-002-status.md \
                  docs/v0176-status.md \
                  .github/scripts/v0175_forms_search_archive_qa.py \
                  .github/scripts/vd_module_visual_parity_002_qa.py
          if git diff --cached --quiet; then
            echo 'v0.1.76 release candidate already current.'
            exit 0
          fi
          git commit -m 'Prepare Visual Designer Manager v0.1.76 release'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo 'Unable to push v0.1.76 release candidate.' >&2
          exit 1
