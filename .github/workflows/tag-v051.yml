name: Tag Hangar18 Manager v0.5.1

on:
  push:
    branches:
      - development/v0.5.1-work
    paths:
      - '.github/workflows/tag-v051.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development/v0.5.1-work
          fetch-depth: 0

      - name: Create release tag and self-clean
        shell: bash
        run: |
          set -euo pipefail
          TARGET='5788e0e683d163f7600cc16f491dca98be5408f3'
          git fetch --tags --force
          if git rev-parse refs/tags/v0.5.1 >/dev/null 2>&1; then
            test "$(git rev-parse v0.5.1^{commit})" = "$TARGET"
          else
            git tag v0.5.1 "$TARGET"
            git push origin refs/tags/v0.5.1
          fi
          rm -f .github/workflows/tag-v051.yml
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Cleanup temporary v0.5.1 tagging workflow'
          git push
