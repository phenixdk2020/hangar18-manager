name: Apply Clean v0.1.18 Patch

on:
  push:
    branches: [main]
    paths:
      - 'clean-v0118-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate v0.1.18 patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply-clean-v0118.py
          php -l clean/hangar18-manager/hangar18-manager.php
          php -l clean/hangar18-manager/src/Model/LayoutModel.php
          php -l clean/hangar18-manager/src/Frontend/Renderer.php
          php -l clean/hangar18-manager/src/Admin/EditorController.php
          node --check clean/hangar18-manager/assets/editor-v018-core.js
          test -s clean/hangar18-manager/assets/editor-v0118.css
          grep -q "Version: 0.1.18" clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.18'" clean/hangar18-manager/hangar18-manager.php
          grep -q "restoreCopy" clean/hangar18-manager/src/Admin/EditorController.php
          grep -q "imageAlignX" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "original" clean/hangar18-manager/src/Frontend/Renderer.php

      - name: Commit source and release trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hangar18-release-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager clean-release-notes.html
          printf 'v0.1.18\ntriggered_utc=2026-08-25T17:50:00Z\nreason=Version restore preview/copy plus independent image-box controls.\nnonce=19\n' > clean-release-now.txt
          git add clean-release-now.txt
          git commit -m 'Prepare clean v0.1.18 versioning and image box controls'
          git push origin HEAD:main
