name: Apply Visual Designer Manager 0.1.39 pages and header

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0139-pages-header.yml'
      - '.github/scripts/apply_v0139_pages_header.py'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.1.39 pages and header patch
        run: python .github/scripts/apply_v0139_pages_header.py

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Regression QA
        shell: bash
        run: |
          set -euo pipefail
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php

      - name: Verify 0.1.39 contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Version: 0.1.39' clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.39'" clean/hangar18-manager/hangar18-manager.php
          grep -q 'CREATE_PAGE_ACTION' clean/hangar18-manager/src/Admin/AdminController.php
          grep -q 'function createPage' clean/hangar18-manager/src/Admin/AdminController.php
          grep -q 'Opret og åbn Designer' clean/hangar18-manager/src/Admin/AdminController.php
          grep -q "'menu'" clean/hangar18-manager/src/Model/LayoutModel.php
          grep -q "'menuId'" clean/hangar18-manager/src/Model/LayoutModel.php
          grep -q "node.type === 'menu'" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "mobileMode" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "'menu' => 'Menu'" clean/hangar18-manager/src/Admin/GlobalDesignerController.php
          grep -q 'h18-clean-front-menu' clean/hangar18-manager/src/Frontend/Renderer.php
          grep -q 'selectionSessionMode' clean/hangar18-manager/assets/editor-v0125.js
          grep -q 'PASS i bruger-QA på 0.1.38' CLEAN-TECHNICAL-MANUAL.md
          grep -q 'Opret en ny side direkte i Manageren' CLEAN-USER-MANUAL.md
          grep -q 'Menu er fra 0.1.39' CLEAN-USER-MANUAL.md
          grep -q '"version": "0.1.39"' clean/hangar18-manager/release-history.json
          test -s docs/v0139-status.md

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-implementation-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add \
            clean/hangar18-manager/hangar18-manager.php \
            clean/hangar18-manager/src/Admin/AdminController.php \
            clean/hangar18-manager/src/Admin/GlobalDesignerController.php \
            clean/hangar18-manager/src/Model/LayoutModel.php \
            clean/hangar18-manager/src/Frontend/Renderer.php \
            clean/hangar18-manager/assets/editor-v018-core.js \
            clean/hangar18-manager/release-history.json \
            .github/scripts/v0125_model_qa.php \
            CLEAN-TECHNICAL-MANUAL.md \
            CLEAN-USER-MANUAL.md \
            clean-release-notes.html \
            docs/v0139-status.md
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Add native pages and Header Menu for v0.1.39'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
