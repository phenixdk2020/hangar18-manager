name: Publish Hangar18 Manager 0.4.7

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v047.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build v0.4.7 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          php_path = Path('hangar18-manager.php')
          readme_path = Path('readme.txt')
          php = php_path.read_text(encoding='utf-8')
          readme = readme_path.read_text(encoding='utf-8')

          def rep(old, new, label):
              global php
              if old not in php:
                  raise SystemExit(f'{label}: anchor not found')
              php = php.replace(old, new, 1)

          rep(' * Version: 0.4.6', ' * Version: 0.4.7', 'plugin version')
          rep("const VERSION = '0.4.6';", "const VERSION = '0.4.7';", 'version constant')
          rep(
              "    const FRONTEND_REPAIR_046_OPTION = 'hangar18_manager_frontend_repair_046';\n",
              "    const FRONTEND_REPAIR_046_OPTION = 'hangar18_manager_frontend_repair_046';\n    const ASTRA_BANNER_REPAIR_047_OPTION = 'hangar18_manager_astra_banner_repair_047';\n",
              'repair option'
          )
          rep(
              "        add_action('admin_init', [$this, 'maybe_run_frontend_repair_046'], 15);\n        add_action('admin_init', [$this, 'maybe_check_for_updates'], 20);\n        add_action('wp_head', [$this, 'render_frontend_runtime_fixes'], 999);\n",
              "        add_action('admin_init', [$this, 'maybe_run_frontend_repair_046'], 15);\n        add_action('admin_init', [$this, 'maybe_repair_astra_banner_047'], 16);\n        add_action('admin_init', [$this, 'maybe_check_for_updates'], 20);\n        add_action('wp', [$this, 'disable_astra_banner_for_managed_pages'], 1);\n        add_action('wp_head', [$this, 'render_frontend_runtime_fixes'], 999);\n",
              'hooks'
          )

          anchor = "    public function render_frontend_runtime_fixes() {\n"
          methods = r'''    public function disable_astra_banner_for_managed_pages() {
              if (is_admin() || !$this->is_hangar18_managed_frontend_page()) {
                  return;
              }

              add_filter('astra_the_title_enabled', '__return_false', 999);
              add_filter('astra_advanced_header_title', '__return_false', 999);
              add_filter('astra_apply_hero_header_banner', '__return_false', 999);
              add_filter('astra_remove_entry_header_content', '__return_true', 999);
              add_filter('astra_single_layout_one_banner_visibility', '__return_false', 999);
              add_filter('astra_banner_title_area_visibility', [$this, 'disable_astra_banner_visibility_047'], 999);
          }

          public function disable_astra_banner_visibility_047($visibility) {
              return 'disabled';
          }

          private function get_hangar18_managed_page_ids_047() {
              $ids = [];
              foreach ($this->get_managed_pages() as $page) {
                  if ($page instanceof WP_Post) {
                      $ids[] = (int) $page->ID;
                  }
              }
              return array_values(array_unique(array_filter($ids)));
          }

          public function maybe_repair_astra_banner_047() {
              if (!is_admin() || !current_user_can('edit_pages')) {
                  return;
              }
              if (get_option(self::ASTRA_BANNER_REPAIR_047_OPTION, false)) {
                  return;
              }

              try {
                  $this->create_full_managed_backup('Før v0.4.7 Astra Banner Area-reparation');
                  $updated = 0;
                  foreach ($this->get_hangar18_managed_page_ids_047() as $page_id) {
                      update_post_meta($page_id, 'site-post-title', 'disabled');
                      update_post_meta($page_id, 'ast-title-bar-display', 'disabled');
                      update_post_meta($page_id, 'ast-banner-title-visibility', 'disabled');
                      $updated++;
                  }
                  update_option(
                      self::ASTRA_BANNER_REPAIR_047_OPTION,
                      ['CompletedUtc' => gmdate('c'), 'Pages' => $updated],
                      false
                  );
                  $this->rebuild_vehicle_register();
                  $this->rebuild_event_register();
                  $this->rebuild_gallery_index();
                  $this->log('INFO', 'ASTRA_BANNER_REPAIR_047_COMPLETE', "Astra Banner Area er deaktiveret på {$updated} Hangar18-styrede sider, og oversigtssiderne er genbygget.");
                  $this->set_notice('success', "v0.4.7: Astra Banner Area er slået fra på {$updated} sider. Overskrifterne er gendannet på Køretøjer, Events og Billedgalleri.");
              } catch (Throwable $e) {
                  $this->log('ERROR', 'ASTRA_BANNER_REPAIR_047_FAILED', $e->getMessage());
              }
          }

          '''
          if anchor not in php:
              raise SystemExit('runtime method anchor not found')
          php = php.replace(anchor, methods + anchor, 1)

          rep(
              "        body.page .ast-page-title,\n        body.page .ast-page-title-wrap,\n",
              "        body.page .ast-page-title,\n        body.page .ast-page-title-wrap,\n        body.page .ast-single-entry-banner,\n        body.page .ast-single-entry-banner[data-post-type=\"page\"],\n        body.page .ast-banner-title,\n        body.page .ast-banner-title-area,\n",
              'runtime Astra selectors'
          )
          rep(
              "body.page .ast-page-title,\nbody.page .ast-page-title-wrap,\n",
              "body.page .ast-page-title,\nbody.page .ast-page-title-wrap,\nbody.page .ast-single-entry-banner,\nbody.page .ast-single-entry-banner[data-post-type=\"page\"],\nbody.page .ast-banner-title,\nbody.page .ast-banner-title-area,\n",
              'shell Astra selectors'
          )

          rep(
              '.h18-vehicle-register{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,350px));gap:24px;margin-top:30px;width:100%}',
              '.h18-overview-title{margin:0 0 22px;font-size:clamp(2rem,4vw,3.2rem);line-height:1.08;color:#30382a}.h18-vehicle-register{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,350px));gap:24px;margin-top:30px;width:100%}',
              'vehicle title CSS'
          )
          rep(
              '<div class="h18-register-intro" style="text-align:{$register_alignment}">\n<h2>Historisk materiel</h2>',
              '<div class="h18-register-intro" style="text-align:{$register_alignment}">\n<h1 class="h18-overview-title">Køretøjer og materiel</h1>\n<h2>Historisk materiel</h2>',
              'vehicle overview title'
          )

          rep(
              '.h18-event-register{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,360px));gap:18px;margin:20px 0 34px;justify-content:{$justify}}',
              '.h18-overview-heading h1{margin:0 0 28px;font-size:clamp(2rem,4vw,3.2rem);line-height:1.08;color:#30382a}.h18-event-register{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,360px));gap:18px;margin:20px 0 34px;justify-content:{$justify}}',
              'event title CSS'
          )
          rep(
              '</style>\n<div style="text-align:{$alignment}"><h2>Kommende arrangementer</h2></div>',
              '</style>\n<div class="h18-overview-heading" style="text-align:{$alignment}"><h1>Events</h1></div>\n<div style="text-align:{$alignment}"><h2>Kommende arrangementer</h2></div>',
              'event overview title'
          )

          rep(
              "$html = '<!-- wp:html --><style>.h18-gallery-index{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,360px));gap:18px;margin:18px 0 32px;justify-content:' . $justify . '}.h18-album-card{",
              "$html = '<!-- wp:html --><style>.h18-overview-heading h1{margin:0 0 28px;font-size:clamp(2rem,4vw,3.2rem);line-height:1.08;color:#30382a}.h18-gallery-index{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,360px));gap:18px;margin:18px 0 32px;justify-content:' . $justify . '}.h18-album-card{",
              'gallery title CSS'
          )
          rep(
              "        foreach ($groups as $type => $items) {\n",
              "        $html .= '<div class=\"h18-overview-heading\" style=\"text-align:' . esc_attr($alignment) . '\"><h1>Billedgalleri</h1></div>';\n\n        foreach ($groups as $type => $items) {\n",
              'gallery overview title'
          )

          if 'Version: 0.4.6' not in readme:
              raise SystemExit('readme version anchor not found')
          readme = readme.replace('Version: 0.4.6', 'Version: 0.4.7', 1)
          readme += '''\n\n== Version 0.4.7 – Astra Banner Area og egne overskrifter ==\n\n- Den resterende lilla/blå bjælke fjernes via Astra's egne Banner Area-filtre og sidemeta.\n- Oversigtssiderne får egne Hangar18-overskrifter: Køretøjer og materiel, Events og Billedgalleri.\n- Overskrifterne følger oversigtssidens Venstre/Midtstillet-indstilling.\n- Køretøjs-, event- og galleriindhold ændres ikke ud over genbygning af de tre oversigtssider.\n'''

          php_path.write_text(php, encoding='utf-8')
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F 'Version: 0.4.7' hangar18-manager.php
          grep -F "const VERSION = '0.4.7';" hangar18-manager.php
          grep -F 'astra_apply_hero_header_banner' hangar18-manager.php
          grep -F '<h1 class="h18-overview-title">Køretøjer og materiel</h1>' hangar18-manager.php
          grep -F '<h1>Events</h1>' hangar18-manager.php
          grep -F '<h1>Billedgalleri</h1>' hangar18-manager.php

      - name: Build package and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .build
          mkdir -p dist .build/hangar18-manager/assets
          cp hangar18-manager.php .build/hangar18-manager/
          cp readme.txt .build/hangar18-manager/
          cp assets/admin.css .build/hangar18-manager/assets/
          cp assets/admin.js .build/hangar18-manager/assets/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"
          export SHA
          python3 - <<'PY'
          import json, os
          manifest = {
              'schema_version': '1.0',
              'plugin': 'hangar18-manager',
              'version': '0.4.7',
              'min_wp': '6.4',
              'min_php': '8.0',
              'published_utc': '2026-08-14T17:42:00Z',
              'package_path': 'dist/hangar18-manager.zip',
              'package_sha256': os.environ['SHA'],
              'changelog': [
                  'Fjerner Astra 4.x Banner Area-bjælken via Astra-filtre og sidemeta.',
                  'Gendanner egne Hangar18-overskrifter på Køretøjer og materiel, Events og Billedgalleri.',
                  'Overskrifterne følger oversigtssidens Venstre/Midtstillet-indstilling.'
              ]
          }
          with open('update.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Commit v0.4.7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add hangar18-manager.php readme.txt update.json
          git add -f dist/hangar18-manager.zip
          git commit -m 'Publish Hangar18 Manager 0.4.7'
          git push
