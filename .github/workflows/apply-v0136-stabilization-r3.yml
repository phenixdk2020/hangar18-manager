name: Apply Visual Designer Manager 0.1.36 stabilization r3

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/run_v0136_r3.py'
      - '.github/workflows/apply-v0136-stabilization-r3.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 0.1.36 patch r3
        run: python .github/scripts/run_v0136_r3.py
      - name: PHP syntax
        run: find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Regression QA
        run: |
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php
      - name: Verify 0.1.36 contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Version: 0.1.36" clean/hangar18-manager/hangar18-manager.php
          grep -q "data-vd-selection-boundary" clean/hangar18-manager/assets/editor-v0125.js
          grep -q "function restoreMarkerSelection" clean/hangar18-manager/assets/editor-v0125.js
          grep -q "boundary-markers-v0136" clean/hangar18-manager/assets/editor-v0125.js
          grep -q "document.body.appendChild(panel)" clean/hangar18-manager/assets/editor-v0135.js
          grep -q "function positionPanel" clean/hangar18-manager/assets/editor-v0135.js
          grep -q "position:fixed" clean/hangar18-manager/assets/editor-v0135.css
          grep -q "visual-designer-manager-v" clean/hangar18-manager/src/Update/GitHubUpdater.php
          grep -q "24.2 Produktnavn og synlige filnavne" CLEAN-DESIGN-MANUAL.md
          grep -q "VD-COLOR-POPOVER-001" CLEAN-TECHNICAL-MANUAL.md
          test -s docs/v0136-status.md
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-release-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager/hangar18-manager.php \
                  clean/hangar18-manager/assets/editor-v0125.js \
                  clean/hangar18-manager/assets/editor-v0135.js \
                  clean/hangar18-manager/assets/editor-v0135.css \
                  clean/hangar18-manager/src/Update/GitHubUpdater.php \
                  clean/hangar18-manager/release-history.json \
                  clean/hangar18-manager/readme.txt \
                  CLEAN-DESIGN-MANUAL.md CLEAN-TECHNICAL-MANUAL.md CLEAN-USER-MANUAL.md \
                  clean-release-notes.html docs/v0136-status.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Implement Visual Designer Manager 0.1.36 stabilization'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
