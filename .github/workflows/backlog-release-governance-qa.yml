name: Backlog and Release Governance QA

on:
  push:
    branches: [main]
    paths:
      - 'docs/active-backlog-v*.md'
      - 'docs/backlog-index.json'
      - 'docs/BACKLOG-CONTRIBUTING.md'
      - 'release-config.json'
      - 'update.json'
      - 'release-manifest.json'
      - 'dist/hangar18-manager.zip'
      - 'tools/backlog-governance.py'
      - 'tools/release-integrity.py'
      - 'tools/trace-redaction-qa.py'
      - 'assets/ultimate-designer-trace*.js'
      - 'assets/updater-support-v0879.js'
      - 'src/Admin/UltimateDesignerTraceAdminController.php'
      - 'src/Admin/UpdaterStateConsistencyAdminController.php'
      - '.github/workflows/backlog-release-governance-qa.yml'
  pull_request:
    paths:
      - 'docs/active-backlog-v*.md'
      - 'docs/backlog-index.json'
      - 'release-config.json'
      - 'update.json'
      - 'release-manifest.json'
      - 'dist/hangar18-manager.zip'
      - 'tools/backlog-governance.py'
      - 'tools/release-integrity.py'
      - 'tools/trace-redaction-qa.py'
      - 'assets/ultimate-designer-trace*.js'
      - 'assets/updater-support-v0879.js'
      - 'src/Admin/UltimateDesignerTraceAdminController.php'
      - 'src/Admin/UpdaterStateConsistencyAdminController.php'

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve canonical backlog
        id: backlog
        shell: bash
        run: |
          FILE="$(ls docs/active-backlog-v*.md | sort -V | tail -n1)"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Canonical candidate: $FILE"

      - name: Generate and validate backlog index
        shell: bash
        run: |
          python3 tools/backlog-governance.py --backlog '${{ steps.backlog.outputs.file }}' --output /tmp/backlog-index.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/backlog-index.json', encoding='utf-8'))
          ids=[x['id'] for x in p['items']]
          if len(ids)!=len(set(ids)):
              raise SystemExit('duplicate backlog IDs')
          for item in p['items']:
              if not item['priority'] or not item['status'] or not item['definition_of_done']:
                  raise SystemExit('incomplete backlog item: '+item['id'])
          print(f"PASS: {len(ids)} backlog items")
          PY

      - name: Python syntax
        shell: bash
        run: |
          python3 -m py_compile tools/backlog-governance.py tools/release-integrity.py tools/trace-redaction-qa.py

      - name: Trace redaction QA
        shell: bash
        run: python3 tools/trace-redaction-qa.py

      - name: JavaScript syntax
        shell: bash
        run: |
          node --check assets/ultimate-designer-trace-tools-v0879.js
          node --check assets/updater-support-v0879.js

      - name: PHP syntax
        shell: bash
        run: |
          php -l src/Admin/UltimateDesignerTraceAdminController.php
          php -l src/Admin/UpdaterStateConsistencyAdminController.php

      - name: Release integrity when package is present
        shell: bash
        run: |
          if [ -f dist/hangar18-manager.zip ] && [ -f update.json ]; then
            python3 tools/release-integrity.py
          else
            echo 'No built release package in this checkout; release integrity deferred to release workflow.'
          fi
