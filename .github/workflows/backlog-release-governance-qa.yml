name: Backlog and Release Governance QA

on:
  push:
    branches: [main]
    paths:
      - 'docs/active-backlog-v*.md'
      - 'docs/backlog-index.json'
      - 'docs/BACKLOG-CONTRIBUTING.md'
      - 'docs/lego-navigator-v0880-test.md'
      - 'docs/whatif-removal-v0881.md'
      - 'docs/legacy-runtime-audit-v0881.md'
      - 'release-config.json'
      - 'update.json'
      - 'release-manifest.json'
      - 'dist/hangar18-manager.zip'
      - 'hangar18-manager.php'
      - 'assets/admin.js'
      - 'assets/admin.css'
      - 'tools/backlog-governance.py'
      - 'tools/release-integrity.py'
      - 'tools/trace-redaction-qa.py'
      - 'tools/legacy-cleanup-audit.py'
      - 'tools/whatif-source-cleanup.py'
      - 'assets/ultimate-designer-trace*.js'
      - 'assets/updater-support-v0879.js'
      - 'assets/ultimate-designer-navigator-v0880.js'
      - 'assets/ultimate-designer-navigator-v0880.css'
      - 'src/Admin/UltimateDesignerTraceAdminController.php'
      - 'src/Admin/UpdaterStateConsistencyAdminController.php'
      - 'src/Admin/EditorNavigatorAdminController.php'
      - 'src/Admin/LegacyCleanupAuditAdminController.php'
      - 'src/Admin/IntegrationAdminBootstrap.php'
      - 'src/Admin/NoWhatIfAdminController.php'
      - 'src/Autoload.php'
      - '.github/workflows/backlog-release-governance-qa.yml'
      - '.github/workflows/build-plugin-release.yml'
  pull_request:
    paths:
      - 'docs/active-backlog-v*.md'
      - 'docs/backlog-index.json'
      - 'docs/lego-navigator-v0880-test.md'
      - 'docs/whatif-removal-v0881.md'
      - 'docs/legacy-runtime-audit-v0881.md'
      - 'release-config.json'
      - 'update.json'
      - 'release-manifest.json'
      - 'dist/hangar18-manager.zip'
      - 'hangar18-manager.php'
      - 'assets/admin.js'
      - 'assets/admin.css'
      - 'tools/backlog-governance.py'
      - 'tools/release-integrity.py'
      - 'tools/trace-redaction-qa.py'
      - 'tools/legacy-cleanup-audit.py'
      - 'tools/whatif-source-cleanup.py'
      - 'assets/ultimate-designer-trace*.js'
      - 'assets/updater-support-v0879.js'
      - 'assets/ultimate-designer-navigator-v0880.js'
      - 'assets/ultimate-designer-navigator-v0880.css'
      - 'src/Admin/EditorNavigatorAdminController.php'
      - 'src/Admin/LegacyCleanupAuditAdminController.php'
      - 'src/Admin/IntegrationAdminBootstrap.php'
      - 'src/Admin/NoWhatIfAdminController.php'
      - 'src/Autoload.php'
      - '.github/workflows/build-plugin-release.yml'

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve canonical backlog
        id: backlog
        shell: bash
        run: |
          FILE="$(ls docs/active-backlog-v*.md | sort -V | tail -n1)"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Canonical candidate: $FILE"

      - name: Generate and validate backlog index
        shell: bash
        run: |
          python3 tools/backlog-governance.py --backlog '${{ steps.backlog.outputs.file }}' --output /tmp/backlog-index.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/backlog-index.json', encoding='utf-8'))
          ids=[x['id'] for x in p['items']]
          if len(ids)!=len(set(ids)):
              raise SystemExit('duplicate backlog IDs')
          for item in p['items']:
              if not item['priority'] or not item['status'] or not item['definition_of_done']:
                  raise SystemExit('incomplete backlog item: '+item['id'])
          print(f"PASS: {len(ids)} backlog items")
          PY

      - name: Python syntax
        shell: bash
        run: |
          python3 -m py_compile tools/backlog-governance.py tools/release-integrity.py tools/trace-redaction-qa.py tools/legacy-cleanup-audit.py tools/whatif-source-cleanup.py

      - name: WhatIf source-cleaner dry-run
        shell: bash
        run: |
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/assets" "$TMP/src/Admin"
          cp hangar18-manager.php "$TMP/"
          cp assets/admin.js assets/admin.css assets/hangar18-no-whatif-v0858.js assets/hangar18-no-whatif-v0858.css "$TMP/assets/"
          cp src/Admin/IntegrationAdminBootstrap.php src/Admin/NoWhatIfAdminController.php "$TMP/src/Admin/"
          python3 tools/whatif-source-cleanup.py --root "$TMP" --apply --report /tmp/whatif-cleanup.json
          php -l "$TMP/hangar18-manager.php"
          php -l "$TMP/src/Admin/IntegrationAdminBootstrap.php"
          node --check "$TMP/assets/admin.js"
          python3 tools/whatif-source-cleanup.py --root "$TMP" --assert-clean
          cat /tmp/whatif-cleanup.json

      - name: Trace redaction QA
        shell: bash
        run: python3 tools/trace-redaction-qa.py

      - name: Legacy cleanup read-only audit
        shell: bash
        run: |
          python3 tools/legacy-cleanup-audit.py --output /tmp/legacy-cleanup.json --require-no-powershell --require-no-bootstrap-json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/legacy-cleanup.json', encoding='utf-8'))
          print('WhatIf runtime files:', p['whatif_runtime_file_count'])
          print('WhatIf non-shim matches:', p['whatif_nonshim_matches'])
          print('Shim files:', ', '.join(p['shim_files']) or 'none')
          PY

      - name: JavaScript syntax
        shell: bash
        run: |
          node --check assets/ultimate-designer-trace-tools-v0879.js
          node --check assets/updater-support-v0879.js
          node --check assets/ultimate-designer-navigator-v0880.js

      - name: PHP syntax
        shell: bash
        run: |
          php -l src/Admin/UltimateDesignerTraceAdminController.php
          php -l src/Admin/UpdaterStateConsistencyAdminController.php
          php -l src/Admin/EditorNavigatorAdminController.php
          php -l src/Admin/LegacyCleanupAuditAdminController.php
          php -l src/Autoload.php

      - name: Navigator static contract
        shell: bash
        run: |
          grep -q 'window.__h18NavigatorV0880' assets/ultimate-designer-navigator-v0880.js
          grep -q 'h18-layout-parent-key' assets/ultimate-designer-navigator-v0880.js
          grep -q 'moveInto' assets/ultimate-designer-navigator-v0880.js
          grep -q 'moveOut' assets/ultimate-designer-navigator-v0880.js
          grep -q 'wouldCycle' assets/ultimate-designer-navigator-v0880.js
          grep -q '__h18NestingToolsV0840' assets/ultimate-designer-navigator-v0880.js

      - name: Release integrity when package is present
        shell: bash
        run: |
          if [ -f dist/hangar18-manager.zip ] && [ -f update.json ]; then
            python3 tools/release-integrity.py
          else
            echo 'No built release package in this checkout; release integrity deferred to release workflow.'
          fi
