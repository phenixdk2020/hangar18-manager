name: Apply Visual Designer Manager 0.1.29 floating buttons

on:
  push:
    branches: [main]
    paths:
      - 'v0129-floating-now.txt'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic 0.1.29 patch
        run: python .github/scripts/apply_v0129_floating_buttons.py

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Regression QA
        shell: bash
        run: |
          set -euo pipefail
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php

      - name: Verify floating button scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Version: 0.1.29" clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.29'" clean/hangar18-manager/hangar18-manager.php
          grep -q "placementMode" clean/hangar18-manager/src/Model/LayoutModel.php
          grep -q "zIndex" clean/hangar18-manager/src/Model/LayoutModel.php
          grep -q "isFloatingButton" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "Flydende i Sektion/Kasse" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "zone = 'overlay'" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "position = 'absolute'" clean/hangar18-manager/assets/editor-v018-core.js
          grep -q "isFloatingButton" clean/hangar18-manager/assets/editor-v0121.js
          grep -q "h18-clean-front-button--floating" clean/hangar18-manager/src/Frontend/Renderer.php
          grep -q "bool \$floating" clean/hangar18-manager/src/Frontend/ResponsiveRenderer.php
          grep -q "aldrig position:fixed" clean/hangar18-manager/readme.txt
          if grep -n "position:fixed" clean/hangar18-manager/src/Frontend/Renderer.php clean/hangar18-manager/src/Frontend/ResponsiveRenderer.php; then
            echo 'Floating button must be parent-relative, not viewport-fixed.' >&2
            exit 1
          fi

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-implementation-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager docs/BUTTON-ELEMENT-SPEC.md clean-release-notes.html
          if git diff --cached --quiet; then
            echo '0.1.29 floating button implementation already applied.'
            exit 0
          fi
          git commit -m 'Implement parent-relative floating buttons for 0.1.29'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'Unable to publish 0.1.29 floating button source.' >&2
          exit 1
