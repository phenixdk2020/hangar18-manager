name: Event Auto Archive QA

on:
  push:
    branches:
      - agent/event-auto-archive-v0826
  pull_request:
    paths:
      - 'src/Event/EventArchiveRuntime.php'
      - 'src/Autoload.php'
      - 'tests/Architecture/event-auto-archive-*'
      - '.github/workflows/event-auto-archive-qa.yml'

permissions:
  contents: read

jobs:
  event-archive-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0','8.2','8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php-version }}'
          coverage: none
      - run: php -l src/Event/EventArchiveRuntime.php && php -l src/Autoload.php
      - run: bash tests/Architecture/event-auto-archive-contract.sh
