name: V3 Alpha.9 Detail/Form/Gallery Parity QA

on:
  workflow_dispatch:
  push:
    branches: [v3-alpha9-parity]
    paths:
      - '.github/scripts/build_v3_alpha9.py'
      - '.github/scripts/v3_alpha9_padding_qa.php'
      - '.github/workflows/v3-alpha9-qa.yml'
      - 'V3-ALPHA9.md'
  pull_request:
    branches: [v3-clean-refactor]

jobs:
  alpha9-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock V1 0.1.93 source runtime
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='dc3bad403c764f4ec123a526333a781d05dde491'
          git cat-file -e "${BASELINE}^{commit}"
          git diff --quiet "$BASELINE" -- clean/hangar18-manager
          echo 'V1 source runtime baseline: PASS'

      - name: Retained V1 regression gates
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 .github/scripts/v0192_export_integrity_qa.py
          python3 .github/scripts/v0191_form_design_controls_qa.py
          python3 .github/scripts/v0190_form_wysiwyg_parity_qa.py
          python3 .github/scripts/v0189_manager_cleanup_export_all_qa.py
          python3 .github/scripts/v0186_site_settings_qa.py
          python3 .github/scripts/v0185_editor_live_box_qa.py
          python3 .github/scripts/v0185_semantic_qa.py
          python3 .github/scripts/v0184_portable_transfer_qa.py
          echo 'Retained V1 gates: PASS'

      - name: Build and validate Alpha.9
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/build_v3_alpha9.py
          python3 .github/scripts/build_v3_alpha9.py
          php .github/scripts/v3_alpha9_padding_qa.php
          ROOT='build/visual-designer-manager'
          MAIN="$ROOT/visual-designer-manager.php"
          JS="$ROOT/assets/editor-v018-core.js"
          CSS="$ROOT/assets/admin-v0175.css"
          RENDERER="$ROOT/src/Frontend/Renderer.php"
          RR="$ROOT/src/Frontend/ResponsiveRenderer.php"
          REPAIR="$ROOT/src/Migration/V3DetailLayoutRepair.php"
          COLLECTION="$ROOT/src/Frontend/CollectionPageRenderer.php"
          grep -Fq 'Version: 3.0.0-alpha.9' "$MAIN"
          grep -Fq "define('VDM_VERSION', '3.0.0-alpha.9');" "$MAIN"
          grep -Fq 'V3DetailLayoutRepair::register();' "$MAIN"
          grep -Fq 'data-field="paddingTop"' "$JS"
          grep -Fq 'data-field="paddingBottom"' "$JS"
          grep -Fq '.h18-clean-node-preview--form{padding:0!important' "$CSS"
          grep -Fq 'gap:var(--vdm-form-field-gap,16px)!important' "$CSS"
          grep -Fq 'private static function galleryDetailRows' "$RENDERER"
          grep -Fq 'private static function verticalPaddingPx' "$RENDERER"
          grep -Fq 'private static function galleryDetailRows' "$RR"
          grep -Fq 'event-image' "$REPAIR"
          grep -Fq 'event-facts' "$REPAIR"
          grep -Fq '← Tilbage til album' "$REPAIR"
          ! grep -Fq '<h2>Køretøjer</h2>' "$COLLECTION"
          grep -Fq "'.h18-vd-live-shell-header '" "$RR"
          grep -Fq "'.h18-vd-live-shell-page '" "$RR"
          grep -Fq "'.h18-vd-live-shell-footer '" "$RR"
          grep -Fq 'public const MOBILE_MAX = 782;' "$RR"
          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find "$ROOT/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          echo 'Alpha.9 build contract: PASS'

      - name: Package contract
        shell: bash
        run: |
          set -euo pipefail
          VERSION='3.0.0-alpha.9'
          mkdir -p dist
          ZIP="dist/visual-designer-manager-v${VERSION}.zip"
          rm -f "$ZIP"
          (cd build && zip -qr "../$ZIP" visual-designer-manager)
          unzip -tq "$ZIP"
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/visual-designer-manager.php$')" = '1'
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/src/Migration/V3DetailLayoutRepair.php$')" = '1'
          echo "SHA256=$(sha256sum "$ZIP" | awk '{print $1}')"
          echo 'Alpha.9 package: PASS'
