name: Tag Hangar18 Manager v0.5.20

on:
  push:
    branches:
      - maintenance/tag-v0.5.20
    paths:
      - '.github/workflows/tag-v0520.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/tag-v0.5.20
          fetch-depth: 0
      - name: Tag v0.5.20 and self-clean
        shell: bash
        run: |
          set -euo pipefail
          TARGET=98322d5ec6b681b26319034c1bd62e1a8adc3dc9
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$TARGET"
          if git rev-parse refs/tags/v0.5.20 >/dev/null 2>&1; then
            test "$(git rev-list -n1 v0.5.20)" = "$TARGET"
          else
            git tag v0.5.20 "$TARGET"
            git push origin v0.5.20
          fi
          rm -f .github/workflows/tag-v0520.yml
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Maintenance: remove v0.5.20 tag workflow'
          git push origin HEAD:maintenance/tag-v0.5.20
