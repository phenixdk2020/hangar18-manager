name: Tag Hangar18 Manager v0.5.10

on:
  push:
    branches:
      - development/v0.5.10
    paths:
      - '.github/workflows/tag-v0510.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag v0.5.10 and self-clean
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA='2bb0d45a6a6af06863b004f949e3851720092ec3'
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git tag -f v0.5.10 "$RELEASE_SHA"
          git push origin refs/tags/v0.5.10 --force
          git rm .github/workflows/tag-v0510.yml
          git commit -m 'Maintenance: remove v0.5.10 tag workflow'
          git push origin HEAD:development/v0.5.10
