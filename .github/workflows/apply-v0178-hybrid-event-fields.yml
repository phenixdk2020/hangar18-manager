name: Apply Visual Designer Manager 0.1.78 Hybrid Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_v0178_hybrid_event_fields.py'
      - '.github/scripts/v0178_preapply_fix.py'
      - '.github/scripts/v0178_postapply_fix.py'
      - '.github/scripts/v0178_hybrid_event_fields_qa.py'
      - '.github/workflows/apply-v0178-hybrid-event-fields.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.1.78
        run: |
          set -euo pipefail
          python3 .github/scripts/v0178_preapply_fix.py
          python3 .github/scripts/apply_v0178_hybrid_event_fields.py
          python3 .github/scripts/v0178_postapply_fix.py
      - name: Syntax
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/v0178_preapply_fix.py .github/scripts/apply_v0178_hybrid_event_fields.py .github/scripts/v0178_postapply_fix.py .github/scripts/v0178_hybrid_event_fields_qa.py
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Regression QA
        run: |
          set -euo pipefail
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php
          php .github/scripts/v0161_header_footer_qa.php
          python3 .github/scripts/v0162_page_duplicate_qa.py
          python3 .github/scripts/v0164_clipboard_qa.py
          php .github/scripts/v0165_elements_model_qa.php
          python3 .github/scripts/v0165_general_elements_qa.py
          python3 .github/scripts/v0166_foundation_qa.py
          php .github/scripts/v0167_module_foundation_qa.php
          php .github/scripts/v0168_canvas_section_qa.php
          python3 .github/scripts/v0168_canvas_section_static_qa.py
          python3 .github/scripts/v0169_canvas_autoheight_qa.py
          python3 .github/scripts/v0170_vehicle_module_qa.py
          python3 .github/scripts/v0171_event_module_qa.py
          python3 .github/scripts/v0172_gallery_design_qa.py
          python3 .github/scripts/v0173_editor_frontend_parity_qa.py
          python3 .github/scripts/v0174_module_cutover_qa.py
          python3 .github/scripts/v0175_forms_search_archive_qa.py
          python3 .github/scripts/v0177_module_design_qa.py
          python3 .github/scripts/v0178_hybrid_event_fields_qa.py
      - name: Verify scoped diff
        run: |
          set -euo pipefail
          find .github/scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git status --short
          test -n "$(git status --short)"
          if git status --short | grep -Ev '^( M|M |A |\?\?) (clean/hangar18-manager/hangar18-manager.php|clean/hangar18-manager/src/Modules/EventFieldRegistry.php|clean/hangar18-manager/src/Frontend/HybridModuleSlots.php|clean/hangar18-manager/src/Migration/HybridModulePageMigration.php|clean/hangar18-manager/src/Model/LayoutModel.php|clean/hangar18-manager/src/Frontend/Renderer.php|clean/hangar18-manager/src/Frontend/CollectionPageRenderer.php|clean/hangar18-manager/src/Admin/EventAdminController.php|clean/hangar18-manager/src/Admin/AdminController.php|clean/hangar18-manager/src/Admin/EditorController.php|clean/hangar18-manager/assets/editor-v018-core.js|clean/hangar18-manager/assets/admin-v0178-events.js|clean/hangar18-manager/release-history.json|clean-release-notes.html|docs/clean-backlog-v0100.md|docs/v0178-status.md)'; then
            echo 'Unexpected v0.1.78 modified path.' >&2
            exit 1
          fi
          grep -q 'Version: 0.1.78' clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.78'" clean/hangar18-manager/hangar18-manager.php
          test "$(python3 -c "import json;print(json.load(open('clean-update.json',encoding='utf-8'))['version'])")" = '0.1.77'
      - name: Commit v0.1.78 release candidate
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-apply-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager/hangar18-manager.php \
                  clean/hangar18-manager/src/Modules/EventFieldRegistry.php \
                  clean/hangar18-manager/src/Frontend/HybridModuleSlots.php \
                  clean/hangar18-manager/src/Migration/HybridModulePageMigration.php \
                  clean/hangar18-manager/src/Model/LayoutModel.php \
                  clean/hangar18-manager/src/Frontend/Renderer.php \
                  clean/hangar18-manager/src/Frontend/CollectionPageRenderer.php \
                  clean/hangar18-manager/src/Admin/EventAdminController.php \
                  clean/hangar18-manager/src/Admin/AdminController.php \
                  clean/hangar18-manager/src/Admin/EditorController.php \
                  clean/hangar18-manager/assets/editor-v018-core.js \
                  clean/hangar18-manager/assets/admin-v0178-events.js \
                  clean/hangar18-manager/release-history.json \
                  clean-release-notes.html \
                  docs/clean-backlog-v0100.md \
                  docs/v0178-status.md
          if git diff --cached --quiet; then
            echo 'v0.1.78 release candidate already current.'
            exit 0
          fi
          git commit -m 'Implement Visual Designer Manager v0.1.78 hybrid pages'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
