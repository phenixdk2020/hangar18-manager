name: Apply Clean v0.1.14 Patch

on:
  push:
    branches: [main]
    paths:
      - 'clean-v0114-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate v0.1.14 patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply-clean-v0114.py
          php -l clean/hangar18-manager/hangar18-manager.php
          php -l clean/hangar18-manager/src/Admin/EditorController.php
          php -l clean/hangar18-manager/src/Frontend/Renderer.php
          php -l clean/hangar18-manager/src/Model/LayoutModel.php
          node --check clean/hangar18-manager/assets/editor-v0114.js
          test -s clean/hangar18-manager/assets/editor-v0114.css
          grep -q "Version: 0.1.14" clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.14'" clean/hangar18-manager/hangar18-manager.php
          grep -q "h18_clean_preview" clean/hangar18-manager/src/Admin/EditorController.php
          grep -q "previewKey" clean/hangar18-manager/src/Frontend/Renderer.php
          grep -q "Gem &amp; vis" clean/hangar18-manager/src/Admin/EditorController.php

      - name: Commit source and release trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hangar18-release-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager clean-release-notes.html
          printf 'v0.1.14\ntriggered_utc=2026-08-25T17:05:00Z\nreason=Theme preview, verified save, save-and-view, contextual labels.\nnonce=14\n' > clean-release-now.txt
          git add clean-release-now.txt
          git commit -m 'Prepare clean v0.1.14 preview and verified save'
          git push origin HEAD:main
