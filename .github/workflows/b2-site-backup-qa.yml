name: B2 Site Backup QA

on:
  push:
    branches:
      - agent/b2-full-backup-v0829
  pull_request:
    paths:
      - 'src/Backup/SiteBackup*.php'
      - 'src/Admin/SiteBackupAdminController.php'
      - 'src/Admin/IntegrationAdminBootstrap.php'
      - 'tests/Architecture/b2*'
      - 'tests/Architecture/integration-admin-smoke.php'
      - 'docs/b2-*'
      - '.github/workflows/b2-site-backup-qa.yml'

permissions:
  contents: read

jobs:
  package-restore:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0','8.2','8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tests/Architecture/assert-foundation-isolation.sh origin/main
      - run: bash tests/Architecture/protected-domain-contract.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php-version }}'
          extensions: mbstring, zip
          coverage: none
      - run: php -l src/Backup/SiteBackupManifestService.php && php -l src/Backup/SiteBackupManifestValidator.php && php -l src/Backup/SiteBackupSnapshotCollector.php && php -l src/Backup/SiteBackupPackageService.php && php -l src/Backup/SiteBackupRestoreService.php && php -l src/Backup/SiteBackupSecurityPolicy.php && php -l src/Backup/SiteBackupRestoreCoordinator.php && php -l src/Admin/SiteBackupAdminController.php
      - run: php tests/Architecture/b2a-versioned-backup-manifest-smoke.php
      - run: php tests/Architecture/b2-package-restore-smoke.php
      - run: bash tests/Architecture/b2a-versioned-backup-manifest-contract.sh
      - run: bash tests/Architecture/b2-package-restore-contract.sh
      - run: php tests/Architecture/integration-admin-smoke.php
