name: Build Hangar18 Manager v0.5.14

on:
  push:
    branches:
      - development/v0.5.14
    paths:
      - '.github/workflows/build-v0514.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development/v0.5.14
          fetch-depth: 0

      - name: Apply v0.5.14 patch
        run: python3 .github/scripts/patch_v0514.py

      - name: Syntax and structural QA
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F 'Version: 0.5.14' hangar18-manager.php
          grep -F "const VERSION = '0.5.14';" hangar18-manager.php
          grep -F 'Version: 0.5.14' readme.txt
          grep -F 'h18-command-palette-open' hangar18-manager.php
          grep -F 'role="dialog" aria-modal="true"' hangar18-manager.php
          grep -F 'function commandPaletteBuildCommands' assets/admin.js
          grep -F 'function commandPaletteMoveSection' assets/admin.js
          grep -F "event.ctrlKey || event.metaKey" assets/admin.js
          grep -F "commandPaletteIsEditableTarget(event.target)" assets/admin.js
          grep -F "label: 'Gå til Gem / ændringsbeskrivelse'" assets/admin.js
          grep -F "addPageSection(entry[0])" assets/admin.js
          grep -F "editorHistoryUndo" assets/admin.js
          grep -F "editorHistoryRedo" assets/admin.js
          grep -F 'Alt+↑/↓ skift element' hangar18-manager.php
          grep -F 'page-editor schema forbliver 1.12' readme.txt
          python3 - <<'PY'
          from pathlib import Path
          js = Path('assets/admin.js').read_text()
          php = Path('hangar18-manager.php').read_text()
          required_types = ['text','hero','text_image','image','buttons','card','card_grid','highlight','spacer','html','css','mail_form','poll']
          missing = [t for t in required_types if "['%s'" % t not in js and "'%s'" % t not in js]
          if missing:
              raise SystemExit('Missing command palette section types: ' + repr(missing))
          # Safety: palette may navigate to save controls, but must never submit the form.
          palette_start = js.index('const commandPaletteSectionTypes')
          palette_end = js.index("$(document).on('click', '#h18-editor-restore-draft'", palette_start)
          palette = js[palette_start:palette_end]
          forbidden = ['.submit()', '.trigger(\'submit\')', '.trigger("submit")', 'requestSubmit(']
          bad = [item for item in forbidden if item in palette]
          if bad:
              raise SystemExit('Command palette must not submit the editor form: ' + repr(bad))
          if 'commandPaletteIsEditableTarget(event.target)' not in palette:
              raise SystemExit('Keyboard shortcuts must respect editable controls')
          if 'aria-modal="true"' not in php or 'aria-haspopup="dialog"' not in php:
              raise SystemExit('Missing dialog accessibility markup')
          print('Command palette structural QA passed')
          PY

      - name: Rebuild distribution package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build/hangar18-manager/assets
          cp hangar18-manager.php .build/hangar18-manager/
          cp readme.txt .build/hangar18-manager/
          cp assets/admin.css .build/hangar18-manager/assets/
          cp assets/admin.js .build/hangar18-manager/assets/
          rm -f dist/hangar18-manager.zip
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip

      - name: Update manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          package = Path('dist/hangar18-manager.zip')
          manifest = {
              'schema_version': '1.0',
              'plugin': 'hangar18-manager',
              'version': '0.5.14',
              'min_wp': '6.4',
              'min_php': '8.0',
              'published_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'package_path': 'dist/hangar18-manager.zip',
              'package_sha256': hashlib.sha256(package.read_bytes()).hexdigest(),
              'changelog': [
                  'Tilføjer søgbar kommandopalette med Ctrl/Cmd+K.',
                  'Tilføjer dynamisk hurtignavigation til aktuelle sideelementer og genveje til elementoprettelse.',
                  'Tilføjer kommandoer for responsive previews, states, Undo/Redo og designhandlinger.',
                  'Tilføjer Alt+Pil op/ned navigation og tilgængelig dialogbetjening med Escape, Enter og Tab.',
                  'Gem-kommandoen navigerer kun til ændringsbeskrivelsen; page-editor schema forbliver 1.12.'
              ]
          }
          Path('update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(manifest['package_sha256'])
          PY

      - name: Package QA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .verify
          mkdir .verify
          unzip -q dist/hangar18-manager.zip -d .verify
          php -l .verify/hangar18-manager/hangar18-manager.php
          node --check .verify/hangar18-manager/assets/admin.js
          grep -F 'Version: 0.5.14' .verify/hangar18-manager/hangar18-manager.php
          grep -F 'Version: 0.5.14' .verify/hangar18-manager/readme.txt
          grep -F 'h18-command-palette-open' .verify/hangar18-manager/hangar18-manager.php
          grep -F 'function commandPaletteBuildCommands' .verify/hangar18-manager/assets/admin.js
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('update.json').read_text())
          actual = hashlib.sha256(Path('dist/hangar18-manager.zip').read_bytes()).hexdigest()
          assert manifest['version'] == '0.5.14'
          assert manifest['package_sha256'] == actual
          print('Package manifest QA passed:', actual)
          PY

      - name: Self-clean and diff scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build .verify
          rm -f .github/scripts/patch_v0514.py .github/workflows/build-v0514.yml
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed = {'hangar18-manager.php','assets/admin.js','assets/admin.css','readme.txt','update.json','dist/hangar18-manager.zip','.github/scripts/patch_v0514.py','.github/workflows/build-v0514.yml'}
          changed = set(subprocess.check_output(['git','status','--short'], text=True).splitlines())
          paths = set()
          for line in changed:
              path = line[3:].strip()
              if ' -> ' in path:
                  path = path.split(' -> ',1)[1]
              paths.add(path)
          extra = paths - allowed
          if extra:
              raise SystemExit('Unexpected release-scope files: ' + repr(sorted(extra)))
          print('Release scope QA passed')
          PY

      - name: Commit v0.5.14 release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Release Hangar18 Manager 0.5.14'
          git push origin HEAD:development/v0.5.14
