name: Apply Visual Designer Manager 0.1.54 Menu UX and Publish

on:
  push:
    paths:
      - '.github/scripts/apply_v0154_menu_ux_publish.py'
      - '.github/workflows/apply-v0154-menu-ux-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-designer-v0154-menu-ux-publish
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.1.54 patch
        run: python3 .github/scripts/apply_v0154_menu_ux_publish.py

      - name: PHP syntax
        run: |
          set -euo pipefail
          find clean/hangar18-manager -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in clean/hangar18-manager/assets/*.js; do node --check "$f"; done

      - name: Existing model QA
        run: |
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php

      - name: Verify Menu UX contract
        run: |
          set -euo pipefail
          NAV='clean/hangar18-manager/src/Admin/NavigationController.php'
          CORE='clean/hangar18-manager/assets/editor-v018-core.js'
          MODEL='clean/hangar18-manager/src/Model/LayoutModel.php'
          RENDERER='clean/hangar18-manager/src/Frontend/Renderer.php'
          PLUGIN='clean/hangar18-manager/hangar18-manager.php'
          test -s clean/hangar18-manager/assets/admin-v0154-menu.js
          test -s clean/hangar18-manager/assets/admin-v0154-menu.css
          test -s clean/hangar18-manager/assets/editor-v0154-menu.css
          grep -q 'h18-menu-sort-row' "$NAV"
          grep -q 'admin-v0154-menu.js' "$NAV"
          grep -q 'Gem menu og rækkefølge' "$NAV"
          grep -q 'menuAdminUrl' "$PLUGIN"
          grep -q 'h18-clean-editor-v0154-menu' "$PLUGIN"
          grep -q 'mobilePresentation' "$CORE"
          grep -q 'mobileCloseOnSelect' "$CORE"
          grep -q 'mobileCloseOutside' "$CORE"
          grep -q 'Redigér menupunkter' "$CORE"
          grep -q 'Panel fra højre' "$CORE"
          grep -q 'mobilePresentation' "$MODEL"
          grep -q 'data-mobile-presentation' "$RENDERER"
          grep -q 'data-close-on-select' "$RENDERER"
          grep -q 'data-close-outside' "$RENDERER"
          grep -q 'aria-controls' "$RENDERER"
          grep -q 'Escape' "$RENDERER"
          echo 'Menu UX contract PASS'

      - name: Verify page status contract
        run: |
          set -euo pipefail
          EDITOR='clean/hangar18-manager/src/Admin/EditorController.php'
          grep -q 'post_status_action' "$EDITOR"
          grep -q 'Gem &amp; publicér' "$EDITOR"
          grep -q 'Gem &amp; gør til kladde' "$EDITOR"
          grep -q "current_user_can('publish_pages')" "$EDITOR"
          grep -q "wp_update_post(\['ID' => \$postId, 'post_status' => \$desiredStatus\]" "$EDITOR"
          grep -q 'page_status_changed' "$EDITOR"
          grep -q 'VD-PAGE-STATUS-001' CLEAN-TECHNICAL-MANUAL.md
          echo 'page status contract PASS'

      - name: Verify release metadata
        run: |
          set -euo pipefail
          grep -q 'Version: 0.1.54' clean/hangar18-manager/hangar18-manager.php
          grep -q "H18_CLEAN_VERSION', '0.1.54'" clean/hangar18-manager/hangar18-manager.php
          grep -q '0.1.54 – Menu UX og Kladde/Publicér' clean-release-notes.html
          grep -q '"version": "0.1.54"' clean/hangar18-manager/release-history.json
          grep -q 'VD-MENU-UX-002' CLEAN-TECHNICAL-MANUAL.md
          test -s docs/v0154-status.md
          echo 'release metadata PASS'

      - name: Regression gates
        run: |
          set -euo pipefail
          grep -q "selectionSessionMode: 'prearmed-v0138'" clean/hangar18-manager/assets/editor-v0125.js
          grep -q 'boundary-markers-v0137-single-owner' clean/hangar18-manager/assets/editor-v0125.js
          grep -q "var mode = 'fit'" clean/hangar18-manager/assets/editor-v0144-viewport.js
          grep -q 'data-h18-leaf-transparent' clean/hangar18-manager/assets/editor-v018-core.js
          grep -q 'VisualBlockConversionService.php' clean/hangar18-manager/hangar18-manager.php
          grep -q 'h18-clean-editor-v0148-layers' clean/hangar18-manager/hangar18-manager.php
          echo 'regression gates PASS'

      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name "phenixdk2020"
          git config user.email "74060601+phenixdk2020@users.noreply.github.com"
          git add clean/hangar18-manager clean-release-notes.html CLEAN-TECHNICAL-MANUAL.md docs/v0154-status.md
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit'
            exit 0
          fi
          git commit -m 'Add Menu UX and page publishing in Visual Designer Manager 0.1.54'
          git pull --rebase origin main
          git push origin HEAD:main
