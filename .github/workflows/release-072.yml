name: Release 0.7.2

on:
  push:
    branches:
      - agent/release-0.7.2

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message || '', 'Release Hangar18 Manager 0.7.2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.7.2
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - name: Apply release metadata
        run: python3 .github/scripts/release_072.py
      - name: Validate fixes and regressions
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          bash tests/Architecture/v072-save-typography-contract.sh
          bash tests/Architecture/protected-domain-contract.sh
          php tests/Architecture/e8-workflow-smoke.php
          php tests/Architecture/e11-quality-smoke.php
          php tests/Architecture/e14-e2e-smoke.php
          grep -F 'Version: 0.7.2' hangar18-manager.php
          grep -F "const VERSION = '0.7.2';" hangar18-manager.php
      - name: Build plugin package
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build/hangar18-manager dist
          rm -f dist/hangar18-manager.zip
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          cp -R assets src .build/hangar18-manager/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"
          export SHA
          PUBLISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export PUBLISHED
          python3 - <<'PY'
          import json, os
          d={
            'schema_version':'1.0',
            'plugin':'hangar18-manager',
            'version':'0.7.2',
            'min_wp':'6.4',
            'min_php':'8.0',
            'published_utc':os.environ['PUBLISHED'],
            'package_path':'dist/hangar18-manager.zip',
            'package_sha256':os.environ['SHA'],
            'changelog':[
              'Gem-kommentaren er eksplicit valgfri og browser-validity ryddes før submit.',
              'Admin assets cache-bustes med version + filemtime.',
              'Typografi-fanens nested CSS-fejl er rettet.',
              'Brødtekst-/overskrift-font samt Body/H1/H2/H3 størrelser vises igen i Inspector.',
              'Aktiv editorversion vises i sideeditoren.',
              'Vehicle/Event/Gallery-kontrakten er uændret.'
            ]
          }
          open('update.json','w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf .build
      - name: Commit release files only
        run: |
          set -euo pipefail
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/scripts/release_072.py .github/workflows/release-072.yml
          git add hangar18-manager.php readme.txt update.json dist/hangar18-manager.zip .github/workflows/architecture-foundation-qa.yml
          git diff --cached --check
          git commit -m 'Release Hangar18 Manager 0.7.2'
          git push origin HEAD:agent/release-0.7.2
