        run: |
          printf "%s" "$ARCHIVE_B64" | base64 --decode > /tmp/hangar18-manager.zip
          test "$(sha256sum /tmp/hangar18-manager.zip | cut -d" " -f1)" = "dd0f3d205bb4f6aac2ad53cb3d3f7cc75514b6bf18c9a80ac43e9248c355f2f5"
          unzip -t /tmp/hangar18-manager.zip
          rm -rf /tmp/h18
          mkdir -p /tmp/h18
          unzip -q /tmp/hangar18-manager.zip -d /tmp/h18
          php -l /tmp/h18/hangar18-manager/hangar18-manager.php
          node --check /tmp/h18/hangar18-manager/assets/admin.js
      - name: Publish source and updater package
        run: |
          cp /tmp/h18/hangar18-manager/hangar18-manager.php hangar18-manager.php
          cp /tmp/h18/hangar18-manager/readme.txt readme.txt
          mkdir -p assets dist
          cp /tmp/h18/hangar18-manager/assets/admin.js assets/admin.js
          cp /tmp/h18/hangar18-manager/assets/admin.css assets/admin.css
          cp /tmp/hangar18-manager.zip dist/hangar18-manager.zip
          cat > update.json <<'JSON'
          {
            "schema_version": "1.0",
            "plugin": "hangar18-manager",
            "version": "0.4.8",
            "min_wp": "6.4",
            "min_php": "8.0",
