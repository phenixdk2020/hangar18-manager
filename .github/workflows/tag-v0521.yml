name: Tag Hangar18 Manager v0.5.21
on:
  push:
    branches: [maintenance/tag-v0.5.21]
    paths: ['.github/workflows/tag-v0521.yml']
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/tag-v0.5.21
          fetch-depth: 0
      - run: |
          set -euo pipefail
          TARGET=85b369a3238b829e916292a05871674951158143
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$TARGET"
          if git rev-parse refs/tags/v0.5.21 >/dev/null 2>&1; then
            test "$(git rev-list -n1 v0.5.21)" = "$TARGET"
          else
            git tag v0.5.21 "$TARGET"
            git push origin v0.5.21
          fi
          rm -f .github/workflows/tag-v0521.yml
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Maintenance: remove v0.5.21 tag workflow'
          git push origin HEAD:maintenance/tag-v0.5.21
