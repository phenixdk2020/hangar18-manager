name: QA Hangar18 Manager 0.5.3 typography

on:
  push:
    branches:
      - development/v0.5.3
    paths:
      - '.github/workflows/qa-v053-typography.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development/v0.5.3

      - name: Preserve responsive globals and exact custom sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hangar18-manager.php')
          t=p.read_text(encoding='utf-8')
          replacements={
            "'--h18-section-h1-size:' . ($h1_size > 0 ? $h1_size . 'px' : 'var(--h18-font-h1-size,48px)') . ';'":"'--h18-section-h1-size:' . ($h1_size > 0 ? $h1_size . 'px' : 'clamp(2rem,5vw,var(--h18-font-h1-size,48px))') . ';'",
            "'--h18-section-h2-size:' . ($h2_size > 0 ? $h2_size . 'px' : 'var(--h18-font-h2-size,32px)') . ';'":"'--h18-section-h2-size:' . ($h2_size > 0 ? $h2_size . 'px' : 'clamp(1.55rem,3.5vw,var(--h18-font-h2-size,32px))') . ';'",
            "'--h18-section-h3-size:' . ($h3_size > 0 ? $h3_size . 'px' : 'var(--h18-font-h3-size,22px)') . ';';":"'--h18-section-h3-size:' . ($h3_size > 0 ? $h3_size . 'px' : 'clamp(1.2rem,2.5vw,var(--h18-font-h3-size,22px))') . ';';",
            "font-size:clamp(2rem,5vw,var(--h18-section-h1-size))":"font-size:var(--h18-section-h1-size)",
            "font-size:clamp(1.55rem,3.5vw,var(--h18-section-h2-size))":"font-size:var(--h18-section-h2-size)",
            "font-size:clamp(1.2rem,2.5vw,var(--h18-section-h3-size))":"font-size:var(--h18-section-h3-size)",
          }
          for old,new in replacements.items():
              if old not in t:
                  raise SystemExit('typography QA anchor missing: '+old[:70])
              t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Validate and rebuild package
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -F "clamp(2rem,5vw,var(--h18-font-h1-size,48px))" hangar18-manager.php
          grep -F "font-size:var(--h18-section-h1-size)" hangar18-manager.php
          rm -rf .build
          mkdir -p .build/hangar18-manager/assets dist
          cp hangar18-manager.php .build/hangar18-manager/
          cp readme.txt .build/hangar18-manager/
          cp assets/admin.css .build/hangar18-manager/assets/
          cp assets/admin.js .build/hangar18-manager/assets/
          (cd .build && zip -qr ../dist/hangar18-manager.zip hangar18-manager)
          unzip -t dist/hangar18-manager.zip
          SHA="$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')"
          export SHA
          python3 -c "import json,os; p='update.json'; m=json.load(open(p,encoding='utf-8')); assert m['version']=='0.5.3'; m['package_sha256']=os.environ['SHA']; open(p,'w',encoding='utf-8').write(json.dumps(m,ensure_ascii=False,indent=2)+'\\n')"
          rm -rf .build

      - name: Commit QA fix and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/qa-v053-typography.yml
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'QA fix v0.5.3 exact custom typography sizes'
          git push
