name: Publish Hangar18 Manager 0.4.5

on:
  push:
    branches:
      - main
    paths:
      - 'release-v045.patch'
      - '.github/workflows/materialize-v045.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply v0.4.5 changes and validate source
        shell: bash
        run: |
          set -euo pipefail
          git apply --check release-v045.patch
          git apply release-v045.patch
          grep -F 'Version: 0.4.5' hangar18-manager.php
          grep -F "const VERSION = '0.4.5';" hangar18-manager.php
          grep -F 'body.page .entry-header' hangar18-manager.php
          grep -F 'h18-event-card-image' hangar18-manager.php
          grep -F '$detail_margin' hangar18-manager.php
          grep -F '$grid_margin' hangar18-manager.php
          grep -F '$detail_outer_margin' hangar18-manager.php
          php -l hangar18-manager.php
          node --check assets/admin.js

      - name: Build and verify plugin package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build/hangar18-manager dist
          cp hangar18-manager.php readme.txt .build/hangar18-manager/
          mkdir -p .build/hangar18-manager/assets
          cp assets/admin.css assets/admin.js .build/hangar18-manager/assets/
          (
            cd .build
            zip -qr ../dist/hangar18-manager.zip hangar18-manager
          )
          unzip -t dist/hangar18-manager.zip
          SHA=$(sha256sum dist/hangar18-manager.zip | awk '{print $1}')
          echo "Package SHA-256: ${SHA}"
          python3 - "$SHA" <<'PY'
          import json, sys
          sha = sys.argv[1]
          manifest = {
              'schema_version': '1.0',
              'plugin': 'hangar18-manager',
              'version': '0.4.5',
              'min_wp': '6.4',
              'min_php': '8.0',
              'published_utc': '2026-08-14T17:10:00Z',
              'package_path': 'dist/hangar18-manager.zip',
              'package_sha256': sha,
              'changelog': [
                  "Fjerner Astra/WordPress sidetitel-feltet over Hangar18-headeren.",
                  "Events detaljesider respekterer Venstre/Midtstillet for hele indholdet.",
                  "Billedgalleri-albums respekterer Venstre/Midtstillet for billedgrid'et.",
                  "Køretøjsdetaljer respekterer Venstre/Midtstillet for hele detaljeindholdet.",
                  "Eventbilleder er gendannet på Events-oversigten.",
                  "Ældre events bruger featured image som fallback.",
                  "Header-knapper har tydeligere navne."
              ]
          }
          with open('update.json', 'w', encoding='utf-8') as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)
              fh.write('\n')
          PY
          rm -rf .build

      - name: Commit v0.4.5 release and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -f release-v045.patch .github/workflows/materialize-v045.yml
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Hangar18 Manager 0.4.5'
          git push
