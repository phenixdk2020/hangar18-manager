name: V3 Alpha.39 Independent QA and Publish

on:
  push:
    branches: [v3-alpha39-editor-text-import-menu-fixes]
    paths:
      - '.github/workflows/v3-alpha39-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-package-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate Alpha.39
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/build_v3_alpha39.py
          python3 .github/scripts/build_v3_alpha39.py
          ROOT='build/visual-designer-manager'
          grep -Fq 'Version: 3.0.0-alpha.39' "$ROOT/visual-designer-manager.php"
          grep -Fq 'var selectionChanged = state.selected !== currentSelection();' "$ROOT/assets/editor-v0114.js"
          grep -Fq 'if (generation !== selectionGeneration || editor.innerHTML !== htmlAtSchedule) { return; }' "$ROOT/assets/editor-v0125.js"
          grep -Fq "if (type === 'menu') { newProps.textColor = readableMenuText(parentId); }" "$ROOT/assets/editor-v018-core.js"
          grep -Fq "focused.closest('#h18-clean-inspector')) { focused.blur(); }" "$ROOT/assets/editor-v018-core.js"
          grep -Fq "\$post->post_type === 'page' ? \$post : null" "$ROOT/src/Compatibility/PageLookup.php"
          grep -Fq "require_once VDM_DIR . 'src/Compatibility/PageLookup.php';" "$ROOT/visual-designer-manager.php"
          grep -Fq "require_once VDM_DIR . 'src/Compatibility/HiddenAdminTitles.php';" "$ROOT/visual-designer-manager.php"
          grep -Fq 'page=vdm-transfer' "$ROOT/src/Admin/ExportController.php"
          ! grep -rEq "get_page_by_path\([^;]*OBJECT, *'page'\)" "$ROOT/src/Admin" "$ROOT/src/Frontend"
          ! grep -rFq 'add_submenu_page(null' "$ROOT/src"
          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find "$ROOT/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Package Alpha.39
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION='3.0.0-alpha.39'
          mkdir -p dist
          ZIP="dist/visual-designer-manager-v${VERSION}.zip"
          rm -f "$ZIP"
          (cd build && zip -qr "../$ZIP" visual-designer-manager)
          unzip -tq "$ZIP"
          SHA256="$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Alpha.39 SHA-256: $SHA256"

      - name: Publish Alpha.39 to stable updater channel
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          VERSION='3.0.0-alpha.39'
          git fetch origin v3-clean-refactor
          RELEASE_DIR="$(mktemp -d)"
          git worktree add "$RELEASE_DIR" origin/v3-clean-refactor
          mkdir -p "$RELEASE_DIR/dist"
          cp "$ZIP" "$RELEASE_DIR/dist/visual-designer-manager-v${VERSION}.zip"
          VERSION="$VERSION" SHA256="$SHA256" SOURCE_COMMIT="$GITHUB_SHA" python3 - <<'PY' > "$RELEASE_DIR/v3-update.json"
          import json, os
          version = os.environ['VERSION']
          manifest = {
              'name': 'Visual Designer Manager',
              'slug': 'visual-designer-manager',
              'version': version,
              'homepage': 'https://github.com/phenixdk2020/hangar18-manager/tree/v3-clean-refactor',
              'requires': '6.4',
              'requires_php': '8.0',
              'tested': '6.8',
              'package': f'https://raw.githubusercontent.com/phenixdk2020/hangar18-manager/v3-clean-refactor/dist/visual-designer-manager-v{version}.zip',
              'sha256': os.environ['SHA256'],
              'source_commit': os.environ['SOURCE_COMMIT'],
              'source_baseline': 'dc3bad403c764f4ec123a526333a781d05dde491',
              'source_version': '0.1.93',
              'sections': {
                  'description': 'Visual Designer Manager V3 med V1 som funktionel og visuel reference.',
                  'changelog': '3.0.0-alpha.39: Tekst i tekstelementer bevares fuldt under skrivning (mistede alt efter første bogstav); piletaster flytter elementet efter redigering i Inspector; ny Menu får læsbar tekstfarve og synlig mobil-hamburger på lys baggrund; import overskriver ikke længere et billede med samme slug som en side; Gendan / importér er linket fra Backup og Eksport; PHP 8.1-deprecations på admin-siderne er fjernet.'
              }
          }
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          cd "$RELEASE_DIR"
          git config user.name 'visual-designer-v3-release-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add "dist/visual-designer-manager-v${VERSION}.zip" v3-update.json
          git diff --cached --check
          git commit -m "Publish Visual Designer Manager V3 ${VERSION} [skip v3 release]"
          git push origin HEAD:v3-clean-refactor

      - name: Verify stable Alpha.39
        shell: bash
        env:
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          git fetch origin v3-clean-refactor
          git show origin/v3-clean-refactor:v3-update.json > /tmp/manifest.json
          git show origin/v3-clean-refactor:dist/visual-designer-manager-v3.0.0-alpha.39.zip > /tmp/alpha39.zip
          test "$(sha256sum /tmp/alpha39.zip | awk '{print $1}')" = "$SHA256"
          SHA256="$SHA256" python3 - <<'PY'
          import json, os
          m=json.load(open('/tmp/manifest.json', encoding='utf-8'))
          assert m['version']=='3.0.0-alpha.39'
          assert m['sha256']==os.environ['SHA256']
          print('Stable Alpha.39: PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: visual-designer-manager-3.0.0-alpha.39
          retention-days: 30
          if-no-files-found: error
          path: dist/visual-designer-manager-v3.0.0-alpha.39.zip
