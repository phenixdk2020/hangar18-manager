name: QA Hangar18 Manager 0.5.8

on:
  push:
    branches:
      - qa/v0.5.8
    paths:
      - .github/workflows/qa-fix-v058.yml

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: qa/v0.5.8
          fetch-depth: 0

      - name: Apply QA fix
        run: python3 .github/scripts/qa_fix_v058.py

      - name: Validate
        shell: bash
        run: |
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -q "fieldName === 'HoverOpacityPercent'" assets/admin.js
          grep -q 'data-canvas-border' assets/admin.js
          python3 - <<'PY'
          import json, hashlib, zipfile
          from pathlib import Path
          m=json.loads(Path('update.json').read_text(encoding='utf-8'))
          p=Path(m['package_path'])
          assert m['version']=='0.5.8'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['package_sha256']
          with zipfile.ZipFile(p) as z:
              assert 'hangar18-manager/assets/admin.js' in z.namelist()
          PY

      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/qa-fix-v058.yml .github/scripts/qa_fix_v058.py
          git add assets/admin.js update.json dist/hangar18-manager.zip
          git commit -m 'QA fix v0.5.8 hover direct controls'
          git push origin HEAD:qa/v0.5.8
