name: Inspect test2 home for v0.1.52

on:
  push:
    paths:
      - '.github/workflows/inspect-test2-home-v0152.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch test2 home read-only
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 -A 'Visual-Designer-Manager-QA/0.1.52' https://test2.hangar18.dk/ -o /tmp/home.html
          echo "bytes=$(wc -c </tmp/home.html)"
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import re
          html=Path('/tmp/home.html').read_text(encoding='utf-8',errors='replace')
          print('--- stylesheet links ---')
          for m in re.finditer(r'<link[^>]+(?:rel=["\']stylesheet["\'][^>]+href=["\']([^"\']+)|href=["\']([^"\']+)["\'][^>]+rel=["\']stylesheet["\'])',html,re.I):
              print(urljoin('https://test2.hangar18.dk/',m.group(1) or m.group(2)))
          print('--- image refs ---')
          for m in re.finditer(r'(?:src|data-src|style)=["\']([^"\']*(?:jpg|jpeg|png|webp)[^"\']*)["\']',html,re.I):
              print(m.group(0)[:300])
          print('--- inline CSS around design selectors ---')
          for key in ['h18-page-frame','avpf-home-hero','avpf-home-tagline','avpf-section','avpf-card']:
              print('\nSELECTOR',key)
              for m in list(re.finditer(re.escape(key),html,re.I))[:12]:
                  snippet=html[max(0,m.start()-700):m.start()+1400]
                  if '<style' in snippet.lower() or '{' in snippet:
                      print(snippet)
          print('--- page frame structure ---')
          start=html.find('h18-page-frame')
          if start>=0:
              start=html.rfind('<',0,start)
              print(html[start:start+35000])
          PY
      - name: Fetch same-origin stylesheet
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 'https://test2.hangar18.dk/wp-content/themes/hangar18-base/style.css?ver=1.2.0' -o /tmp/theme.css
          echo "theme css bytes=$(wc -c </tmp/theme.css)"
          cat /tmp/theme.css
