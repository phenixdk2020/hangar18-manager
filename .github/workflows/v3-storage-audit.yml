name: V3 Storage Audit

on:
  push:
    branches: [v3-alpha3-storage-migration]
    paths:
      - 'v3-storage-audit-trigger.txt'
      - '.github/workflows/v3-storage-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory persistent identifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('clean/hangar18-manager')
          funcs = ('get_option','update_option','add_option','delete_option','get_post_meta','update_post_meta','add_post_meta','delete_post_meta','metadata_exists','get_site_option','update_site_option','delete_site_option','get_transient','set_transient','delete_transient','get_site_transient','set_site_transient','delete_site_transient','register_post_type')
          call_re = re.compile(r'\b(' + '|'.join(map(re.escape, funcs)) + r')\s*\(([^\n;]{0,260})')
          const_re = re.compile(r'\b(?:public|private|protected)?\s*const\s+([A-Z0-9_]+)\s*=\s*[\'\"]([^\'\"]+)[\'\"]')
          literal_re = re.compile(r'[\'\"]((?:_?h18|vdm)[A-Za-z0-9_.:-]*)[\'\"]')
          rows=[]
          for path in sorted(root.rglob('*.php')):
              text=path.read_text(encoding='utf-8', errors='replace')
              rel=path.relative_to(root).as_posix()
              for m in const_re.finditer(text):
                  name,val=m.groups()
                  if ('h18' in val.lower() or 'vdm' in val.lower()) and any(x in name for x in ('META','OPTION','POST','CACHE','HISTORY','MIGRATION','BACKUP','TRANSIENT','LANDING','PAGE')):
                      rows.append((rel,'CONST',name,val))
              for m in call_re.finditer(text):
                  func,args=m.groups()
                  lits=literal_re.findall(args)
                  if lits:
                      rows.append((rel,func,'',','.join(lits)))
          for row in sorted(set(rows)):
              print('|'.join(row))
          print(f'PERSISTENCE_AUDIT_ROWS={len(set(rows))}')
          PY
