name: B1 Backup Restore QA

on:
  push:
    branches:
      - agent/b1-page-backup-restore-v0828
  pull_request:
    paths:
      - 'src/Backup/ManagedPageBackupRestore*.php'
      - 'src/Admin/BackupRestoreAdminController.php'
      - 'src/Admin/IntegrationAdminBootstrap.php'
      - 'tests/Architecture/b1-page-backup-*'
      - '.github/workflows/b1-backup-restore-qa.yml'

permissions:
  contents: read

jobs:
  restore-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0','8.2','8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tests/Architecture/assert-foundation-isolation.sh origin/main
      - run: bash tests/Architecture/protected-domain-contract.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php-version }}'
          coverage: none
      - run: php -l src/Backup/ManagedPageBackupRestoreService.php && php -l src/Backup/ManagedPageBackupRestorePreflightService.php && php -l src/Admin/BackupRestoreAdminController.php
      - run: php tests/Architecture/b1-page-backup-restore-smoke.php
      - run: php tests/Architecture/b1-page-backup-preflight-smoke.php
      - run: bash tests/Architecture/b1-page-backup-restore-contract.sh
      - run: bash tests/Architecture/b1-page-backup-preflight-contract.sh
