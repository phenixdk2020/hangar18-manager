name: Apply Visual Designer Manager 0.1.33 contracts

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_v0133_contracts.py'
      - '.github/workflows/apply-v0133-contracts.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic 0.1.33 patch
        run: python .github/scripts/apply_v0133_contracts.py

      - name: PHP syntax
        run: find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Regression QA
        run: |
          php .github/scripts/hierarchy_normalizer_qa.php
          php .github/scripts/v0125_model_qa.php

      - name: Verify 0.1.33 interaction contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Version: 0.1.33' clean/hangar18-manager/hangar18-manager.php
          grep -Fq "H18_CLEAN_VERSION', '0.1.33'" clean/hangar18-manager/hangar18-manager.php

          # VD-TEXT-SEL-001: one shared logical selection pipeline.
          grep -Fq 'function captureLogicalSelection(editor)' clean/hangar18-manager/assets/editor-v0125.js
          grep -Fq 'function restoreLogicalSelection(snapshot)' clean/hangar18-manager/assets/editor-v0125.js
          grep -Fq 'var logicalSelection = captureLogicalSelection(active.editor);' clean/hangar18-manager/assets/editor-v0125.js
          grep -Fq "document.execCommand('styleWithCSS', false, 'false')" clean/hangar18-manager/assets/editor-v0125.js
          grep -Fq 'reinforceLogicalSelection(logicalSelection);' clean/hangar18-manager/assets/editor-v0125.js

          # VD-FLOAT-001: palette Button is overlay before target/cell splitting.
          grep -Fq "const paletteFloatingButton = String(paletteType || '').toLowerCase() === 'button';" clean/hangar18-manager/assets/editor-v018-core.js
          grep -Fq "if (isFloatingButton(movingNode) || paletteFloatingButton)" clean/hangar18-manager/assets/editor-v018-core.js
          grep -Fq "if (type === 'button' && p.zone === 'overlay') { newProps.placementMode = 'overlay'; }" clean/hangar18-manager/assets/editor-v018-core.js
          grep -Fq "payload.kind === 'palette' ? payload.type : ''" clean/hangar18-manager/assets/editor-v018-core.js
          grep -Fq "if (type === 'button' && floating) { return { allowed: true, message: '' }; }" clean/hangar18-manager/assets/editor-v0122-hierarchy.js
          grep -Fq "floating: type === 'button'" clean/hangar18-manager/assets/editor-v0122-hierarchy.js
          grep -Fq 'slip på canvas, i Sektion eller Kasse' clean/hangar18-manager/assets/editor-v0132.js

          # Inspector regression and documentation/versioning.
          grep -Fq 'height:360px' clean/hangar18-manager/assets/editor-v0132.css
          grep -Fq '== 0.1.33 ==' clean/hangar18-manager/readme.txt
          grep -Fq '"version": "0.1.33"' clean/hangar18-manager/release-history.json
          grep -Fq '<h4>0.1.33</h4>' clean-release-notes.html
          grep -Fq 'Visual Designer Manager 0.1.33 og nyere' CLEAN-USER-MANUAL.md
          grep -Fq 'Kontraktstatus for 0.1.33' CLEAN-TECHNICAL-MANUAL.md
          grep -Fq 'Flydende Knap er den eksplicitte leaf-undtagelse' CLEAN-TECHNICAL-MANUAL.md
          test -s docs/v0133-status.md

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-ci-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add clean/hangar18-manager/hangar18-manager.php \
                  clean/hangar18-manager/assets/editor-v0125.js \
                  clean/hangar18-manager/assets/editor-v018-core.js \
                  clean/hangar18-manager/assets/editor-v0122-hierarchy.js \
                  clean/hangar18-manager/assets/editor-v0132.js \
                  clean/hangar18-manager/readme.txt \
                  clean/hangar18-manager/release-history.json \
                  clean-release-notes.html \
                  CLEAN-USER-MANUAL.md \
                  CLEAN-TECHNICAL-MANUAL.md \
                  docs/v0133-status.md
          if git diff --cached --quiet; then
            echo 'Implementation already present.'
            exit 0
          fi
          git commit -m 'Apply Visual Designer Manager 0.1.33 interaction fixes'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race on attempt ${attempt}; retrying..."
            sleep 2
          done
          exit 1
