name: V3 Alpha.23 V1 Mobile Rhythm and Page Spacing QA

on:
  push:
    branches: [v3-alpha23-v1-mobile-spacing]
    paths:
      - '.github/scripts/build_v3_alpha23.py'
      - '.github/workflows/v3-alpha23-qa.yml'
      - 'V3-ALPHA23.md'
  pull_request:
    branches: [v3-clean-refactor]

jobs:
  alpha23-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock V1 0.1.93 source runtime
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='dc3bad403c764f4ec123a526333a781d05dde491'
          git cat-file -e "${BASELINE}^{commit}"
          git diff --exit-code "$BASELINE" -- clean/hangar18-manager

      - name: Retained V1 regression gates
        shell: bash
        run: |
          set -euo pipefail
          find clean/hangar18-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find clean/hangar18-manager/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 .github/scripts/v0192_export_integrity_qa.py
          python3 .github/scripts/v0191_form_design_controls_qa.py
          python3 .github/scripts/v0190_form_wysiwyg_parity_qa.py
          python3 .github/scripts/v0189_manager_cleanup_export_all_qa.py
          python3 .github/scripts/v0186_site_settings_qa.py
          python3 .github/scripts/v0185_editor_live_box_qa.py
          python3 .github/scripts/v0185_semantic_qa.py
          python3 .github/scripts/v0184_portable_transfer_qa.py

      - name: Re-prove Alpha.22 menu baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build_v3_alpha22.py
          ROOT='build/visual-designer-manager'
          RENDERER="$ROOT/src/Frontend/Renderer.php"
          grep -Fq 'Version: 3.0.0-alpha.22' "$ROOT/visual-designer-manager.php"
          grep -Fq 'h18-clean-front-menu-toggle' "$RENDERER"
          grep -Fq 'is-open' "$RENDERER"
          grep -Fq "get_option('vdm_website_menu_id', null)" "$RENDERER"
          ! grep -Fq '<details class="h18-clean-front-menu-details">' "$RENDERER"

      - name: Build and validate V3 3.0.0-alpha.23
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/build_v3_alpha23.py
          python3 .github/scripts/build_v3_alpha23.py
          ROOT='build/visual-designer-manager'
          MAIN="$ROOT/visual-designer-manager.php"
          MODEL="$ROOT/src/Model/LayoutModel.php"
          EDITOR="$ROOT/src/Admin/EditorController.php"
          JS="$ROOT/assets/editor-v018-core.js"
          RENDERER="$ROOT/src/Frontend/Renderer.php"
          RESPONSIVE="$ROOT/src/Frontend/ResponsiveRenderer.php"
          HISTORY="$ROOT/release-history.json"

          grep -Fq 'Version: 3.0.0-alpha.23' "$MAIN"
          grep -Fq "'pageSettings' => self::pageSettings" "$MODEL"
          grep -Fq "'sectionGap' =>" "$MODEL"
          grep -Fq "'elementGap' =>" "$MODEL"
          grep -Fq "'footerGap' =>" "$MODEL"
          grep -Fq 'Sideindstillinger · Afstande' "$EDITOR"
          grep -Fq 'Afstand mellem sektioner' "$EDITOR"
          grep -Fq 'Standard afstand mellem elementer' "$EDITOR"
          grep -Fq 'Afstand til Footer' "$EDITOR"
          grep -Fq 'data-page-spacing-key' "$EDITOR"
          grep -Fq 'function normalizePageSettings(' "$JS"
          grep -Fq 'pageSettings: normalizePageSettings(raw.pageSettings)' "$JS"
          grep -Fq 'data-page-spacing-device' "$JS"
          grep -Fq 'private static function pageSpacingCss(' "$RESPONSIVE"
          grep -Fq -- '--h18-vdm-page-section-gap:' "$RESPONSIVE"
          grep -Fq -- '--h18-vdm-page-element-gap:' "$RESPONSIVE"
          grep -Fq -- '--h18-vdm-page-footer-gap:' "$RESPONSIVE"
          grep -Fq 'grid-template-columns:64px minmax(0,1fr) 48px' "$RESPONSIVE"
          grep -Fq 'height:160px!important' "$RESPONSIVE"
          grep -Fq 'var(--h18-vdm-page-section-gap,24px)' "$RESPONSIVE"
          grep -Fq 'var(--h18-vdm-page-element-gap,14px)' "$RESPONSIVE"
          grep -Fq 'h18-clean-front-menu-toggle' "$RENDERER"
          ! grep -Fq '<details class="h18-clean-front-menu-details">' "$RENDERER"
          grep -Fq '3.0.0-alpha.23' "$HISTORY"

          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find "$ROOT/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Package Alpha.23 QA artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION='3.0.0-alpha.23'
          mkdir -p dist
          ZIP="dist/visual-designer-manager-v${VERSION}.zip"
          rm -f "$ZIP"
          (cd build && zip -qr "../$ZIP" visual-designer-manager)
          unzip -tq "$ZIP"
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/visual-designer-manager.php$')" = '1'
          test "$(unzip -Z1 "$ZIP" | grep -c '^visual-designer-manager/src/Frontend/ResponsiveRenderer.php$')" = '1'
          echo "SHA256=$(sha256sum "$ZIP" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: visual-designer-manager-v3.0.0-alpha.23-qa
          path: dist/visual-designer-manager-v3.0.0-alpha.23.zip
          if-no-files-found: error
