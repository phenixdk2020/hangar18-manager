name: Build Hangar18 Manager v0.5.12

on:
  push:
    branches:
      - development/v0.5.12
    paths:
      - .github/workflows/build-v0512.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development/v0.5.12
          fetch-depth: 0

      - name: Apply v0.5.12 patch
        run: python3 .github/scripts/patch_v0512.py

      - name: Syntax and structural QA
        shell: bash
        run: |
          set -euo pipefail
          php -l hangar18-manager.php
          node --check assets/admin.js
          grep -q "Version: 0.5.12" hangar18-manager.php
          grep -q "const VERSION = '0.5.12'" hangar18-manager.php
          grep -q "id=\"h18-editor-undo\"" hangar18-manager.php
          grep -q "id=\"h18-editor-redo\"" hangar18-manager.php
          grep -q "editorHistoryLimit = 50" assets/admin.js
          grep -q "MutationObserver" assets/admin.js
          grep -q "beforeunload.h18EditorHistory" assets/admin.js
          grep -q "window.setTimeout(initializeEditorHistory, 0)" assets/admin.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('assets/admin.js').read_text(encoding='utf-8')
          assert "if ($target.is('input, textarea, select')" in js, 'Keyboard shortcut must preserve native field undo'
          assert 'restoreInspectedSection();' in js, 'History restore must safely restore Inspector body'
          assert "editorHistoryNormalizeClone" in js
          assert "h18-canvas-preview, .ui-sortable-placeholder" in js
          php=Path('hangar18-manager.php').read_text(encoding='utf-8')
          assert "'Version'        => '1.12'" in php, 'Page schema must remain 1.12'
          PY

      - name: Rebuild distribution package
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          unzip -q dist/hangar18-manager.zip -d "$work"
          test -d "$work/hangar18-manager"
          cp hangar18-manager.php "$work/hangar18-manager/hangar18-manager.php"
          cp assets/admin.js "$work/hangar18-manager/assets/admin.js"
          cp assets/admin.css "$work/hangar18-manager/assets/admin.css"
          cp readme.txt "$work/hangar18-manager/readme.txt"
          rm -f dist/hangar18-manager.zip
          (cd "$work" && zip -qr "$GITHUB_WORKSPACE/dist/hangar18-manager.zip" hangar18-manager)
          unzip -t dist/hangar18-manager.zip >/dev/null
          rm -rf "$work"

      - name: Update manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('dist/hangar18-manager.zip')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          m={
            'schema_version':'1.0','plugin':'hangar18-manager','version':'0.5.12','min_wp':'6.4','min_php':'8.0',
            'published_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'package_path':'dist/hangar18-manager.zip','package_sha256':sha,
            'changelog':[
              'Tilføjer lokal Undo/Redo-historik med op til 50 trin i den visuelle editor.',
              'Tilføjer Fortryd/Gendan-knapper samt sikre tastaturgenveje.',
              'Historikken dækker live-canvas, sektioner, Card Grid og rækkefølge.',
              'Tilføjer status for ugemte ændringer og navigation-advarsel.',
              'Page-editor schema forbliver 1.12; permanente revisioner og backups er uændrede.'
            ]
          }
          Path('update.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(sha)
          PY

      - name: Package QA
        shell: bash
        run: |
          set -euo pipefail
          unzip -p dist/hangar18-manager.zip hangar18-manager/hangar18-manager.php > /tmp/h18.php
          unzip -p dist/hangar18-manager.zip hangar18-manager/assets/admin.js > /tmp/h18.js
          php -l /tmp/h18.php
          node --check /tmp/h18.js
          grep -q "Version: 0.5.12" /tmp/h18.php
          grep -q "editorHistoryLimit = 50" /tmp/h18.js
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('update.json').read_text(encoding='utf-8'))
          actual=hashlib.sha256(Path('dist/hangar18-manager.zip').read_bytes()).hexdigest()
          assert m['version']=='0.5.12'
          assert m['package_sha256']==actual
          PY

      - name: Self-clean and diff scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/patch_v0512.py .github/workflows/build-v0512.yml
          git status --short
          allowed='^(hangar18-manager\.php|assets/admin\.js|assets/admin\.css|readme\.txt|update\.json|dist/hangar18-manager\.zip)$'
          bad="$(git diff --name-only main | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi

      - name: Commit v0.5.12 release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hangar18-build
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Release Hangar18 Manager 0.5.12"
          git push origin HEAD:development/v0.5.12
