name: Persist Visual Designer Manager 0.1.25 QA

on:
  push:
    branches: [main]
    paths:
      - 'v0125-persist-qa-now.txt'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix permanent QA UUID fixture
        run: python .github/scripts/fix_v0125_qa_stub.py
      - name: Verify permanent model QA
        run: php .github/scripts/v0125_model_qa.php
      - name: Commit permanent QA fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-qa-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add .github/scripts/v0125_model_qa.php
          if git diff --cached --quiet; then
            echo 'Permanent QA fixture already correct.'
            exit 0
          fi
          git commit -m 'Fix permanent Visual Designer 0.1.25 QA fixture'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
