name: Repair v0.1.70 Apply Script

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-v0170-apply-script.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair VehicleFieldRegistry generator syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_v0170_vehicle_module.py')
          value = path.read_text(encoding='utf-8')
          broken = "                'order' => max(0, min(100000, (int) ($row['order'] ?? (($index + 1) * 10))),\n"
          fixed = "                'order' => max(0, min(100000, (int) ($row['order'] ?? (($index + 1) * 10)))),\n"
          if value.count(broken) != 1:
              raise SystemExit(f'Expected exactly one broken VehicleFieldRegistry order expression, found {value.count(broken)}')
          path.write_text(value.replace(broken, fixed, 1), encoding='utf-8')
          PY
          python3 -m py_compile .github/scripts/apply_v0170_vehicle_module.py

      - name: Commit repaired apply script
        run: |
          set -euo pipefail
          git config user.name 'visual-designer-repair-bot'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add .github/scripts/apply_v0170_vehicle_module.py
          git diff --cached --check
          git commit -m 'Fix v0.1.70 VehicleFieldRegistry generator syntax'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
