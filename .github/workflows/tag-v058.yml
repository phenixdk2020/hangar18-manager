name: Tag Hangar18 Manager v0.5.8

on:
  push:
    branches:
      - development/v0.5.8
    paths:
      - .github/workflows/tag-v058.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/v0.5.8
          fetch-depth: 0
      - name: Tag v0.5.8 and self-clean
        shell: bash
        run: |
          git config user.name 'hangar18-build'
          git config user.email 'actions@users.noreply.github.com'
          TARGET='afdb3727c17d97891d9e44653142064dd555b6e6'
          git tag -f v0.5.8 "$TARGET"
          git push origin refs/tags/v0.5.8 --force
          git rm .github/workflows/tag-v058.yml
          git commit -m 'Maintenance: remove v0.5.8 tag workflow'
          git push origin HEAD:development/v0.5.8
